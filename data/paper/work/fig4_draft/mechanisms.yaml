# Figure 4: each ablated mechanism's readable name and its origin: the starting model whose code has it
# ("in a starting model", the literature's), or new (no starting model has it; checked against the seeds'
# code 2026-11-18). Reference games count only the textbook seeds (RSA depth 1, depth 2, shared prior), not
# the promoted ones agents wrote. Each cue is named in its panel's direction (DIRECTION in fig4_draft.py; signs
# from the winners' pooled fits, data/paper/parameter_summaries/; the number game's cues are positive by construction).
# A mechanism whose key ends in _personal is person-level (fit per person).
subjective_randomness:
  ideal_personal: ["ideal alternation rate", new]
  beta_personal: ["alternation sensitivity", new]
  asymmetry: ["over-alternation", new]
  imbalance: ["heads/tails imbalance", local_representativeness]
  imbalance_personal: ["imbalance weight", new]
  longest_run: ["longest run", new]
  longest_run_personal: ["longest-run weight", new]
  final_run: ["streak at the end", new]
  palindrome: ["palindrome", motif_stack]
  variety: ["uniform run lengths", new]
  lopsided: ["lopsided stretch", new]
  antisymmetry: ["mirror-complement", motif_stack]
  gain_personal: ["pattern-detection gain", new]
  lapse: ["lapse", new]
  lapse_personal: ["lapse rate", new]
rsa:
  depth2: ["depth-2 reasoning", rsa_l2]
  interior: ["not in-between", new]
  avoidable: ["avoidable ambiguity", new]
  confusion: ["not confusable", new]
  singleton: ["unique object", new]
  distinct: ["distinctive features", new]
  features: ["more features", rsa_l1_shared_prior]
  typicality: ["atypical object", new]
  valence: ["framing", new]
  color: ["colour", new]
  attention: ["attention gate", new]
  popout: ["pop-out", new]
  load: ["display load", new]
  candidate: ["word fits many objects", new]
  inhibit_leak: ["inattentive picks fit the word", new]
  outlier: ["lone-foil outlier", new]
number_game:
  intercept: ["yes bias", new]
  slope: ["response sharpness", new]
  parity: ["odd / even", tenenbaum_rules_similarity]
  prime: ["primes", tenenbaum_rules_similarity]
  square_cube: ["squares, cubes", tenenbaum_rules_similarity]
  power: ["powers", tenenbaum_rules_similarity]
  multiple: ["multiples of 3–12", tenenbaum_rules_similarity]
  last_digit: ["same last digit", tenenbaum_rules_similarity]
  contains_digit: ["shared digit", bigelow_piantadosi_independent]
  round_multiple: ["multiples of 5, 10", tenenbaum_rules_similarity]
  range_low: ["≥ smallest", tenenbaum_rules_similarity]
  range_high: ["≤ largest", tenenbaum_rules_similarity]
  seed: ["multiples of smallest", new]
  progression: ["sequence continued", new]
  span: ["near examples' range", new]
