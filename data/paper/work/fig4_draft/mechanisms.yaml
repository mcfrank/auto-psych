# Figure 4: each ablated mechanism's readable name and its origin: the starting model whose code has it
# ("in a starting model", the literature's), or new (no starting model has it; checked against the seeds'
# code 2026-11-18). Reference games count only the textbook seeds (RSA depth 1, depth 2, shared prior), not
# the promoted ones agents wrote. A mechanism whose key ends in _personal is person-level (fit per person).
subjective_randomness:
  ideal_personal: [personal ideal alternation rate, new]
  beta_personal: [personal sensitivity to alternation, new]
  asymmetry: [over-alternation weighted apart, new]
  imbalance: [heads/tails imbalance, local_representativeness]
  imbalance_personal: [personal weight on imbalance, new]
  longest_run: [longest run, new]
  longest_run_personal: [personal weight on longest run, new]
  final_run: [long final run (recency), new]
  palindrome: [palindrome looks designed, motif_stack]
  variety: [varied run lengths look random, new]
  lopsided: [most lopsided stretch, new]
  antisymmetry: [mirror-complement looks designed, motif_stack]
  gain_personal: [personal pattern-detection gain, new]
  lapse: [lapse (guessing), new]
  lapse_personal: [personal lapse rate, new]
rsa:
  depth2: [second-order pragmatic listener, rsa_l2]
  interior: [interior-match suppression, new]
  avoidable: [avoidable-ambiguity cost, new]
  confusion: [confusable-referent penalty, new]
  singleton: ["salience: unique object", new]
  distinct: ["salience: distinctive features", new]
  features: ["salience: number of features", rsa_l1_shared_prior]
  typicality: ["salience: typicality", new]
  valence: [framing shifts feature weight, new]
  color: ["salience: colour", new]
  attention: [attention gate, new]
  popout: ["attention: pop-out", new]
  load: ["attention: display load", new]
  candidate: ["attention: number of matches", new]
  inhibit_leak: [inattention captured by matches, new]
  outlier: [solitary-foil outlier, new]
number_game:
  intercept: [baseline "yes" rate, new]
  slope: [decision gain, new]
  parity: [odd / even, tenenbaum_rules_similarity]
  prime: [primes, tenenbaum_rules_similarity]
  square_cube: [squares and cubes, tenenbaum_rules_similarity]
  power: [powers of 2-10, tenenbaum_rules_similarity]
  multiple: [multiples of 3-12, tenenbaum_rules_similarity]
  last_digit: [shared last digit, tenenbaum_rules_similarity]
  contains_digit: [contains a shared digit, bigelow_piantadosi_independent]
  round_multiple: [multiples of 5 and 10, tenenbaum_rules_similarity]
  range_low: [not below the smallest example, tenenbaum_rules_similarity]
  range_high: [not above the largest example, tenenbaum_rules_similarity]
  seed: [multiples of the smallest example, new]
  progression: [arithmetic progression continued, new]
  span: [closeness to the examples' span, new]
  retain: [a visible last digit dominates, new]
  recency: [last example's last digit, new]
  primacy: [first example's last digit, new]
  doubt_single: [rule doubt (one example), new]
  doubt_rich: ["more fitting rules, more doubt (one example)", new]
  doubt_multi: [rule doubt (several examples), new]
  doubt_rich_multi: ["more fitting rules, more doubt (several)", new]
  parity_keep: [doubt keeps the parity, new]
  doubt_band: [doubt keeps the magnitude band, new]
  memory_limit: [one of four examples forgotten, new]
