# Figure 4 draft: each ablated mechanism's readable name and kind. The kinds are a JUDGEMENT to check:
#   person    - person-level variation in a parameter
#   literature - an idea from a seed/literature account
#   new       - introduced by the discovered model
#   response  - the response process (lapse, attention to the task)
subjective_randomness:
  ideal_personal: [personal ideal alternation rate, person]
  beta_personal: [personal sensitivity to alternation, person]
  asymmetry: [over-alternation weighted apart, new]
  imbalance: [heads/tails imbalance, literature]          # Kahneman & Tversky: local representativeness
  imbalance_personal: [personal weight on imbalance, person]
  longest_run: [longest run, literature]                  # Falk & Konold; Kahneman & Tversky
  longest_run_personal: [personal weight on longest run, person]
  final_run: [long final run (recency), new]
  palindrome: [palindrome looks designed, literature]     # Griffiths et al.: regular generators
  variety: [varied run lengths look random, new]
  lopsided: [most lopsided stretch, new]
  antisymmetry: [mirror-complement looks designed, new]
  gain_personal: [personal pattern-detection gain, person]
  lapse: [lapse (guessing), response]
  lapse_personal: [personal lapse rate, person]
rsa:
  depth2: [second-order pragmatic listener, literature]   # RSA recursion (Frank & Goodman)
  interior: [interior-match suppression, new]
  avoidable: [avoidable-ambiguity cost, new]
  confusion: [confusable-referent penalty, new]
  singleton: ["salience: unique object", new]
  distinct: ["salience: distinctive features", new]
  features: ["salience: number of features", new]
  typicality: ["salience: typicality", new]
  valence: [framing shifts feature weight, new]
  color: ["salience: colour", new]
  attention: [attention gate, response]
  popout: ["attention: pop-out", response]
  load: ["attention: display load", response]
  candidate: ["attention: number of matches", response]
  inhibit_leak: [inattention captured by matches, response]
  outlier: [solitary-foil outlier, new]
number_game:
  # literature: the seeds' rule and interval hypotheses (Tenenbaum 2000; Bigelow & Piantadosi 2016)
  intercept: [baseline "yes" rate, response]
  slope: [decision gain, response]
  parity: [odd / even, literature]
  prime: [primes, literature]
  square_cube: [squares and cubes, literature]
  power: [powers of 2-10, literature]
  multiple: [multiples of 3-12, literature]
  last_digit: [shared last digit, literature]
  contains_digit: [contains a shared digit, literature]   # Bigelow & Piantadosi only
  round_multiple: [multiples of 5 and 10, literature]     # among the seeds' multiples; weighting them apart is new
  range_low: [not below the smallest example, literature] # the seeds' intervals, here graded
  range_high: [not above the largest example, literature]
  seed: [multiples of the smallest example, new]
  progression: [arithmetic progression continued, new]
  span: [closeness to the examples' span, new]
  retain: [a visible last digit dominates, new]
  recency: [last example's last digit, new]
  primacy: [first example's last digit, new]
  doubt_single: [rule doubt (one example), new]
  doubt_rich: ["more fitting rules, more doubt (one example)", new]
  doubt_multi: [rule doubt (several examples), new]
  doubt_rich_multi: ["more fitting rules, more doubt (several)", new]
  parity_keep: [doubt keeps the parity, new]
  doubt_band: [doubt keeps the magnitude band, new]
  memory_limit: [one of four examples forgotten, new]
