  primacy: ["first example's digit", new]
  doubt_single: ["random guessing (one example)", new]
  doubt_rich: ["more rules fit, more guessing (one example)", new]
  doubt_multi: ["random guessing (several examples)", new]
  doubt_rich_multi: ["more rules fit, more guessing (several)", new]
  parity_keep: ["guesses keep odd/even", new]
