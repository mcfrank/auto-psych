  lopsided: ["lopsided stretch", new]
  antisymmetry: ["mirror-complement", motif_stack]
  gain_personal: ["pattern sensitivity", new]
  lapse: ["guessing rate (shared)", new]
  lapse_personal: ["guessing rate", new]
