# Figure 4: each ablated mechanism's readable name and its origin: the starting model whose code has it
# ("in a starting model", the literature's), or new (no starting model has it; checked against the seeds'
# code 2026-11-18). Reference games count only the textbook seeds (RSA depth 1, depth 2, shared prior), not
# the promoted ones agents wrote. Each cue is named in its panel's direction (DIRECTION in fig4_draft.py; signs
# from the winners' pooled fits, data/paper/parameter_summaries/; the number game's cues are positive by construction).
# A mechanism whose key ends in _personal is person-level (fit per person).
subjective_randomness:
  ideal_personal: ["preferred switch rate", new]
  beta_personal: ["switch-rate sensitivity", new]
  asymmetry: ["too many switches", new]
  imbalance: ["heads/tails imbalance (shared)", local_representativeness]
  imbalance_personal: ["heads/tails imbalance", new]
  longest_run: ["longest streak (shared)", new]
  longest_run_personal: ["longest streak", new]
  final_run: ["final streak", new]
  palindrome: ["palindrome", motif_stack]
  variety: ["uniform streak lengths", new]
  lopsided: ["lopsided stretch", new]
  antisymmetry: ["mirror-complement", motif_stack]
  gain_personal: ["pattern sensitivity", new]
  lapse: ["guessing rate (shared)", new]
  lapse_personal: ["guessing rate", new]
rsa:
  depth2: ["depth-2 reasoning", rsa_l2]
  interior: ["fewest or most features", new]
  avoidable: ["has a word of its own", new]
  confusion: ["unlike the other objects", new]
  singleton: ["no identical twin", new]
  distinct: ["distinctive features", new]
  features: ["more features", rsa_l1_shared_prior]
  typicality: ["atypical", new]
  valence: ["more features, if framed positively", new]
  color: ["colored", new]
  attention: ["attention gate", new]
  popout: ["word fits only that object", new]
  load: ["few objects shown", new]
  candidate: ["word fits few other objects", new]
  inhibit_leak: ["literal match, if inattentive", new]
  outlier: ["only object the word misses", new]
number_game:
  intercept: ["yes bias", new]
  slope: ["response sharpness", new]
  parity: ["parity", tenenbaum_rules_similarity]
  prime: ["prime", tenenbaum_rules_similarity]
  square_cube: ["square or cube", tenenbaum_rules_similarity]
  power: ["power", tenenbaum_rules_similarity]
  multiple: ["other multiples (3–12)", tenenbaum_rules_similarity]
  last_digit: ["last digit", tenenbaum_rules_similarity]
  contains_digit: ["a digit", bigelow_piantadosi_independent]
  round_multiple: ["multiple of 5 or 10", tenenbaum_rules_similarity]
  range_low: ["≥ smallest", tenenbaum_rules_similarity]
  range_high: ["≤ largest", tenenbaum_rules_similarity]
  seed: ["multiple of the smallest", new]
  progression: ["arithmetic sequence", new]
  span: ["range", new]
  retain: ["last digit overrides others", new]
  recency: ["last example's last digit", new]
  primacy: ["first example's last digit", new]
  doubt_single: ["guessing after one example", new]
  doubt_rich: ["guess more if many rules fit (one)", new]
  doubt_multi: ["guessing after several examples", new]
  doubt_rich_multi: ["guess more if many rules fit (several)", new]
  parity_keep: ["guesses keep parity", new]
  doubt_band: ["guesses stay near examples", new]
  memory_limit: ["forgets an example", new]

