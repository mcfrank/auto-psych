models:
- name: rsa_l2_singleton_confusion_omission_cost
  rationale: 'Pragmatic listeners reason at depth 2 about speakers who avoid competitor
    confusion, penalize unmentioned informative features of the target, penalize broadly
    shared descriptors with utterance extension costs, and account for visual singleton
    salience. When multiple descriptions apply to an object, speakers prefer specific,
    less widely shared words over descriptors that extend to many scene objects, while
    avoiding ambiguous words when the target possesses superior unstated descriptors.
    On uninformative trials, listeners spontaneously favor unique visual singletons
    over duplicated items in the display. Refining rsa_l2_singleton_confusion_omission
    by incorporating utterance extension costs from rsa_l2_singleton_confusion_cost:
    Speakers evaluate candidate referring expressions not only by informativeness
    to simulated listeners, distractor confusion avoidance, and omitted-alternative
    exhaustification penalties, but also by penalizing words proportional to their
    visual extension (the fraction of display objects satisfying the feature). When
    an object possesses multiple valid descriptions, speakers avoid broadly applicable
    words in favor of more specific descriptors, capturing listeners'' preference
    for specific descriptions on displays where features differ in contextual generality
    while preserving sensitivity to unmentioned target features. Differences from
    rsa_l2_singleton_confusion_omission: - Recursion depth: Unchanged at depth 2 (choice_probs
    calls L2). - Parameters added: w_cost (Normal(0.0, 1.0), penalizing candidate
    words proportional to their visual extension / scene frequency). - Parameters
    removed: None. - Other terms: Added compute_extension_cost to calculate the scene-wide
    object fraction sharing each word; incorporated - w_cost * vec(cost, u) into simulated
    speaker utility at both depth-1 (S1 in L1) and depth-2 (S2 in L2).'
- name: rsa_l2_singleton_confusion_omission
  rationale: 'Pragmatic listeners reason at depth 2 about speakers who avoid competitor
    confusion, penalize unmentioned informative features of the target, and account
    for visual singleton salience. When multiple descriptions apply to an object,
    speakers avoid using an ambiguous descriptor if the target possesses an unmentioned,
    highly discriminative alternative feature in the display, leading listeners to
    reject referents with superior unstated descriptors. On uninformative trials,
    listeners spontaneously favor unique visual singletons over duplicated items in
    the display. Refining rsa_l2_singleton_confusion by incorporating omitted-alternative
    exhaustification from alternative_exhaustification_listener: Speakers evaluate
    candidate referring expressions not only by informativeness to simulated listeners
    and distractor confusion avoidance, but also by penalizing expressions that leave
    more distinctive alternative features of the intended referent unsaid. This improves
    fit on displays where referents vary in contextual alternative availability, capturing
    human listeners'' strong implicatures against targets with superior unmentioned
    descriptors while preserving visual singleton salience on uninformative displays.
    Differences from rsa_l2_singleton_confusion: - Recursion depth: Unchanged at depth
    2 (choice_probs calls L2). - Parameters added: w_omission (Normal(0.0, 1.0), penalizing
    referring expressions that omit informative alternative features of the intended
    referent). - Parameters removed: None. - Other terms: Added compute_exhaustification_violation
    to quantify the contextual informativeness of unmentioned features for each candidate
    referent; incorporated - w_omission * at(violation, u, r) into simulated speaker
    utility at both depth-1 (S1 in L1) and depth-2 (S2 in L2).'
- name: rsa_l2_singleton_confusion
  rationale: 'Pragmatic listeners reason at depth 2 about speakers who avoid competitor
    confusion while accounting for visual singleton salience. When multiple objects
    satisfy a description, speakers avoid referring to a target if its competitors
    share many visual features, leading listeners to expect words to target objects
    whose competitors are visually distinct. On uninformative trials, listeners spontaneously
    favor unique visual singletons over duplicated items in the display. Refining
    rsa_l2_singleton by incorporating competitor confusion avoidance from competitor_confusion_speaker:
    Speakers evaluate candidate words not only by their informativeness to simulated
    listeners, but also by penalizing words that overlap with visually similar competitor
    objects in the context. This improves fit on displays where distractors share
    visual features with the intended referent, guiding listeners away from targets
    whose competitors create visual confusion. Differences from rsa_l2_singleton:
    - Recursion depth: Unchanged at depth 2 (choice_probs calls L2). - Parameters
    added: w_confusion (Normal(0.0, 1.0), penalizing candidate words proportional
    to their visual similarity overlap with alternative referents satisfying the word).
    - Parameters removed: None. - Other terms: Added compute_confusion to calculate
    pairwise visual similarity between referents and competitors sharing each utterance;
    incorporated - w_confusion * at(confusion, u, r) into the simulated speaker utility
    at both depth-1 (S1 in L1) and depth-2 (S2 in L2).'
- name: rsa_l2_singleton_confusion_cost
  rationale: 'Pragmatic listeners reason at depth 2 about speakers who avoid competitor
    confusion, penalize broadly shared descriptors with high utterance extension costs,
    and account for visual singleton salience. When multiple descriptions apply to
    an object, speakers prefer more specific, less widely shared words over descriptors
    that extend to many scene objects, guiding listeners to reject referents for which
    the heard expression was unnecessarily broad. On uninformative trials, listeners
    spontaneously favor unique visual singletons over duplicated items in the display.
    Refining rsa_l2_singleton_confusion by incorporating utterance extension costs
    from isolated_graded_costly_l3: Speakers evaluate candidate referring expressions
    not only by informativeness to simulated listeners and competitor confusion avoidance,
    but also by penalizing words proportional to their visual extension (the fraction
    of display objects satisfying the feature). When an object possesses multiple
    valid descriptions, speakers avoid broadly applicable words in favor of more specific
    descriptors, capturing listeners'' preference for specific descriptions on displays
    where features differ in contextual generality. Differences from rsa_l2_singleton_confusion:
    - Recursion depth: Unchanged at depth 2 (choice_probs calls L2). - Parameters
    added: w_cost (Normal(0.0, 1.0), penalizing candidate words proportional to their
    visual extension / scene frequency). - Parameters removed: None. - Other terms:
    Added compute_extension_cost to calculate the scene-wide object fraction sharing
    each word; incorporated - w_cost * vec(cost, u) into simulated speaker utility
    at both depth-1 (S1 in L1) and depth-2 (S2 in L2).'
- name: rsa_l2_distinct_confusion_omission_cost
  rationale: 'Pragmatic listeners reason at depth 2 about speakers who avoid competitor
    confusion, penalize unmentioned informative features of the target, penalize broadly
    shared descriptors with utterance extension costs, and account for visual singleton
    salience and contextual feature distinctiveness. When multiple descriptions apply
    to an object, speakers prefer specific, less widely shared words over descriptors
    that extend to many scene objects, while avoiding ambiguous words when the target
    possesses superior unstated descriptors. On uninformative trials, listeners spontaneously
    favor items that contrast more strongly against the ensemble of display objects
    in overall feature space as well as discrete visual singletons. Refining rsa_l2_singleton_confusion_omission_cost
    by incorporating contextual distinctiveness from rsa_l2_salience_confusion_l0:
    Visual salience in reference games operates continuously across feature space
    rather than solely as an all-or-nothing binary distinction between duplicates
    and non-duplicates. Listeners and simulated speakers evaluate candidate referents
    with common-ground visual priors that combine discrete singleton salience with
    continuous contextual distinctiveness (the accumulated visual feature contrast
    between each object and all other display items), directing attention toward contextually
    distinctive objects even when all items in the display are distinct. Differences
    from rsa_l2_singleton_confusion_omission_cost: - Recursion depth: Unchanged at
    depth 2 (choice_probs calls L2). - Parameters added: w_distinct (Normal(0.0, 1.0),
    weighting the contextual feature distinctiveness prior over candidate referents).
    - Parameters removed: None. - Other terms: Added distinct calculation (accumulated
    pairwise visual feature distance between each referent and all other display objects);
    incorporated + params["w_distinct"] * distinct into the softmax object prior passed
    to simulated speakers S1 and S2 and governing uninformative prior trials.'
- name: rsa_l2_distinct_confusion_omission
  rationale: 'Pragmatic listeners reason at depth 2 about speakers who avoid competitor
    confusion, penalize unmentioned informative features of the target, and account
    for visual singleton salience and contextual feature distinctiveness. When multiple
    descriptions apply to an object, speakers avoid using an ambiguous descriptor
    if the target possesses an unmentioned, highly discriminative alternative feature
    in the display, leading listeners to reject referents with superior unstated descriptors.
    On uninformative trials, listeners spontaneously favor items that contrast more
    strongly against the ensemble of display objects in overall feature space as well
    as discrete visual singletons. Refining rsa_l2_singleton_confusion_omission by
    incorporating contextual feature distinctiveness from rsa_l2_salience_confusion_l0:
    Visual salience in reference games operates continuously across feature space
    rather than solely as an all-or-nothing binary distinction between duplicates
    and non-duplicates. Listeners and simulated speakers evaluate candidate referents
    with common-ground visual priors that combine discrete singleton salience with
    continuous contextual distinctiveness (the accumulated visual feature contrast
    between each object and all other display items), directing attention toward contextually
    distinctive objects even when all items in the display are distinct. Differences
    from rsa_l2_singleton_confusion_omission: - Recursion depth: Unchanged at depth
    2 (choice_probs calls L2). - Parameters added: w_distinct (Normal(0.0, 1.0), weighting
    the continuous contextual feature distinctiveness prior over candidate referents).
    - Parameters removed: None. - Other terms: Added compute_distinctiveness to calculate
    the accumulated visual feature distance between each referent and all other display
    objects; incorporated + params["w_distinct"] * distinct into the common-ground
    softmax object prior passed to simulated speakers S1 and S2 and governing choices
    on uninformative prior trials.'
- name: aspect_goal_listener
  rationale: 'Listeners interpret referring expressions by reasoning about the speaker''s
    communicative goal or question under discussion: rather than attempting to uniquely
    pinpoint the referent''s complete scene identity, speakers aim to be informative
    about a specific visual aspect (feature) of the target object. When selecting
    which aspect of a referent to communicate, speakers favor features that are contextually
    informative and distinctive in the display, and express that chosen aspect with
    a descriptive word. Pragmatic listeners invert this process by jointly inferring
    the intended referent and the speaker''s communicative goal, expecting a heard
    feature to pick out objects for which that feature was the most contextually relevant
    aspect to highlight.'
- name: incremental_alternative_speaker
  rationale: Speakers formulate referring expressions by evaluating candidate words
    against an active alternative feature of the intended referent, choosing words
    that eliminate visual competitors the alternative feature left confusable. Pragmatic
    listeners invert this two-stage communicative process by jointly inferring the
    intended referent and the alternative descriptor the speaker sought to improve
    upon. On uninformative trials with no descriptive word, choices default to common-ground
    visual singleton salience.
