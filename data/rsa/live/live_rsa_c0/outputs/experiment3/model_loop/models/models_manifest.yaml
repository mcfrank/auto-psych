models:
- name: prototype_typicality_bounded_listener
  rationale: 'Pragmatic listener at depth 2 under capacity-limited executive inhibitory
    control with contextual category typicality and bounded speaker consideration.
    Refining prototype_typicality_listener by incorporating bounded speaker consideration
    from bounded_consideration_speaker: speakers evaluate communicative alternatives
    probabilistically rather than exhaustively, retrieving distinguishing alternative
    expressions with a bounded consideration rate and otherwise producing an unconsidered
    true feature without communicative comparison. Pragmatic listeners invert this
    bounded-consideration speaker under capacity-limited executive inhibitory control,
    recognizing that hearing an ambiguous word does not rule out feature-rich competitors
    whose unique distinguishing words failed to enter the speaker''s consideration
    set. This directly moderates overly aggressive scalar exclusion, elevates choices
    of maximal-feature candidates under ubiquitous and multi-match expressions (all_match_max_feature_choice_rate
    and four_object_three_candidate_max_feature_rate), elevates selections of duplicated
    candidates under shared words (duplicate_matching_candidate_choice_rate), and
    calibrates pragmatic target rates against all-feature competitors (four_object_target_vs_all_feature_rate).
    Differences from prototype_typicality_listener: - Recursion depth remains depth
    2 (choice_probs calls L_typical, which inverts a speaker simulating depth-1 listener
    L1). - Added parameter: logit_p_consider (prior dist.Normal(1.0, 1.0)). - No parameters
    removed (retains alpha, logit_p_base, w_load, w_popout, w_candidate, w_inhibit_leak,
    w_typical, w_singleton, w_distinct, w_features, w_valence, w_color, w_confusion,
    and lapse). - Speaker utility in both S1 and S2: added an alternative consideration
    mode choice (speaker: chooses(mode in MODES, wpp=p_consider if mode == 1 else
    (1.0 - p_consider))) where communicative utility exp(alpha * L - w_confusion *
    at(confusion, u, r)) is evaluated when mode == 1, while mode == 0 selects true
    utterances uniformly with weight 1.0. - In choice_probs: computed p_consider =
    jax.nn.sigmoid(params["logit_p_consider"]) and passed p_consider to L_typical.'
- name: focal_avoidable_info_gain_listener
  rationale: "Listeners interpret referring expressions under capacity-limited visual\
    \ attention that restricts counterfactual communicative mentalizing to the active\
    \ focal set of candidate referents matching the heard word, reasoning about a\
    \ speaker who balances referent recovery and global communicative information\
    \ gain under bounded consideration while penalizing avoidable ambiguity. When\
    \ evaluating what a speaker would have said, listeners mentally simulate alternative\
    \ expressions only with respect to distinguishing candidates within the attended\
    \ focal contrast set, expecting that a speaker actively avoids producing an ambiguous\
    \ referring expression whenever the intended referent possessed an alternative\
    \ distinguishing word that would have uniquely singled it out in context. Consequently,\
    \ competitors that possessed uniquely distinguishing alternatives are decisively\
    \ precluded, while minimal pragmatic targets and multi-feature candidates lacking\
    \ distinguishing options are strongly favored, resolving under-prediction of targets\
    \ possessing unique alternative features and calibrating selections across multi-object\
    \ scenes. Refining focal_bounded_info_gain_listener by incorporating the avoidable\
    \ ambiguity avoidance component from avoidable_ambiguity_outlier_listener: speakers\
    \ in reference games adhere to Gricean clarity by penalizing referentially ambiguous\
    \ expressions specifically when the ambiguity is avoidable\u2014that is, when\
    \ the intended referent possessed an alternative distinguishing expression that\
    \ would have uniquely identified it in context. Pragmatic listeners invert this\
    \ avoidable-ambiguity-sensitive speaker under capacity-limited executive attention\
    \ with focal candidate contrast set mentalizing, recognizing that hearing an ambiguous\
    \ word provides strong evidence for referents that lacked distinguishing alternatives.\
    \ This directly rectifies the under-selection of pragmatic targets possessing\
    \ unique alternative features (unique_alternative_target_choice_rate) and multi-feature\
    \ pragmatic targets in four-object displays (four_object_multifeature_target_vs_all_feature_rate\
    \ and four_object_two_feature_target_vs_three_feature_competitor_rate), while\
    \ preserving focal candidate visual attention, bounded speaker consideration,\
    \ communicative information gain, contextual category typicality, and contrastive\
    \ outlier pop-out. Differences from focal_bounded_info_gain_listener: - Recursion\
    \ depth remains depth 2 (choice_probs calls L_typical, which inverts a speaker\
    \ simulating depth-1 listener L1). - Added parameter: c_avoid (prior dist.Normal(0.0,\
    \ 1.0)). - No parameters removed (retains alpha, logit_p_consider, logit_att_leak,\
    \ logit_p_base, w_load, w_popout, w_candidate, w_info, logit_p_outlier, w_inhibit_leak,\
    \ w_typical, w_singleton, w_distinct, w_features, w_valence, w_color, w_confusion,\
    \ and lapse). - In choice_probs: added compute_avoidable(ctx) to compute the avoidable\
    \ ambiguity penalty matrix as avoidable = real_lex * ambiguity[:, None] * has_unique[None,\
    \ :] where ambiguity = (k_u - 1.0) / jnp.maximum(1.0, n_obj - 1.0) * (1.0 - ctx.is_sink),\
    \ and passed avoidable = params[\"c_avoid\"] * compute_avoidable(ctx) to L_typical.\
    \ - Speaker utility in both L1 and L_typical: added avoidable ambiguity penalty\
    \ term - at(avoidable, u, r) inside communicative utility when mode == 1, evaluating\
    \ as alpha * (L - at(avoidable, u, r) + w_info * vec(info_gain, u)) - w_confusion\
    \ * at(confusion, u, r) while mode == 0 selects true utterances uniformly with\
    \ weight 1.0."
- name: boundary_polarization_listener
  rationale: "Listeners interpret referring expressions through boundary polarization:\
    \ when a referring expression matches multiple candidate referents that vary in\
    \ feature complexity, evaluative attention is anchored on the range extrema\u2014\
    the minimal pragmatic target and the maximal category prototype\u2014while candidates\
    \ located in the interior of the feature range suffer cognitive suppression due\
    \ to lack of boundary contrast. Pragmatic listeners invert an informative speaker\
    \ who avoids producing referring expressions for referents located in this suppressed\
    \ interior of the candidate feature range, leading them to strongly avoid intermediate-feature\
    \ competitors and polarize choices between the minimal target and the maximal\
    \ prototype. This mechanism disagrees most sharply with standard models on displays\
    \ where three candidates match the heard utterance with strictly distinct feature\
    \ counts (such as a three-object display with one, two, and three features hearing\
    \ the shared word), where standard models predict intermediate candidates to receive\
    \ substantial choice probability between the minimal and maximal candidates, whereas\
    \ boundary polarization strongly suppresses the intermediate competitor to match\
    \ human behavior."
- name: focal_avoidable_exemplar_listener
  rationale: 'Listeners interpret referring expressions under capacity-limited visual
    attention that restricts counterfactual communicative mentalizing to the active
    focal set of candidate referents matching the heard word, reasoning about a speaker
    who balances referent recovery and global communicative information gain under
    bounded consideration while penalizing avoidable ambiguity, and evaluating contextual
    category typicality through exemplar-based psychological similarity across the
    visual scene. Before hearing an informative word and during referent selection,
    each referent''s contextual typicality is determined by its average exponential-decay
    psychological similarity to all other scene exemplars under the Generalized Context
    Model rather than additive feature overlap. This exemplar similarity formulation
    properly rewards identical candidates and central scene exemplars without artificially
    compounding with total feature count, directly mitigating excessive singleton
    preferences on uninformative trials, elevating choices of full duplicates and
    duplicate-matching competitors, and calibrating choices across multi-object displays.
    Refining focal_avoidable_info_gain_listener by replacing contextual category typicality
    from additive feature overlap with exemplar-based psychological similarity under
    the Generalized Context Model from exemplar_typicality_listener: listeners evaluate
    contextual typicality as an object''s average exponential-decay similarity to
    all other scene exemplars across the visual display rather than an unnormalized
    sum of shared feature fractions. This directly rectifies the observed under-selection
    of duplicate-matching competitors in three-object displays (three_object_target_vs_duplicate_competitor_rate),
    the under-selection of full duplicates on uninformative mumble trials (mumble_full_duplicate_choice_rate),
    and the excessive singleton bias (mumble_singleton_choice_rate), while fully preserving
    focal candidate visual attention, bounded speaker consideration, communicative
    information gain, avoidable ambiguity avoidance, and contrastive outlier pop-out.
    Differences from focal_avoidable_info_gain_listener: - Recursion depth remains
    depth 2 (choice_probs calls L_typical, which inverts a speaker simulating depth-1
    listener L1). - Added parameters: None. - Removed parameters: None (retains alpha,
    logit_p_consider, logit_att_leak, c_avoid, logit_p_base, w_load, w_popout, w_candidate,
    w_info, logit_p_outlier, w_inhibit_leak, w_typical, w_singleton, w_distinct, w_features,
    w_valence, w_color, w_confusion, and lapse with identical priors). - In choice_probs:
    replaced compute_typicality(ctx) with an exemplar-based psychological similarity
    formulation computing an object''s contextual typicality as its mean pairwise
    exponential-decay psychological similarity to all other scene exemplars (the sum
    of exp(-dist) to all other scene objects divided by N_obj - 1) instead of the
    unnormalized sum of shared feature fractions.'
- name: boundary_avoidable_ambiguity_listener
  rationale: "Listeners interpret referring expressions through boundary polarization\
    \ with avoidable ambiguity avoidance: when a referring expression matches multiple\
    \ candidate referents that vary in feature complexity, evaluative attention anchors\
    \ on the range extrema\u2014the minimal pragmatic target and the maximal category\
    \ prototype\u2014while candidates located in the interior of the feature range\
    \ suffer cognitive suppression due to lack of boundary contrast. When evaluating\
    \ alternative referring expressions, listeners expect that speakers adhere to\
    \ Gricean clarity by penalizing ambiguous expressions specifically when the ambiguity\
    \ is avoidable\u2014that is, when the intended referent possessed an alternative\
    \ distinguishing expression that would have uniquely identified it in context.\
    \ Consequently, competitors that possessed uniquely distinguishing alternatives\
    \ are decisively precluded under shared expressions, while minimal pragmatic targets\
    \ and multi-feature candidates lacking distinguishing options are strongly favored.\
    \ Refining boundary_polarization_listener by incorporating the avoidable ambiguity\
    \ avoidance component from avoidable_ambiguity_speaker: speakers in reference\
    \ games adhere to Gricean clarity by penalizing referentially ambiguous expressions\
    \ specifically when the ambiguity is avoidable\u2014that is, when the intended\
    \ referent possessed an alternative distinguishing expression that would have\
    \ uniquely identified it in context. Pragmatic listeners invert this avoidable-ambiguity-sensitive\
    \ speaker under boundary polarization, recognizing that hearing an ambiguous word\
    \ provides strong evidence for referents that lacked distinguishing alternatives.\
    \ This directly rectifies the observed under-selection of multi-feature pragmatic\
    \ targets over all-feature competitors in four-object displays (four_object_multifeature_target_vs_all_feature_rate\
    \ and four_object_two_feature_target_vs_three_feature_competitor_rate), the under-selection\
    \ of pragmatic targets possessing unique alternative features (unique_alternative_target_choice_rate),\
    \ and the over-selection of single-feature targets over three-feature competitors\
    \ in two-object displays (two_object_one_feature_target_vs_three_feature_competitor_rate),\
    \ while fully preserving range-frequency boundary polarization, capacity-limited\
    \ executive attention, competitor confusion avoidance, and contrastive outlier\
    \ pop-out. Differences from boundary_polarization_listener: - Recursion depth\
    \ remains depth 2 (choice_probs calls L2, which inverts a speaker simulating depth-1\
    \ listener L1). - Added parameter: c_avoid (prior dist.Normal(0.0, 1.0)). - Removed\
    \ parameters: None (retains alpha, w_interior, logit_p_base, w_load, w_popout,\
    \ w_candidate, logit_p_outlier, w_inhibit_leak, w_typical, w_singleton, w_distinct,\
    \ w_features, w_valence, w_color, w_confusion, and lapse with identical priors).\
    \ - In choice_probs: added compute_avoidable(ctx) computing the contextual avoidable\
    \ ambiguity matrix as avoidable = real_lex * ambiguity[:, None] * has_unique[None,\
    \ :] where ambiguity = (k_u - 1.0) / jnp.maximum(1.0, n_obj - 1.0) * (1.0 - ctx.is_sink)\
    \ and has_unique indicates whether the referent possesses any unique word with\
    \ k_u == 1, scaled by params[\"c_avoid\"] as avoidable = params[\"c_avoid\"] *\
    \ compute_avoidable(ctx), and passed avoidable to L2. - Speaker utility in both\
    \ L1 and L2: added avoidable ambiguity penalty term - at(avoidable, u, r) inside\
    \ communicative utility, evaluating as alpha * (L - w_interior * at(interior,\
    \ u, r) - at(avoidable, u, r)) - w_confusion * at(confusion, u, r) (where L is\
    \ L0 in L1 and L1 in L2)."
