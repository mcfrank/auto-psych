models:
- name: rsa_l1_singleton_feat_color_familiar
  rationale: 'Pragmatic listener at depth 1 with singleton salience, contextual distinctiveness,
    visual feature complexity, visual color contrast, and familiarization base rates.
    Refining rsa_l1 by incorporating the multi-attribute perceptual and experiential
    referent prior from rsa_l2_singleton_feat_color_familiar_l0: listeners reason
    at first-order depth, directly inverting a cooperative speaker who balances literal
    informativeness against visual and exposure biases. Because listeners perform
    only single-step pragmatic inversion, they do not compound likelihood ratios across
    recursive tiers, curbing the excessive target preferences observed at depth 2
    when competitor objects possess multiple additional features or duplicate copies.
    On uninformative mumble trials, choices directly reflect this shared perceptual
    and experiential prior rather than uniform guessing. Differences from rsa_l1:
    - Recursion depth: depth 1 (calls L1, unchanged from rsa_l1). - Parameters added:
    w_singleton, w_distinct, w_features, w_color, w_familiar. - Parameters removed:
    none. - Other terms: The simulated speaker in L1 samples referents according to
    the multi-attribute perceptual prior vec(prior, r) instead of a uniform distribution,
    and on uninformative prior trials choices follow this prior directly rather than
    uniform guessing.'
- name: noisy_channel_speaker_l2
  rationale: 'Pragmatic listeners reason at depth 2 about a speaker whose intended
    message selection is rational but whose actual feature articulation is subject
    to stochastic transmission noise over applicable descriptors. This noisy-channel
    execution noise softens extreme likelihood differences, preventing listeners from
    drastically ruling out competitor objects that possess additional features or
    identical duplicates when hearing an ambiguous or shared word. On trials with
    no informative word, choices directly follow a rich perceptual and experiential
    prior combining singleton salience, contextual distinctiveness, feature count,
    color contrast, and familiarization frequency. Differences from source (rsa_l2_singleton_feat_color_familiar_l0):
    - Recursion depth: Unchanged at depth 2 (choice_probs calls L2). - Parameters
    added: epsilon (prior: dist.Beta(1.0, 5.0)), representing the probability of stochastic
    execution noise over true features. - Parameters removed: None. - Other terms:
    In both simulated speaker levels L1 and L2, the speaker chooses an intended communicative
    feature according to pragmatic utility but articulates an applicable feature with
    execution noise epsilon.'
- name: attentive_display_listener
  rationale: Listeners have limited visual attention across the display, so even foundational
    literal interpretation is biased toward visually salient objects rather than uniform
    across truth-conditional matches. Communicative speakers anticipate an attentive
    listener whose gaze is naturally drawn to visually distinctive and feature-rich
    objects, making speakers more willing to use shared descriptors for complex referents.
    Pragmatic listeners in turn do not excessively eliminate feature-rich competitor
    objects when hearing an ambiguous utterance.
- name: noisy_channel_speaker_l1
  rationale: 'Pragmatic listeners reason at depth 1 about a speaker whose intended
    message selection is rational but whose actual feature articulation is subject
    to stochastic execution noise over applicable descriptors. Refining rsa_l1_singleton_feat_color_familiar
    by incorporating the stochastic transmission noise component from noisy_channel_speaker_l2:
    listeners perform first-order pragmatic inversion of a speaker who balances literal
    informativeness against a rich perceptual and experiential referent prior, but
    occasionally articulates any applicable descriptor by mistake. This transmission
    noise cushions likelihood ratios, directly mitigating the model''s overprediction
    of minimal-feature targets when competitors have duplicate copies or large feature
    gaps, while preserving depth-1 calibrated reasoning and perceptual prior expectations
    on uninformative mumble trials. Differences from source (rsa_l1_singleton_feat_color_familiar):
    - Recursion depth: depth 1 (choice_probs calls L1, unchanged from source). - Parameters
    added: epsilon (prior: dist.Beta(1.0, 5.0)), representing the probability of stochastic
    execution noise over true features. - Parameters removed: none. - Other terms:
    In the simulated speaker at level L1, the speaker chooses an intended communicative
    feature m according to literal informativeness but articulates an applicable feature
    u with execution noise epsilon.'
- name: softmax_belief_listener
  rationale: Listeners evaluate candidate referents through pragmatic counterfactual
    reasoning, but rather than strictly matching choice probabilities to posterior
    beliefs, they select their click via a bounded-precision softmax decision rule
    over beliefs. When choosing among semantically valid referents, response sensitivity
    determines how strongly differences in subjective belief translate into click
    probabilities, softening extreme pragmatic inferences and generating bounded,
    probabilistic choice. On uninformative trials, choices likewise reflect this bounded
    softmax response rule applied over prior perceptual and contextual expectations.
- name: speaker_aspect_goal_listener
  rationale: Listeners understand that speakers are not always trying to uniquely
    identify an individual object in the display, but frequently communicate with
    the goal of highlighting or conveying an aspect of the referent (a feature-oriented
    question under discussion). Under an aspect-descriptive goal, speakers freely
    choose among the referent's true features without penalizing descriptors that
    are shared across other objects. A pragmatic listener maintains uncertainty over
    whether the speaker aims for referent identification or aspect description, preventing
    extreme elimination of multi-feature and duplicated competitor objects when hearing
    an ambiguous word.
- name: attentive_noisy_channel_listener
  rationale: 'Pragmatic listeners reason at depth 1 about an attentive literal listener,
    but account for stochastic execution noise in the speaker''s feature articulation.
    Refining attentive_display_listener by incorporating the stochastic transmission
    noise component from noisy_channel_speaker_l1: foundational literal interpretation
    remains biased toward visually salient and distinctive objects, and communicative
    speakers anticipate this attentive gaze, but speakers occasionally articulate
    an alternative applicable descriptor by mistake. This transmission noise cushions
    extreme likelihood ratios, directly correcting the incumbent model''s severe overprediction
    of minimal-feature targets when competitors have duplicate copies or large feature
    gaps, while preserving visual attention biases on uninformative mumble trials.
    Differences from source (attentive_display_listener): - Recursion depth: depth
    1 (choice_probs calls L1, unchanged from source). - Parameters added: epsilon
    (prior: dist.Beta(1.0, 5.0)), representing the probability of stochastic execution
    noise over true features. - Parameters removed: none. - Other terms: In the simulated
    speaker at level L1, the speaker chooses an intended communicative feature m according
    to informativeness over attentive L0, but articulates an applicable feature u
    with stochastic execution noise epsilon.'
- name: noisy_channel_featured_singleton_l1
  rationale: 'Perceptual pop-out from uniqueness in a visual scene requires distinguishing
    features; an unadorned, empty object does not capture attention merely because
    it lacks identical copies. Pragmatic listeners invert a first-order noisy-channel
    speaker with a referent prior where visual singleton salience applies only to
    unique objects possessing at least one visual feature. This prevents listeners
    from overselecting featureless singleton objects in displays containing duplicated
    competitors on uninformative trials, while transmission noise tempers pragmatic
    likelihood ratios when hearing descriptive words. Refining noisy_channel_speaker_l1
    by incorporating the feature-gated singleton salience component from feature_singleton_salience_l1:
    - Recursion depth: depth 1 (choice_probs calls L1, unchanged from source). - Parameters
    added: none. - Parameters removed: none. - Other terms: In the referent prior,
    visual singleton salience is gated by the presence of visual features (`featured_singleton
    = is_singleton * (ctx.feature_count > 0)`), so that empty objects with no duplicates
    receive zero singleton pop-out boost.'
- name: literal_pragmatic_mixture_listener
  rationale: Listeners in reference games are cognitively heterogeneous, behaving
    as a population mixture of literal and depth-2 pragmatic listener types. Literal
    listeners select among truthful referents according to visual attention without
    counterfactual speaker reasoning, while pragmatic listeners perform recursive
    pragmatic inversion to resolve communicative intent. Across display sizes and
    feature overlaps, this mixture moderates extreme target inferences by providing
    a consistent literal choice baseline regardless of feature gap or display complexity.
- name: contrastive_similarity_speaker
  rationale: 'In communicative reference, speakers evaluate potential utterances not
    against an undifferentiated background of all scene objects, but through perceptual
    confusability: communicative interference decays with visual feature distance,
    so sharing a descriptor with a distant, visually distinct competitor incurs minimal
    penalty compared to sharing it with an adjacent neighbor. A rational pragmatic
    listener inverts this similarity-contrast speaker, recognizing that a speaker
    describing a multi-featured referent freely uses a shared descriptor when the
    competing matching object is distant in feature space. This mechanism disagrees
    most sharply with standard RSA on displays with large feature gaps between a minimal
    target and a multi-featured competitor (such as hearing a shared feature for a
    one-feature object competing against a four-feature object), preventing listeners
    from overwhelmingly eliminating the complex competitor.'
- name: bounded_capacity_listener
  rationale: Listeners interpret utterances under bounded cognitive capacity, performing
    conservative belief updating where communicative evidence from the speaker is
    tempered relative to prior scene expectations. Rather than executing unconstrained
    Bayesian belief revision that overwhelmingly eliminates complex competitor objects,
    a resource-limited listener dampens extreme likelihood ratios to maintain moderate
    expectations for multi-featured competitors. On uninformative trials where no
    communicative evidence is received, choices directly reflect prior perceptual
    and contextual scene expectations.
- name: aspect_goal_featured_singleton_listener
  rationale: 'Visual pop-out from scene uniqueness requires the presence of distinguishing
    visual features, so an unadorned empty object does not capture pre-attentive attention
    merely because it lacks duplicates. Pragmatic listeners invert a communicative
    speaker who alternates between uniquely identifying a referent and simply describing
    an aspect of it, under a referent prior where visual singleton salience applies
    only to unique objects possessing actual visual features. This prevents listeners
    from overselecting empty singletons when competing against duplicated full objects
    on uninformative trials, while aspect-goal speaker uncertainty cushions pragmatic
    likelihood ratios when hearing descriptive words. Differences from source (speaker_aspect_goal_listener):
    - Recursion depth: depth 1 (choice_probs calls L1, unchanged from source). - Parameters
    added: none. - Parameters removed: none. - Other terms: In the referent prior,
    discrete visual singleton salience is gated by the presence of visual features
    (`featured_singleton = is_singleton * (ctx.feature_count > 0)`), ensuring that
    empty objects lacking visual features receive no singleton pop-out boost.'
