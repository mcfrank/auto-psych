- name: competition_scaled_binding_lapse_l2
  rationale: 'We refine competition_endpoint_binding_lapse_l2 by replacing display-normalized
    illusory conjunctions with complexity-scaled perceptual feature binding from Feature
    Integration Theory. When resolving referring expressions, features active in working
    memory are prone to illusory conjunctions on non-matching distractors, with an
    object''s susceptibility scaling directly with its visual feature complexity.
    Pragmatic listeners invert competition-bounded speakers while factoring in this
    distractor-specific perceptual vulnerability, directly resolving the incumbent
    model''s severe underprediction of literal semantic violations on visually complex
    non-matching objects (complex_false_object_rate). Differences from competition_endpoint_binding_lapse_l2:
    - Recursion depth: Unchanged; choice_probs calls L2. - Parameters added: None.
    - Parameters removed: None. - Perceptual feature-binding mechanism: Replaces display-normalized
    illusory conjunctions with complexity-scaled feature binding in choice_probs on
    word trials. Effective binding probability scales with the relative feature complexity
    of the most complex non-matching distractor (effective_bind = params["w_binding"]
    * (max_false_fc / max_fc)), and distractor binding weights scale purely with relative
    visual feature count without multiplying by the extremity-penalized prior (binding_weight
    = is_false * (ctx.feature_count / max_fc)), eliminating artificial suppression
    of intermediate-complexity false objects. - All other terms: Contextual end-point
    salience (w_endpoint) in the shared visual referent prior (alongside w_singleton,
    w_distinct, w_features, w_empty, and w_color), lexical competition in speaker
    utterance production (w_competition), capacity-limited inferential updating (kappa)
    at L1 and L2, contextual feature prevalence accessibility (w_prevalence) and referential
    equivalence class size redundancy discounting (w_redundancy via compute_equivalence_class)
    on speaker alternatives in S1 and S2, literal truth-conditional semantics at L0,
    depth-2 RSA recursion, and salience-captured attentional lapse mixing remain identical
    to competition_endpoint_binding_lapse_l2.'
- name: conjunction_binding_distractor_l2
  rationale: 'We refine competition_distractor_endpoint_l2 by incorporating feature
    conjunction binding into perceptual reference resolution. Under Feature Integration
    Theory, illusory feature conjunctions occur specifically when candidate objects
    require attentional binding across multiple visual attributes, whereas objects
    with zero or single features are processed pre-attentively and do not suffer illusory
    conjunction errors. Susceptibility to illusory feature binding scales directly
    with an object''s feature conjunction load, directly resolving the model''s severe
    underprediction of choices for complex non-matching objects on word trials (complex_false_object_rate)
    while preserving distractor-interference reasoning, lexical competition, and contextual
    endpoint salience. Differences from competition_distractor_endpoint_l2: - Recursion
    depth: Unchanged; choice_probs calls L2. - Parameters added: None. - Parameters
    removed: None. - Perceptual feature-binding mechanism: In choice_probs on word
    trials, illusory feature binding scales with candidate distractor feature conjunction
    complexity (conjunction_load = jnp.maximum(ctx.feature_count - 1.0, 0.0) / max_fc)
    rather than uniform non-matching presence, gating effective binding by the maximum
    conjunction complexity among context distractors (effective_bind = params["w_binding"]
    * jnp.max(is_false * conjunction_load)), so that single-feature and empty distractors
    are immune to illusory binding while multi-featured distractors attract illusory
    binding in proportion to their conjunction complexity. - All other terms: Perceptual
    distractor interference in speaker utterance production (w_threat), lexical competition
    across candidate utterances (w_competition), contextual end-point salience (w_endpoint)
    in the shared visual referent prior (alongside w_singleton, w_distinct, w_features,
    w_empty, and w_color), capacity-limited inferential updating (kappa) at L1 and
    L2, contextual feature prevalence accessibility (w_prevalence) and referential
    equivalence class size redundancy discounting (w_redundancy via compute_equivalence_class)
    on speaker alternatives in S1 and S2, literal truth-conditional semantics at L0,
    depth-2 RSA recursion, and salience-captured attentional lapse mixing remain identical
    to competition_distractor_endpoint_l2.'
- name: selective_attention_listener_l2
  rationale: 'When resolving referring expressions in visual reference games, listeners
    operate under selective dimensional attention (Garner filtering): on unprompted
    trials, perceptual attention is distributed holistically across all visual dimensions
    according to bottom-up feature conspicuity, whereas hearing an informative referring
    expression triggers selective attentional narrowing to the mentioned attribute,
    attenuating the perceptual salience of extraneous, unmentioned visual features.
    Pragmatic listeners invert informative speakers under this dimension-filtered
    prior, which directly resolves the incumbent model''s underprediction of simpler
    matching candidates in cross-cutting displays (non_nested_fewer_features_rate)
    and overprediction of intermediate matching objects (word_intermediate_match_rate)
    while preserving robust exemplar salience on unprompted trials (mumble_full_over_empty_rate).
    This mechanism disagrees most sharply with the current best model on cross-cutting
    displays where matching candidates vary in extraneous feature complexity (such
    as a two-feature object versus a three-feature object sharing the uttered word),
    predicting a robust preference for the simpler candidate rather than dividing
    choices evenly.'
