models:
- name: competition_endpoint_binding_l2
  rationale: 'We refine endpoint_binding_uncertainty_lapse_l2 by incorporating lexical
    competition in speaker utterance production from lexical_competition_speaker_l2
    into communicative inference. When communicating about an object with multiple
    applicable visual features, candidate labels compete for lexical retrieval and
    selection in the speaker''s lexicon, attenuating the speaker''s communicative
    precision and increasing the production of shared or redundant expressions. Pragmatic
    listeners invert this competition-bounded speaker via recursive Theory of Mind
    at depth 2, which softens recursive preemption penalties against multi-featured
    competitor referents in two-object subset displays and cross-cutting contexts
    while preserving extremity expectations, perceptual feature binding, and contextual
    lexical uncertainty. Differences from endpoint_binding_uncertainty_lapse_l2: -
    Recursion depth: Unchanged; choice_probs calls L_choice, which marginalizes over
    depth-2 pragmatic listener L2. - Parameters added: w_competition (prior: dist.LogNormal(-1.0,
    1.0)). - Parameters removed: None. - Speaker utterance production / lexical competition:
    In S1 and S2, the speaker''s communicative precision varies by referent feature
    complexity (alpha = params["alpha"] / (1.0 + params["w_competition"] * jnp.maximum(ctx.feature_count
    - 1.0, 0.0))) from lexical_competition_speaker_l2, attenuating speaker rationality
    when describing objects that possess multiple competing candidate labels. - Shared
    visual referent prior: Unchanged; combines singleton salience (w_singleton), contextual
    distinctiveness (w_distinct), visual feature count (w_features), featureless baseline
    ground salience (w_empty), contextual endpoint salience (w_endpoint * is_endpoint),
    and color contrast (w_color). - Perceptual feature-binding mechanism: Unchanged;
    non-matching distractor objects receive illusory conjunction probability scaling
    with relative visual feature complexity and prior salience (binding_weight = is_false
    * (ctx.feature_count / max_fc) * prior, normalized as p_bind), mixed into the
    pragmatic interpretation as p_word = (1.0 - effective_bind) * heard + effective_bind
    * p_bind. - Contextual lexical feature uncertainty: Unchanged; listeners marginalize
    over alternative feature interpretations that co-occur in context with the uttered
    word via transition matrix p_feat (weighted by beta) in L_choice. - Response choice
    lapse mechanism: Retains salience-captured attentional lapse mixing (p_choice
    = (1.0 - lapse) * p_word + lapse * prior, returning prior on uninformative prior
    trials). - All other terms: Capacity-limited inferential updating (kappa) at L1
    and L2, contextual feature prevalence accessibility (w_prevalence) and referential
    equivalence class size redundancy discounting (w_redundancy via compute_equivalence_class)
    on speaker alternatives in S1 and S2, literal truth-conditional semantics at L0,
    and depth-2 RSA recursion remain identical to endpoint_binding_uncertainty_lapse_l2.'
- name: egocentric_endpoint_binding_l2
  rationale: 'We refine endpoint_binding_uncertainty_lapse_l2 by incorporating partially
    egocentric speaker production from egocentric_speaker_l2 into recursive communication.
    When communicating about an object, speakers balance partner-directed informativeness
    against egocentric accessibility, frequently producing an applicable visual feature
    without exhaustively verifying whether it uniquely distinguishes the referent
    from context distractors. Pragmatic listeners invert this partially egocentric
    speaker via recursive Theory of Mind at depth 2, which directly softens recursive
    preemption in two-object subset displays and ambiguous-word contexts while favoring
    candidates with fewer total features in cross-cutting contexts because egocentric
    production probability scales inversely with each object''s total feature count.
    Differences from endpoint_binding_uncertainty_lapse_l2: - Recursion depth: Unchanged;
    choice_probs calls L_choice, which marginalizes over depth-2 pragmatic listener
    L2. - Parameters added: w_ego (prior: dist.Beta(1.0, 4.0)). - Parameters removed:
    None. - Speaker utterance production / egocentric accessibility: In S1 and S2,
    candidate utterance weights interpolate between partner-directed communicative
    informativeness and egocentric accessibility weighted by w_ego (((1.0 - w_ego)
    * exp(alpha * log(L + EPS)) + w_ego)), reflecting speakers'' tendency to name
    applicable features based on intrinsic availability without complete partner perspective-taking.
    - Shared visual referent prior: Unchanged; combines singleton salience (w_singleton),
    contextual distinctiveness (w_distinct), visual feature count (w_features), featureless
    baseline ground salience (w_empty), contextual endpoint salience (w_endpoint *
    is_endpoint), and color contrast (w_color). - Perceptual feature-binding mechanism:
    Unchanged; non-matching distractor objects receive illusory conjunction probability
    scaling with relative visual feature complexity and prior salience (binding_weight
    = is_false * (ctx.feature_count / max_fc) * prior, normalized as p_bind), mixed
    into the pragmatic interpretation as p_word = (1.0 - effective_bind) * heard +
    effective_bind * p_bind. - Contextual lexical feature uncertainty: Unchanged;
    listeners marginalize over alternative feature interpretations that co-occur in
    context with the uttered word via transition matrix p_feat (weighted by beta)
    in L_choice. - Response choice lapse mechanism: Retains salience-captured attentional
    lapse mixing (p_choice = (1.0 - lapse) * p_word + lapse * prior, returning prior
    on uninformative prior trials). - All other terms: Capacity-limited inferential
    updating (kappa) at L1 and L2, contextual feature prevalence accessibility (w_prevalence)
    and referential equivalence class size redundancy discounting (w_redundancy via
    compute_equivalence_class) on speaker alternatives in S1 and S2, literal truth-conditional
    semantics at L0, and depth-2 RSA recursion remain identical to endpoint_binding_uncertainty_lapse_l2.'
- name: endpoint_binding_uncertainty_lapse_l2
  rationale: 'We refine feature_binding_uncertainty_lapse_l2 by incorporating contextual
    end-point salience from endpoint_salience_l2 into the shared visual referent prior.
    In visual reference games, listeners anchor their default perceptual attention
    at the structural boundaries of the scene''s feature complexity distribution (the
    minimal baseline object and the maximal exemplar), while intermediate objects
    that fall strictly between these poles are disfavored as unremarkable non-targets.
    Pragmatic listeners resolve referring expressions under this extremity prior alongside
    perceptual feature-binding noise and contextual lexical uncertainty, directly
    resolving the incumbent model''s significant overprediction of strictly intermediate-complexity
    objects on both unprompted mumble trials and matching word trials. Differences
    from feature_binding_uncertainty_lapse_l2: - Recursion depth: Unchanged; choice_probs
    calls L_choice, which marginalizes over depth-2 pragmatic listener L2. - Parameters
    added: w_endpoint (prior: dist.Normal(0.0, 1.0)). - Parameters removed: None.
    - Shared visual referent prior: Adds contextual endpoint salience (params["w_endpoint"]
    * is_endpoint) to the perceptual referent prior, where is_endpoint flags objects
    possessing either the minimum or maximum feature count in the display (1.0 - is_inter,
    where is_inter identifies objects whose feature count is strictly between the
    display minimum and maximum), disfavoring strictly intermediate objects. - Perceptual
    feature-binding mechanism: Unchanged; non-matching distractor objects receive
    illusory conjunction probability scaling with relative visual feature complexity
    and prior salience (binding_weight = is_false * (ctx.feature_count / max_fc) *
    prior, normalized as p_bind), mixed into the pragmatic interpretation as p_word
    = (1.0 - effective_bind) * heard + effective_bind * p_bind. - Contextual lexical
    feature uncertainty: Unchanged; listeners marginalize over alternative feature
    interpretations that co-occur in context with the uttered word via transition
    matrix p_feat (weighted by beta) in L_choice. - Response choice lapse mechanism:
    Retains salience-captured attentional lapse mixing (p_choice = (1.0 - lapse) *
    p_word + lapse * prior, returning prior on uninformative prior trials). - All
    other terms: Capacity-limited inferential updating (kappa) at L1 and L2, contextual
    feature prevalence accessibility (w_prevalence) and referential equivalence class
    size redundancy discounting (w_redundancy via compute_equivalence_class) on speaker
    alternatives in S1 and S2, literal truth-conditional semantics at L0, depth-2
    RSA recursion, and baseline perceptual prior components (w_singleton, w_distinct,
    w_features, w_empty, w_color) remain identical to feature_binding_uncertainty_lapse_l2.'
- name: feature_binding_salience_lapse_l2
  rationale: 'We refine salience_lapse_endpoint_prev_l2 by incorporating perceptual
    feature-binding noise from feature_binding_listener_l2 into reference resolution.
    When resolving referring expressions in visual reference games, listeners reason
    under perceptual feature-binding noise (Feature Integration Theory): features
    active in working memory are prone to illusory conjunctions, erroneously binding
    to distractor objects that physically lack them. Susceptibility to illusory conjunctions
    scales with a distractor''s visual feature complexity, directly resolving the
    source model''s severe underprediction of literal semantic violations (false-feature
    choices) on complex non-matching objects while preserving bounded-capacity pragmatic
    inference and salience-captured attentional lapses. Differences from salience_lapse_endpoint_prev_l2:
    - Recursion depth: Unchanged; choice_probs calls L2. - Parameters added: w_binding
    (prior: dist.Beta(1.0, 24.0)). - Parameters removed: None. - Perceptual feature-binding
    mechanism: In choice_probs on word trials, incorporates perceptual feature binding
    from feature_binding_listener_l2: non-matching distractor objects receive illusory
    conjunction probability scaling with relative visual feature complexity and prior
    salience (binding_weight = is_false * (ctx.feature_count / max_fc) * prior, normalized
    as p_bind), mixed into the pragmatic interpretation as p_word = (1.0 - effective_bind)
    * heard + effective_bind * p_bind, which then undergoes salience-captured attentional
    lapse mixing (p_choice = (1.0 - lapse) * p_word + lapse * prior). - All other
    terms: Capacity-limited inferential updating (kappa) at L1 and L2, contextual
    feature prevalence accessibility (w_prevalence) and referential equivalence class
    size redundancy discounting (w_redundancy via compute_equivalence_class) on speaker
    alternatives in S1 and S2, literal truth-conditional semantics at L0, depth-2
    RSA recursion, shared perceptual referent prior (w_singleton, w_distinct, w_features,
    w_empty, w_color), and unprompted prior choice remain identical to salience_lapse_endpoint_prev_l2.'
