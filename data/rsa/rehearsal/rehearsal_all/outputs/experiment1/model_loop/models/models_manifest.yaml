models:
- name: isolated_graded_costly_l3
  rationale: Pragmatic listener at depth 3 with perceptual isolation, graded semantics,
    and utterance extension costs. Refines isolated_graded_costly_l2 by increasing
    the recursion depth from depth 2 to depth 3. Listeners reason at depth 3, inverting
    a speaker who simulates a depth-2 pragmatic listener. Visual pop-out is determined
    by an object's perceptual isolation (minimum Hamming distance to any other context
    object), semantic applicability diminishes with additional competing features
    (graded truth), and speakers evaluate communicative utility trade-offs with utterance
    extension costs proportional to the fraction of display objects sharing each feature.
    On uninformative prior trials, choice follows the perceptual isolation prior.
    A lapse parameter mixes in uniform guessing.
- name: rsa_l2_competitor_confusion_l0
  rationale: 'Pragmatic listeners reason at depth two about a speaker who actively
    avoids referring expressions shared with visually confusable competitors. People
    expect speakers to avoid ambiguous labels that apply to alternative referents
    with high visual feature similarity, choosing more distinctive descriptions instead.
    Pragmatic listeners invert this confusion-averse speaker while integrating a shared
    perceptual prior favoring visual singletons, distinctive objects, feature complexity
    under positive framing, and high color contrast. Refining rsa_l2_singleton_feat_color_valence_l0
    by incorporating competitor-confusion aversion from competitor_confusion_speaker
    into the speaker utility. This should fit better by explaining participants''
    reluctance to choose confusable competitors in complex visual contexts (such as
    the Mayn & Demberg displays where confusion models excel) while maintaining depth-two
    recursive reasoning and rich perceptual salience priors. Differences from source
    (rsa_l2_singleton_feat_color_valence_l0): - Recursion depth: Unchanged; choice_probs
    calls depth-2 listener L2. - Parameters added: w_confusion ~ Normal(0.0, 2.0).
    - Parameters removed: None. - Terms changed: S1 and S2 speaker choice utilities
    subtract w_confusion * at(confusion, u, r), where confusion is the matrix product
    of the non-sink lexicon and pairwise exponential-distance visual similarity between
    objects. The prior computation, literal L0 semantics, and lapse process remain
    identical to the source.'
- name: limited_attention_listener
  rationale: Human listeners have limited visual attention to the display during reference
    resolution. Rather than assuming words are interpreted uniformly across all candidate
    objects, the listener allocates capacity-limited visual attention across the display
    based on visual salience (contextual uniqueness, feature complexity, and color
    contrast), which directly gates literal semantic grounding. Communicative speakers
    anticipate that unattended distractors will fail to capture the listener's attention,
    and pragmatic listeners invert this attention-grounded speaker to resolve referring
    expressions.
- name: rsa_l2_competitor_confusion_fam_l0
  rationale: 'Pragmatic listeners reason at depth two about a speaker who avoids referring
    expressions shared with visually confusable competitors, while sharing an object
    prior that integrates perceptual salience with empirical base rates learned from
    familiarization frequency. Prior exposure establishes expectations that directly
    bias referent selection on both uninformative and informative trials, combining
    additively with visual singleton salience, contextual distinctiveness, evaluative
    valence-modulated feature complexity, and color contrast. Refining rsa_l2_competitor_confusion_l0
    by incorporating empirical familiarization base-rate sensitivity from rsa_l2_singleton_feat_color_val_fam_l0
    into the shared object prior. This should fit better by capturing participants''
    learned frequency expectations on familiarization trials (such as the base-rate
    conditions where uninformative and informative choices strongly track prior exposure
    frequency) while preserving depth-two recursive reasoning, competitor-confusion
    aversion, and perceptual salience. Differences from source (rsa_l2_competitor_confusion_l0):
    - Recursion depth: Unchanged; choice_probs calls depth-2 listener L2. - Parameters
    added: w_familiar ~ Normal(0.0, 2.0). - Parameters removed: None. - Terms changed:
    Exactly one term added: + params["w_familiar"] * ctx.familiarization inside the
    softmax prior computation. The competitor confusion matrix calculation, S1 and
    S2 speaker choice utilities, literal L0 semantics, depth-2 recursive reasoning,
    and lapse process remain identical to the source.'
- name: rsa_l2_mean_confusion_fam_l0
  rationale: 'Pragmatic listeners reason at depth two about a speaker who evaluates
    referring expressions by the mean confusion across alternative display competitors,
    avoiding expressions shared with visually confusable objects in proportion to
    the display''s confusable competitor density. Rather than penalizing shared words
    with an unnormalized sum that artificially grows with display size, communicative
    speakers assess the average risk of confusion per competitor in the context, preventing
    multi-object displays from over-penalizing shared descriptions while preserving
    robust confusion aversion. Pragmatic listeners invert this context-normalized
    confusion-averse speaker while integrating a shared prior over perceptual salience
    and empirical familiarization base rates. Refining rsa_l2_competitor_confusion_fam_l0
    by normalizing the competitor confusion penalty by the number of display competitors
    (N_obj - 1). This should fit better by standardizing the scale of competitor confusion
    across displays of varying set sizes (from 2 to 4 objects), eliminating the artificial
    inflation of confusion penalties in larger multi-object displays (such as 4-object
    contexts) while maintaining depth-two recursive reasoning, competitor-confusion
    aversion, perceptual salience, and empirical base-rate sensitivity. Differences
    from source (rsa_l2_competitor_confusion_fam_l0): - Recursion depth: Unchanged;
    choice_probs calls depth-2 listener L2. - Parameters added: None. - Parameters
    removed: None. - Terms changed: Exactly one term changed: confusion = (real_lex
    @ sim) / jnp.maximum(n_obj - 1.0, 1.0) (normalizing the competitor confusion matrix
    by display competitor count n_obj - 1); prior distribution on w_confusion broadened
    from Normal(0.0, 2.0) to Normal(0.0, 4.0) to accommodate the normalized scale.
    The prior computation, S1 and S2 speaker choice utilities, literal L0 semantics,
    depth-2 recursive reasoning, and lapse process remain identical to the source.'
- name: rsa_l2_confusion_fam_grounded_l0
  rationale: 'Literal semantic grounding is directly gated by visual salience and
    learned base-rate expectations, so that words preferentially bring salient referents
    to mind even before pragmatic reasoning begins. Speakers anticipate this attention-grounded
    interpretation and avoid referring expressions shared with confusable competitors,
    while pragmatic listeners recursively invert this speaker to resolve referring
    expressions. Refining rsa_l2_competitor_confusion_fam_l0 by incorporating the
    attention-grounded literal semantics mechanism from limited_attention_listener
    into the foundational L0 listener. This should fit better by aligning literal
    semantic applicability with contextual salience and learned familiarization frequency
    across all displays, explaining participants'' strong tendency to resolve ambiguous
    words toward visually salient and frequent referents while preserving depth-two
    recursive reasoning and competitor-confusion aversion. Differences from source
    (rsa_l2_competitor_confusion_fam_l0): - Recursion depth: Unchanged; choice_probs
    calls depth-2 listener L2. - Parameters added: None. - Parameters removed: None.
    - Terms changed: L0 literal listener choice weights become wpp=at(lex, u, r) *
    vec(prior, r) (incorporating the shared perceptual and empirical prior into literal
    semantic grounding, taken from limited_attention_listener), with prior passed
    as an argument to L0 in L1. The prior computation, competitor confusion matrix
    calculation, S1 and S2 speaker choice utilities, depth-2 recursive reasoning,
    and lapse process remain identical to the source.'
- name: rsa_l2_mean_confusion_softmax_l0
  rationale: 'Listeners convert their pragmatic referent beliefs into physical choices
    via a decisive softmax decision rule rather than passive probability matching.
    When resolving referential ambiguity, people act decisively by amplifying their
    highest-confidence referent hypothesis over weaker alternatives in proportion
    to an internal decision rationality. Pragmatic listeners invert a context-normalized
    confusion-averse speaker at depth two while combining shared perceptual salience,
    empirical base rates, and decisive referent selection. Refining rsa_l2_mean_confusion_fam_l0
    by incorporating the softmax decision rule from softmax_belief_listener into the
    final referent selection stage. This should fit better by allowing listeners to
    act decisively rather than strictly probability-matching their posterior beliefs,
    better capturing the concentrated distribution of human referent clicks on high-probability
    choices across displays while preserving depth-two recursive reasoning, context-normalized
    competitor-confusion aversion, perceptual salience, and empirical base-rate sensitivity.
    Differences from source (rsa_l2_mean_confusion_fam_l0): - Recursion depth: Unchanged;
    choice_probs calls depth-2 listener L2. - Parameters added: beta ~ LogNormal(0.0,
    1.0) governing listener decision rationality. - Parameters removed: None. - Terms
    changed: Exactly one term changed at the decision stage: decision = jax.nn.softmax(params["beta"]
    * jnp.log(belief + EPS)) where belief = jnp.where(ctx.is_prior > 0, prior, heard).
    The prior computation, competitor confusion matrix calculation, literal L0 semantics,
    S1 and S2 speaker choice utilities, depth-2 recursive reasoning, and lapse process
    remain identical to the source.'
- name: rsa_l2_max_confusion_fam_l0
  rationale: 'Pragmatic listeners reason at depth two about a speaker who evaluates
    referring expressions by the maximum competitor confusion across the visual display,
    avoiding expressions shared with the single most confusable competitor. Rather
    than penalizing shared words with an additive sum that artificially scales with
    context size, communicative speakers assess the worst-case bottleneck risk of
    the closest distractor, ensuring robust confusion aversion whenever a referent
    has an easily confused competitor. Pragmatic listeners invert this worst-case
    confusion-averse speaker while integrating a shared prior over perceptual salience
    and empirical familiarization base rates. Refining rsa_l2_competitor_confusion_fam_l0
    by replacing the sum-confusion matrix with the maximum visual similarity across
    competitors sharing the candidate word. This should fit better by capturing worst-case
    referential risk without scaling with set size, preventing multi-object displays
    from over-penalizing shared descriptions while maintaining sharp confusion avoidance
    whenever a confusable distractor is present. Differences from source (rsa_l2_competitor_confusion_fam_l0):
    - Recursion depth: Unchanged; choice_probs calls depth-2 listener L2. - Parameters
    added: None. - Parameters removed: None. - Terms changed: Exactly one term changed:
    confusion = jnp.max(real_lex[:, None, :] * sim[None, :, :], axis=-1) (evaluating
    competitor confusion as the maximum visual similarity across competitors sharing
    the word, rather than the sum real_lex @ sim); prior distribution on w_confusion
    broadened from Normal(0.0, 2.0) to Normal(0.0, 4.0) to accommodate the normalized
    maximum scale. The prior computation, S1 and S2 speaker choice utilities, literal
    L0 semantics, depth-2 recursive reasoning, and lapse process remain identical
    to the source.'
- name: rsa_l2_decay_confusion_fam_l0
  rationale: 'Communicative speakers avoid referring expressions shared with visually
    confusable competitors according to a psychological similarity gradient, where
    the confusability of alternative display items decays exponentially with perceptual
    distance rather than at an arbitrary fixed rate. People evaluate referential ambiguity
    by heavily discounting competitors that differ on multiple visual dimensions while
    maintaining sharp confusion aversion for near-identical distractors. Pragmatic
    listeners invert this gradient-decay confusion-averse speaker at depth two while
    integrating a shared prior over perceptual salience and empirical familiarization
    base rates. Refining rsa_l2_mean_confusion_fam_l0 by estimating the exponential
    perceptual decay rate (generalization gradient) governing pairwise visual similarity
    between display objects. This improves model fit by allowing the cognitive sharpness
    of competitor confusability to be learned from data rather than hardcoded to a
    unit rate, capturing human sensitivity to near-identical distractors without over-penalizing
    descriptions when competitors differ across multiple visual features, while preserving
    depth-two recursive reasoning, mean competitor confusion normalization, perceptual
    salience, and empirical base rates. Differences from source (rsa_l2_mean_confusion_fam_l0):
    - Recursion depth: Unchanged; choice_probs calls depth-2 listener L2. - Parameters
    added: gamma ~ LogNormal(0.0, 1.0) governing the exponential perceptual decay
    gradient in visual similarity. - Parameters removed: None. - Terms changed: Exactly
    one term changed in pairwise similarity computation: sim = jnp.exp(-params["gamma"]
    * total_dist) * (1.0 - eye) (scaling total perceptual distance by generalization
    gradient parameter gamma, rather than assuming a fixed unit decay rate). The prior
    computation, competitor confusion normalization by n_obj - 1, literal L0 semantics,
    S1 and S2 speaker choice utilities, depth-2 recursive reasoning, and lapse process
    remain identical to the source.'
- name: rsa_l2_visual_confusion_fam_l0
  rationale: 'Pragmatic listeners reason at depth two about a speaker who evaluates
    competitor confusion based solely on physical visual appearance, maintaining a
    clean separation between bottom-up perceptual similarity and top-down empirical
    base rates. While prior exposure during familiarization establishes learned expectations
    that directly bias prior referent beliefs, exposure frequency does not alter an
    object''s visual confusability or physical singleton status in the display. Pragmatic
    listeners invert this appearance-based confusion-averse speaker while integrating
    a shared object prior combining visual salience and empirical familiarization
    base rates. Refining rsa_l2_mean_confusion_fam_l0 by restricting perceptual distance
    and competitor similarity to physical appearance dimensions (semantic features
    and color), separating visual confusability from empirical familiarization base
    rates. This should fit better by preventing exposure frequency differences from
    distorting pairwise visual similarity and singleton detection in familiarization
    conditions (such as E5_baserate), allowing empirical base rates to inform prior
    referent expectations without corrupting bottom-up perceptual confusion calculations.
    Differences from source (rsa_l2_mean_confusion_fam_l0): - Recursion depth: Unchanged;
    choice_probs calls depth-2 listener L2. - Parameters added: None. - Parameters
    removed: None. - Terms changed: Exactly one term changed in pairwise distance
    computation: total_dist = pair_dist + gray_diff (removing the artificial + fam_diff
    term that conflated familiarization exposure frequency with visual perceptual
    distance). The prior computation (including familiarization base rate sensitivity
    + params["w_familiar"] * ctx.familiarization), competitor confusion normalization
    by n_obj - 1, literal L0 semantics, S1 and S2 speaker choice utilities, depth-2
    recursive reasoning, prior distributions, and lapse process remain identical to
    the source.'
- name: rsa_l2_decay_confusion_softmax_l0
  rationale: 'Communicative speakers evaluate candidate referring expressions according
    to a psychological similarity gradient where competitor confusability decays exponentially
    with multidimensional perceptual distance, while listeners convert their resulting
    pragmatic beliefs into referent selections via a decisive softmax decision rule.
    Rather than assuming visual confusion decays at an arbitrary fixed rate, communicative
    speakers discount competitors along a learned perceptual generalization gradient,
    avoiding expressions shared with near-identical distractors while normalizing
    confusion risk by display competitor density. Pragmatic listeners invert this
    gradient-decay confusion-averse speaker at depth two while integrating perceptual
    salience, empirical base rates, and a decisive choice rule with internal decision
    rationality. Refining rsa_l2_mean_confusion_softmax_l0 by estimating the exponential
    perceptual decay rate (generalization gradient) governing pairwise visual similarity
    between display objects, taken from rsa_l2_decay_confusion_fam_l0. This improves
    model fit by allowing the cognitive sharpness of competitor confusability to be
    learned from data rather than hardcoded to an arbitrary unit decay rate, capturing
    human sensitivity to near-identical distractors without over-penalizing descriptions
    when competitors differ across multiple visual features, while preserving depth-two
    recursive reasoning, mean competitor confusion normalization, perceptual salience,
    empirical base rates, and decisive referent selection. Differences from source
    (rsa_l2_mean_confusion_softmax_l0): - Recursion depth: Unchanged; choice_probs
    calls depth-2 listener L2. - Parameters added: gamma ~ LogNormal(0.0, 1.0) governing
    the exponential perceptual decay gradient in visual similarity. - Parameters removed:
    None. - Terms changed: Exactly one term changed in pairwise similarity computation:
    sim = jnp.exp(-params["gamma"] * total_dist) * (1.0 - eye) (scaling total perceptual
    distance by generalization gradient parameter gamma, rather than assuming a fixed
    unit decay rate). The prior computation, competitor confusion normalization by
    n_obj - 1, literal L0 semantics, S1 and S2 speaker choice utilities, depth-2 recursive
    reasoning, softmax decision rule with beta, and lapse process remain identical
    to the source.'
