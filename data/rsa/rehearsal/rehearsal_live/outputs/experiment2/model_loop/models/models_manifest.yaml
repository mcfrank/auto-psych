- name: twin_color_atten_base_valence_listener
  rationale: 'Attenuated solitary perceptual oddity listener with twin contrast, visual
    color contrast, attenuated evaluative valence framing, and attenuated contextual
    familiarization base rates. Listeners interpret referring expressions by integrating
    visual color contrast, twin-contrast solitary oddity pop-out, and attenuated evaluative
    valence framing with contextual familiarization base rates whose behavioral influence
    is strong during spontaneous ungrounded expectations but attenuated during linguistic
    utterance comprehension. When no informative expression is heard, listeners strongly
    favor frequently seen exemplars alongside preferences for feature-rich objects
    under positive framing, solitary singletons contrasting with twins, and fully
    colored objects; when an informative expression is heard, selective attention
    to semantic applicability attenuates both familiarization base-rate bias and evaluative
    attitude among matching referents while continuing to weight candidate referents
    by chromatic coloration and twin-contrast solitary pop-out. ### Refinement details
    relative to twin_color_base_atten_valence_listener - **Single stated change**:
    Decoupled the contextual familiarization base-rate parameter in twin_color_base_atten_valence_listener
    into separate ungrounded prior (w_base_prior) and linguistic utterance comprehension
    (w_base_utt) weights. - **Why it should fit better**: In visual reference games
    with pre-test familiarization phases (such as experiment E5_baserate), listeners
    develop empirical base-rate expectations favoring candidate referents encountered
    more frequently during prior exposure. On ungrounded prior trials where no informative
    word is uttered, listeners follow these exposure frequencies unconstrained, strongly
    expecting speakers to target frequent exemplars; however, when an informative
    referring expression is produced, selective attention shifts toward semantic applicability
    and referential intention, dampening the behavioral influence of pre-test exposure
    frequencies among semantically matching referents. The source model (twin_color_base_atten_valence_listener)
    enforced an identical base-rate weight across both prior expectations and utterance
    comprehension, systematically overestimating base-rate bias during linguistic
    comprehension (where it contradicted human pragmatic scalar implicature preferences)
    and constraining the prior base-rate fit; decoupling the base-rate weights allows
    listeners to attend strongly to familiarization frequency a priori while attenuating
    base-rate distortion during utterance interpretation, while preserving twin-contrast
    solitary oddity pop-out, visual color contrast weighting, and attenuated evaluative
    valence modulation. - **Recursion depth**: Unchanged at depth 0 (choice_probs
    evaluates L_heur directly without recursive speaker simulation). - **Parameters
    added or removed**: Removed parameter w_base; added parameters w_base_prior (prior
    Normal(0.0, 2.0)) and w_base_utt (prior Normal(0.0, 2.0)); retained parameter
    beta_prior (prior Normal(0.0, 2.0)), parameter beta_utt (prior Normal(0.0, 2.0)),
    parameter w_valence_prior (prior Normal(0.0, 2.0)), parameter w_valence_utt (prior
    Normal(0.0, 2.0)), parameter w_color (prior Normal(0.0, 2.0)), and parameter lapse
    (prior Beta(1.0, 9.0)). - **Code differences**: In PARAMS, replaced w_base with
    w_base_prior and w_base_utt. In L_heur, renamed array parameter base_bias to base_utt_bias
    in both the function signature and referent choice weighting expression. In choice_probs,
    computed base_prior_bias = params["w_base_prior"] * ctx.familiarization and base_utt_bias
    = params["w_base_utt"] * ctx.familiarization, updated the ungrounded prior calculation
    to prior = softmax_prior(params["beta_prior"] * is_singleton + val_prior_bias
    + color_bias + base_prior_bias), and passed base_utt_bias into L_heur.'
