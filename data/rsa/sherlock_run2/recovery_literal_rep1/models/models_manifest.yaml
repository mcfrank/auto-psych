models:
- name: literal_salience_listener
  rationale: 'Listeners interpret utterances literally rather than pragmatically:
    they select among referents of which the heard word is true based strictly on
    prior contextual salience, without simulating alternative words a speaker could
    have chosen. On a display with a one-feature object and a two-feature object that
    both possess the named feature, this mechanism predicts that listeners will favor
    the two-feature object because its greater feature count makes it more salient
    a priori, directly reversing the pragmatic model''s prediction that the one-feature
    object is favored because a speaker meaning the two-feature object would have
    named its alternative feature.'
- name: bounded_alternatives_listener
  rationale: Listeners have bounded attentional resources to generate and reason over
    unmentioned alternative utterances when interpreting a speaker. When simulating
    the speaker's utterance choice, a resource-limited listener discounts unmentioned
    alternative expressions relative to the focal heard word, reducing the speaker's
    perceived likelihood of having chosen an alternative descriptor. Under limited
    attention to alternatives, the listener relies predominantly on literal semantics
    and contextual salience, attenuating the pragmatic pressure of scalar implicature.
- name: graded_specificity_listener
  rationale: 'Listeners interpret referential expressions through graded truth values
    rather than binary logic: a word''s degree of truth decays with the referent''s
    total feature complexity and is further discounted when the referent possesses
    unmentioned distinctive features that could have uniquely identified it. When
    interpreting an utterance, listeners choose among candidate referents in proportion
    to this graded semantic fit and prior familiarization expectations, without simulating
    a counterfactual speaker.'
- name: fewest_features_listener
  rationale: 'Listeners interpret referential expressions through a non-Bayesian parsimony
    heuristic: rather than simulating counterfactual speakers, they select among referents
    satisfying the heard word by preferring the object with the fewest total features.
    When no informative word is heard, listeners have no descriptive cues to evaluate
    and choose uniformly among candidate objects, modulated only by familiarization
    base rates.'
- name: salience_structured_lapse_listener
  rationale: Listeners interpret utterances through literal semantic comprehension,
    treating all candidate referents that satisfy the speaker's word as equally plausible
    targets. When goal-directed attention lapses or when no informative clue is provided,
    choice is governed by a structured lapse process that falls back to bottom-up
    visual and contextual salience, biasing clicks toward feature-rich and familiar
    objects rather than guessing uniformly at random.
- name: costly_bounded_alternatives_listener
  rationale: 'We refine bounded_alternatives_listener by proposing that speakers balance
    communicative informativeness against utterance production costs, penalizing ambiguous
    words that refer to multiple objects in the visual display. When a resource-limited
    listener simulates the speaker''s referential choice, the speaker''s utility discounts
    unmentioned alternative expressions due to bounded attention while simultaneously
    disfavoring ambiguous shared descriptors. On prior trials with no informative
    word, listener choices are guided solely by contextual object salience. Differences
    from source (bounded_alternatives_listener): - Recursion depth: Unchanged (choice_probs
    calls L1 at depth 1). - Parameters added: cost (prior: Normal(0.0, 1.0)). - Parameters
    removed: None. - Other terms: In L1, the speaker''s choice weight incorporates
    an utterance production cost penalty `- cost * vec(utt_cost, u)`, where `utt_cost`
    measures the excess extension of non-sink utterances across referents (`jnp.maximum(0.0,
    jnp.sum(ctx.lex * (1.0 - ctx.is_sink)[:, None], axis=1) - 1.0)`).'
- name: framed_alignment_listener
  rationale: Listeners interpret referential expressions by inverting a framed, boundedly
    rational speaker whose referential goals reflect contextual framing and whose
    word choices balance semantic truthfulness with descriptive accessibility. Under
    affective framing, the speaker's prior target reflects emotional valence, amplifying
    the appeal of feature-rich objects when describing a favorite and discounting
    complexity when describing a least favorite, while visual prominence renders colored
    objects more salient across all contexts. Bounded listeners infer the speaker's
    intended referent from these framed communicative expectations, relying directly
    on framed visual salience when no informative word is heard.
- name: residual_surprisal_listener
  rationale: Listeners interpret referential expressions by penalizing candidate referents
    according to the residual surprisal of their unmentioned features. When evaluating
    objects that satisfy the heard word, listeners discount referents that possess
    unmentioned features carrying high contextual information content (rarity across
    the display), reasoning that an informative speaker would not omit highly diagnostic
    attributes. When no informative word is heard, choices are guided uniformly across
    candidate referents, modulated by prior familiarization expectations.
- name: valence_parsimony_listener
  rationale: 'We refine fewest_features_listener by proposing that the listener''s
    parsimony heuristic is modulated by the speaker''s affective framing: when interpreting
    an utterance, listeners penalize feature complexity under neutral or positive
    framing ("favorite"), but invert this preference when the speaker describes their
    "least favorite" object, favoring referents with more features. When no informative
    word is heard, listeners choose uniformly among candidate objects, modulated only
    by familiarization base rates. Differences from source (fewest_features_listener):
    - Recursion depth: Unchanged (choice_probs calls L0 at depth 0). - Parameters
    added: w_valence (prior: Normal(0.0, 1.0)). - Parameters removed: None. - Other
    terms: In choice_probs, the feature parsimony exponent `-params["beta"] * ctx.feature_count`
    is replaced by `-(params["beta"] + params["w_valence"] * ctx.valence) * ctx.feature_count`,
    modulating the parsimony penalty according to speaker valence.'
- name: perceptual_parsimony_listener
  rationale: 'We refine fewest_features_listener by proposing that listeners balance
    descriptive parsimony against visual perceptual prominence: when interpreting
    an utterance, listeners penalize feature complexity among matching referents while
    favoring visually prominent referents shown in full color over desaturated grayscale
    objects. When no informative word is heard, listeners have no descriptive cues
    to evaluate and choose uniformly among candidate objects, modulated only by familiarization
    base rates. Differences from source (fewest_features_listener): - Recursion depth:
    Unchanged (choice_probs calls L0 at depth 0). - Parameters added: w_color (prior:
    Normal(0.0, 1.0)). - Parameters removed: None. - Other terms: In choice_probs,
    the referent choice weight incorporates a perceptual prominence boost for colored
    objects: `weight = jnp.exp(-params["beta"] * ctx.feature_count + params["w_color"]
    * (1.0 - ctx.grayscale))`.'
- name: parsimonious_structured_lapse_listener
  rationale: 'We refine salience_structured_lapse_listener by proposing that listeners
    interpret referential expressions through parsimonious semantic comprehension,
    preferring candidate referents with fewer total features rather than treating
    all matching referents equally. When goal-directed attention lapses or when no
    informative clue is provided, choice is governed by a structured fallback to bottom-up
    visual and contextual salience, biasing clicks toward feature-rich and familiar
    objects. This parsimony preference naturally favors simpler referents in ambiguous
    communicative contexts while preserving salience-driven visual attention during
    lapses and prior trials. Differences from source (salience_structured_lapse_listener):
    - Recursion depth: Unchanged (choice_probs calls L0 at depth 0). - Parameters
    added: beta (prior: LogNormal(0.0, 1.0)). - Parameters removed: None. - Other
    terms: In L0, the listener''s choice weight incorporates a parsimony discount
    against feature complexity, `wpp = at(lex, u, r) * vec(weight, r)`, where `weight
    = jnp.exp(-params["beta"] * ctx.feature_count)`, selecting among referents satisfying
    the heard word by preferring objects with fewer total features, while goal-directed
    lapses and prior trials continue to fall back to bottom-up contextual salience.'
- name: parsimonious_literal_mixture
  rationale: 'The participant population is structured as a discrete mixture of two
    distinct cognitive listener types: literal semantic listeners who treat all candidate
    referents satisfying the heard word as equally plausible, and parsimonious listeners
    who select among matching referents by penalizing feature complexity according
    to descriptive parsimony. Observed choices on communicative trials reflect a population
    mixture over these two types parameterized by the proportion of parsimonious listeners,
    explaining why aggregate implicature rates remain bounded near chance across diverse
    displays. On prior trials with no informative word, all listeners choose uniformly
    among candidate objects, modulated only by familiarization base rates.'
