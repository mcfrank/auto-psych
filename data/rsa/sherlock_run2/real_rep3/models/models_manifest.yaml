models:
- name: singleton_isolation_l2
  rationale: 'We refine singleton_isolation_listener by increasing listener recursive
    reasoning from depth 1 to depth 2: listeners invert a speaker who simulates a
    depth-1 pragmatic listener rather than a literal listener, while maintaining the
    contextual singleton isolation preference as common knowledge across all levels
    of recursion. This allows listeners to resolve complex scalar implicatures and
    informativeness asymmetries that depth-1 reasoning leaves ambiguous, while preserving
    the perceptual isolation bias that favours unique singletons over identical duplicate
    objects. Compared to singleton_isolation_listener, recursion depth increases from
    L1 to L2 (choice_probs calls L2 instead of L1), introducing an intermediate pragmatic
    speaker S2 and depth-2 listener L2 with the singleton prior shared across all
    levels, with no parameters added or removed (retaining alpha, w_singleton, and
    lapse).'
- name: attentional_crowding_singleton_l2
  rationale: 'We refine singleton_isolation_l2 by incorporating continuous visual
    attentional crowding (taking the visual crowding component from attentional_crowding_listener)
    into the shared referent prior: listeners and the speakers they model combine
    perceptual isolation for contextually unique singletons with a penalty for visual
    crowding from shared feature overlap with other display items. This joint prior
    penalizes objects that compete for visual processing, capturing perceptual distinctiveness
    across complex displays while preserving the ability of depth-2 recursive pragmatic
    reasoning to resolve higher-order scalar implicatures and isolate unique singletons
    from identical duplicate clones. Compared to singleton_isolation_l2, recursion
    depth remains at L2 (choice_probs calls L2), one parameter (w_crowd) is added,
    no parameters are removed (retaining alpha, w_singleton, and lapse), and the shared
    prior subtracts the exponential feature-crowding term alongside the singleton
    isolation indicator.'
- name: singleton_parsimony_l2
  rationale: 'We refine singleton_isolation_l2 by incorporating a feature parsimony
    preference (taking the feature parsimony component from feature_parsimony_heuristic)
    into the shared referent prior: listeners and the speakers they model treat contextually
    unique singletons lacking duplicates as salient referents while preferring feature-sparse,
    minimal referents over cluttered objects with superfluous unmentioned features.
    This shared prior grounds depth-2 recursive pragmatic reasoning in visual simplicity,
    capturing human preferences for minimal referents on uninformative trials and
    reinforcing scalar implicatures on referring expression trials while preserving
    second-order Theory of Mind. Compared to singleton_isolation_l2, recursion depth
    remains at L2 (choice_probs calls L2), one parameter (w_features) is added, no
    parameters are removed (retaining alpha, w_singleton, and lapse), and the shared
    prior adds the feature count term alongside the singleton isolation indicator.'
- name: attentional_crowding_parsimony_l2
  rationale: 'We refine singleton_parsimony_l2 by incorporating continuous visual
    attentional crowding (taking the visual crowding component from attentional_crowding_listener)
    into the shared referent prior: listeners and the speakers they model combine
    perceptual isolation for contextually unique singletons and an intrinsic preference
    for feature-sparse minimal referents with an attentional penalty for visual crowding
    caused by shared feature overlap with other display items. This joint prior penalizes
    visually cluttered objects that compete for visual processing while favoring simple,
    isolated referents, capturing perceptual distinctiveness across complex scenes
    while preserving the ability of depth-2 recursive pragmatic reasoning to resolve
    higher-order scalar implicatures. Compared to singleton_parsimony_l2, recursion
    depth remains at L2 (choice_probs calls L2), one parameter (w_crowd) is added,
    no parameters are removed (retaining alpha, w_singleton, w_features, and lapse),
    and the shared prior subtracts the exponential feature-crowding term alongside
    the singleton isolation indicator and feature count.'
- name: crowding_singleton_chromatic_l2
  rationale: 'We refine attentional_crowding_singleton_l2 by incorporating chromatic
    prominence (taking the color salience component from rsa_l2_chromatic_singleton_prior)
    into the shared referent prior: listeners and the speakers they model treat colorful
    objects as perceptually salient referents over desaturated grayscale items, alongside
    unique singletons and attentional crowding penalties for shared feature overlap.
    This grounds depth-2 recursive pragmatic reasoning in visual color prominence,
    accounting for human perceptual biases toward colored referents in displays with
    grayscale items while preserving singleton isolation and visual crowding avoidance.
    Compared to attentional_crowding_singleton_l2, recursion depth remains at L2 (choice_probs
    calls L2), one parameter (w_color) is added, no parameters are removed (retaining
    alpha, w_singleton, w_crowd, and lapse), and the shared prior adds the chromatic
    prominence term alongside the singleton isolation indicator and attentional crowding
    penalty.'
- name: crowd_decision_chromatic_familiar_l2
  rationale: 'We refine crowd_singleton_chromatic_familiar_l2 by incorporating a softmax
    decision rule (taking the decision sensitivity component from softmax_decision_listener)
    at the depth-2 pragmatic listener level: listeners compute pragmatic posterior
    beliefs via recursive Theory of Mind grounded in singleton isolation, visual crowding
    avoidance, chromatic prominence, and episodic familiarization base rates, but
    select referents using a softmax choice rule governed by decision sensitivity
    rather than strict probability matching. This allows listeners to amplify high-probability
    pragmatic referents on communicative trials, capturing human probability-maximizing
    tendencies in forced-choice reference games while preserving depth-2 scalar implicatures,
    perceptual salience grounding, and empirical base rates. Compared to crowd_singleton_chromatic_familiar_l2,
    recursion depth remains at L2 (choice_probs calls L2), one parameter (beta) is
    added, no parameters are removed (retaining alpha, w_singleton, w_crowd, w_color,
    w_familiar, and lapse), the shared referent prior is unchanged, and the depth-2
    listener choice rule replaces probability matching with exponential probability
    weighting by beta.'
- name: crowd_singleton_chromatic_parsimony_l2
  rationale: 'We refine crowding_singleton_chromatic_l2 by incorporating a feature
    parsimony preference (taking the feature parsimony component from attentional_crowding_parsimony_l2)
    into the shared referent prior: listeners and the speakers they model combine
    perceptual isolation for contextually unique singletons, attentional crowding
    penalties for shared feature overlap, and chromatic prominence for colorful items
    with an intrinsic preference for feature-sparse minimal referents over cluttered
    objects with superfluous unmentioned features. This joint prior grounds depth-2
    recursive pragmatic reasoning in visual simplicity, capturing human preferences
    for minimal referents on uninformative trials and reinforcing scalar implicatures
    across complex displays while preserving singleton isolation, visual crowding
    avoidance, and chromatic prominence. Compared to crowding_singleton_chromatic_l2,
    recursion depth remains at L2 (choice_probs calls L2), one parameter (w_features)
    is added, no parameters are removed (retaining alpha, w_singleton, w_crowd, w_color,
    and lapse), and the shared prior adds the feature count term alongside the singleton
    isolation indicator, attentional crowding penalty, and chromatic prominence term.'
- name: crowding_discriminative_chromatic_l2
  rationale: 'We refine crowding_singleton_chromatic_l2 by incorporating a communicative
    penalty on ambiguous utterances when distinguishing alternatives exist (taking
    the discriminative alternative cost component from discriminative_alternative_speaker)
    into the simulated speakers'' utility: speakers incur a production cost when choosing
    an ambiguous word for their intended referent if a uniquely distinguishing word
    was available in the visual context. Pragmatic listeners invert this cost-sensitive
    speaker across recursive reasoning levels, recognizing that using an ambiguous
    word signals that the speaker lacked an informative distinguishing alternative,
    combining Gricean quantity reasoning with shared visual crowding avoidance, singleton
    isolation, and chromatic prominence. Compared to crowding_singleton_chromatic_l2,
    recursion depth remains at L2 (choice_probs calls L2), one parameter (cost) is
    added, no parameters are removed (retaining alpha, w_singleton, w_crowd, w_color,
    and lapse), the shared referent prior is unchanged, and the speaker choice utility
    subtracts the communicative penalty for ambiguous words when a distinguishing
    alternative exists.'
- name: crowding_singleton_confusion_l2
  rationale: 'We refine attentional_crowding_singleton_l2 by incorporating competitor
    confusion aversion (taking the competitor confusion component from competitor_confusion_speaker)
    into the speaker''s communicative utility: speakers actively penalize referring
    expressions that are shared with visually confusable distractors in the context,
    in addition to reasoning at depth 2 with a shared referent prior grounded in singleton
    isolation and visual crowding avoidance. Pragmatic listeners invert this confusion-averse
    speaker, resolving scalar implicatures and ambiguous words while expecting speakers
    to choose distinguishing words when distractors are visually similar. Compared
    to attentional_crowding_singleton_l2, recursion depth remains at L2 (choice_probs
    calls L2), one parameter (w_confusion) is added, no parameters are removed (retaining
    alpha, w_singleton, w_crowd, and lapse), and the speaker choice utility in S1
    and S2 subtracts the competitor confusion penalty while the shared referent prior
    is unchanged.'
- name: crowd_singleton_confusion_chromatic_l2
  rationale: 'We refine crowding_singleton_confusion_l2 by incorporating chromatic
    prominence (taking the color salience component from crowding_singleton_chromatic_l2)
    into the shared referent prior: listeners and the speakers they model treat colorful
    objects as perceptually salient referents over desaturated grayscale items, alongside
    unique singletons, attentional crowding penalties for shared feature overlap,
    and competitor confusion aversion. This grounds depth-2 recursive pragmatic reasoning
    and confusion-averse speaker production in visual color salience, capturing human
    perceptual biases toward colored referents in displays with grayscale items while
    preserving singleton isolation, visual crowding avoidance, and competitor confusion
    aversion. Compared to crowding_singleton_confusion_l2, recursion depth remains
    at L2 (choice_probs calls L2), one parameter (w_color) is added, no parameters
    are removed (retaining alpha, w_singleton, w_crowd, w_confusion, and lapse), the
    speaker choice utility in S1 and S2 is unchanged, and the shared referent prior
    adds the chromatic prominence term alongside the singleton isolation indicator
    and attentional crowding penalty.'
- name: crowding_confusion_discriminative_l2
  rationale: 'We refine crowding_singleton_confusion_l2 by incorporating a communicative
    penalty on ambiguous utterances when distinguishing alternatives exist (taking
    the discriminative alternative cost component from discriminative_alternative_speaker)
    into the simulated speakers'' utility: speakers incur a production cost when choosing
    an ambiguous word for their intended referent if a uniquely distinguishing word
    was available in the visual context, in addition to penalizing expressions that
    are shared with visually confusable distractors. Pragmatic listeners invert this
    cost-sensitive speaker across recursive reasoning levels, recognizing that using
    an ambiguous word signals that the speaker lacked an informative distinguishing
    alternative, combining Gricean quantity reasoning with competitor confusion aversion,
    singleton isolation, and visual crowding avoidance. Compared to crowding_singleton_confusion_l2,
    recursion depth remains at L2 (choice_probs calls L2), one parameter (cost) is
    added, no parameters are removed (retaining alpha, w_singleton, w_crowd, w_confusion,
    and lapse), the shared referent prior is unchanged, and the speaker choice utility
    in S1 and S2 subtracts the communicative penalty for ambiguous words when a distinguishing
    alternative exists.'
- name: crowd_discrim_confusion_chromatic_l2
  rationale: 'We refine crowding_discriminative_chromatic_l2 by incorporating competitor
    confusion aversion (taking the competitor confusion component from competitor_confusion_speaker)
    into the simulated speakers'' communicative utility: speakers actively penalize
    referring expressions that are shared with visually confusable competitors in
    the context, in addition to incurring a communicative cost for ambiguous words
    when a uniquely distinguishing alternative was available. Pragmatic listeners
    invert this cost- and confusion-sensitive speaker across recursive reasoning levels,
    resolving ambiguous words and scalar implicatures while expecting speakers to
    choose distinguishing words when distractors are visually similar and colorful.
    Compared to crowding_discriminative_chromatic_l2, recursion depth remains at L2
    (choice_probs calls L2), one parameter (w_confusion) is added, no parameters are
    removed (retaining alpha, cost, w_singleton, w_crowd, w_color, and lapse), the
    shared referent prior is unchanged, and the speaker choice utility in S1 and S2
    subtracts the competitor confusion penalty alongside the discriminative alternative
    cost.'
