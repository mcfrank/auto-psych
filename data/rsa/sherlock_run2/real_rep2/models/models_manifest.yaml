- name: familiar_surprisal_graded_costly_l4
  rationale: 'Listeners interpret referring expressions through depth-4 pragmatic
    reasoning that jointly accounts for perceptual isolation, contextual feature surprisal,
    graded semantic applicability, utterance extension costs, and prior familiarization
    experience. When resolving an ambiguous referring expression, listeners invert
    a speaker who anticipates a depth-3 pragmatic listener''s interpretation, expecting
    speakers to refer preferentially to objects that exhibit higher nearest-neighbor
    visual contrast, contain rare distinctive features, and have higher prior familiarization
    base rates, while penalizing feature dilution and overextended descriptions. On
    uninformative prior trials, listeners'' expectations directly follow this integrated
    prior of perceptual isolation, feature surprisal, and familiarization history.
    This model refines `surprisal_isolated_graded_costly_l4` by incorporating familiarization
    base-rate sensitivity from `familiar_isolated_graded_costly_l2` into the shared
    referent prior. While depth-4 recursive reasoning, nearest-neighbor isolation,
    feature surprisal, graded semantics, and utterance extension costs successfully
    resolve complex pragmatic implicatures and visual pop-out, participants also rely
    on exposure frequency when evaluating referents and predicting choices a priori.
    Differences from `surprisal_isolated_graded_costly_l4`: - Recursion depth: Remains
    4 (`choice_probs` calls `L4`). - Parameters added: `w_familiar` with prior `dist.Normal(0.0,
    2.0)`. Parameters removed: None (retains `alpha`, `w_distinct`, `w_surprisal`,
    `gamma`, `cost_weight`, and `lapse`). - Other terms: In `choice_probs`, the object
    prior integrates familiarization base rates alongside perceptual isolation and
    feature surprisal: `prior = softmax_prior(params["w_distinct"] * dist_vec + params["w_surprisal"]
    * surp_vec + params["w_familiar"] * ctx.familiarization)`. All other components
    (`L0`, `L1`, `L2`, `L3`, `L4`, `object_isolation`, `object_feature_surprisal`,
    `compute_graded_lex`, utterance extension costs, and the lapse mixture) remain
    identical.'
- name: surprisal_isolated_graded_costly_l5
  rationale: 'Listeners interpret referring expressions through depth-5 pragmatic
    reasoning that jointly accounts for perceptual isolation, contextual feature surprisal,
    graded semantic applicability, and utterance extension costs. When resolving an
    ambiguous referring expression, listeners invert a speaker who anticipates a depth-4
    pragmatic listener''s interpretation, expecting speakers to refer preferentially
    to objects that exhibit nearest-neighbor visual contrast and rare distinctive
    features while penalizing feature dilution and overextended descriptions. On uninformative
    prior trials, listeners'' expectations directly follow the integrated prior of
    perceptual isolation and feature surprisal. This model refines `surprisal_isolated_graded_costly_l4`
    with a single change: increasing the recursion depth from depth 4 to depth 5.
    While depth-4 pragmatic reasoning captures extensive counterfactual coordination,
    complex multi-object displays with rich feature combinations and multiple competing
    descriptors require even deeper recursive coordination, allowing listeners to
    invert speakers who anticipate how depth-4 pragmatic listeners resolve embedded
    contextual alternatives under contextual feature surprisal and utterance extension
    costs. Differences from `surprisal_isolated_graded_costly_l4`: - Recursion depth:
    `choice_probs` calls `L5` instead of `L4`. - Parameters added or removed: None
    (retains `alpha`, `w_distinct`, `w_surprisal`, `gamma`, `cost_weight`, and `lapse`).
    - Other terms: Adds the level-5 pragmatic listener `L5[u, r]` inverting a level-5
    speaker `S5` who evaluates communicative utility against `L4[u, r]` with utterance
    extension costs and perceptual isolation, while `L0`, `L1`, `L2`, `L3`, `L4`,
    `object_isolation`, `object_feature_surprisal`, `compute_graded_lex`, utterance
    extension costs, and the lapse mixture remain identical.'
- name: softmax_surprisal_isolated_costly_l4
  rationale: 'Listeners interpret referring expressions through depth-4 pragmatic
    reasoning under perceptual isolation, contextual feature surprisal, graded semantics,
    and utterance extension costs, converting posterior beliefs into choices via a
    softmax decision rule rather than strict probability matching. By applying choice
    determinism over posterior communicative beliefs, boundedly rational listeners
    calibrate the sharpness of their referent selection independently of the speaker''s
    communicative rationality, softening over-confident higher-order implicatures
    while preserving recursive pragmatic coordination. On uninformative prior trials
    without an informative word, listeners'' expectations directly follow the integrated
    prior of perceptual isolation and feature surprisal. This model refines `surprisal_isolated_graded_costly_l4`
    by incorporating the softmax decision rule over posterior beliefs from `softmax_belief_listener`.
    While depth-4 recursive reasoning, nearest-neighbor isolation, feature surprisal,
    graded semantics, and utterance extension costs successfully resolve complex pragmatic
    implicatures and singleton pop-out, standard RSA assumes strict probability matching
    where action probabilities equal communicative beliefs; decoupling choice determinism
    from speaker rationality allows boundedly rational listeners to modulate response
    determinism against high-order recursive beliefs, preventing over-penalization
    of competing referents on multi-object displays. Differences from `surprisal_isolated_graded_costly_l4`:
    - Recursion depth: Remains 4 (`choice_probs` calls `L4`). - Parameters added:
    `beta` with prior `dist.LogNormal(0.0, 1.0)`. Parameters removed: None (retains
    `alpha`, `w_distinct`, `w_surprisal`, `gamma`, `cost_weight`, and `lapse`). -
    Other terms: In `choice_probs`, posterior beliefs `heard` from `L4` are transformed
    by choice determinism `beta` via a normalized softmax transformation over non-zero
    belief logits (`logits = params["beta"] * jnp.log(safe_heard)`), producing choice
    probabilities `choice` before the uniform lapse mixture. All other components
    (`L0`, `L1`, `L2`, `L3`, `L4`, `object_isolation`, `object_feature_surprisal`,
    `compute_graded_lex`, utterance extension costs, and the prior over objects) remain
    identical.'
