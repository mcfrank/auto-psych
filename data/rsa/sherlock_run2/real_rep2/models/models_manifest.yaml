    under feature surprisal. Differences from `isolated_graded_costly_l2_2`: - Recursion
    depth: `choice_probs` calls `L3` instead of `L2`. - Parameters added or removed:
    None (retains `alpha`, `w_distinct`, `w_surprisal`, `gamma`, `cost_weight`, and
    `lapse`). - Other terms: Adds the level-3 pragmatic listener `L3[u, r]` inverting
    a level-3 speaker `S3` who evaluates communicative utility against `L2[u, r]`
