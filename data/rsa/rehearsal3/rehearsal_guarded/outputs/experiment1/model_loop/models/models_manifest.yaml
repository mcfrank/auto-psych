models:
- name: r1_c4
  rationale: RSA pragmatic listener at depth 2 with singleton salience, contextual
    distinctiveness, visual feature complexity, evaluative valence framing, visual
    color contrast, and literal L0.
- name: isolated_graded_costly_singleton_l3
  rationale: 'When identifying a speaker''s intended referent in visual contexts containing
    duplicate objects, listeners combine continuous perceptual isolation and graded
    semantic applicability with a discrete perceptual singleton bias that prioritizes
    unique singleton objects. Rather than evaluating distinctiveness purely through
    continuous feature distances, listeners spontaneously privilege solitary referents
    that lack identical copies in the scene when interpreting ambiguous referring
    expressions or uninformative prior displays. Model refined: `isolated_graded_costly_l3`.
    Differences from source: - Recursion depth: Unchanged (depth 3, calling L3 in
    choice_probs). - Parameters added: `w_singleton` (prior Normal(0.0, 1.0)) weighting
    discrete singleton salience in the referent prior. - Parameters removed: None.
    - Referent prior: Extended from purely continuous perceptual isolation (`softmax_prior(w_distinct
    * dist_vec)`) to combine discrete singleton pop-out with continuous isolation
    (`softmax_prior(w_singleton * is_singleton + w_distinct * dist_vec)`).'
- name: costly_extension_confusion_rsa_l2
  rationale: 'When interpreting referring expressions in visual reference games, listeners
    reason about speakers who actively penalize utterances with broad contextual extension
    while avoiding confusion with visually similar competitors. Pragmatic listeners
    at depth 2 invert this cost-sensitive, confusion-averse speaker, expecting that
    a speaker intending a referent with unique distinguishing features would avoid
    using an overly broad expression shared by many objects in the scene. Uninformative
    prior trials remain governed by visual singleton pop-out, contextual distinctiveness,
    and feature complexity. Model refined: `r1_c4`. Differences from source: - Recursion
    depth: Unchanged (depth 2, calling L2 in choice_probs). - Parameters added: `cost_weight`
    (prior Normal(0.0, 1.0)) weighting utterance extension cost in simulated speaker
    utilities. - Parameters removed: None. - Speaker utility: Extended at both simulated
    speaker tiers S1 and S2 to penalize words with wider contextual extension by subtracting
    utterance extension cost (`alpha * (log(L) - vec(cost, u)) - w_confusion * at(confusion,
    u, r)`), where cost is proportional to the fraction of display objects satisfying
    each feature (`cost_weight * (jnp.sum(real_lex, axis=-1) / real_lex.shape[-1])`).
    - Referent prior: Unchanged (combining discrete singleton salience, continuous
    contextual distinctiveness, visual feature count modulated by framing valence,
    and color contrast).'
