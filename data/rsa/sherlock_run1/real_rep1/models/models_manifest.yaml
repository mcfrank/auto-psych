models:
- name: distinctive_multimodal_l2_listener
  rationale: 'Listeners interpret referential and evaluative descriptions by combining
    depth-2 recursive pragmatic reasoning, utterance production costs, graded semantics,
    and perceptual salience with visual distinctiveness, refining multimodal_graded_costly_l2_listener
    by incorporating feature distinctiveness from distinctiveness_salience_listener
    into the common-knowledge salience prior. Before hearing an informative utterance,
    listeners assign higher prior prominence to distinctive objects possessing unique
    or narrowly shared features that contrast with the visual context, resolving competition
    between singleton referents and identical competitors while maintaining evaluative,
    color, and complexity priors across reasoning depths. Refined model: multimodal_graded_costly_l2_listener
    Differences from source: - Recursion depth: Depth 2 (choice_probs calls L2, unchanged
    from source). - Parameters added: w_distinct (Normal(0.0, 1.0)); no parameters
    removed (retains alpha, w_features, w_familiar, w_valence, w_color, w_extension,
    beta_graded, lapse with identical priors). - Terms changed: In choice_probs, the
    prior over objects incorporates feature distinctiveness + params["w_distinct"]
    * distinctiveness, where distinctiveness is the sum across non-sink features true
    of each object weighted by specificity (inverse feature frequency).'
- name: contrastive_multimodal_l2_listener
  rationale: "Listeners interpret referential and evaluative descriptions by combining\
    \ depth-2 recursive pragmatic reasoning, utterance production costs, graded semantics,\
    \ and perceptual salience with contrastive visual distinctiveness, refining distinctive_multimodal_l2_listener\
    \ by replacing inverse frequency with contextual contrast in the common-knowledge\
    \ salience prior. Before hearing an informative utterance, listeners assign prior\
    \ prominence to objects in direct proportion to how sharply their features contrast\
    \ with the visual scene\u2014measured by the fraction of competing display objects\
    \ that lack those features\u2014conferring maximal prominence to unique singleton\
    \ features while naturally assigning zero distinctiveness to universal features\
    \ shared by the entire display. Communicative speakers and pragmatic listeners\
    \ share this contrastive salience distribution across recursive reasoning depths\
    \ while balancing informativeness against production costs over graded descriptions.\
    \ Refined model: distinctive_multimodal_l2_listener Differences from source: -\
    \ Recursion depth: Depth 2 (choice_probs calls L2, unchanged from source). - Parameters\
    \ added: None. - Parameters removed: None (retains alpha, w_features, w_familiar,\
    \ w_valence, w_color, w_distinct, w_extension, beta_graded, lapse with identical\
    \ priors). - Terms changed: In choice_probs, feature specificity in distinctiveness\
    \ is changed from linear inverse frequency 1.0 / feature_freq to contrastive isolation\
    \ (n_obj - feature_freq) / jnp.maximum(n_obj - 1.0, 1.0), weighting each non-sink\
    \ feature by the proportion of competing objects in the visual context that lack\
    \ it."
- name: capacity_limited_distinctive_l2
  rationale: 'Listeners interpret referential descriptions with bounded cognitive
    resources whose reasoning precision decays as visual display clutter increases,
    refining distinctive_multimodal_l2_listener by incorporating capacity limitation
    from capacity_limited_listener into the depth-2 pragmatic reasoning architecture.
    While listeners maintain visual distinctiveness, evaluative framing, color pop-out,
    and graded semantics, their pragmatic rationality follows a power law decay with
    display set size, enabling sharp, decisive pragmatic inferences on compact two-object
    displays but producing more diffuse, bounded choices in larger, cluttered visual
    scenes. Refined model: distinctive_multimodal_l2_listener Differences from source:
    - Recursion depth: Depth 2 (choice_probs calls L2, unchanged from source). - Parameters
    added: alpha_base (LogNormal(0.0, 1.0)), gamma (Beta(1.0, 1.0)). - Parameters
    removed: alpha. (Retains w_features, w_familiar, w_valence, w_color, w_distinct,
    w_extension, beta_graded, lapse with identical priors). - Terms changed: In choice_probs,
    the rationality parameter alpha passed to L2 is modulated by display set size
    via alpha = params["alpha_base"] * (2.0 / ctx.lex.shape[1]) ** params["gamma"]
    instead of a constant scalar alpha.'
- name: surprisal_multimodal_l2_listener_2
  rationale: 'Listeners interpret referential and evaluative descriptions by combining
    depth-2 recursive pragmatic reasoning, utterance production costs, graded semantics,
    and perceptual salience with information-theoretic feature surprisal, refining
    multimodal_graded_costly_l2_listener by incorporating feature distinctiveness
    weighted by self-information into the common-knowledge salience prior. Before
    hearing an informative utterance, listeners assign higher prior prominence to
    distinctive objects possessing rare or unexpected features that contrast with
    the visual scene, where the prominence of each feature scales with its surprisal
    (rarity relative to the display size) rather than linear inverse frequency, naturally
    discounting universal features shared by all objects. Communicative speakers and
    pragmatic listeners share this surprisal-grounded salience distribution across
    recursive depths while balancing informativeness against utterance production
    costs over graded descriptions. Refined model: multimodal_graded_costly_l2_listener
    Differences from source: - Recursion depth: Depth 2 (choice_probs calls L2, unchanged
    from source). - Parameters added: w_distinct (Normal(0.0, 1.0)); no parameters
    removed (retains alpha, w_features, w_familiar, w_valence, w_color, w_extension,
    beta_graded, lapse with identical priors). - Terms changed: In choice_probs, the
    prior over objects incorporates feature distinctiveness + params["w_distinct"]
    * distinctiveness, where distinctiveness is the sum across non-sink features true
    of each object weighted by surprisal specificity = log(N_OBJ / feature_freq).'
