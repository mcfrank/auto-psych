models:
- name: minkowski_accumulated_typicality
  rationale: 'People evaluate the randomness of a sequence by accumulating a subjective

    sense of typicality over its length, computing each event''s typicality as

    a penalty based on its distance from a mental prototype, with the distance

    raised to a freely inferred Minkowski-like exponent so extreme feature

    deviations are disproportionately punished.

    '
- name: evidence_accumulation_messy_prototype
  rationale: "Random-looking sequences are judged by an evidence-accumulation process\n\
    where each item provides a baseline weight of evidence for randomness,\ndiscounted\
    \ by the sequence's quadratic (and asymmetric, for alternation)\ndeviation from\
    \ a messy prototype \u2014 an ideal positive imbalance and ideal\nalternation\
    \ rate \u2014 so near-ideal longer sequences are preferred while\nclearly deviant\
    \ long sequences are penalized more heavily.\n"
- name: evidence_accumulation_per_run
  rationale: "Random-looking sequences are judged by an evidence-accumulation process\n\
    where each distinct run (streak of identical outcomes) \u2014 rather than each\n\
    item \u2014 provides a baseline weight of evidence for randomness, discounted\n\
    by the sequence's quadratic deviation from a messy prototype, so periodic\npatterns\
    \ with artificially few runs are penalized without a separate\nperiodicity cue.\n"
- name: artificial_balance_diagnosticity
  rationale: "People judge randomness by Bayesian diagnosticity \u2014 the log-likelihood\n\
    ratio of a fair coin versus a subjective \"regular\" generative process \u2014\
    \nwhere the regular process includes an \"artificial balance\" generator that\n\
    targets an exactly equal count of heads and tails, explaining why people\npenalize\
    \ suspiciously symmetric sequences as contrived rather than random.\n"
- name: recency_window_accumulated_typicality
  rationale: "People judge the randomness of a sequence by accumulating a subjective\
    \ sense of\ntypicality, but they only accumulate it over a small recent window\
    \ of the\nsequence \u2014 the most recent few tosses \u2014 rather than over the\
    \ whole length. This\nis a refinement of the accumulated-typicality mechanism:\
    \ the same per-event\ntypicality penalty (imbalance and alternation distance from\
    \ an ideal prototype)\nis applied, but restricted to the recency window, so the\
    \ judgment is driven by\nwhat is in working memory rather than the entire pattern."
