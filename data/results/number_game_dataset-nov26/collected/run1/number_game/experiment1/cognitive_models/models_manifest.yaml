models:
- name: divisibility_kinship_exemplar
  rationale: 'Refinement of `graded_parity_variability_exemplar`: people still judge
    a target by its summed similarity to the remembered examples. Attention to magnitude
    and final digit is still set by how variable the examples are, and parity is still
    a fixed dimension. The one change is that the parity dimension is widened into
    divisibility kinship: an example also contributes less similarity when it and
    the target have no common factor at all (they are coprime), so two numbers that
    share a factor such as 3, 5 or 7 feel related even when their parity differs.
    This predicts that after sets like "3, 63", "6, 66" or "55, 15, 75, 45", targets
    that share a factor with the examples (30, 36, 39, 60, 50) are endorsed well above
    what magnitude, final digit and parity alone allow, while targets coprime to the
    examples (e.g. 37 after "8, 32") are rejected more often.'
- name: shared_factor_parity_exemplar
  rationale: 'Refinement of `variability_tuned_parity_attention`: people still judge
    a target by its summed similarity to the remembered examples in a space of magnitude,
    final digit and parity, with attention to each set by how variable the examples
    are on it. The one change is a further, fixed "shared factor" dimension: a target
    that has no common divisor with an example (they are coprime) loses similarity
    to that example by a constant factor. So after "3, 63" people endorse 36 and 39
    (they share the factor 3) although these match neither example''s final digit
    nor magnitude, and after "8, 32" they reject 37, unlike targets that share a factor
    with the examples.'
- name: coincidence_sharpened_exemplar
  rationale: 'People generalize from the examples by summed similarity (magnitude,
    final digit, parity, shared factors), but how sharply similarity falls off is
    set by how suspicious a coincidence the examples are: the less likely it is that
    the examples would share their most specific common property (all the same final
    digit, all multiples of 5, all the same parity) by chance, the more specific they
    take the program to be. So they tighten their generalization on every dimension
    at once. This disagrees most with the best model on coherent sets, e.g. "78, 48,
    88" or "15, 85, 45" (near non-matching targets rejected far more), "90, 45" (multiples
    of 5 favoured more sharply), and on how much sets differ in overall endorsement,
    while single examples and incoherent sets are generalized as before.'
- name: common_step_lattice_exemplar
  rationale: 'Refinement of `shared_factor_parity_exemplar`: people still judge a
    target by its summed similarity to the remembered examples (magnitude, final digit,
    parity and shared factors, with attention tuned to how variable the examples are),
    but they also read the spacing of the examples. When three or more examples are
    separated by gaps that are all multiples of one common step of at most 20 (e.g.
    step 10 in "78, 48, 88", step 6 in "63, 27, 99, 33", step 2 in "12, 14, 16"),
    people expect the program to move in that step, and a target that cannot be reached
    from the examples in whole steps feels dissimilar to every example by a fixed
    factor. So off-step targets near the examples are rejected more than similarity
    alone predicts, while sets with no such small common step are unaffected.'
- name: capacity_limited_attention_exemplar
  rationale: 'People judge a target by its similarity to the remembered examples on
    magnitude, final digit, parity and shared factors, but their attention is a fixed,
    limited budget split across these dimensions: whatever the examples are consistent
    on (a shared final digit, a shared parity, a tight magnitude range) pulls attention
    onto that dimension and necessarily away from the others. So after a set that
    shares a final digit, people reject wrong-digit targets and also become more tolerant
    of magnitude distance for right-digit targets, because the attention spent on
    the digit is taken from magnitude, and the reverse holds after scattered-digit
    sets.'
- name: digit_run_rule_attention_exemplar
  rationale: 'Refinement of the incumbent `shared_factor_parity_exemplar`. People
    still judge a target by its summed similarity to the remembered examples in a
    space of magnitude, final digit, parity and shared factor, with attention to magnitude
    and final digit tuned by how variable the examples are. The one change, adapted
    from `digit_run_strict_criterion_exemplar` but placed inside the similarity space
    rather than the response criterion: when three or more examples all end in the
    same digit, people read the final digit as the program''s rule, and their attention
    to it jumps. A target with a different final digit then loses much more similarity
    to every example, so after sets like "46, 76, 66" or "15, 85, 45" magnitude-near
    targets with the wrong digit are rejected far more often than graded digit attention
    allows. Targets that match the digit are not penalized.'
- name: digit_run_criterion_shared_factor
  rationale: 'Refinement of `digit_run_strict_criterion_exemplar`: people still judge
    a target by its summed similarity to the remembered examples (magnitude and final-digit
    attention tuned to how variable the examples are, a fixed parity penalty), and
    still raise their response criterion when three or more examples all end in the
    same digit, reading such a set as a narrow rule. The one change, grafted from
    `shared_factor_parity_exemplar`, is a fixed shared-factor dimension: an example
    contributes less similarity to a target that shares no common divisor with it
    (they are coprime). This predicts strict rejection of wrong-digit targets after
    same-digit runs (e.g. "62, 32, 22") together with endorsement of factor-sharing
    targets far from the examples (36 and 39 after "3, 63") and rejection of coprime
    ones (37 after "8, 32").'
- name: digit_run_raised_criterion_exemplar
  rationale: 'Refinement of the incumbent `shared_factor_parity_exemplar`. People
    still judge a target by its summed similarity to the remembered examples (magnitude,
    final digit, parity and shared factor, with attention tuned to how variable the
    examples are). The one change, grafted from `digit_run_strict_criterion_exemplar`:
    when three or more examples all end in the same digit, people read the set as
    coming from a narrow, rule-bound program and demand more similarity before saying
    yes to *any* target. So such sets are endorsed less across the board. That includes
    targets that do match the shared digit, which a sharper digit attention (`digit_run_rule_attention_exemplar`)
    would leave untouched. Wrong-digit targets near the examples are rejected far
    more often than the incumbent predicts.'
