models:
- name: divisibility_kinship_exemplar
  rationale: 'Refinement of `graded_parity_variability_exemplar`: people still judge
    a target by its summed similarity to the remembered examples. Attention to magnitude
    and final digit is still set by how variable the examples are, and parity is still
    a fixed dimension. The one change is that the parity dimension is widened into
    divisibility kinship: an example also contributes less similarity when it and
    the target have no common factor at all (they are coprime), so two numbers that
    share a factor such as 3, 5 or 7 feel related even when their parity differs.
    This predicts that after sets like "3, 63", "6, 66" or "55, 15, 75, 45", targets
    that share a factor with the examples (30, 36, 39, 60, 50) are endorsed well above
    what magnitude, final digit and parity alone allow, while targets coprime to the
    examples (e.g. 37 after "8, 32") are rejected more often.'
- name: shared_factor_parity_exemplar
  rationale: 'Refinement of `variability_tuned_parity_attention`: people still judge
    a target by its summed similarity to the remembered examples in a space of magnitude,
    final digit and parity, with attention to each set by how variable the examples
    are on it. The one change is a further, fixed "shared factor" dimension: a target
    that has no common divisor with an example (they are coprime) loses similarity
    to that example by a constant factor. So after "3, 63" people endorse 36 and 39
    (they share the factor 3) although these match neither example''s final digit
    nor magnitude, and after "8, 32" they reject 37, unlike targets that share a factor
    with the examples.'
- name: coincidence_sharpened_exemplar
  rationale: 'People generalize from the examples by summed similarity (magnitude,
    final digit, parity, shared factors), but how sharply similarity falls off is
    set by how suspicious a coincidence the examples are: the less likely it is that
    the examples would share their most specific common property (all the same final
    digit, all multiples of 5, all the same parity) by chance, the more specific they
    take the program to be. So they tighten their generalization on every dimension
    at once. This disagrees most with the best model on coherent sets, e.g. "78, 48,
    88" or "15, 85, 45" (near non-matching targets rejected far more), "90, 45" (multiples
    of 5 favoured more sharply), and on how much sets differ in overall endorsement,
    while single examples and incoherent sets are generalized as before.'
- name: common_step_lattice_exemplar
  rationale: 'Refinement of `shared_factor_parity_exemplar`: people still judge a
    target by its summed similarity to the remembered examples (magnitude, final digit,
    parity and shared factors, with attention tuned to how variable the examples are),
    but they also read the spacing of the examples. When three or more examples are
    separated by gaps that are all multiples of one common step of at most 20 (e.g.
    step 10 in "78, 48, 88", step 6 in "63, 27, 99, 33", step 2 in "12, 14, 16"),
    people expect the program to move in that step, and a target that cannot be reached
    from the examples in whole steps feels dissimilar to every example by a fixed
    factor. So off-step targets near the examples are rejected more than similarity
    alone predicts, while sets with no such small common step are unaffected.'
- name: capacity_limited_attention_exemplar
  rationale: 'People judge a target by its similarity to the remembered examples on
    magnitude, final digit, parity and shared factors, but their attention is a fixed,
    limited budget split across these dimensions: whatever the examples are consistent
    on (a shared final digit, a shared parity, a tight magnitude range) pulls attention
    onto that dimension and necessarily away from the others. So after a set that
    shares a final digit, people reject wrong-digit targets and also become more tolerant
    of magnitude distance for right-digit targets, because the attention spent on
    the digit is taken from magnitude, and the reverse holds after scattered-digit
    sets.'
- name: digit_run_rule_attention_exemplar
  rationale: 'Refinement of the incumbent `shared_factor_parity_exemplar`. People
    still judge a target by its summed similarity to the remembered examples in a
    space of magnitude, final digit, parity and shared factor, with attention to magnitude
    and final digit tuned by how variable the examples are. The one change, adapted
    from `digit_run_strict_criterion_exemplar` but placed inside the similarity space
    rather than the response criterion: when three or more examples all end in the
    same digit, people read the final digit as the program''s rule, and their attention
    to it jumps. A target with a different final digit then loses much more similarity
    to every example, so after sets like "46, 76, 66" or "15, 85, 45" magnitude-near
    targets with the wrong digit are rejected far more often than graded digit attention
    allows. Targets that match the digit are not penalized.'
- name: digit_run_criterion_shared_factor
  rationale: 'Refinement of `digit_run_strict_criterion_exemplar`: people still judge
    a target by its summed similarity to the remembered examples (magnitude and final-digit
    attention tuned to how variable the examples are, a fixed parity penalty), and
    still raise their response criterion when three or more examples all end in the
    same digit, reading such a set as a narrow rule. The one change, grafted from
    `shared_factor_parity_exemplar`, is a fixed shared-factor dimension: an example
    contributes less similarity to a target that shares no common divisor with it
    (they are coprime). This predicts strict rejection of wrong-digit targets after
    same-digit runs (e.g. "62, 32, 22") together with endorsement of factor-sharing
    targets far from the examples (36 and 39 after "3, 63") and rejection of coprime
    ones (37 after "8, 32").'
- name: digit_run_raised_criterion_exemplar
  rationale: 'Refinement of the incumbent `shared_factor_parity_exemplar`. People
    still judge a target by its summed similarity to the remembered examples (magnitude,
    final digit, parity and shared factor, with attention tuned to how variable the
    examples are). The one change, grafted from `digit_run_strict_criterion_exemplar`:
    when three or more examples all end in the same digit, people read the set as
    coming from a narrow, rule-bound program and demand more similarity before saying
    yes to *any* target. So such sets are endorsed less across the board. That includes
    targets that do match the shared digit, which a sharper digit attention (`digit_run_rule_attention_exemplar`)
    would leave untouched. Wrong-digit targets near the examples are rejected far
    more often than the incumbent predicts.'
- name: log_odds_distorted_concept_learning
  rationale: 'People infer the hidden program as a Bayesian learner would: they weigh
    candidate rules (parity, multiples of any number, powers, squares, cubes, primes,
    a shared final digit) and magnitude ranges by how well each explains the examples,
    favouring small concepts that make the examples a suspicious coincidence (the
    size principle), and they derive how probable it is that the target belongs. The
    one distortion is in how that probability is used: people perceive it in a compressed,
    log-odds-linear way (as in classic probability-weighting), so near-certain inclusions
    and exclusions are pulled strongly toward the middle. Targets the posterior rates
    as almost certain or almost impossible are therefore endorsed or rejected far
    less consistently than the normative account says.'
- name: shared_feature_contrast
  rationale: People do not compare the target to each example; they abstract the features
    that all of the examples have in common (odd/even, being a multiple of some number,
    a final digit, a decade, being a square, cube, power of two or prime) and weight
    each shared feature by how suspicious a coincidence it is (the rarer the feature
    among 1-100 and the more examples share it, the more it counts). They say yes
    to a target in proportion to how much weighted shared-feature evidence it satisfies,
    minus how much it violates, so sets with many specific common features (e.g. "8,
    32", "3, 63", "78, 48, 88") produce sharp, rule-like acceptance of feature-satisfying
    targets anywhere on the number line and rejection of nearby violators, while sets
    with few common features are accepted only weakly.
- name: running_guess_coincidence_exemplar
  rationale: 'People read the examples one at a time and keep a running guess about
    the program''s rule (a shared final digit, multiples of 5, a shared parity): each
    new example that fits the current guess makes it more convincing, but an example
    that breaks it makes them drop the guess and start again from that example, forgetting
    the earlier evidence. They then generalize by summed similarity to the examples
    (magnitude, final digit, parity, shared factors), sharpened on every dimension
    by how suspicious a coincidence the guess they end up with is. So order matters:
    "83, 38, 58, 68" ends on a three-example run of final digit 8 and gives narrow
    generalization, while the same numbers with the odd one last ("38, 58, 68, 83")
    would not.'
- name: common_divisor_sharpened_exemplar
  rationale: Refinement of the incumbent `coincidence_sharpened_exemplar`. People
    still judge a target by its summed similarity to the examples (magnitude, final
    digit, parity, and a factor dimension), and they still sharpen this generalization
    on every dimension when the examples share a suspicious coincidence. The one change
    is to the factor dimension. People do not check pairwise whether the target shares
    any factor with each example. Instead they read the common divisor of the whole
    set (when the examples share one of 3 or more, e.g. 3 in "3, 63" or 10 in "10,
    50, 100"), and a target that is not a multiple of it loses similarity to every
    example by a constant factor. So multiples of the set's common divisor that match
    no example's final digit are endorsed well above non-multiples, while single examples
    and sets without such a divisor carry no factor penalty.
- name: common_divisor_rule_exemplar
  rationale: 'Refinement of the incumbent `coincidence_sharpened_exemplar`: people
    still generalize by summed similarity to the examples (magnitude, final digit,
    parity and a shared-factor dimension), and they still sharpen it on every dimension
    when the examples share a suspicious property. The one change is to the shared-factor
    dimension. When the examples have a common divisor (e.g. 3 in "63, 27, 99, 33",
    8 in "8, 32", 10 in "10, 80"), people read the set as "multiples of that number".
    A target that is not a multiple of it loses similarity to every example, even
    if it shares some other factor with one of them. Single examples and sets whose
    only common divisor is 1 keep the old per-example coprimality test. This predicts
    that far targets with no matching final digit are endorsed when they divide by
    the set''s common divisor (36 after "3, 63") and rejected when they do not.'
- name: accumulating_regularity_exemplar
  rationale: 'Refinement of the pruned `shared_regularity_exemplar`: people still
    judge a target by its summed similarity to the remembered examples (magnitude,
    final digit, parity), and they still notice the most specific arithmetic or digit
    regularity that all the examples share (e.g. multiples of 3, powers of 2, ending
    in 8), favouring targets that conform to it and rejecting those that break it.
    The one change is that rule evidence now builds up with every example, as the
    size principle says it should: each further example that fits a surprising regularity
    makes it less likely to be a coincidence. So the push toward rule members and
    away from rule breakers grows with the number of examples beyond the first, and
    is no longer a fixed amount per set. Four multiples of 10 therefore support "multiples
    of 10" (e.g. 20 accepted, 47 rejected) much more strongly than two multiples of
    3 support "multiples of 3", while a single example implies no rule.'
- name: multiple_route_exemplar
  rationale: 'People judge a target by its summed similarity to the examples (closeness
    in magnitude, same final digit, same parity, and whether it divides by the set''s
    common divisor), sharpened when the examples share a suspicious coincidence. On
    top of that there is a second, separate way for a target to resemble an example:
    being one of its multiples (14, 49 or 98 after "7"; 64 after "4"). This multiples
    route adds a fixed amount of similarity no matter how far apart the two numbers
    are, instead of only scaling down closeness. So multiples of an example that are
    far from it and share none of its digits are still often endorsed, especially
    after single examples and small-number examples, where magnitude similarity alone
    predicts almost certain rejection.'
- name: rule_uncertainty_guessing
  rationale: People judge a target by its plain summed similarity to the examples
    (magnitude, final digit, parity, and the set's common divisor), but whether they
    actually use that judgment is a decision-level choice that depends on how clear
    the program's rule looks. When the examples share no suspicious property (a common
    final digit, multiples of 5, a common divisor, a shared parity), people are unsure
    what the program does and on many trials just guess, saying yes at their own base
    rate. The clearer the shared rule, the less they guess. So rule-less sets (e.g.
    "4, 66, 78, 96") get a broad, flat background of yes answers, while rule-coherent
    sets (e.g. "80, 70, 90, 100") reject dissimilar targets consistently.
- name: divisor_family_exemplar
  rationale: 'Refinement of `common_divisor_sharpened_exemplar`: people still judge
    a target by its summed similarity to the examples (magnitude, final digit, parity,
    factor), sharpened by how suspicious the examples'' shared coincidence is. The
    one change is to the space of arithmetic concepts they consider: they entertain
    "multiples of d" for every divisor d of 3 or more that all the examples share,
    including the divisors of a single lone example, not only the largest common divisor
    of a multi-example set. A target that is a multiple of none of these candidate
    divisors loses similarity to every example by a constant factor, so after a single
    "7" people favour 14, 49 and 98 over 17 or 47, and after "90, 45" they still accept
    30 and 60 (multiples of 15).'
- name: common_divisor_membership_route
  rationale: 'Refinement of the incumbent `common_divisor_sharpened_exemplar`. People
    still judge a target by its summed similarity to the examples (magnitude, final
    digit, parity, and a penalty for not being a multiple of the set''s common divisor),
    sharpened on every dimension when the examples share a suspicious coincidence.
    The one change is that the set''s common divisor of 3 or more (for a single example,
    the example itself) is also read as a rule, "multiples of that number", which
    gives the targets it covers a second, distance-free route to a yes: being a member
    adds a fixed amount to the target''s summed similarity, rather than only sparing
    it a penalty. So multiples of the set''s divisor that are far from every example
    and share none of their digits are often endorsed (e.g. 30 after "5", 14 or 70
    after "28, 98", 39 after "63, 27, 99, 33"), while multiples of a single example
    in a set without that common divisor get no boost.'
- name: similarity_averaging_exemplar
  rationale: 'Refinement of the incumbent `common_divisor_sharpened_exemplar`. People
    still judge a target by its similarity to the examples (magnitude, final digit,
    parity, and the set''s common divisor), sharpened on every dimension when the
    examples share a suspicious coincidence. The one change is how evidence from several
    examples is pooled: people do not add up the similarity to every example, they
    (partly) average it, so each further example dilutes rather than adds to a target''s
    support, and a target is judged by how well it fits the examples on average rather
    than how many it resembles. This predicts that adding examples does not make dissimilar
    targets more acceptable, that a far target in a sparse pair like "25, 82" is not
    carried by summing two weak similarities, and that single examples generalize
    relatively more broadly than multi-example sets, with the degree of averaging
    (from pure summing to pure averaging) inferred from the data.'
- name: set_size_diluted_multiple_route
  rationale: 'Refinement of `multiple_route_exemplar`. People still judge a target
    by its summed similarity to the examples (magnitude, final digit, parity and divisibility
    by the set''s common divisor, sharpened when the examples share a suspicious coincidence),
    and being a multiple of an example is still a separate route to similarity that
    works at any distance. The one change is that this route is something people take
    mostly from a lone example: each further example shown weakens it by a constant
    factor, because with more examples people judge from what the examples have in
    common rather than from one example''s multiples. So after the single example
    "7" or "5", far multiples (14, 49, 98; 30, 100) are often endorsed, but after
    "50, 2" or "55, 3" far multiples of the small example are seldom endorsed, and
    in four-example sets the route hardly matters.'
- name: times_table_multiple_route
  rationale: 'Refinement of `multiple_route_exemplar`. People still judge a target
    by its summed similarity to the examples (magnitude, final digit, parity and divisibility
    by the set''s common divisor, sharpened when the examples share a suspicious coincidence),
    and being a multiple of an example is still a separate route to similarity that
    works at any distance. The one change is where that route comes from: it is retrieved
    times-table knowledge, so it exists only for examples that are themselves times-table
    numbers (2 to 12). After "7" people endorse 14, 49 and 98, but after "47" or "31"
    the far multiples 94 and 62 get no extra support and are judged by ordinary similarity
    alone.'
- name: times_table_rule_sampling
  rationale: People do not compare the target with each example by similarity; on
    each trial they come up with one guess about the program and answer by whether
    the target obeys it. The guess is a familiar property that every example has (odd
    or even, a times-table "multiples of 3 to 12", a shared final digit, squares,
    cubes or powers of two), or failing that just "numbers in the region the examples
    cover". Each kind of property comes to mind with its own ease, with smaller times
    tables easier, and properties become more likely than the region guess as more
    examples fit them. So after a lone "15" people often say yes to 12 or 9 (the 3-
    and 5-tables) but after "47" they rarely say yes to 94, and targets inside the
    examples' span are accepted as fully as the examples themselves.
- name: times_table_kinship_exemplar
  rationale: 'People judge a target by its summed similarity to the examples (magnitude,
    final digit, parity, divisibility by the set''s common divisor, sharpened when
    the examples share a suspicious coincidence), but the distance-free arithmetic
    route is not "being a multiple of the example": it is belonging to the same familiar
    times table, i.e. sharing a factor of 3 or more with an example, with the route''s
    strength falling off as the smallest such shared factor gets larger (3, 4, 5,
    7 tables are well known; a 47 table is not). This disagrees most sharply with
    the current best model on lone examples: it predicts factor-kin that are not multiples
    are often endorsed (12 or 27 after "15" or "30", 9 after "6"), while far multiples
    of large two-digit examples (94 after "47", 62 after "31") get little of the boost
    that multiples of small examples (49 after "7") get.'
- name: factor_kin_multiple_route
  rationale: Refinement of `multiple_route_exemplar`. People still judge a target
    by its summed similarity to the examples (magnitude, final digit, parity, divisibility
    by the set's common divisor, all sharpened when the examples share a suspicious
    coincidence). Being a multiple of an example is still a distance-free route to
    similarity. The one change is that this arithmetic route is broader than exact
    multiples. A target that shares a factor of 3 or more with an example also gains
    a separate, smaller fixed amount of similarity to it, at any distance, even when
    it is neither a multiple nor a divisor of that example (12 or 27 after "15", 9
    after "6", 28 after "42"). So people generalize to the factor-kin of an example,
    not only to its multiples, while targets sharing no such factor with any example
    get no boost.
- name: times_table_multiple_route_2
  rationale: 'Refinement of the incumbent `multiple_route_exemplar`: people still
    judge a target by its summed similarity to the examples (magnitude, final digit,
    parity, the set''s common divisor, sharpened by suspicious coincidences), and
    being a multiple of an example is still a separate route to a yes that works at
    any distance. The one change is that this route comes from memorised times tables.
    So it is strong for one-digit examples (14, 49 or 98 after "7"; 64 after "4")
    and much weaker for two-digit examples, whose multiples are not familiar facts
    (94 after "47", 62 after "31"). Far multiples of a two-digit example are therefore
    endorsed far less than far multiples of a one-digit one.'
- name: times_table_multiple_route_3
  rationale: 'Refinement of `set_size_diluted_multiple_route`. People still judge
    a target by its summed similarity to the examples (magnitude, final digit, parity
    and the set''s common divisor, sharpened when the examples share a suspicious
    coincidence). Being a multiple of an example is still a separate route to similarity
    that works at any distance, and it still weakens with each further example. The
    one change is where the route comes from: it is retrieved from memorized times
    tables, so it works only for examples from 2 to 10 (49 or 98 after "7", 30 after
    "5", 64 after "4"). Multiples of larger examples, such as 94 after "47", 62 after
    "31" or 75 after "25", get no route and are judged on ordinary similarity alone.'
- name: round_number_kinship_exemplar
  rationale: 'People judge a target by its summed similarity to the examples (magnitude,
    final digit, parity, the set''s common divisor, multiples and factor-kin of an
    example, all sharpened when the examples share a suspicious coincidence), but
    they also treat round numbers as a familiar class of their own: a target that
    is a multiple of ten resembles every example ending in 0 or 5 by a fixed amount,
    at any distance and whatever its final digit. So round targets are endorsed well
    above what magnitude and digit similarity allow when the examples include numbers
    ending in 0 or 5 (100 after "5", 50 after "45, 90"), while targets ending in 5,
    and round targets after examples with no 0 or 5 ending, get no such boost (30
    after "63, 27, 99, 33").'
- name: problem_size_multiple_retrieval
  rationale: "People judge a target by its summed similarity to the examples (magnitude,\
    \ final digit, parity, the set's common divisor, sharpened by suspicious coincidences,\
    \ plus a weaker route for factor-kin), and being a multiple of an example gives\
    \ a distance-free route to a yes only to the extent that the multiplication fact\
    \ linking them (\"7 \xD7 2 = 14\") is retrieved from memory. Retrieval of arithmetic\
    \ facts gets harder as the problem gets bigger (the problem-size effect), so the\
    \ route weakens steadily with the sum of the two factors: 14 after \"7\" or 8\
    \ after \"4\" are readily endorsed, 98 after \"7\" less so, and 94 after \"47\"\
    \ or 62 after \"31\" gain almost nothing, even though each is a small multiple."
- name: frequency_weighted_multiple_concepts
  rationale: 'Refinement of `log_odds_distorted_concept_learning`. People still infer
    the hidden program as a Bayesian learner would: they weigh candidate rules (parity,
    primes, squares, cubes, powers, multiples of a number, a shared final digit) and
    magnitude ranges by the size principle, and they perceive the resulting probability
    that the target belongs in a compressed, log-odds way. The one change is in which
    arithmetic rules come to mind: "multiples of k" is a familiar idea for small times
    tables, and it becomes less available the larger k is (its prior falls off as
    a power of k). So after "47" the tiny rule "multiples of 47" hardly competes,
    and 94 gets little support, while after "7" the rule "multiples of 7" carries
    14, 49 and 98.'
- name: one_digit_table_factor_kin_route
  rationale: 'Refinement of the incumbent `factor_kin_multiple_route`. People still
    judge a target by its summed similarity to the examples: magnitude, final digit,
    parity and divisibility by the set''s common divisor, all sharpened when the examples
    share a suspicious coincidence. A target that shares a factor of 3 or more with
    an example still gets a small similarity boost at any distance. The one change
    is to the multiples route. It is retrieved one-digit times-table knowledge, so
    only one-digit examples (2 to 9) give their multiples a distance-free boost (14,
    49 or 98 after "7"; 64 after "4"). Far multiples of two-digit examples (94 after
    "47", 62 after "31", 75 after "25") get no multiples boost and are judged by ordinary
    similarity and factor-kinship alone.'
- name: one_digit_arithmetic_route
  rationale: 'Refinement of the incumbent `factor_kin_multiple_route`. People still
    judge a target by its summed similarity to the examples (magnitude, final digit,
    parity and the set''s common divisor, sharpened when the examples share a suspicious
    coincidence), with two distance-free arithmetic routes: being a multiple of an
    example, and sharing a factor of 3 or more with it. The one change is that both
    arithmetic routes are retrieved times-table knowledge about one-digit numbers,
    so an example of 10 or more gives both routes a much weaker boost by one common
    factor: after "7" or "6" people endorse 49, 98 or 9, but after "47" or "15" far
    targets like 94, 12 or 27 get little arithmetic support and are judged mostly
    by ordinary similarity.'
- name: times_table_averaging_exemplar
  rationale: "Refinement of `times_table_multiple_route` (multiples route only for\
    \ times-table examples 2-12), with one component grafted from `similarity_averaging_exemplar`:\
    \ people pool their evidence across examples by (partly) averaging rather than\
    \ summing it. A target's support \u2014 its similarity to each example (magnitude,\
    \ final digit, parity, the set's common divisor, sharpened by suspicious coincidences)\
    \ plus the times-table multiples route \u2014 is diluted as more examples are\
    \ shown, not accumulated. So a far target is not carried by adding up several\
    \ weak resemblances in multi-example sets like \"25, 82\" or \"50, 2\", while\
    \ lone examples like \"7\" or \"5\" keep generalizing broadly to their times-table\
    \ multiples (14, 49, 98; 30, 100) and multiples of large examples (94 after \"\
    47\") get no boost."
- name: round_target_familiarity_bias
  rationale: 'People judge a target by its summed similarity to the examples (magnitude,
    final digit, parity, the set''s common divisor, multiples and factor-kin of an
    example, all sharpened when the examples share a suspicious coincidence), but
    the extra appeal of round numbers is a property of the target itself, not a resemblance
    to round-ish examples: multiples of ten feel like natural outputs of any number-producing
    program, so people are more willing to say yes to them by a fixed amount whatever
    the examples are. This disagrees with `round_number_kinship_exemplar` on round
    targets after sets with no example ending in 0 or 5 (e.g. 30 or 60 after "63,
    27, 99, 33" are boosted here, not there), and on round targets after 0/5 sets,
    which here get no extra boost from having more round-ish examples.'
- name: recency_gated_arithmetic_route
  rationale: 'People judge a target by its summed similarity to the examples (magnitude,
    final digit, parity, the set''s common divisor, sharpened when the examples share
    a suspicious coincidence), but the distance-free arithmetic routes (being a multiple
    or a factor-kin of an example, and round-number kinship) need the example to be
    actively held in mind while the target is checked, and examples fade from working
    memory as later ones arrive. So an example''s arithmetic support falls off steadily
    with how many examples were shown after it: the multiples of the last-shown example
    (21 after "3, 7", 36 after "5, 9") are endorsed much more than equally far multiples
    of an earlier example (99 after "3, 33" is not carried by the 3), while ordinary
    magnitude and digit similarity is unaffected by order.'
- name: weber_scaled_magnitude_exemplar
  rationale: 'People judge a target by its summed similarity to the examples (final
    digit, parity, the set''s common divisor, multiples, factor-kin and round-number
    kinship, all sharpened when the examples share a suspicious coincidence), but
    the magnitude part of that similarity is read off a compressed mental number line
    that obeys Weber''s law: how different two numbers feel depends on their gap relative
    to their size, not on the raw gap. So a gap of 10 makes a target feel much less
    like a small example (5 against 15) than like a large one (85 against 95), and
    generalization by magnitude is narrow around small examples and broad around large
    ones, with the degree of compression inferred from the data.'
- name: round_number_averaging_exemplar
  rationale: 'Refinement of the incumbent `round_number_kinship_exemplar`, with one
    component grafted from `similarity_averaging_exemplar` (as used in `times_table_averaging_exemplar`):
    people pool a target''s support across the examples by partly averaging rather
    than summing it. That support is the target''s similarity to each example (magnitude,
    final digit, parity, the set''s common divisor, sharpened by suspicious coincidences)
    plus the distance-free routes for multiples, factor-kin and round-number kinship.
    So each further example dilutes the support instead of adding to it. A far target
    in a multi-example set (e.g. "25, 82", "50, 2") is not carried by several weak
    resemblances added together, while lone examples ("7", "5") keep generalizing
    broadly to their multiples and round kin (14, 49, 98; 30, 100).'
- name: times_table_round_kinship_exemplar
  rationale: 'Refinement of the incumbent `round_number_kinship_exemplar`: people
    still judge a target by its summed similarity to the examples (magnitude, final
    digit, parity, the set''s common divisor, sharpened by suspicious coincidences),
    with distance-free routes for factor-kin of an example and for round targets after
    examples ending in 0 or 5. The one change is that the multiples route is retrieved
    times-table knowledge, so it exists only for examples that are themselves times-table
    numbers (2 to 12): after "7" people endorse 14, 49 and 98, but far multiples of
    two-digit examples (94 after "47", 62 after "31", 75 after "25") get no multiples
    boost and are judged by ordinary similarity, factor-kinship and roundness alone.'
- name: times_table_round_averaging
  rationale: 'Refinement of `times_table_averaging_exemplar` (similarity to the examples
    on magnitude, final digit, parity and the set''s common divisor, sharpened by
    suspicious coincidences, plus a distance-free multiples route only for times-table
    examples 2-12, with support partly averaged rather than summed over examples).
    The one change, grafted from `round_number_kinship_exemplar`: round numbers are
    a familiar class of their own, so a target that is a multiple of ten gains a fixed,
    distance-free amount of similarity to every example ending in 0 or 5. This predicts
    that round targets are endorsed well above magnitude and digit similarity after
    sets containing 0/5-ending examples (100 after "5", 50 after "45, 90"), while
    far multiples of large two-digit examples (94 after "47", 62 after "31") still
    get no multiples boost, unlike in the current best model.'
