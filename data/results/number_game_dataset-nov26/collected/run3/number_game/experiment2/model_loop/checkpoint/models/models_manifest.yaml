models:
- name: extrapolation_verification_failure
  rationale: "People infer the hidden concept by the same tempered, serial-position-weighted\
    \ Bayesian concept learning as the best model (45 weighted rules and all intervals,\
    \ with sorted lists shifting belief toward ranges), but to answer they must mentally\
    \ verify that the target follows from the examples, and this extrapolation becomes\
    \ unreliable beyond the span of numbers they have actually seen: the farther the\
    \ target lies outside the examples' min\u2013max range, the more likely the check\
    \ fails and they answer \"no\", at an inferred rate per unit of distance. This\
    \ predicts that members of a broad arithmetic rule (e.g. multiples of 3 after\
    \ 63, 27, 99, 33) are endorsed less outside the examples' range than inside it,\
    \ more steeply than belief in the concept alone implies, while inside-range judgments\
    \ are unchanged."
- name: range_bounded_parity_concepts
  rationale: "Refinement of `parity_restricted_concepts`: people do the same tempered-evidence\
    \ Bayesian concept learning over the 45 weighted rules, all intervals of 1-100,\
    \ and their odd-only and even-only versions. The one change is a single added\
    \ component, taken from `bounded_range_rule_learning`: people can also restrict\
    \ a rule to a range of numbers that covers the examples (e.g. \"multiples of 3\
    \ between 20 and 100\"), and these range-bounded rules get an inferred share of\
    \ the prior for rules (share 0 recovers `parity_restricted_concepts`). A bounded\
    \ rule is smaller than the full rule, so the size principle favours it. This predicts\
    \ that people endorse members of the examples' rule that lie outside the examples'\
    \ min-max range less than members inside it, and that this gap is larger than\
    \ the rule/interval mixture allows (63,27,99,33 \u2192 3 below 45)."
- name: weak_sampling_hypothesis_elimination
  rationale: "People learn the hidden concept by eliminating hypotheses rather than\
    \ by weighing how typical the examples are: they keep every rule (one of 45 mathematical\
    \ or digit rules, each with its own prior plausibility) or range of numbers that\
    \ is consistent with the examples, treating an example that does not fit only\
    \ as a possible stray, and they answer \"yes\" with their total belief in the\
    \ surviving concepts that contain the target. Because there is no size principle\
    \ (weak sampling), a small concept gains nothing over a broad one that also fits,\
    \ so people generalize broadly \u2014 especially from a single example \u2014\
    \ and adding consistent examples does not sharpen belief toward the smallest rule."
- name: sample_size_neglect_evidence
  rationale: "People do the same tempered Bayesian concept learning as the best model\
    \ (45 weighted rules, all intervals, their odd/even versions and range-bounded\
    \ rules), with one distortion: they neglect sample size, so the total weight they\
    \ give the examples grows less than in proportion to how many examples they saw\
    \ \u2014 the first example counts heavily, and each further example adds less.\
    \ This predicts that a single example already pins down its most salient rule\
    \ (e.g. 10 \u2192 multiples of 10), producing many yeses for that rule's members,\
    \ while adding more examples sharpens generalization far less than an ideal learner\
    \ would."
- name: range_size_prior_concepts
  rationale: "Refinement of `range_bounded_parity_concepts`: people do the same tempered-evidence\
    \ Bayesian concept learning over the 45 weighted rules, all intervals of 1-100,\
    \ their odd-only and even-only versions, and range-bounded rules, but they do\
    \ not think every magnitude range is equally plausible a priori \u2014 a tiny\
    \ range such as \"numbers from 10 to 12\" seems an unlikely thing for a program\
    \ to produce, so a range's prior plausibility grows (or shrinks) as an inferred\
    \ power of its size (power 0 recovers the incumbent). The one change is this size-dependent\
    \ prior on ranges; because the size principle favours tiny ranges most when there\
    \ is only one example, a broad-range prior moves belief from tiny ranges around\
    \ a lone example to the rules it belongs to, so people generalize from a single\
    \ example (10 \u2192 80, 11 \u2192 55) much more than the incumbent allows, while\
    \ several examples still pin down a tight concept."
- name: single_example_rule_reading
  rationale: "Refinement of `parity_restricted_concepts` (people do tempered-evidence\
    \ Bayesian concept learning over the 45 weighted rules, all intervals of 1-100,\
    \ and their odd-only and even-only versions). The one change: a magnitude range\
    \ is a concept defined by its endpoints, so a single example cannot suggest one\
    \ \u2014 when only one example is shown, people read it as an instance of a mathematical\
    \ or digit property, and prior belief shifts from range concepts to rules by an\
    \ inferred amount (zero shift recovers the original model). This predicts that\
    \ from a lone example people endorse the members of the rules that contain it\
    \ broadly (11 \u2192 22, 55, 99; 10 \u2192 60, 90) rather than confining belief\
    \ to a tight range around the example, while judgments about sets of two or more\
    \ examples are unchanged."
- name: range_prior_sample_size_neglect
  rationale: "Refinement of `range_size_prior_concepts`: people do the same tempered-evidence\
    \ Bayesian concept learning over the 45 weighted rules, all intervals of 1-100\
    \ (with a prior that grows as a power of a range's size), their odd-only and even-only\
    \ versions, and range-bounded rules. The one change is taken from `sample_size_neglect_evidence`:\
    \ people neglect sample size, so each example's evidential weight shrinks as more\
    \ examples are shown. The total weight of the examples grows less than in proportion\
    \ to their number (no neglect recovers the incumbent). This predicts that a lone\
    \ example is weighed heavily enough to pin down the small rule it belongs to (6\
    \ \u2192 12, 18; 11 \u2192 55, 66; 25 \u2192 50, 100), so its members are endorsed\
    \ far more than the incumbent allows, while larger sets sharpen generalization\
    \ less than an ideal learner's would."
- name: neglect_evidence_guessing_lapse
  rationale: "Refinement of `sample_size_neglect_evidence`: people do the same tempered\
    \ Bayesian concept learning with sample-size neglect (45 weighted rules, all intervals,\
    \ their odd/even versions and range-bounded rules, with each extra example adding\
    \ less evidence), but they do not consult that concept on every trial. On some\
    \ trials, at an inferred lapse rate, they skip the inference and answer by a biased\
    \ guess, saying \"yes\" at an inferred guessing rate whatever the target is. The\
    \ one change is this guessing lapse (a lapse rate of 0 recovers the original model).\
    \ It predicts that even targets that are themselves examples, or that clearly\
    \ belong to the inferred concept, are sometimes rejected (examples get about 0.7\u2013\
    0.9 yes, not 1), and that clear non-members still get a floor of yeses."
- name: normalized_attention_similarity
  rationale: "People judge a target by its similarity to the examples over number\
    \ properties (parity, primality, squares, cubes, powers, multiples, final digit,\
    \ digits contained), where the examples set a fixed budget of attention that is\
    \ shared among the properties according to how consistently the examples have\
    \ them. The target's dissimilarity is the fraction of that attention falling on\
    \ properties it lacks, and the chance of \"yes\" falls off exponentially with\
    \ it (Shepard-style generalization). Because the budget is fixed, a lone example\
    \ spreads attention over its many properties, so a target sharing most of them\
    \ (10 \u2192 80, 6 \u2192 18) is still judged very similar and broadly endorsed,\
    \ while several examples that agree on one property (all ending in 2) concentrate\
    \ attention there and sharply reject targets lacking it."
- name: open_ended_multiples_concepts
  rationale: "People do the same tempered-evidence Bayesian concept learning as `range_size_prior_concepts`\
    \ (45 weighted rules, size-weighted intervals of 1-100, their odd-only and even-only\
    \ versions, and range-bounded rules), but their space of concepts also includes\
    \ an open-ended family of \"multiples of k\" concepts for larger steps k from\
    \ 13 to 50 (e.g. multiples of 25, of 33, of 14), beyond the few small multiples\
    \ in the fixed rule list. This family gets an inferred share of prior belief,\
    \ and within it a step's prior plausibility falls off in inverse proportion to\
    \ k (larger steps come to mind less easily). Because the size principle strongly\
    \ favours such a small concept when it contains the examples, people generalize\
    \ a lone example to its own multiples (25 \u2192 50, 75, 100; 33 \u2192 66, 99;\
    \ 14 \u2192 28, 42) much more than the fixed rule list allows."
- name: arithmetic_relation_exemplar
  rationale: "People do not infer a hidden rule; they judge a target by its similarity\
    \ to the stored examples, as in an exemplar (context) model, where two numbers\
    \ are similar to the extent that they stand in familiar arithmetic relations \u2014\
    \ one is a multiple of the other, they share a common factor of 3 or more, they\
    \ end in the same digit, they have the same parity \u2014 and each relation the\
    \ pair lacks shrinks their similarity by an inferred factor. The target's average\
    \ similarity to the examples, against an internal criterion, sets the chance of\
    \ \"yes\", so a lone example is generalized to its own multiples (6 \u2192 18,\
    \ 25 \u2192 100, 11 \u2192 55) because each such target is arithmetically close\
    \ to it, while numbers sharing none of these relations with any example are rejected."
- name: range_sized_bounded_rules
  rationale: "Refinement of `range_prior_sample_size_neglect` (tempered Bayesian concept\
    \ learning with sample-size neglect over 45 weighted rules, size-weighted intervals\
    \ of 1-100, their odd/even versions and range-bounded rules). The one change is\
    \ that the range-size prior people hold applies to every concept defined by a\
    \ range, so it applies to a rule confined to a range (\"multiples of 11 between\
    \ 5 and 15\") as it does to a plain interval. A bounded rule's prior plausibility\
    \ grows by the same inferred power of how many members it keeps, rather than being\
    \ equal for every range, and no new parameter is added. Tiny bounded versions\
    \ of a rule, such as {11} or {25}, then seem implausible. From a lone example\
    \ people should generalize to the whole rule it belongs to (11 \u2192 55, 66;\
    \ 25 \u2192 50, 100), while sets of several examples keep a range-bounded reading."
- name: digit_rules_need_comparison
  rationale: "Refinement of `range_prior_sample_size_neglect` (the same tempered,\
    \ sample-size-neglecting Bayesian concept learning over the 45 weighted rules,\
    \ size-weighted intervals of 1-100, their odd/even versions and range-bounded\
    \ rules). The one change: a digit pattern (\"ends in 6\", \"contains a 1\") is\
    \ something people notice only by comparing examples, so when a single example\
    \ is shown, digit-based rules hardly come to mind, and their prior is discounted\
    \ by an inferred amount (zero recovers the incumbent). Belief then moves to the\
    \ lone example's arithmetic rules. People should generalize a lone example to\
    \ its multiples (6 \u2192 12, 18; 11 \u2192 55, 66; 10 \u2192 80) more than the\
    \ incumbent allows, and endorse numbers that share only its digits (14 \u2192\
    \ 74, 94) less. Judgments about sets of two or more examples are unchanged."
- name: open_multiples_guessing_lapse
  rationale: "Refinement of `open_ended_multiples_concepts`: people do the same tempered-evidence\
    \ Bayesian concept learning over the 45 weighted rules, size-weighted intervals\
    \ of 1-100, their odd-only and even-only versions, range-bounded rules and the\
    \ open-ended \"multiples of k\" family (k from 13 to 50). The one change, taken\
    \ from `neglect_evidence_guessing_lapse`, is that people do not consult this concept\
    \ on every trial: at an inferred lapse rate they skip the inference and give a\
    \ biased guess, answering \"yes\" at an inferred guessing rate whatever the target\
    \ is (a lapse rate of 0 recovers the original model). Because the guessing lapse,\
    \ not weak evidence, accounts for the rejected examples and the floor of yeses,\
    \ the concept inference itself can be sharper, so members of the examples' rule\
    \ (including the lone example's own multiples, 25 \u2192 50, 100) are endorsed\
    \ more and clear non-members less, apart from the guessing floor."
- name: pedagogical_sampling_concepts
  rationale: 'People assume the examples were chosen by a helpful teacher, not sampled
    at random: the program picked numbers that would best lead a learner to its concept
    (pedagogical sampling). So an example counts as evidence for a concept, whether
    a mathematical rule or a range, in proportion to how strongly that example on
    its own would make a naive learner think of that concept, compared with the other
    numbers the teacher could have shown; people then answer "yes" with their resulting
    belief that the concept contains the target. This predicts that concepts for which
    the shown examples would be poor, unrepresentative teaching choices lose belief
    even when they contain the examples, unlike under the size principle, where any
    concept that contains the examples gains in proportion to how small it is.'
- name: comparison_dependent_concepts
  rationale: "Refinement of `digit_rules_need_comparison` (tempered, sample-size-neglecting\
    \ Bayesian concept learning over the 45 weighted rules, size-weighted intervals,\
    \ their odd/even versions and range-bounded rules, with digit rules discounted\
    \ when only one example is shown). The one change is to say why the discount happens.\
    \ Any concept that is defined by a relation among the examples can be noticed\
    \ only by comparing examples. That covers a shared digit pattern and also a rule\
    \ confined to the span the examples cover (\"multiples of 6 between 4 and 9\"\
    ). So when a single example is shown, range-bounded rules lose prior plausibility\
    \ by the same inferred amount as digit rules, and no new parameter is added. People\
    \ should then generalize a lone example to the whole of its arithmetic rule, including\
    \ far members (6 \u2192 18, 24; 11 \u2192 55, 99; 25 \u2192 100; 10 \u2192 80),\
    \ more than the incumbent allows, while judgments about sets of two or more examples\
    \ are unchanged."
- name: digit_neglect_sized_bounded_rules
  rationale: "Refinement of `range_sized_bounded_rules` (tempered, sample-size-neglecting\
    \ Bayesian concept learning over the 45 weighted rules, size-weighted intervals,\
    \ their odd/even versions, and range-bounded rules whose prior grows with how\
    \ many members they keep). The one change, grafted from `digit_rules_need_comparison`:\
    \ a digit pattern (\"ends in 6\", \"contains a 1\") is noticed only by comparing\
    \ examples, so when a single example is shown the digit-based rules hardly come\
    \ to mind and their prior is discounted by an inferred amount (zero recovers `range_sized_bounded_rules`).\
    \ The sized range prior already makes tiny bounded rules around a lone example\
    \ implausible, so the belief taken from digit rules moves to the example's whole\
    \ arithmetic rules. People should then generalize a lone example to its multiples\
    \ (6 \u2192 12, 18; 11 \u2192 55, 66; 25 \u2192 50, 100) more than either parent\
    \ model allows, and endorse its digit neighbours (14 \u2192 74) less, while judgments\
    \ about sets of two or more examples are unchanged."
- name: coherence_relative_similarity
  rationale: 'People judge a target by its similarity to the examples, where two numbers
    are similar to the extent that they share number properties (parity, primality,
    being a square/cube/power, divisibility, final digit, digits contained, and a
    magnitude band of width 20), each shared property counting by how rare, and so
    informative, it is. The criterion is relative: people say "yes" when the target
    is about as similar to the examples, on average, as the examples are to one another,
    so a set whose members are loosely related (no common rule) accepts loosely related
    targets such as nearby numbers, while a tightly related set (all ending in 2)
    demands the same tight relation. A lone example, which has no partner to compare
    with, is judged against a fixed default criterion.'
- name: consistent_examples_bounded_rules
  rationale: "Refinement of `comparison_dependent_concepts` (the same tempered, sample-size-neglecting\
    \ Bayesian concept learning over the 45 weighted rules, size-weighted intervals,\
    \ their odd/even versions and range-bounded rules, with digit rules and bounded\
    \ rules discounted when only one example is shown). The one change takes that\
    \ model's own premise further. A rule confined to the examples' span (\"ends in\
    \ 3 between 48 and 63\") is built by comparing the examples and seeing that they\
    \ share the rule, so people entertain it only when every example fits the rule.\
    \ A bounded rule that one of the examples breaks is never considered, rather than\
    \ kept with that example written off as a stray, and no parameter is added. People\
    \ should then drop a rule that most examples share but one breaks, and fall back\
    \ on the examples' range or on whole rules. In-range numbers lacking the majority\
    \ pattern (48,63,53 \u2192 49, 51) should be endorsed more than the incumbent\
    \ predicts, while sets that a rule fits fully are unchanged."
- name: comparison_gated_sized_bounded_rules
  rationale: "Refinement of `digit_neglect_sized_bounded_rules`. People do tempered,\
    \ sample-size-neglecting Bayesian concept learning over the 45 weighted rules,\
    \ size-weighted intervals, their odd/even versions, and range-bounded rules whose\
    \ prior grows with how many members they keep. In that model, digit rules are\
    \ already discounted when only one example is shown. The one change, grafted from\
    \ `comparison_dependent_concepts`: a rule confined to the span the examples cover\
    \ also needs a comparison between examples, so with a lone example range-bounded\
    \ rules lose prior plausibility by the same inferred discount as digit rules.\
    \ No parameter is added. People should therefore generalize a lone example to\
    \ the whole of its arithmetic rule, including far members (6 \u2192 18, 24; 25\
    \ \u2192 100; 11 \u2192 99), more than either parent allows. For sets of two or\
    \ more examples, a sized range-bounded reading is kept."
