models:
- name: consistent_examples_bounded_rules
  rationale: "Refinement of `comparison_dependent_concepts` (the same tempered, sample-size-neglecting\
    \ Bayesian concept learning over the 45 weighted rules, size-weighted intervals,\
    \ their odd/even versions and range-bounded rules, with digit rules and bounded\
    \ rules discounted when only one example is shown). The one change takes that\
    \ model's own premise further. A rule confined to the examples' span (\"ends in\
    \ 3 between 48 and 63\") is built by comparing the examples and seeing that they\
    \ share the rule, so people entertain it only when every example fits the rule.\
    \ A bounded rule that one of the examples breaks is never considered, rather than\
    \ kept with that example written off as a stray, and no parameter is added. People\
    \ should then drop a rule that most examples share but one breaks, and fall back\
    \ on the examples' range or on whole rules. In-range numbers lacking the majority\
    \ pattern (48,63,53 \u2192 49, 51) should be endorsed more than the incumbent\
    \ predicts, while sets that a rule fits fully are unchanged."
- name: central_tendency_feature_prototype
  rationale: People do not infer a rule. They boil the examples down to one prototype,
    which records how often each familiar number property (odd/even, prime, square,
    cube, power, multiple of k, final digit, digit contained) occurs among the examples
    and where the examples sit on average on the number line. They say "yes" to a
    target according to its similarity to that prototype. A property counts toward
    the comparison more steeply the more consistently the examples share it, and the
    target loses similarity for the share of that weight that falls on properties
    it lacks and for its distance from the examples' central magnitude. This predicts
    that when no property is shared by every example, generalization rests on closeness
    to the examples' centre, so targets between the examples are endorsed more than
    equally related targets outside their span, while a property shared by all the
    examples dominates the judgment.
- name: stray_rate_inferred_concepts
  rationale: 'Refinement of `comparison_dependent_concepts`. It keeps the same tempered,
    sample-size-neglecting Bayesian concept learning over the 45 weighted rules, size-weighted
    intervals, their odd/even versions and range-bounded rules, with digit and bounded
    rules discounted for a lone example. The one change: people do not assume a fixed
    10% of the examples are random strays. How likely they think a stray example is
    gets inferred. If people think the program''s examples are rarely strays, any
    rule that one example breaks (whole, bounded or parity-restricted) loses nearly
    all belief, and that belief moves to the ranges that cover every example. In-range
    numbers should then be endorsed more than either earlier model predicts for sets
    no rule fully fits and for pairs of examples, and less outside the range.'
- name: range_specific_evidence_strength
  rationale: 'Refinement of `consistent_examples_bounded_rules`. People use the same
    tempered, sample-size-neglecting Bayesian concept learning over weighted rules,
    size-weighted ranges, their odd/even versions and bounded rules that every example
    must fit, and they still discount comparison-based rules when shown one example.
    The one change: people do not weigh the examples as equally strong evidence for
    every kind of concept. Once they think of a magnitude range, the size principle
    acts on it with its own strength, which differs from the strength used for mathematical
    and digit rules by an inferred amount (no difference recovers the incumbent).
    This separates how tightly the imagined range fits the examples from how sharply
    people choose among rules, so it should change how much people endorse in-range
    relative to out-of-range targets for pairs of examples and for sets that no rule
    fits fully, while judgments driven by a rule that fits fully stay nearly the same.'
- name: most_specific_noticed_rule
  rationale: People do not weigh many candidate concepts at once; they search for
    a single rule and stop at the first one they notice. Each familiar property that
    every example shares (a parity, multiples of some number, a special number kind
    such as squares, powers or primes, a final digit, a contained digit) is noticed
    with a probability that depends on its kind, and among the shared properties they
    notice people adopt the most specific one and say "yes" to targets that have it.
    Only when they notice no shared property do they fall back on the stretch of the
    number line the examples span, endorsing targets inside it and fewer the farther
    a target lies outside it, so sets with no common rule give little generalization
    beyond their range.
- name: guessing_lapse_consistent_concepts
  rationale: 'I refine `consistent_examples_bounded_rules` (tempered, sample-size-neglecting
    Bayesian concept learning over weighted rules, size-weighted ranges, their odd/even
    versions, and bounded rules that every example must fit). The one change is a
    component taken from `neglect_evidence_guessing_lapse`: on some trials people
    do not consult their inferred concept at all. On those trials they guess, saying
    "yes" at an inferred rate whatever the target is. In the parent model the occasional
    "yes" to numbers that no plausible concept contains could only come from a prior
    that favours very wide ranges. With guessing to account for it, people''s ranges
    should stay close to the examples: when no rule fits, numbers inside the examples''
    span get relatively more endorsement and numbers outside it less, and every target,
    even the examples themselves, keeps a floor and ceiling set by guessing.'
- name: range_evidence_accumulates_with_n
  rationale: 'Refinement of `range_specific_evidence_strength` (the same tempered,
    sample-size-neglecting Bayesian concept learning over weighted rules, size-weighted
    ranges with their own evidence strength, odd/even versions and fully consistent
    bounded rules, with comparison-based rules discounted for a lone example). The
    one change: sample-size neglect differs by kind of concept. People judge how tightly
    a magnitude range fits by how densely the examples fill it, so each further example
    adds evidence for a range at its own rate, which differs from the rate for rules
    by an inferred amount (no difference recovers the incumbent). If ranges neglect
    sample size less than rules, then for sets of three or four examples that no rule
    fits (71,61,26,81; 70,88,7,22) people should endorse targets outside the examples''
    span less than the incumbent predicts, while pairs and rule-driven judgments barely
    change.'
- name: graded_explaining_away_by_specificity
  rationale: When people compare the examples, they notice the most specific property
    all of them share (for example, all ending in 3), and they treat broader properties
    that it implies (being odd, containing a 3) as by-products of it rather than as
    separate candidate rules. A broader rule is set aside more completely the more
    specific the shared property that implies it, while people otherwise infer the
    concept by tempered Bayesian concept learning over rules and magnitude ranges.
    So after sets like 63,23,43 or 93,43,83,53, same-parity numbers with a different
    final digit should be endorsed less than the current best model predicts, while
    a lone example, which allows no comparison, is unaffected.
- name: iter2_candidate1
  rationale: 'People infer the program''s concept by the same tempered, sample-size-neglecting
    Bayesian concept learning as the current best model, with one bias: explaining
    away. When the examples all share a specific property (all end in 3), a broader
    property that this one implies (being odd, containing a 3) looks like a by-product
    of it, not a candidate rule. Each further example that again shows the specific
    property strengthens that impression, so a rule that strictly contains another
    rule all the examples fit loses plausibility by an inferred amount per additional
    example. Targets that have only the broader property (31, 35, 39 after 63, 23,
    43) should be endorsed less than the best model predicts, more so for four examples
    than for two. Targets with the specific property, lone examples, and sets without
    nested rules should barely change.'
- name: hundreds_chart_block_concepts
  rationale: People picture the numbers 1-100 laid out as a ten-by-ten hundreds chart
    (rows are decades, columns are final digits), and the "magnitude" concepts they
    entertain are rectangular blocks of that chart rather than stretches of the number
    line. They weigh these blocks, together with familiar mathematical and digit rules,
    by how small a concept can still cover the examples (the size principle), and
    say "yes" to a target with their belief that the concept contains it. So examples
    sharing a final digit are read as a narrow column block that excludes other final
    digits even of the same parity, and when no rule fits, people endorse in-range
    targets only if the target's final digit falls within the span of the examples'
    final digits.
- name: shared_rule_explains_away_supersets
  rationale: 'Refinement of `range_specific_evidence_strength` (the same tempered,
    sample-size-neglecting Bayesian concept learning over weighted rules, size-weighted
    ranges with their own evidence strength, odd/even versions and fully consistent
    bounded rules, with comparison-based rules discounted for a lone example). The
    one change is explaining away: when people compare two or more examples and see
    that all of them share a specific property (all end in 3), they treat any broader
    property it implies (being odd, containing a 3) as a by-product of that specific
    property, not as a separate candidate rule, so every rule that strictly contains
    another rule all the examples fit loses prior plausibility by an inferred amount
    (no loss recovers the incumbent). After sets such as 63,23,43 or 93,43,83,53,
    odd targets with a different final digit (31, 35, 39) should then be endorsed
    much less than the incumbent predicts, while targets with the specific property
    and sets without nested rules barely change.'
- name: specific_rule_explains_away_with_lapse
  rationale: 'I refine `guessing_lapse_consistent_concepts` (tempered, sample-size-neglecting
    Bayesian concept learning over weighted rules, size-weighted ranges, their odd/even
    versions and bounded rules that every example must fit, with a guessing lapse
    on some trials). The one change, taken from `specific_rule_preempts_supersets`:
    when people compare two or more examples and see that they all share a specific
    property (all end in 3), they explain away any broader property it implies (being
    odd, containing a 3) as a by-product rather than a candidate rule, so each rule
    that strictly contains another rule every example fits keeps only an inferred
    fraction of its plausibility. After sets such as 63,23,43 or 93,43,83,53, people
    should then rarely endorse same-parity numbers with a different final digit (31,
    35, 39), less often than either parent predicts, while targets with the specific
    property, lone examples, and sets without nested rules stay as the guessing-lapse
    model predicts.'
- name: range_evidence_with_guessing_lapse
  rationale: 'I refine `range_specific_evidence_strength`, keeping its tempered, sample-size-neglecting
    Bayesian concept learning over weighted rules, size-weighted ranges that have
    their own evidence strength, odd/even versions and fully consistent bounded rules,
    with comparison-based rules discounted for a lone example. The one change is a
    component taken from `guessing_lapse_consistent_concepts`: on some trials people
    do not consult their inferred concept at all and guess instead, saying "yes" at
    an inferred rate whatever the target is. Then the occasional "yes" to numbers
    that no plausible concept contains comes from guessing, not from a prior that
    favours very wide ranges. So the ranges people imagine, which already have their
    own evidence strength, should stay closer to the examples, and every target, even
    the examples themselves, keeps a floor and a ceiling set by guessing.'
- name: directional_stream_extrapolation
  rationale: People read the examples, in the order shown, as the program's output
    stream so far, and notice which way it has been travelling along the number line
    (from the first example toward the last); they infer the concept by the same tempered,
    sample-size-neglecting Bayesian concept learning as the current best model, but
    accept a target beyond the examples more readily when it lies ahead of the stream's
    direction of travel and less readily when it lies behind it. So the same examples
    shown in rising versus falling order should be generalized more toward larger
    versus smaller numbers, while targets inside the examples' span and lone examples
    are unaffected.
- name: upward_directed_similarity_gradient
  rationale: 'People judge a target by its similarity to the examples on a single
    explicit metric: the target loses similarity for each number property the examples
    consistently share (parity, final digit, digits contained, multiples, special
    kinds such as squares or primes) that it lacks, with a property''s attention rising
    steeply with how consistently the examples share it, and for how far it lies below
    the smallest example on the number line. The magnitude gradient is one-directional:
    people treat the program''s output as counting upward from its examples, so numbers
    above the largest example lose no similarity for their magnitude, while numbers
    below the smallest lose more the farther down they lie, making people generalize
    upward more than downward.'
- name: belief_criterion_confidence_gain
  rationale: 'People infer the program''s concept by the same simple tempered Bayesian
    concept learning as the simplest current model, but they do not answer "yes" with
    a probability equal to their belief (probability matching): they weigh how strongly
    they believe the concept contains the target against an internal criterion of
    how sure they must be, and this comparison is noisy, so their answers are more
    or less all-or-none than the belief itself by an inferred confidence gain on the
    log-odds of belief. Unlike a guessing lapse, which pulls every answer toward one
    fixed rate by the same proportion, this rule moves confident beliefs (examples,
    clear non-members) much less than moderate ones, so a gain below 1 leaves near-certain
    judgments close to certainty while it compresses uncertain ones toward the criterion,
    and a gain above 1 makes them more extreme.'
- name: cumulative_explaining_away_with_lapse
  rationale: 'I refine the incumbent `iter2_candidate1` (cumulative explaining away).
    It keeps the incumbent''s tempered, sample-size-neglecting Bayesian concept learning,
    in which a broader rule implied by a specific rule that all the examples share
    (odd or contains-3, given ends-in-3) is explained away more with each further
    example. The one change is a component taken from `range_evidence_with_guessing_lapse`:
    on some trials people do not consult their inferred concept at all and guess,
    saying "yes" at an inferred rate whatever the target is. Because guessing, and
    not wide ranges or broad stray-tolerant rules, now accounts for the occasional
    "yes" to numbers that no plausible concept contains, the inferred concept should
    be sharper: the ranges people imagine stay tighter around the examples, and every
    target, examples included, keeps a guessing floor and ceiling.'
- name: magnitude_threshold_concepts
  rationale: 'I refine the incumbent `iter2_candidate1`. It keeps the tempered, sample-size-neglecting
    Bayesian concept learning over weighted rules, size-weighted ranges with their
    own evidence strength, odd/even versions and fully consistent bounded rules, along
    with the lone-example discount and the explaining away of implied rules, which
    grows with each extra example. The one change: people also treat one-sided magnitude
    thresholds ("numbers above 40", "numbers below 30") as concepts in their own right.
    So a range that runs up to the top of 1-100, or down to the bottom, gains plausibility
    beyond an ordinary range of the same size, with a separate inferred amount for
    "above" and "below" (none recovers the incumbent). People should then extend generalization
    from the examples all the way to one end of the number line more than the incumbent
    predicts, and more toward larger numbers than toward smaller ones.'
- name: graded_explaining_away_with_guessing
  rationale: "I refine `graded_explaining_away_by_specificity`: people infer the concept\
    \ by the same tempered, sample-size-neglecting Bayesian concept learning over\
    \ rules, magnitude ranges and bounded rules, and when they compare the examples\
    \ they set aside a broader rule implied by a more specific rule all the examples\
    \ share, the more completely the more specific that shared rule is. The one change,\
    \ a component taken from `range_evidence_with_guessing_lapse`: on some trials\
    \ people do not consult their inferred concept at all and guess, saying \"yes\"\
    \ at an inferred rate whatever the target is. So the floor of yeses to numbers\
    \ that no plausible concept contains, and the occasional \"no\" to the examples\
    \ themselves, come from guessing rather than from a prior favouring very wide\
    \ ranges, letting the imagined ranges stay closer to the examples while same-parity\
    \ numbers with a different final digit (63,23,43 \u2192 31, 35) are still rejected."
- name: pairwise_consequential_exemplar
  rationale: People do not infer one concept that explains all the examples together;
    they store each example as a separate exemplar and judge the target by how similar
    it is to each stored example on its own, where two numbers are similar to the
    extent that familiar number concepts (mathematical and digit rules, magnitude
    ranges), weighted toward small concepts, would contain both (Shepard's consequential-region
    similarity). They say "yes" according to the target's average similarity to the
    stored examples, so a target strongly linked to only some examples (sharing a
    property with one, lying near another) still earns partial endorsement, and adding
    examples does not make generalization any tighter through a shared, suspiciously
    coincidental pattern.
- name: exception_weighted_rule_rejection
  rationale: 'I refine the incumbent `magnitude_threshold_concepts`, keeping its tempered,
    sample-size-neglecting Bayesian concept learning over weighted rules and their
    odd/even versions, size-weighted ranges with their own evidence strength and one-sided
    "above x"/"below x" thresholds, fully consistent bounded rules, the lone-example
    discount and the cumulative explaining away of implied rules. The one change:
    people judge a mathematical or digit rule by its exceptions, so an example that
    breaks a rule counts against it by its own inferred amount rather than the fixed
    cost implied by treating 10% of examples as random strays (no extra cost recovers
    the incumbent), which separates how firmly a rule is rejected for an exception
    from how strongly the size principle favours small rules, while ranges keep the
    stray account. If exceptions weigh more than strays imply, a rule that one example
    breaks gives up belief to the ranges covering every example, so for sets that
    no rule fits people should generalize more inside the examples'' span and less
    to rule members outside it, while the size principle among fitting rules can be
    gentler.'
- name: graded_explaining_away_with_thresholds
  rationale: 'I refine `graded_explaining_away_with_guessing`: people infer the concept
    by tempered, sample-size-neglecting Bayesian concept learning over weighted rules,
    size-weighted magnitude ranges and bounded rules. They set aside a broader rule
    implied by a more specific rule all the examples share, more completely the more
    specific that shared rule is, and on some trials they guess "yes" at an inferred
    rate without consulting the concept. The one change, a component taken from `magnitude_threshold_concepts`,
    is that people also treat one-sided magnitude thresholds ("numbers above 40",
    "numbers below 30") as concepts in their own right, so a range running to the
    top or the bottom of 1-100 gains extra plausibility, by a separate inferred amount
    for "above" and "below". Because guessing now supplies the floor of yeses, a threshold
    boost should mean that people generalize from the examples toward one end of the
    number line, more toward larger numbers than smaller ones, while ranges otherwise
    stay close to the examples and same-parity numbers with a different final digit
    are still rejected after sets that share a final digit.'
