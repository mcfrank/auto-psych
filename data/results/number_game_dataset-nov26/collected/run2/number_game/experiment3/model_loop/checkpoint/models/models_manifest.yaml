models:
- name: first_impression_anchoring
  rationale: "People read the examples in order and form their first guess about the\
    \ program from the first example alone, entertaining every salient property it\
    \ has (its parity, the numbers it is a multiple of, its digits, its final digit).\
    \ Later examples should rule out the first example's properties they lack, but\
    \ people adjust insufficiently from this first impression: contradicted first-example\
    \ properties keep a fraction of their weight, so targets that share properties\
    \ with the first-shown example \u2014 not only its final digit \u2014 are endorsed\
    \ more than the examples' common profile alone implies, and the same examples\
    \ in a different order are generalized differently."
- name: progression_band_first_digit_primacy
  rationale: 'Refinement of `progression_graded_magnitude_band` (the incumbent) by
    one grafted component, taken from `graded_band_first_digit_primacy`: when several
    examples are shown without a shared final digit, the final digit of the FIRST
    example also lingers as a candidate pattern ("ends in 3"), with its own inferred
    salience, because the first example anchors people''s initial guess before the
    later examples arrive. Everything else is the incumbent''s judgment unchanged
    (salience-weighted share of the examples'' shared profile, with the graded magnitude
    band, the "start at the smallest and add the gap" progression concept, multiples
    of the seed, final-digit overshadowing and the last example''s lingering digit),
    so targets sharing the first-shown example''s final digit are endorsed more than
    targets sharing no example''s final digit, closing the first_example_digit_lift
    critique the incumbent fails.'
- name: coincidence_gated_first_digit_primacy
  rationale: 'Refinement of `coincidence_gated_pattern_belief` by one grafted component,
    taken from `graded_band_first_digit_primacy`: when people believe the program
    follows a rule, the final digit of the FIRST example shown also lingers as a candidate
    pattern ("ends in 3"), with its own inferred salience, because the first example
    anchors their initial guess before the later examples arrive. Everything else
    is unchanged: people first judge from how striking the examples'' agreement is
    whether the program is patterned at all (a single example or broadly shared properties
    leave them suspecting it is random, so they lean toward "yes"), and otherwise
    say "yes" by the salience-weighted share of the examples'' shared profile the
    target has, the last example''s lingering digit included. So on multi-example
    sets without a shared final digit, targets sharing the first-shown example''s
    final digit are endorsed more than targets sharing no example''s final digit,
    which is the first_example_digit_lift discrepancy that the best model misses.'
- name: incremental_band_narrowing
  rationale: People read the examples one at a time and keep a running guess about
    how widely the program's numbers spread in magnitude. After a single example the
    guess is broad, but each additional example revises it and tightens how far beyond
    the examples' range they are willing to generalize. So targets outside the range
    lose endorsement faster with distance the more examples have been shown, while
    targets inside the range keep full magnitude credit, and the rest of the judgment
    (the salience-weighted share of the examples' shared properties) is unchanged.
- name: span_interval_similarity
  rationale: 'When two or more examples are shown, people also treat the stretch of
    the number line between the smallest and largest example as a candidate concept
    in its own right ("numbers in this range"), and a target earns credit for it by
    its similarity to that interval: full credit anywhere inside it, decaying exponentially
    (Shepard''s generalization gradient, at an inferred and fairly steep rate) with
    the target''s distance outside it. This interval similarity enters, with its own
    salience, the salience-weighted share of the examples'' shared profile that drives
    "yes" in the current best account, so targets lying between the examples are endorsed
    more than equally nondescript targets outside them, even when they share no digit,
    parity or seed-multiple with the examples.'
- name: range_tightened_magnitude_band
  rationale: 'Refinement of `progression_band_first_digit_primacy` (the incumbent)
    by one change to its graded magnitude band: the band''s width depends on whether
    the examples mark out a range. A single example gives no range, so magnitude credit
    falls off broadly around it, but once two or more examples are shown people take
    the span they cover as the program''s range, and magnitude credit falls off more
    steeply (by an inferred fraction of the single-example width) below the smallest
    and above the largest example. Everything else is the incumbent unchanged, so
    in multi-example sets targets inside the examples'' range that share no other
    property are endorsed more than targets outside it (the inrange_nonshared_rate
    critique), while single-example sets still generalize broadly.'
- name: span_sharpened_magnitude_band
  rationale: 'Refinement of the incumbent `progression_band_first_digit_primacy` by
    one change to its graded magnitude band: how sharply magnitude credit falls off
    outside the examples depends on whether the examples mark out a span. A lone example
    gives no edges, so people generalize by magnitude broadly; once two or more examples
    are shown, their smallest and largest values become real boundaries, and credit
    falls off much more steeply (its own inferred width) beyond them. Everything else
    is the incumbent unchanged, so in multi-example sets, targets inside the examples''
    range that share nothing else with them are endorsed more than equally nondescript
    targets outside it, closing the inrange_nonshared_rate critique, while single-example
    generalization stays broad.'
- name: first_impression_span_interior
  rationale: 'Refinement of `first_impression_anchoring` by one change: when two or
    more examples are shown, people also take "a number lying between the smallest
    and the largest example" as a candidate property of the program (the range the
    examples fill in), with its own inferred salience, overshadowed like the other
    non-digit properties by a visible shared final digit. Everything else is unchanged
    (the first impression''s contradicted properties keep a fraction of their weight,
    graded magnitude band, progression concept, seed multiples, the last example''s
    lingering digit), so on multi-example sets targets strictly inside the examples''
    range are endorsed more than targets just outside it even when they share no digit,
    parity or seed-multiple with the examples, closing the inrange_nonshared_rate
    critique.'
- name: evidence_scaled_decisiveness
  rationale: 'People infer the program''s concept as the current best account says
    (the salience-weighted share of the examples'' shared property profile, including
    the stretch between the examples), but the decision rule that turns that belief
    into a yes/no answer depends on how much evidence they have: the fewer examples
    shown, the noisier and less decisive their answers, drifting toward a coin flip.
    So after a single example poorly matching targets are endorsed more and targets
    are less sharply differentiated, while with three or four examples the same degree
    of match is acted on more decisively.'
- name: size_discounted_anything_concept
  rationale: 'People''s space of candidate concepts includes "the program can produce
    any number at all", a concept every target fits, which they weigh by the size
    principle: because it is the broadest concept, each additional example that happens
    to fit a narrower pattern makes it less credible, by an inferred factor per example.
    So after one example the anything-goes concept carries much of the judgment and
    people say "yes" broadly with little regard to the target''s distance or properties,
    while with three or four examples it has faded and "yes" follows the salience-weighted
    share of the examples'' shared profile (with the in-span interval concept) as
    in the current best account.'
- name: evidence_tuned_attention_exemplar
  rationale: 'People do not infer a concept; they store each example shown and judge
    a target by its average similarity to those stored examples, where similarity
    falls off exponentially with the attention-weighted number of the example''s properties
    (parity, primality, squares/cubes, powers, multiples, base-ten multiples, final
    digit, contained digits) the target lacks, plus their distance in magnitude. Attention
    to a property is learned from the examples themselves: it grows with how many
    of the stored examples carry that property, shrunk toward zero by a prior pseudo-count
    of uninformative observations, so a single example draws only weak attention to
    any of its features (broad, nearly distance-flat generalization), while each further
    example sharpens attention to the features they have in common.'
- name: range_band_single_leniency
  rationale: "Refinement of `range_tightened_magnitude_band` (chosen: statistically\
    \ tied with the best and already separating broad single-example from tight multi-example\
    \ magnitude generalization) by one grafted component, taken from `progression_band_single_leniency`:\
    \ when only a single example is shown, people know they cannot yet tell which\
    \ of its properties the program cares about, so they adopt a laxer decision criterion\
    \ and lean toward \"yes\" for every target by an inferred amount. Everything else\
    \ is the refined model unchanged (salience-weighted share of the examples' shared\
    \ profile with a magnitude band that is broad for one example and tighter outside\
    \ the span of several, progression concept, seed multiples, final-digit overshadowing,\
    \ lingering first- and last-example digits), so one-example sets are endorsed\
    \ more, and more uniformly across distance from the example, than the profile\
    \ match alone implies \u2014 the single_vs_multi_yes_gap and single_example_distance_gradient\
    \ discrepancies the best model fails \u2014 with no change for two- to four-example\
    \ sets."
- name: salience_scaled_span_decisiveness
  rationale: 'Refinement of the incumbent `span_interval_similarity` by one change,
    grafted from `salience_scaled_decisiveness_overlap`: how decisively people act
    on a target''s match to the examples'' shared profile grows with how much the
    examples visibly have in common. When the examples share many or highly salient
    properties (a common final digit, a seed and its multiples, an arithmetic progression),
    a well-matching target is endorsed and a mismatching one rejected far more sharply
    than when the examples share only a few weak properties, where answers stay close
    to the baseline whatever the target; the judged share itself (including the in-span
    interval similarity) is the incumbent''s unchanged, so items are differentiated
    more sharply on strongly patterned sets (the item_mean_variance critique).'
- name: single_example_random_program_doubt
  rationale: 'Refinement of the incumbent `span_interval_similarity` by one change.
    When the program has shown only a single example, people often cannot rule out
    that it produces numbers more or less at random: on an inferred share of one-example
    trials they set the example''s properties aside and answer at a flat rate that
    is the same for every target (so some of these answers are a flat "yes" and some
    a flat "no"), while on the remaining one-example trials and on every multi-example
    trial they judge exactly as the incumbent does (the salience-weighted share of
    the examples'' shared profile, with the interval similarity). So one-example sets
    are endorsed more often, and their endorsement depends less on the target''s distance
    and properties than the overlap alone predicts.'
- name: representativeness_gated_random_doubt
  rationale: "People judge whether a lone example came from a rule-following or a\
    \ random program by how representative it looks of random output (a representativeness\
    \ heuristic): a conspicuous number \u2014 a perfect square or power, a round multiple\
    \ of ten, a repdigit, 1 or 100 \u2014 looks deliberately chosen and convinces\
    \ them the program follows a rule, while a nondescript number like 43 or 67 looks\
    \ like what a random generator would spit out and leaves them answering at a flat\
    \ rate regardless of the target. So one-example sets differ in breadth of generalization\
    \ according to how patterned the example looks: conspicuous lone examples get\
    \ sharp, property-based answers (yes to matching targets, no to the rest), nondescript\
    \ ones get flat answers; multi-example sets are judged by the salience-weighted\
    \ share of the examples' shared profile as in the current best account."
- name: parity_preserving_random_doubt
  rationale: 'When only one example is shown, people often suspect the program produces
    numbers more or less at random, but even then they do not set the lone example
    aside entirely: they keep its parity as the one default constraint on what such
    a loosely patterned program emits ("it gives odd numbers"), answering "yes" at
    a flat rate to targets of the example''s parity and much less often to targets
    of the opposite parity. Otherwise (the remaining one-example trials and every
    multi-example trial) they judge by the salience-weighted share of the examples''
    shared profile with the in-span interval similarity, as the current best account
    does. The sharpest disagreement with the best model lives at opposite-parity targets
    of one-example sets, which this hypothesis predicts are endorsed far less, so
    lone examples asked about opposite-parity targets have markedly lower mean endorsement
    than the best model''s flat doubt allows.'
- name: round_example_reduces_random_doubt
  rationale: 'When only a single example is shown, whether people suspect the program
    produces numbers at random depends on how random-looking that example is: a round
    number (a multiple of 5 or 10) looks deliberately chosen rather than randomly
    drawn, so people doubt much less that a rule lies behind it and judge targets
    strictly by their match to its properties, whereas a nondescript lone example
    invites the random-program doubt that makes people answer at a flat rate whatever
    the target. So lone round examples are endorsed much less broadly than lone nondescript
    ones, while multi-example judgments (the salience-weighted share of the examples''
    shared profile with the in-span interval similarity) are unchanged.'
- name: rule_ambiguity_single_doubt
  rationale: 'Refinement of the incumbent `single_example_random_program_doubt` by
    one change to its doubt mechanism: how often people set a lone example aside and
    answer at a flat rate depends on how many candidate rules that example fits. A
    number that belongs to many salient categories at once (64: even, a square, a
    cube, a power of 2, 4 and 8, a multiple of 4 and 8, ...) gives no way to tell
    which of them the program follows, so people more often give up on rule-based
    judgment and answer flatly; a number with few salient properties (43) points to
    a definite rule and is judged by its profile more often. Everything else is the
    incumbent unchanged (the salience-weighted share of the examples'' shared profile,
    with the interval similarity on multi-example sets), so the breadth of generalization
    differs from one lone example to another, which the incumbent''s single global
    doubt rate cannot produce (the n1_set_mean_variance critique).'
- name: pattern_graded_random_doubt
  rationale: 'Refinement of the incumbent `single_example_random_program_doubt` by
    one change to its doubt mechanism. When only one example is shown, how often people
    suspect that the program produces numbers at random, and so answer at a flat rate
    whatever the target, is not fixed: it depends on how patterned that lone example
    looks, meaning the total salience of the properties it carries (a round multiple
    of 5 or 10, a power or square, many divisors, as opposed to a nondescript number).
    The direction and strength of this dependence are inferred. On the remaining one-example
    trials and on every multi-example trial people judge exactly as the incumbent
    does, so lone examples differ from one another in how broadly and how flatly they
    are generalized, which addresses the n1_set_mean_variance critique.'
- name: representativeness_discounted_anything
  rationale: "Refinement of `size_discounted_anything_concept` (rank 1, the narrowest\
    \ loser) by one change: how credible the \"the program can produce any number\"\
    \ concept is depends on whether the examples look like something a random program\
    \ would produce (the representativeness heuristic). A round example \u2014 a multiple\
    \ of 5 or 10 \u2014 looks deliberately chosen rather than random, so each round\
    \ example discounts the anything-goes concept by an extra inferred factor on top\
    \ of the size-principle discount per additional example; everything else is the\
    \ refined model unchanged. So a lone round example (85, 30, 100, 55) is generalized\
    \ much more narrowly, by its shared property profile, than a lone nondescript\
    \ example (43, 73, 16), which makes breadth of generalization differ between one-example\
    \ sets (the n1_set_mean_variance critique) and sharpens property-based (parity)\
    \ generalization from round lone examples."
- name: working_memory_three_example_limit
  rationale: 'People generalize from the examples as the current best account says,
    by the salience-weighted share of the profile the examples have in common (with
    doubt about a lone example, and the interval between the examples). The one change
    is a working-memory limit: people can hold only three examples in mind at once.
    So when four examples are shown, on an inferred share of trials one of them has
    dropped out of memory, and people judge the target against the profile the remaining
    three share. That profile is richer, because it includes coincidences the dropped
    example would have ruled out, so on four-example sets targets that fit the full
    set''s profile are endorsed less than a reasoner using all four examples would
    endorse them, while sets of one to three examples are judged exactly as before.'
- name: single_exception_tolerance
  rationale: People allow that one of the examples may be an odd one out (a slip or
    noise in the program's output), so when three or four examples are shown, a property
    that every example but one has (two of 48, 63, 53 end in 3) is still entertained
    as the program's possible rule, at an inferred fraction of the weight it would
    carry if all examples shared it. Targets with such an almost-shared property are
    therefore endorsed more than the strictly shared profile implies; everything else
    is the current best account unchanged (the salience-weighted share of the examples'
    shared profile with the in-span interval similarity, and the flat-rate doubt on
    lone examples that grows with how many rules the example fits).
- name: rule_ambiguity_doubt_all_sizes
  rationale: Refinement of the incumbent `rule_ambiguity_single_doubt`. The one change
    is that rule-ambiguity doubt is not limited to lone examples. When several examples
    are shown, people also sometimes give up on rule-based judgment and answer at
    a flat rate, and they do so more often the more candidate rules all the examples
    fit together. Examples like 64 and 4 (even, squares, powers of 2, multiples of
    4) leave the program's rule ambiguous, so their targets are endorsed broadly and
    uniformly; examples sharing few categories point to one rule and are judged by
    the salience-weighted share of their shared profile, as before. Multi-example
    doubt has its own base rate and its own dependence on how many rules the examples
    share, and the judged share and the lone-example doubt are the incumbent's unchanged,
    so sets whose examples share many properties are endorsed more broadly than the
    profile share alone predicts.
- name: rule_ambiguity_parity_kept_doubt
  rationale: 'Refinement of the incumbent `rule_ambiguity_single_doubt` by one grafted
    component, taken from `parity_preserving_random_doubt`: when a lone example leaves
    people doubting that the program follows any rule (more often the more candidate
    rules the example fits), they do not answer completely flatly but keep the example''s
    parity as the one default constraint on a loosely patterned program, so their
    doubt-mode "yes" goes to targets of the example''s parity at the inferred flat
    rate and to opposite-parity targets at a discounted rate. Everything else is the
    incumbent unchanged, so lone examples differ in breadth both by how ambiguous
    they are and by whether they are asked about opposite-parity targets (the odd
    round lone examples 15, 55, 85, 95), the source of the n1_set_mean_variance discrepancy.'
- name: power_chain_generation
  rationale: 'When several examples are shown, people try to reconstruct how the program
    generated them step by step, and one operation they readily try is repeated multiplication:
    if every example lies on one chain of powers of a common base (4 and 64; 9 and
    81; 2, 8, 16), they read the program as "keep multiplying by the base" and take
    the other links of that chain (16 for 4, 64; 27 and 3 for 9, 81) as numbers it
    produces, giving that power pattern extra weight, by an inferred boost over its
    ordinary salience, that a shared final digit does not overshadow, because it describes
    how the numbers were made rather than how they look. Otherwise the judgment is
    that of the current best account (the salience-weighted share of the examples''
    shared profile, the in-span interval similarity, and the richness-dependent doubt
    on lone examples), so the missing links of a power chain are endorsed far more
    than the share of the examples'' surface profile alone predicts.'
- name: parity_bounded_ambiguity_doubt
  rationale: 'Refinement of `rule_ambiguity_doubt_all_sizes` by one grafted component,
    taken from `parity_preserving_random_doubt` and applied at every set size. When
    the examples fit so many candidate rules that people give up on rule-based judgment
    (whether one example or several are shown), they do not answer completely flatly:
    they keep the parity that all the examples share as the one default constraint
    on a loosely patterned program. Their fallback "yes" goes to targets of that parity
    at a flat rate and much less often to opposite-parity targets. So rule-ambiguous
    even sets such as 64, 4 or 96, 48 are endorsed broadly for even targets but not
    for odd ones, while rule-based judgment (the salience-weighted share of the shared
    profile with the interval similarity) is unchanged.'
- name: sequence_momentum_extrapolation
  rationale: 'People read the examples in the order shown as the program''s running
    output, and take the direction it was moving (the last example larger or smaller
    than the first) as where it is heading next. So when several examples are shown,
    they extend magnitude generalization further beyond the examples on the side the
    sequence was moving toward than on the side it came from: an ascending set like
    12, 47 is generalized to larger targets above it more readily than to equally
    distant targets below it, and a descending set the other way round. Lone examples
    have no direction, and the rest of the judgment (the salience-weighted share of
    the examples'' shared profile, with the in-span interval and the parity-keeping
    rule-ambiguity doubt) is that of the current best account.'
- name: log_number_line_similarity
  rationale: 'People judge how close a target is to the examples in magnitude on a
    compressed, logarithmic mental number line, where closeness is a matter of ratio
    rather than difference: 3 is far from 20, while 90 is close to 60. Everything
    else is the current best account unchanged (the salience-weighted share of the
    examples'' shared profile, with rule-ambiguity doubt that keeps the shared parity),
    but both magnitude similarities in it, the bell-shaped band around the examples''
    range and the exponential similarity to the interval between them, now fall off
    with the log-ratio distance from the nearest edge. So small targets below the
    examples are rejected much faster than large targets above them at the same numeric
    distance, and generalization upward from large examples is broad.'
- name: uncertainty_gated_default_answer
  rationale: 'People form their belief about whether the program produces the target
    exactly as the interval-similarity account says (the salience-weighted share of
    the examples'' shared property profile, including the stretch between the examples),
    but the decision rule depends on how sure that belief is: the closer the belief
    is to a toss-up, the more often they stop deliberating and fall back on a default
    answer, given at an inferred default "yes" rate, whereas clear-cut beliefs (a
    target that plainly fits or plainly breaks the pattern) are acted on directly.
    So targets of intermediate fit, which abound after a single example, are answered
    at a nearly uniform default rate regardless of their exact fit, while clearly
    fitting or clearly violating targets keep their sharp answers, unlike a fixed
    lapse that flattens every answer equally.'
- name: parity_doubt_three_example_memory
  rationale: "Refinement of the incumbent `parity_bounded_ambiguity_doubt` by one\
    \ grafted component, taken from `working_memory_three_example_limit`: people can\
    \ hold only three examples in mind, so when four are shown, on an inferred share\
    \ of trials one example has dropped out of memory and the whole judgment \u2014\
    \ the salience-weighted share of the shared profile, how many rules the examples\
    \ fit (and so how often people give up and answer flatly), and the parity kept\
    \ in that fallback \u2014 is made from the three remembered examples, averaged\
    \ over which one was lost. Because three examples share more coincidental properties\
    \ and fit more rules than four, four-example sets are judged against a richer\
    \ profile, so targets fitting the full set's profile are endorsed less, and sometimes\
    \ more broadly, than a reasoner using all four would; sets of one to three examples\
    \ are judged exactly as by the incumbent."
- name: working_memory_ambiguity_doubt
  rationale: 'Refinement of `working_memory_three_example_limit` by one grafted component,
    taken from `rule_ambiguity_doubt_all_sizes`: the doubt that makes people give
    up on rule-based judgment and answer at a flat rate is not limited to lone examples
    but operates at every set size, more often the more candidate rules all the examples
    fit together (its own base rate for multi-example sets). Everything else is the
    working-memory model unchanged: people hold at most three examples in mind, so
    on an inferred share of four-example trials one example has dropped out and the
    target is judged against the richer profile the remaining three share. So rule-ambiguous
    sets (64, 4) are endorsed broadly and flatly at any size, while four-example sets
    are generalized more narrowly than their full shared profile implies.'
- name: exception_tolerant_parity_doubt
  rationale: "Refinement of the incumbent `parity_bounded_ambiguity_doubt` by one\
    \ grafted component, taken from `single_exception_tolerance`: people allow that\
    \ one of the examples may be an odd one out (a slip or noise in the program's\
    \ output), so when three or four examples are shown, a property that every example\
    \ but one has (three of 12, 48, 36, 7 are even; two of 48, 63, 53 end in 3) is\
    \ still entertained as a possible rule, at an inferred fraction of the weight\
    \ it would carry if all examples shared it. Everything else is the incumbent unchanged\
    \ \u2014 the salience-weighted share of the shared profile with the interval similarity,\
    \ and rule-ambiguity doubt at every set size whose fallback \"yes\" keeps the\
    \ examples' shared parity \u2014 so on three- and four-example sets, targets carrying\
    \ an almost-shared property are endorsed more than the strictly shared profile\
    \ implies, while one- and two-example sets are judged exactly as before."
- name: common_step_grid_concept
  rationale: 'People''s space of candidate concepts includes a "common grid" concept
    the current models lack: when several examples are shown, they notice when every
    gap between the examples is a multiple of one step of 3 or more (7, 22, 37 all
    sit on a grid of step 15 starting at 7; 12, 48, 36 on a grid of step 12), even
    when the examples are unevenly spaced, and entertain "numbers on that grid, in
    either direction" as a candidate property. Its prior salience is an inferred multiple
    of the arithmetic-progression concept''s salience, and like other non-digit properties
    it is overshadowed by a visible shared final digit. Otherwise the judgment is
    that of the current best account, so targets lying on the examples'' common grid,
    inside or outside their range, are endorsed more than the strictly shared profile
    implies.'
- name: conjunctive_exemplar_similarity
  rationale: People do not infer a rule; they keep each example shown as a stored
    exemplar and ask whether the target resembles every one of them at once (a conjunctive,
    product-rule exemplar comparison). Similarity to each stored example falls off
    exponentially with the salience-weighted fraction of that example's own properties
    (parity, primality, squares/cubes, powers, multiples, round multiples of 5/10,
    final digit, contained digits) that the target lacks plus their distance in magnitude,
    and the similarities to the examples are multiplied together, so a single badly
    mismatched example vetoes the target while a property carried by every example
    counts fully and one carried by only some counts in proportion.
- name: output_dispersion_crowding_veto
  rationale: "People expect the program's outputs to be spread out over the number\
    \ line, the way they expect a random-looking generator not to repeat itself, so\
    \ a target lying right next to a number the program has already produced (within\
    \ a few units of an example, such as 43 after 42) seems an unlikely further output\
    \ and is vetoed on an inferred share of trials, a veto that fades quickly with\
    \ distance from the nearest example. Apart from this crowding veto, judgment is\
    \ that of the current best account (the salience-weighted share of the examples'\
    \ shared profile with the interval similarity, parity-keeping rule-ambiguity doubt,\
    \ and the three-example memory limit), so targets crowding an example \u2014 even\
    \ inside the examples' range \u2014 are endorsed less than equally fitting targets\
    \ a little further away."
- name: magnitude_bounded_ambiguity_doubt
  rationale: "Refinement of `exception_tolerant_parity_doubt` by one change to its\
    \ rule-ambiguity doubt: when several examples fit so many rules that people give\
    \ up on rule-based judgment, their fallback is not \"any number of the right parity\"\
    \ but \"numbers of the right parity around where the examples fall\" \u2014 the\
    \ loosely patterned program they then imagine keeps the examples' magnitude neighbourhood\
    \ as well as their shared parity, so the fallback \"yes\" fades smoothly (with\
    \ its own inferred width) with the target's distance below the smallest or above\
    \ the largest example. Everything else (exception-tolerant salience-weighted share\
    \ of the shared profile with interval similarity, and the lone-example doubt that\
    \ keeps only parity) is unchanged, so rule-ambiguous multi-example sets such as\
    \ 64, 4 or 96, 48 are endorsed broadly for same-parity targets near and between\
    \ the examples but much less for same-parity targets far beyond them."
- name: neighbourhood_doubt_three_example_memory
  rationale: 'Refinement of the incumbent `parity_doubt_three_example_memory` by one
    change to its rule-ambiguity doubt, taken from `magnitude_bounded_ambiguity_doubt`:
    when the several examples people hold in mind fit so many rules that they give
    up on rule-based judgment, the loosely patterned program they fall back on keeps
    the examples'' magnitude neighbourhood as well as their shared parity, so the
    fallback "yes" fades smoothly (with its own inferred width) with the target''s
    distance below the smallest or above the largest remembered example. Everything
    else is the incumbent unchanged (the three-example working-memory limit averaged
    over which example was lost, the salience-weighted share of the shared profile
    with the interval similarity, and lone-example doubt that keeps only parity),
    so rule-ambiguous multi-example sets such as 64, 4 or 96, 48 are endorsed broadly
    for same-parity targets near and between the examples but much less for same-parity
    targets far beyond them. (The one significant critique, a lower yes rate early
    in the session, depends on trial position, which a stimulus-only model cannot
    represent.)'
