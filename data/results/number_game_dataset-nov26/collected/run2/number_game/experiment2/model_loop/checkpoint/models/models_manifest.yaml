models:
- name: final_digit_overshadowing_overlap
  rationale: 'Refinement of `one_sided_magnitude_bound_overlap` by one change: a final
    digit that is visibly shared by all of several examples (e.g. 28, 98) overshadows
    every other shared property. People still say "yes" in proportion to the salience-weighted
    share of the examples'' shared profile that the target has, but when the examples
    visibly share a final digit, all the other shared properties (parity, multiples,
    contained digits, magnitude bounds, and so on) lose an inferred fraction of their
    salience. This disagrees most sharply with the incumbent on shared-final-digit
    sets: targets that keep the digit but break the other shared properties (28, 98
    -> 18, 38) are endorsed far more, and targets that fit the other properties but
    not the digit (28, 98 -> 14, 56) far less.'
- name: seed_multiple_salience_overlap
  rationale: 'People notice a relation between the examples themselves that the property-overlap
    models ignore: whether the smallest example divides every other example (7 and
    63, 9 and 81, 8 and 64). When it does, they read that smallest number as the program''s
    seed and take "multiples of the seed" as a salient property of the set, with its
    own salience. As in the overlap account, they still say "yes" in proportion to
    the salience-weighted share of the examples'' common properties that the target
    also has, so a multiple of the seed is endorsed even when it breaks other shared
    properties such as parity (e.g. 14 and 28 for 7, 63).'
- name: leaky_memory_example_elimination
  rationale: "People generalize like a weak-sampling Bayesian learner over salient\
    \ number properties (the incumbent's salience-weighted overlap, with a visible\
    \ shared final digit overshadowing other properties), but with one resource limit:\
    \ working memory for the examples fades, so each earlier example is only remembered\
    \ \u2014 and so only rules out the properties it lacks \u2014 with a probability\
    \ that falls with how many examples were shown after it. Properties of the most\
    \ recent example that an earlier, partly forgotten example contradicts therefore\
    \ keep some weight, so targets resembling the last-shown example (e.g. sharing\
    \ its final digit) are endorsed more than targets resembling the first."
- name: graded_consensus_feature_overlap
  rationale: 'Refinement of `final_digit_overshadowing_overlap` by one change: people
    judge a target by how much of the examples'' property profile it shares, but that
    profile is not limited to properties that *every* example has. Each property held
    by some of the examples enters with a weight that grows with the fraction of examples
    holding it, and how steeply that weight falls off is inferred. A property held
    by most examples (three of 69, 9, 39, 21 end in 9) or by half of them (13, 91
    end in 1 and 3) still pulls generalization toward targets that have it, rather
    than being ignored as it is when only unanimous properties count.'
- name: last_example_digit_recency_overlap
  rationale: 'Refinement of `final_digit_overshadowing_overlap` by one order-dependent
    change: people revise a running guess as they read the examples, and the final
    digit of the last example shown lingers in that guess as a candidate pattern ("ends
    in 2") even when the earlier examples do not all share it. They still say "yes"
    in proportion to the salience-weighted share of the examples'' shared profile
    that the target has, but that profile also contains "ends in the same digit as
    the last example", with a fraction of the final-digit salience. So the same examples
    in a different order are generalized differently: targets sharing the last-shown
    example''s final digit are endorsed more than targets sharing the first-shown
    example''s.'
- name: seed_multiple_digit_overshadowing
  rationale: Refinement of `final_digit_overshadowing_overlap` by one grafted component,
    taken from `seed_multiple_salience_overlap`. People still say "yes" in proportion
    to the salience-weighted share of the examples' shared property profile that the
    target also has, and a final digit visibly shared by several examples still overshadows
    every other shared property. The one change is that people also notice when the
    smallest example divides every other example (7 and 63, 8 and 64). They read that
    number as the program's seed and add "multiples of the seed" to the shared profile
    with its own salience, so multiples of the seed that break other shared properties
    such as parity (14 or 28 for 7, 63) are endorsed far more than the incumbent predicts.
- name: seed_multiple_digit_overshadowing_overlap
  rationale: 'Refinement of `final_digit_overshadowing_overlap` by one change, a component
    grafted from `seed_multiple_salience_overlap`: people also notice a relation between
    the examples themselves, namely whether the smallest example divides every other
    example (7, 63; 9, 81; 8, 64). When it does, "multiples of that seed number" joins
    the examples'' shared profile as a property with its own salience. Otherwise the
    judgment is unchanged: people say "yes" in proportion to the salience-weighted
    share of the shared profile the target has, and a final digit visibly shared by
    several examples still overshadows every other shared property, the seed property
    included. Compared with the incumbent, multiples of the seed that break other
    shared properties, such as 14 and 28 for the set 7, 63, are endorsed more.'
- name: seed_overshadowing_last_digit_recency
  rationale: 'Refinement of `seed_multiple_digit_overshadowing_overlap` by one grafted
    component, taken from `last_example_digit_recency_overlap`: people read the examples
    in order, and the final digit of the last example shown lingers in their guess
    as a candidate pattern ("ends in 1") even when the earlier examples do not share
    it. Otherwise the judgment is unchanged: "yes" follows the salience-weighted share
    of the examples'' shared profile the target has, with "multiples of the smallest
    example" in that profile when it divides all the others, and a final digit visibly
    shared by all examples overshadowing every other property. Compared with the seed-overshadowing
    model, targets that share the last-shown example''s final digit are endorsed more
    than targets that share the first-shown example''s, so the same examples in a
    different order are generalized differently.'
- name: graded_magnitude_band_overlap
  rationale: 'Refinement of `seed_overshadowing_last_digit_recency` by one change
    to its magnitude property. People do not treat "at least as large as the smallest
    example" and "no larger than the largest example" as all-or-none tests. They judge
    how close in magnitude the target is to the range the examples span, and that
    magnitude similarity falls off smoothly (a broad, bell-shaped gradient) with the
    target''s distance below the smallest or above the largest example. So a target
    just outside the examples keeps nearly full magnitude credit, and only far-away
    targets lose it. Everything else is unchanged: "yes" follows the salience-weighted
    share of the examples'' shared profile the target has, including the seed-multiple
    property, final-digit overshadowing and the lingering last-example digit. The
    main consequence is broader generalization from a single example, where every
    non-example target lies outside the examples'' "range".'
- name: gap_step_progression_overlap
  rationale: People's space of candidate concepts includes an arithmetic-progression
    concept that the current models lack. When the examples are evenly spaced (e.g.
    8 and 16, or 2 and 8), people entertain "start at the smallest example and keep
    adding the gap between the examples" (8, 16, 24, 32, ...; 2, 8, 14, 20, ...) as
    one more property of the set, with its own inferred prior salience. Otherwise
    they judge the target as before, by the salience-weighted share of the examples'
    shared property profile it has, so targets on the upward continuation of the progression
    are endorsed more even when they break other shared properties such as being a
    power of 2.
- name: single_example_leniency_overlap
  rationale: 'Refinement of `seed_overshadowing_last_digit_recency` by one change:
    when only a single example is shown, people know they cannot yet tell which of
    its properties the program cares about, so they adopt a more lenient criterion
    and lean toward "yes" for any target, beyond what the overlap with that example''s
    property profile alone implies. Everything else is unchanged (salience-weighted
    share of the examples'' shared profile, multiples of the seed, a visibly shared
    final digit overshadowing other properties, and the last example''s final digit
    lingering), so the change predicts higher endorsement of non-example targets for
    one-example sets than for sets of two to four examples, and no difference among
    the multi-example set sizes.'
- name: single_example_open_generalization
  rationale: 'Refinement of `seed_multiple_digit_overshadowing` by one change: when
    the program has shown only a single example, people see no evidence that it is
    restricted to any particular pattern, so they lean toward "yes" for every target,
    by an inferred amount, on top of the usual judgment. Otherwise the judgment is
    unchanged: "yes" follows the salience-weighted share of the examples'' shared
    property profile that the target has, a final digit visibly shared by several
    examples overshadows the other properties, and "multiples of the smallest example"
    joins the profile when it divides all the others. So non-example targets for one-example
    sets (e.g. 48 -> 18, 60, 72) are endorsed more than the same degree of profile
    match would earn after two or more examples. This addresses the critique that
    the best model under-generalizes from single examples.'
- name: inattentive_guessing_lapse
  rationale: 'People judge each target the way the current best account says: by the
    salience-weighted share of the examples'' shared property profile the target has.
    That profile includes multiples of the smallest example when it divides the others,
    a shared final digit that overshadows other properties, and the last example''s
    lingering final digit. The new claim is about the decision rule. On some fraction
    of trials, which the model infers, people do not consult that judgment at all
    and answer by guessing, saying "yes" at their own inferred guessing rate. This
    puts a floor under endorsement of targets that clearly do not fit and a ceiling
    under targets that clearly fit, and the same floor and ceiling apply to every
    set.'
- name: first_last_digit_anchoring
  rationale: 'Refinement of `seed_overshadowing_last_digit_recency` by one change:
    the final digit of the FIRST example shown also lingers as a candidate pattern
    ("ends in 3"), not only that of the last, because the first example anchors people''s
    initial guess before the later ones arrive (primacy alongside recency), with its
    own inferred salience. Otherwise the judgment is unchanged: "yes" follows the
    salience-weighted share of the examples'' shared profile the target has, with
    multiples of the seed, a visibly shared final digit overshadowing other properties,
    and the last example''s lingering digit. So on multi-example sets without a shared
    final digit, targets sharing the first-shown example''s final digit are endorsed
    more than targets sharing no example''s final digit, which the incumbent does
    not predict.'
- name: property_exemplar_similarity
  rationale: People do not infer a concept from the examples; they store each example
    shown as a separate exemplar, described by its mathematical properties (parity,
    primality, squares/cubes, powers, multiples, base-ten multiples, final digit,
    contained digits) and its magnitude, and judge a target by its average similarity
    to the stored examples. Similarity to each example falls off exponentially with
    the attention-weighted number of properties on which the target and that example
    differ plus their numerical distance, and the more similar the target is to the
    examples on average, the more likely a "yes". So every example counts equally
    whatever its position, a target sharing a property with only some examples (e.g.
    the first example's final digit) still gains, and a single example is generalized
    to numbers close in magnitude.
- name: coincidence_gated_pattern_belief
  rationale: 'People first ask whether the examples look patterned at all, or could
    be numbers the program produced at random. They decide this by coincidence detection:
    the more striking the agreement among the examples (several examples all falling
    in a small category such as "powers of 2" or "ends in 8"), the more sure they
    are that the program follows a rule. A single example, or several that share only
    broad properties, gives no such evidence, so people suspect the program produces
    almost any number and lean toward "yes" for every target. When they do believe
    in a rule, they judge the target as the current best account does, by the salience-weighted
    share of the examples'' shared property profile it has.'
- name: single_example_magnitude_neighborhood
  rationale: 'When the program has shown only a single example, that number''s magnitude
    itself becomes one of the candidate properties people consider ("numbers about
    this size"), and a target earns credit for it that falls off smoothly with its
    distance from the example, in both directions. Otherwise "yes" follows the salience-weighted
    share of the examples'' shared property profile the target has, as in the current
    best model (arithmetic-progression concept, seed multiples, final-digit overshadowing,
    the last example''s lingering digit). The disagreement with the best model lives
    in one-example sets: targets near the lone example, above or below it and even
    when they break its parity or digit properties, are endorsed more, and far targets
    above it are no longer favored just for passing the "at least as large" bound.'
- name: progression_graded_magnitude_band
  rationale: "Refinement of `gap_step_progression_overlap` by one change, grafted\
    \ from `graded_magnitude_band_overlap`: people do not treat \"at least as large\
    \ as the smallest example\" and \"no larger than the largest example\" as all-or-none\
    \ tests, but give a target magnitude credit that falls off smoothly (a bell-shaped\
    \ gradient of inferred width) with its distance below the smallest or above the\
    \ largest example. Everything else is unchanged \u2014 the salience-weighted share\
    \ of the examples' shared profile, including the \"start at the smallest and add\
    \ the gap\" progression concept, multiples of the seed, final-digit overshadowing\
    \ and the last example's lingering digit \u2014 so the change predicts broader,\
    \ distance-graded generalization from a single example (near targets endorsed\
    \ more than far ones), which the incumbent misses."
- name: progression_single_example_leniency
  rationale: 'Refinement of `gap_step_progression_overlap` by one change, grafted
    from `single_example_leniency_overlap`: when only a single example is shown, people
    know they cannot yet tell which of its properties the program cares about, so
    they adopt a more lenient criterion and lean toward "yes" for every target by
    an inferred amount, beyond what the overlap with that example''s property profile
    implies. Everything else is the incumbent''s judgment unchanged (salience-weighted
    share of the examples'' shared profile, including the arithmetic-progression concept
    for evenly spaced examples, multiples of the seed, final-digit overshadowing and
    the last example''s lingering digit), so non-example targets of one-example sets
    are endorsed more than after two or more examples, addressing the critique that
    the incumbent under-generalizes from a single example.'
- name: graded_band_first_digit_primacy
  rationale: 'Refinement of `graded_magnitude_band_overlap` by one grafted component,
    taken from `first_last_digit_anchoring`: the final digit of the FIRST example
    shown also lingers as a candidate pattern ("ends in 3"), with its own inferred
    salience, because the first example anchors people''s initial guess before the
    later examples arrive. Everything else is unchanged: "yes" follows the salience-weighted
    share of the examples'' shared profile the target has, with magnitude credit that
    falls off smoothly outside the examples'' range, multiples of the seed, a visibly
    shared final digit overshadowing other properties, and the last example''s lingering
    digit. So on multi-example sets without a shared final digit, targets sharing
    the first-shown example''s final digit are endorsed more than targets sharing
    no example''s final digit, while single-example sets still generalize broadly
    by magnitude.'
- name: first_impression_anchoring
  rationale: "People read the examples in order and form their first guess about the\
    \ program from the first example alone, entertaining every salient property it\
    \ has (its parity, the numbers it is a multiple of, its digits, its final digit).\
    \ Later examples should rule out the first example's properties they lack, but\
    \ people adjust insufficiently from this first impression: contradicted first-example\
    \ properties keep a fraction of their weight, so targets that share properties\
    \ with the first-shown example \u2014 not only its final digit \u2014 are endorsed\
    \ more than the examples' common profile alone implies, and the same examples\
    \ in a different order are generalized differently."
- name: specificity_weighted_overlap
  rationale: "People weigh each property the examples share the way a normative Bayesian\
    \ learner would, by the size principle \u2014 a property that picks out few numbers\
    \ (powers of 2, cubes, multiples of 11) is a more suspicious coincidence and so\
    \ counts for more than a broad one (odd, contains a 3) \u2014 but they apply it\
    \ only partially, discounting the narrowness of a property by an inferred power\
    \ below the normative one (a conservative mis-weighting of specificity). \"Yes\"\
    \ then follows the specificity-weighted share of the examples' shared property\
    \ profile the target has (with the current best account's progression, seed-multiple,\
    \ graded magnitude, overshadowing and lingering-digit properties), so a lone example\
    \ with narrow properties (64) is generalized more narrowly than a nondescript\
    \ one (37), making breadth vary from seed to seed."
- name: progression_band_first_digit_primacy
  rationale: 'Refinement of `progression_graded_magnitude_band` (the incumbent) by
    one grafted component, taken from `graded_band_first_digit_primacy`: when several
    examples are shown without a shared final digit, the final digit of the FIRST
    example also lingers as a candidate pattern ("ends in 3"), with its own inferred
    salience, because the first example anchors people''s initial guess before the
    later examples arrive. Everything else is the incumbent''s judgment unchanged
    (salience-weighted share of the examples'' shared profile, with the graded magnitude
    band, the "start at the smallest and add the gap" progression concept, multiples
    of the seed, final-digit overshadowing and the last example''s lingering digit),
    so targets sharing the first-shown example''s final digit are endorsed more than
    targets sharing no example''s final digit, closing the first_example_digit_lift
    critique the incumbent fails.'
- name: coincidence_gated_first_digit_primacy
  rationale: 'Refinement of `coincidence_gated_pattern_belief` by one grafted component,
    taken from `graded_band_first_digit_primacy`: when people believe the program
    follows a rule, the final digit of the FIRST example shown also lingers as a candidate
    pattern ("ends in 3"), with its own inferred salience, because the first example
    anchors their initial guess before the later examples arrive. Everything else
    is unchanged: people first judge from how striking the examples'' agreement is
    whether the program is patterned at all (a single example or broadly shared properties
    leave them suspecting it is random, so they lean toward "yes"), and otherwise
    say "yes" by the salience-weighted share of the examples'' shared profile the
    target has, the last example''s lingering digit included. So on multi-example
    sets without a shared final digit, targets sharing the first-shown example''s
    final digit are endorsed more than targets sharing no example''s final digit,
    which is the first_example_digit_lift discrepancy that the best model misses.'
- name: coincidence_tilted_overlap
  rationale: People weigh each pattern the examples share by how much of a coincidence
    that sharing would be. A pattern that covers few numbers (powers of 3, multiples
    of 11, squares, a narrow magnitude bound) carries more weight than a broad one
    (even, contains a 4), and this tilt toward the rarer patterns grows with each
    example beyond the first that confirms them. A single example therefore carries
    no coincidence at all. Otherwise "yes" follows the share of that weighted profile
    the target has, as in the current best account. So the more examples share a narrow
    pattern, the more firmly people reject targets that lack it, even when those targets
    keep the broad shared properties.
- name: progression_band_single_leniency
  rationale: "Refinement of the incumbent `progression_graded_magnitude_band` by one\
    \ grafted component, taken from `progression_single_example_leniency`: when only\
    \ a single example is shown, people know they cannot yet tell which of its properties\
    \ the program cares about, so they adopt a more lenient criterion and lean toward\
    \ \"yes\" for every target by an inferred amount, beyond what the overlap with\
    \ that example's profile implies. Everything else is the incumbent unchanged (salience-weighted\
    \ share of the examples' shared profile, with magnitude credit falling off smoothly\
    \ outside the examples' range, the \"start at the smallest and add the gap\" progression\
    \ concept, seed multiples, final-digit overshadowing and the last example's lingering\
    \ digit), so the graded band shapes which targets a lone example generalizes to\
    \ while the leniency raises how often people say yes to them at all \u2014 non-example\
    \ targets of one-example sets are endorsed more than the band alone predicts,\
    \ with no change for sets of two to four examples."
- name: undiluted_magnitude_range_dimension
  rationale: 'People judge magnitude separately from the examples'' mathematical properties:
    whether the target falls within the range the examples span (with credit fading
    smoothly with its distance below the smallest or above the largest example) is
    a dimension of its own that pushes the decision directly, not one property diluted
    among however many properties the examples happen to share. So a target inside
    the examples'' range that shares none of their parity, digit or multiple properties
    is still endorsed clearly more than an equally unrelated target outside the range,
    even for sets with rich shared profiles, while the rest of the judgment (the salience-weighted
    share of the shared profile, with progression, seed multiples, final-digit overshadowing
    and the first and last examples'' lingering digits) is that of the best model.'
- name: incremental_band_narrowing
  rationale: People read the examples one at a time and keep a running guess about
    how widely the program's numbers spread in magnitude. After a single example the
    guess is broad, but each additional example revises it and tightens how far beyond
    the examples' range they are willing to generalize. So targets outside the range
    lose endorsement faster with distance the more examples have been shown, while
    targets inside the range keep full magnitude credit, and the rest of the judgment
    (the salience-weighted share of the examples' shared properties) is unchanged.
- name: span_interval_similarity
  rationale: 'When two or more examples are shown, people also treat the stretch of
    the number line between the smallest and largest example as a candidate concept
    in its own right ("numbers in this range"), and a target earns credit for it by
    its similarity to that interval: full credit anywhere inside it, decaying exponentially
    (Shepard''s generalization gradient, at an inferred and fairly steep rate) with
    the target''s distance outside it. This interval similarity enters, with its own
    salience, the salience-weighted share of the examples'' shared profile that drives
    "yes" in the current best account, so targets lying between the examples are endorsed
    more than equally nondescript targets outside them, even when they share no digit,
    parity or seed-multiple with the examples.'
- name: range_tightened_magnitude_band
  rationale: 'Refinement of `progression_band_first_digit_primacy` (the incumbent)
    by one change to its graded magnitude band: the band''s width depends on whether
    the examples mark out a range. A single example gives no range, so magnitude credit
    falls off broadly around it, but once two or more examples are shown people take
    the span they cover as the program''s range, and magnitude credit falls off more
    steeply (by an inferred fraction of the single-example width) below the smallest
    and above the largest example. Everything else is the incumbent unchanged, so
    in multi-example sets targets inside the examples'' range that share no other
    property are endorsed more than targets outside it (the inrange_nonshared_rate
    critique), while single-example sets still generalize broadly.'
- name: span_sharpened_magnitude_band
  rationale: 'Refinement of the incumbent `progression_band_first_digit_primacy` by
    one change to its graded magnitude band: how sharply magnitude credit falls off
    outside the examples depends on whether the examples mark out a span. A lone example
    gives no edges, so people generalize by magnitude broadly; once two or more examples
    are shown, their smallest and largest values become real boundaries, and credit
    falls off much more steeply (its own inferred width) beyond them. Everything else
    is the incumbent unchanged, so in multi-example sets, targets inside the examples''
    range that share nothing else with them are endorsed more than equally nondescript
    targets outside it, closing the inrange_nonshared_rate critique, while single-example
    generalization stays broad.'
- name: first_impression_span_interior
  rationale: 'Refinement of `first_impression_anchoring` by one change: when two or
    more examples are shown, people also take "a number lying between the smallest
    and the largest example" as a candidate property of the program (the range the
    examples fill in), with its own inferred salience, overshadowed like the other
    non-digit properties by a visible shared final digit. Everything else is unchanged
    (the first impression''s contradicted properties keep a fraction of their weight,
    graded magnitude band, progression concept, seed multiples, the last example''s
    lingering digit), so on multi-example sets targets strictly inside the examples''
    range are endorsed more than targets just outside it even when they share no digit,
    parity or seed-multiple with the examples, closing the inrange_nonshared_rate
    critique.'
