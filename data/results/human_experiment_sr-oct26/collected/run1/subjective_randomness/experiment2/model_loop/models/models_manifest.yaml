models:
- name: personal_decisiveness_mirror_streak_lapse
  rationale: "Refinement of the incumbent `mirror_symmetry_streak_aversion_lapse`:\
    \ each person still judges a sequence as more random the closer its alternation\
    \ rate lies to their own ideal switching rate, still penalises lopsided heads/tails\
    \ counts and the longest streak by weights of their own, still weighs the final\
    \ streak and mirror symmetry by shared weights, and still guesses on some trials\
    \ at a personal lapse rate. The one change is that people differ in how decisively\
    \ they act on their impression: each person has their own overall decisiveness\
    \ (drawn from a population centred on the typical person) that sharpens or flattens\
    \ every comparison they make, so some people consistently pick the more random-looking\
    \ sequence while others, though not guessing, follow their impression only weakly\
    \ \u2014 addressing the critique that participants differ in how often they agree\
    \ with the majority choice more than the incumbent's person-level weights and\
    \ lapse rates produce."
- name: run_length_variety_preference
  rationale: 'People judge randomness partly by the variety of a sequence''s runs:
    a sequence whose runs of identical flips all have the same length (HTHTHTHT, HHTTHHTT,
    HHHTTTHH) has a regular, rhythmic run structure that looks designed, while one
    mixing runs of different lengths (HTTHHHTH) looks irregular and so random, by
    a shared weight on the number of distinct run lengths (relative to the most its
    length allows). This sits on top of the current best judgement (each person''s
    own ideal switching rate and sensitivity to it, personal weights on heads/tails
    imbalance and the longest streak, shared weights on the final streak and on mirror
    symmetry, and a personal guessing rate) and addresses the critique (surviving
    FDR) that among pairs matched on alternation rate people choose the sequence with
    more distinct run lengths more often than the best model predicts.'
- name: asymmetric_ideal_alternation_mirror
  rationale: "Refinement of the incumbent `individual_alternation_sensitivity_mirror`:\
    \ each person still judges a sequence as more random the closer its alternation\
    \ rate lies to their own ideal switching rate (with their own sensitivity), still\
    \ penalises lopsided heads/tails counts and the longest streak by weights of their\
    \ own, still weighs the final streak and mirror symmetry by shared weights, and\
    \ still guesses on some trials at a personal lapse rate. The one change is that\
    \ the tolerance around the ideal is asymmetric: switching more often than one's\
    \ ideal (over-alternation) counts against a sequence by a different, shared fraction\
    \ of the penalty for switching less often (streakiness), so people can be far\
    \ more lenient toward too much alternation than toward too little \u2014 addressing\
    \ the critique (surviving FDR) that among two highly alternating sequences people\
    \ choose the more alternating one more often than the incumbent's symmetric quadratic\
    \ ideal-rate penalty predicts."
- name: most_lopsided_stretch_aversion
  rationale: "People notice the single most lopsided stretch of a sequence \u2014\
    \ the contiguous run of flips in which heads most outnumber tails (or tails most\
    \ outnumber heads), even when it is not one unbroken streak (HHTHH is a three-heads\
    \ excess) \u2014 and that one striking local excess makes the sequence look less\
    \ random by a shared weight. This sits on top of the current best judgement (each\
    \ person's own ideal switching rate and sensitivity to it, personal weights on\
    \ overall heads/tails imbalance and the longest streak, shared weights on the\
    \ final streak, mirror symmetry and run-length variety, and a personal guessing\
    \ rate); because a strictly alternating sequence never builds a local excess beyond\
    \ one flip while a slightly less alternating one with a repeat or two clustered\
    \ together does, it predicts that among two highly alternating sequences people\
    \ choose the more alternating one more often than the best model does (the critique's\
    \ high-alternation discrepancy)."
- name: block_rhythm_regularity
  rationale: "Refinement of the incumbent `run_length_variety_preference`: people\
    \ still see a sequence made of runs that all share one length as rhythmic and\
    \ designed, but the rhythm they notice is one of repeated blocks of identical\
    \ flips (HHTTHHTT, HHHTTTHH) \u2014 the penalty is the lack of run-length variety\
    \ scaled by the share of flips that sit in runs of two or more \u2014 so strict\
    \ alternation (HTHTHTHT, every run a single flip) is no longer counted as a designed\
    \ rhythm and is judged only against each person's own ideal switching rate. Everything\
    \ else is the incumbent's judgement (personal ideal switching rate and sensitivity,\
    \ personal weights on heads/tails imbalance and the longest streak, shared weights\
    \ on the final streak and mirror symmetry, a personal guessing rate); the one\
    \ change addresses the critique that among two highly alternating sequences people\
    \ choose the more alternating one more often than the incumbent predicts, which\
    \ its variety term (zero variety for strict alternation) pushes against."
- name: run_variety_asymmetric_ideal_rate
  rationale: "Refinement of the incumbent `run_length_variety_preference`: people\
    \ still judge a sequence as more random when its runs of identical flips come\
    \ in varied lengths rather than one repeated length, still compare its alternation\
    \ rate with their own ideal switching rate (with their own sensitivity), still\
    \ penalise heads/tails imbalance and the longest streak by personal weights, still\
    \ weigh the final streak and mirror symmetry by shared weights, and still guess\
    \ at a personal lapse rate. The one change is that departures from one's ideal\
    \ switching rate are judged asymmetrically: switching more often than the ideal\
    \ counts against a sequence by a shared fraction (fitted, possibly far below one)\
    \ of what the same shortfall in switching (streakiness) costs \u2014 addressing\
    \ the critique that among two highly alternating sequences people choose the more\
    \ alternating one more often than the incumbent's symmetric quadratic ideal-rate\
    \ penalty predicts."
- name: alignment_sharpened_comparison
  rationale: "People do not judge the two sequences one at a time: they lay them side\
    \ by side and look for where they differ, so how decisively the difference in\
    \ randomness drives the choice depends on how alignable the pair is. When the\
    \ two sequences match flip for flip except in a few places (allowing heads and\
    \ tails to be swapped), the differences that make one look less random stand out\
    \ and the choice follows them sharply; when the two share little, there is no\
    \ common frame and the same difference in apparent randomness decides the choice\
    \ only weakly \u2014 so the same sequence is chosen at different rates beside\
    \ a similar partner than beside a dissimilar one. Each sequence's randomness is\
    \ still judged as in the current best model (personal ideal switching rate and\
    \ sensitivity, personal weights on imbalance and the longest streak, shared weights\
    \ on the final streak, mirror symmetry and run-length variety, and a personal\
    \ guessing rate)."
- name: length_scaled_run_variety_load
  rationale: "Refinement of `length_load_encoding_noise` (rank 2): to compare two\
    \ sequences people must hold both in working memory, and the number of flips changes\
    \ how sharply the difference in apparent randomness decides the choice (a power\
    \ of sequence length, by a shared fitted exponent: noise that grows with length,\
    \ or evidence that accumulates with it); the impression itself is still each person's\
    \ own ideal switching rate and sensitivity to it, personal weights on heads/tails\
    \ imbalance and the longest streak, shared weights on the final streak and mirror\
    \ symmetry, and people still guess on some trials at a personal lapse rate. The\
    \ one change is grafting in the incumbent's run-length variety: a sequence whose\
    \ runs of identical flips all share one length (HTHTHTHT, HHTTHHTT) looks rhythmic\
    \ and designed, while one mixing runs of different lengths looks random, by a\
    \ shared weight on the number of distinct run lengths relative to the most its\
    \ length allows \u2014 so the length-dependent decisiveness is estimated on top\
    \ of the best current impression, predicting that the incumbent's variety and\
    \ alternation effects are weaker for short pairs and stronger for long ones than\
    \ a length-blind comparison implies."
