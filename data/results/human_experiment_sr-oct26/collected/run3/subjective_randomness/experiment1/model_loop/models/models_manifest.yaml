models:
- name: mismatch_noise_paired_comparison
  rationale: "People do not evaluate each sequence on its own and then compare two\
    \ independent impressions; they compare the two sequences flip against flip, so\
    \ positions where the two show the same outcome cancel out and only the mismatching\
    \ positions carry evidence \u2014 and also noise \u2014 into the judgment. Each\
    \ sequence's randomness evidence is the Bayesian \"fair coin (believed to over-alternate)\
    \ versus regular generator\" score, but the noise in comparing them grows with\
    \ the number of positions at which the two sequences differ, so the same difference\
    \ in randomness is judged decisively beside a near-identical partner (and on short\
    \ pairs) and hesitantly beside a very different one."
- name: bayesian_chance_vs_repeating_motif
  rationale: "Refinement of the incumbent `bayesian_overalternating_chance_model`:\
    \ people still judge a sequence random to the extent their (over-alternating)\
    \ model of a fair coin explains it better than the regular generators, with every\
    \ generator's unknowns averaged out normatively. The single change is one more\
    \ regular generator in the comparison \u2014 a \"repeating-pattern\" generator\
    \ that picks a short motif (one to four flips) and repeats it \u2014 given a fitted\
    \ share of the prior on regularity; so exactly periodic sequences (perfect alternation\
    \ HTHT\u2026, but also HHTHHT\u2026, HHTTHHTT\u2026) are recognised as patterns\
    \ and condemned, addressing the critique that the incumbent over-credits perfect\
    \ alternation and under-penalises period-3/4 motifs."
- name: bayesian_chance_vs_repeating_motif_2
  rationale: "Refinement of the incumbent `bayesian_overalternating_chance_model`:\
    \ people still judge a sequence random to the extent a fair coin (which they believe\
    \ over-alternates) explains it better than a \"regular\" generator, with the regular\
    \ generators' unknowns averaged out normatively. The single change is one more\
    \ regular generator in their hypothesis space: a \"repeating motif\" process that\
    \ writes a short pattern (one to four flips long, e.g. H, HT, HHT, HHTT) and keeps\
    \ copying it with an occasional slip (a fitted slip rate), so sequences that are\
    \ near-repetitions of a short motif \u2014 perfect alternation and period-3/4\
    \ patterns above all \u2014 are explained as regular and look less random, addressing\
    \ the critique that the incumbent under-penalises perfect alternation and periodic\
    \ motifs."
- name: gist_tail_probability_test
  rationale: "People judge randomness like an intuitive significance test on a sequence's\
    \ gist rather than by comparing explanations: they summarise each sequence by\
    \ its head count, its number of switches and its longest run, and ask how often\
    \ a fair coin (which they believe switches somewhat more than half the time) would\
    \ produce a gist at least as rare as this one. A sequence looks random to the\
    \ extent that this tail probability is high \u2014 a typical gist is unremarkable,\
    \ while a rare gist (a lopsided count, a long streak, or too-perfect alternation)\
    \ \"rejects chance\" \u2014 and people differ in how decisively this felt surprise\
    \ drives their choice."
- name: length_normalised_chance_vs_motif
  rationale: "Refinement of the incumbent `bayesian_chance_vs_repeating_motif_2`:\
    \ people still judge a sequence random to the extent their (over-alternating)\
    \ model of a fair coin explains it better than the regular generators (a switch-biased\
    \ Markov coin, a biased coin, and a repeating short motif with occasional slips),\
    \ with the generators' unknowns averaged out. The single change is in how that\
    \ evidence is weighed: people judge the evidence per flip rather than in total,\
    \ so the log evidence difference is divided by a fitted power of the sequence\
    \ length \u2014 the same per-flip regularity is judged about as decisively in\
    \ a short pair as in a long one, instead of long sequences automatically yielding\
    \ near-certain choices \u2014 addressing the critique that people are more decisive\
    \ on short pairs (relative to long) than the incumbent predicts and that it over-penalises\
    \ long perfect alternation."
- name: mismatch_noise_repeating_motif
  rationale: 'Refinement of `mismatch_noise_paired_comparison`: people still compare
    the two sequences flip against flip, so matching positions cancel and the noise
    in the comparison grows with the number of positions at which the two sequences
    differ (making short and near-identical pairs judged more decisively), and each
    sequence''s evidence is still the Bayesian "fair coin believed to over-alternate
    versus a regular generator" score. The single change is to the regular generators
    people entertain: besides a switch-biased and a heads-biased coin, they also consider
    a repeating-motif process that copies a short pattern (one to four flips) with
    an occasional slip, so near-periodic sequences such as perfect alternation or
    HHT-HHT are recognised as regular and look less random.'
- name: bayesian_chance_vs_motif_beta_trick_coin
  rationale: "Refinement of the incumbent `bayesian_chance_vs_repeating_motif_2`:\
    \ people still judge a sequence random to the extent their (over-alternating)\
    \ model of a fair coin explains it better than the regular generators (a switch-biased\
    \ Markov coin, a biased coin, and a repeating short motif with occasional slips),\
    \ with each generator's unknowns averaged out. The single change is in what people\
    \ imagine a \"biased coin\" to be: instead of a uniform prior over its heads rate,\
    \ they hold a symmetric prior of fitted concentration \u2014 imagining either\
    \ only grossly lopsided trick coins or mildly biased ones \u2014 which sets how\
    \ much a modest heads/tails imbalance counts as evidence against chance, addressing\
    \ the critique that people weight heads/tails balance more than the incumbent's\
    \ biased-coin generator implies among sequences with similar switch counts."
- name: hot_hand_only_suspicion
  rationale: "People judge a sequence random to the extent a plain fair coin explains\
    \ it better than the only kinds of \"non-random\" coin they ever suspect \u2014\
    \ a hot-hand (streaky) coin that tends to repeat its last outcome by an unknown\
    \ amount, or a coin biased towards heads or tails by an unknown amount \u2014\
    \ with those unknowns averaged out and the evidence weighed per flip. Switching\
    \ is never suspicious in itself, so perfect alternation and period-3/4 patterns\
    \ count as maximally random: this is where the model disagrees most sharply with\
    \ the current best model, which condemns them as repeating motifs, while among\
    \ sequences with similar switch counts it still condemns streaks and heads/tails\
    \ imbalance."
