models:
- name: chance_face_bias_motif_suspicion
  rationale: "Refinement of the incumbent `person_specific_motif_suspicion`: people\
    \ still judge a sequence random to the extent their own model of a fair coin (with\
    \ a person-specific belief about how often it switches) explains it better than\
    \ the regular generators (a switch-biased Markov coin, a biased coin, and a repeating\
    \ short motif with occasional slips, with each person's own readiness to suspect\
    \ a motif), the evidence weighed per flip by a fitted power of length. The single\
    \ change is that people's model of a fair coin is not label-symmetric: they believe\
    \ a fair coin lands on one face (fitted; the data suggest tails) slightly more\
    \ often than the other, so among otherwise similar sequences the one leaning towards\
    \ that face is better explained by chance and looks more random \u2014 addressing\
    \ the critique (surviving FDR) that people choose the head-heavier sequence less\
    \ often than the symmetric incumbent predicts."
- name: second_order_chance_motif_suspicion
  rationale: "Refinement of the incumbent `person_specific_motif_suspicion`: people\
    \ still judge a sequence random to the extent their own model of a fair coin (with\
    \ a person-specific believed switch rate) explains it better than the regular\
    \ generators (a switch-biased Markov coin, a biased coin, and a repeating short\
    \ motif with occasional slips, with each person's own suspicion of motifs), the\
    \ generators' unknowns averaged out and the evidence weighed per flip by a fitted\
    \ power of length. The single change is that people's model of a fair coin is\
    \ second-order: right after a switch they expect a further switch to be less (or\
    \ more) likely than usual, by a shared fitted amount, so a sequence that keeps\
    \ switching flip after flip is improbable under \"chance\" beyond what its total\
    \ switch count implies \u2014 addressing the critique that among already highly\
    \ alternating sequences people prefer still more switches less than the incumbent\
    \ predicts."
- name: face_biased_second_order_motif
  rationale: "Refinement of the incumbent `second_order_chance_motif_suspicion`: people\
    \ still judge a sequence random to the extent their own second-order model of\
    \ a fair coin (a person-specific believed switch rate, shifted right after a switch\
    \ by a shared fitted amount) explains it better than the regular generators (a\
    \ switch-biased Markov coin, a biased coin, and a repeating short motif with slips,\
    \ with each person's own suspicion of motifs), the evidence weighed per flip by\
    \ a fitted power of length. The single change, grafted from `chance_face_bias_motif_suspicion`,\
    \ is that this imagined fair coin is also not label-symmetric: people believe\
    \ it lands on one face (fitted; the data suggest tails) slightly more often, so\
    \ among otherwise similar sequences the one leaning towards that face is better\
    \ explained by chance and looks more random \u2014 addressing the FDR-surviving\
    \ critique that people choose the head-heavier sequence less often than the H/T-symmetric\
    \ incumbent predicts."
- name: second_order_motif_side_habit
  rationale: "Refinement of the incumbent `second_order_chance_motif_suspicion`: people\
    \ still judge a sequence random to the extent their own second-order model of\
    \ a fair coin (a person-specific believed switch rate, and a shared shift in how\
    \ likely a switch is right after a switch) explains it better than the regular\
    \ generators (a switch-biased Markov coin, a biased coin, and a repeating short\
    \ motif with slips, with each person's own suspicion of motifs), the evidence\
    \ weighed per flip by a fitted power of length. The single change, taken from\
    \ `person_side_habit_switch_belief`, is that each person also has their own habitual\
    \ leaning towards the Left or the Right button, drawn from a population, which\
    \ adds to the randomness evidence before the choice, so when the two sequences\
    \ look about equally random a person's side habit decides \u2014 addressing the\
    \ FDR-surviving critique that participants' proportions of Left choices vary more\
    \ across people than the incumbent produces."
- name: face_bias_motif_side_habit
  rationale: "Refinement of `chance_face_bias_motif_suspicion`: people still judge\
    \ a sequence random to the extent their own model of a fair coin \u2014 with a\
    \ person-specific believed switch rate and a shared belief that one face (fitted;\
    \ the data suggest tails) comes up slightly more often \u2014 explains it better\
    \ than the regular generators (a switch-biased Markov coin, a biased coin, and\
    \ a repeating short motif with slips, with each person's own readiness to suspect\
    \ a motif), the evidence weighed per flip by a fitted power of length. The single\
    \ change, grafted from `person_side_habit_switch_belief`, is that each person\
    \ also has their own habitual leaning towards the Left or Right button, drawn\
    \ from a population, which adds to the randomness evidence before the choice,\
    \ so when the two sequences look about equally random a person's side habit decides\
    \ \u2014 addressing the FDR-surviving critique that participants' proportions\
    \ of Left choices vary more across people than the face-bias/second-order models\
    \ produce, while keeping the tail-favouring chance coin that addresses the other\
    \ FDR-surviving critique (people choose the head-heavier sequence less often than\
    \ a symmetric model predicts)."
- name: heads_rigged_second_order_side_habit
  rationale: "Refinement of the incumbent `second_order_motif_side_habit`: people\
    \ still judge a sequence random to the extent their own second-order model of\
    \ a fair coin (a person-specific believed switch rate, shifted right after a switch\
    \ by a shared amount) explains it better than the regular generators they suspect\
    \ (a switch-biased Markov coin, a trick coin, and a repeating short motif with\
    \ slips, with each person's own suspicion of motifs), the evidence weighed per\
    \ flip by a fitted power of length and each person's side habit deciding near-ties.\
    \ The single change, taken from `heads_rigged_coin_suspicion`, is that the trick\
    \ coin people imagine is not symmetric: they suspect coins rigged towards heads\
    \ more than coins rigged towards tails (fitted direction and strength), so a surplus\
    \ of heads is more readily explained away as rigging than an equal surplus of\
    \ tails, and head-heavy sequences look less random than their tail-heavy mirrors\
    \ \u2014 most strongly for lopsided sequences \u2014 addressing the FDR-surviving\
    \ critique that people choose the head-heavier sequence less often than the H/T-symmetric\
    \ incumbent predicts."
- name: face_specific_streak_chance_coin
  rationale: "Refinement of `face_biased_second_order_motif`: people still judge a\
    \ sequence random to the extent their own second-order model of a fair coin (a\
    \ person-specific believed switch rate, shifted right after a switch by a shared\
    \ amount) explains it better than the regular generators (a switch-biased Markov\
    \ coin, a biased coin, and a repeating short motif with slips, with each person's\
    \ own suspicion of motifs), the evidence weighed per flip by a fitted power of\
    \ length. The single change is where the coin's label asymmetry lives: instead\
    \ of believing a fair coin lands on tails more often overall, people believe chance\
    \ repeats one face more readily than the other (fitted; the data suggest a run\
    \ of tails is more expected of chance than an equally long run of heads), so a\
    \ heads-heads repeat is stronger evidence against chance than a tails-tails repeat\
    \ \u2014 locating the FDR-surviving critique (people choose the head-heavier sequence\
    \ less often than a symmetric model predicts) in streaks of heads rather than\
    \ in the head count itself."
- name: gamblers_run_second_order_side_habit
  rationale: "Refinement of the incumbent `second_order_motif_side_habit`: people\
    \ still judge a sequence random to the extent their own second-order model of\
    \ a fair coin (a person-specific believed switch rate, shifted right after a switch\
    \ by a shared amount) explains it better than the regular generators (a switch-biased\
    \ Markov coin, a biased coin, and a repeating short motif with slips, with each\
    \ person's own suspicion of motifs), the evidence weighed per flip by a fitted\
    \ power of length and each person's side habit deciding near-ties. The single\
    \ change, taken from the narrowly retired `run_length_gamblers_chance_vs_motif`,\
    \ is that their model of chance also holds a gambler's fallacy: the longer the\
    \ current run has lasted beyond two flips, the more they expect a fair coin to\
    \ switch (a shared fitted rise per extra flip), so a long streak looks improbable\
    \ under chance roughly quadratically in its length \u2014 far beyond what its\
    \ switch count and the after-switch belief imply \u2014 while the same switches\
    \ spread over short runs do not."
