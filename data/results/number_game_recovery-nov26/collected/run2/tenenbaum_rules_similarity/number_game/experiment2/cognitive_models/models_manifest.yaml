models:
- name: no_digit_containment_span_concepts
  rationale: 'People do the same Bayesian concept learning as the current best model
    (arithmetic and final-digit rules plus multiples of 13-50, rule runs confined
    to a stretch of the number line, ranges of a typical width, an inferred share
    of random examples, examples drawn without replacement), except that they never
    entertain "contains the digit d" concepts: a digit that merely appears somewhere
    in the written numbers (such as a shared tens digit) is not noticed as a pattern.
    This simpler concept space predicts that near targets get no extra "yes" for sharing
    an example''s decade and that sets like 8, 80, 48 do not generalise to other numbers
    containing an 8.'
