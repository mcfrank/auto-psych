models:
- name: heading_weber_with_upward_counting
  rationale: 'Refinement of the incumbent `heading_extrapolation_weber_width`. People
    do Bayesian concept learning over the same arithmetic, digit and digit-sum rules
    and every numeric range of 1-100. They read the examples as distinct draws with
    some strays, sometimes guess, judge a range''s breadth Weber-like (relative to
    its magnitude), and let the direction of the last step stretch the ranges toward
    where the sequence is heading.


    The one change, the component taken from `upward_room_range_prior`, is a counting
    habit that does not depend on order. Whatever order the examples came in, people
    expect the program''s numbers to carry on upward past the largest example, so
    they credit a candidate range by how far it reaches above the examples (strength
    inferred). This predicts more "yes" to numbers a little above a cluster than below
    it even for single examples and for sets whose last step points down (e.g. 67
    versus 57 after 64, 62, 60), on top of the order-dependent heading effect.'
- name: rule_breadth_heading_upward_counting
  rationale: 'Refinement of the incumbent `heading_weber_with_upward_counting`. People
    do Bayesian concept learning over the same arithmetic, digit and digit-sum rules
    and every numeric range. They read the examples as distinct draws with some strays,
    sometimes guess, judge a range''s breadth relative to its magnitude, stretch ranges
    toward where the sequence is heading, and expect the numbers to carry on upward
    past the largest example. The one change, the component taken from `rule_breadth_prior_concepts`,
    is that the arithmetic and digit rules do not share an equal prior: before seeing
    any examples, people find a rule more (or less) plausible as a power of how many
    numbers it contains, with the strength and direction inferred (the data suggest
    a slight preference for broad rules). This predicts that broad rules such as "even
    numbers" or "contains a 3" take a different share of the "yes" answers to their
    members than the incumbent gives them, compared with narrow rules such as "powers
    of 4", while range generalization is unchanged.'
- name: heading_weber_upward_with_replacement
  rationale: 'Refinement of the incumbent `heading_weber_with_upward_counting`: people
    do Bayesian concept learning over the same arithmetic, digit and digit-sum rules
    and every numeric range of 1-100. They allow some strays, sometimes guess, judge
    a range''s breadth Weber-like, let the last step''s direction stretch ranges toward
    where the sequence is heading, and expect the program''s numbers to carry on upward
    past the largest example. The one change is the sampling assumption. People do
    not assume the program avoids repeating itself, so they read each example as an
    independent draw from the concept''s members (with replacement), not as a draw
    from the members not yet shown. This predicts that examples that nearly use up
    a small rule or a short range (e.g. 1, 8, 27 for cubes, or 60, 61, 62, 63 for
    a four-number stretch) make that concept no more credible than the plain size
    principle implies, so people say "yes" more often to members of broader rules
    and ranges after such sets than the incumbent predicts.'
- name: position_decaying_example_evidence
  rationale: 'People read the examples one after another and build a running guess
    about the program, but each example revises that guess by a steadily changing
    amount: the evidence an example carries shrinks (or grows) by a constant factor
    with each step down the sequence, with the factor inferred, so the total weight
    of the evidence is not fixed but depends on how many examples came before. Otherwise
    they do plain Bayesian concept learning over arithmetic, digit and digit-sum rules
    and every numeric range of 1-100 (equally plausible ranges, independent draws
    with some strays, occasional guessing). This predicts that a later example narrows
    generalization less than a full-weight learner expects when evidence fades (for
    example, a fourth example after 31, 3, 1), and that the same numbers shown in
    a different order generalize toward the concepts favoured by whichever examples
    came first.'
- name: set_size_scaled_evidence_weight
  rationale: 'Refinement of the incumbent `heading_weber_upward_with_replacement`:
    people do the same Bayesian concept learning over arithmetic, digit and digit-sum
    rules and every numeric range of 1-100. They read the examples as independent
    draws with some strays, sometimes guess, judge a range''s breadth Weber-like,
    stretch ranges toward the heading and expect the numbers to carry on upward past
    the largest example. The one change is how much weight people give the evidence
    as a set grows: the weight per example is not fixed but rises or falls as a power
    of how many examples were shown, with strength and direction inferred. So a single
    example is judged as before, while bigger sets sharpen belief toward narrow rules
    and tight ranges by more (or by less) than an ideal learner would. This predicts
    that adding a fourth example to a set changes how far "yes" spreads by a different
    amount than the incumbent predicts (e.g. 31, 3, 1 compared with 31, 3, 1, 15).'
- name: offset_progression_concepts
  rationale: Alongside the arithmetic, digit and digit-sum rules and the numeric ranges
    of the best model, people entertain arithmetic progressions that run with an offset
    through the whole number line, "numbers that are r more than a multiple of m"
    (e.g. 2, 7, 12, 17, ... or 1, 4, 7, 10, ...) for steps of 3 to 12. All of these
    progressions are equally likely a priori, and the family as a whole takes an inferred
    share of the prior belief given to rules; otherwise learning is as in the best
    model (size principle with some strays, position-decaying example evidence, occasional
    guessing). This predicts that examples sharing a remainder (e.g. 4, 16, 28 or
    17, 32, 47) draw "yes" to other numbers with that remainder spread across the
    whole line (40, 52, 88 or 2, 62, 92), beyond what "even numbers", "ends in d"
    or a range gives.
- name: span_filling_example_evidence
  rationale: 'Refinement of `position_decaying_example_evidence`: people read the
    examples one after another and do the same Bayesian concept learning (arithmetic,
    digit and digit-sum rules and every numeric range, independent draws with some
    strays, occasional guessing), with each later example''s evidence changing by
    a constant factor per position. The one change is that how much an example revises
    their guess also depends on whether it tells them anything new about the extent
    of the program: an example that falls inside the span of the examples shown before
    it (e.g. 15 after 31, 3, 1) carries its own inferred evidence weight, either discounted
    as redundant (so it narrows generalization less than a full-weight learner expects)
    or taken as extra confirmation that the pattern holds (so it narrows it more).
    This predicts that the same numbers shown in an order where the last one fills
    a gap (31, 3, 1, 15) generalize differently from an order where every example
    extends the span (1, 3, 15, 31), with the difference falling on members of broad
    rules and wide ranges.'
- name: position_decay_upward_room
  rationale: 'Refinement of `position_decaying_example_evidence`: people do the same
    Bayesian concept learning over arithmetic, digit and digit-sum rules and every
    numeric range of 1-100. Each example''s evidence shrinks or grows by a constant
    factor along the sequence, and the examples are read as independent draws with
    some strays, with occasional guessing. The one change, the component taken from
    `upward_room_range_prior`, replaces the flat range prior with a counting habit:
    people expect the program''s numbers to carry on upward past the largest example,
    so a candidate range''s prior plausibility rises with how far it reaches above
    the examples (strength inferred). This predicts more "yes" to numbers a little
    above a cluster than to numbers the same distance below it (e.g. 67 versus 57
    after 60, 62, 64), whatever order the examples were shown in, while rule and digit-sum
    generalization and the order-dependent weighting of the examples are kept.'
