models:
- name: tenenbaum_rules_similarity
  rationale: Bayesian concept learning over 33 mathematical rules (odd, even, squares,
    cubes, primes, multiples of 3-12, powers of 2-10, ending in 1-9) and every interval
    of 1-100. The rules share a prior fraction lambda equally; the intervals share
    the rest by an Erlang density on their size (scale sigma). Examples are sampled
    from the concept (the size principle), 10% of them uniformly from 1-100, and "yes"
    is the posterior probability that the concept contains the target.
- name: bigelow_piantadosi_independent
  rationale: 'Bayesian concept learning over 45 rules (odd, even, primes, squares,

    cubes, powers of 2-10, powers of 2 without 32 or with 37, multiples of

    3-9, 11 and 12, ending in 0-9, containing the digit 0-9) and every

    interval of 1-100, with a prior weight inferred for each rule separately

    and a share lambda_0 for the rules as a group; each interval has prior

    (1 - lambda_0) / 100^2. Examples are sampled from the concept (the size

    principle), 10% of them uniformly from 1-100, and "yes" is the posterior

    probability that the concept contains the target.

    '
- name: exemplar_feature_similarity_gcm
  rationale: People do not entertain explicit rules; they judge the target by its
    summed psychological similarity to the remembered examples (an exemplar / generalized-context
    model). Similarity decays exponentially with distance in a feature space where
    each number is described by its magnitude and by its surface properties (parity,
    last digit, tens digit, divisibility by 3/4/5, being prime or a square), with
    attention split between magnitude and properties; the more similar the target
    is to the examples on average, the more likely a "yes".
- name: weak_sampling_concept_generalization
  rationale: 'People entertain the same mathematical rules and numeric ranges as candidate
    concepts, but treat the examples only as labelled members of the concept rather
    than as random draws from it (weak sampling, no size principle): every concept
    consistent with the examples stays credible in proportion to its prior, however
    broad it is, so adding examples rules concepts out but never sharpens generalization
    toward the narrowest one. The sharpest disagreement with the best (strong-sampling)
    model is on multi-example sets that fit both a narrow rule and broader ones (e.g.
    16,8,64 or 83,38,58,68): this model predicts broad, graded "yes" to targets in
    wide consistent ranges and broad rules, where the size-principle model predicts
    confident yes only for the narrow rule.'
- name: digit_feature_exemplar_similarity
  rationale: 'People judge a target by its featural resemblance to the examples in
    decimal notation: each example''s similarity to the target falls off exponentially
    with whether the two differ in their ones digit and whether they differ in their
    tens digit, and the probability of saying yes grows with the target''s summed
    (averaged) similarity to the shown examples, as in an exemplar model over digit
    features rather than a search over explicit rules.'
- name: concept_learning_with_guess_lapse
  rationale: 'Refinement of `bigelow_piantadosi_independent`: people do Bayesian concept
    learning over the same 45 rules with separately weighted priors plus every interval
    of 1-100 (size principle, 10% of examples random), but on a fixed fraction of
    trials they do not consult the inferred concept at all and instead answer by guessing,
    saying "yes" at their own baseline rate. The one change is this response-lapse
    component, which lets the model explain "no" answers to targets the concept clearly
    contains (even the shown examples) and stray "yes" answers to targets it clearly
    excludes.'
- name: tenenbaum_digit_concepts
  rationale: "Refinement of `tenenbaum_rules_similarity`: people do Bayesian concept\
    \ learning over Tenenbaum's mathematical rules and size-weighted intervals, but\
    \ they also read the examples as written numerals, so their hypothesis space additionally\
    \ contains digit concepts \u2014 \"contains the digit d\" (for each digit 0\u2013\
    9) and \"ends in 0\" \u2014 sharing the rules' equal prior. The one change is\
    \ adding these digit concepts, which predicts that examples sharing a digit (e.g.\
    \ 83, 38, 58, 68) lead people to say yes to other numbers containing that digit\
    \ (e.g. 84, 87), even when those numbers are far from any arithmetic rule."
- name: order_weighted_concept_learning
  rationale: "People do Bayesian concept learning over mathematical rules, digit concepts\
    \ and numeric intervals (the size principle), but they read the examples one after\
    \ another and do not weigh them equally: their attention to an example shifts\
    \ systematically with its position in the sequence, so later-read examples (recency)\
    \ or earlier-read examples (primacy) count for more of the evidence about the\
    \ concept. The one claim is this order-dependent weighting of each example's evidence\
    \ \u2014 the total amount of evidence stays the same \u2014 which predicts that\
    \ the same set shown in a different order generalizes more toward the concepts\
    \ favoured by the emphasized examples."
- name: conservative_evidence_digit_concepts
  rationale: 'People do Bayesian concept learning over Tenenbaum''s mathematical rules,
    digit concepts and size-weighted intervals, but they are conservative updaters:
    they underweight (or overweight) the evidence each example provides, so the likelihood
    of the examples under each concept enters their belief only to a fitted power
    rather than at full strength. This single mis-weighting predicts that generalization
    tightens toward the narrowest consistent concept more slowly (or faster) with
    added examples than an ideal size-principle learner would, so multi-example sets
    still yield graded "yes" to broader consistent concepts.'
- name: smallest_rule_commitment
  rationale: People do not weigh many candidate concepts at once; they search for
    the single most specific rule that covers every example (the smallest of the arithmetic
    and digit rules such as "powers of 2", "multiples of 7", "ends in 3" or "contains
    an 8"), commit to it, and answer yes to a target if and only if it obeys that
    rule, falling back to the range spanned by the examples only when no rule fits
    them all. Apart from response noise (a fixed rate of yes inside the chosen rule
    and of yes outside it), generalization is all-or-none with no graded similarity
    or averaging over alternative concepts.
- name: digit_concepts_inferred_outlier_rate
  rationale: "Refinement of `tenenbaum_digit_concepts`: people do Bayesian concept\
    \ learning with the size principle over Tenenbaum's arithmetic rules, size-weighted\
    \ intervals and the digit concepts (\"contains the digit d\", \"ends in 0\"),\
    \ while allowing that any example may be a stray random number from 1\u2013100\
    \ \u2014 and how often they believe the program produces such strays is a property\
    \ of the learner, inferred from their answers, rather than fixed at one in ten.\
    \ The one change is freeing this outlier rate, which predicts that people discount\
    \ an example that fails to fit a tight concept as a stray rather than abandoning\
    \ the concept for a broader one, so narrow rules survive a misfitting example\
    \ and generalization to their members stays strong."
- name: digit_concepts_with_guess_lapse
  rationale: 'Refinement of `tenenbaum_digit_concepts`: people do Bayesian concept
    learning over Tenenbaum''s mathematical rules, the digit concepts ("contains the
    digit d", "ends in 0") and size-weighted intervals exactly as in that model, but
    on a small fixed fraction of trials they do not consult the inferred concept and
    instead guess, saying "yes" at their own baseline rate. The one change is this
    response-lapse component (taken from `concept_learning_with_guess_lapse`), which
    predicts occasional "no" answers to targets the concept surely contains and occasional
    "yes" answers to targets it surely excludes, instead of near-certain responses
    there.'
- name: equal_prior_concepts_with_guess_lapse
  rationale: "Refinement of `concept_learning_with_guess_lapse`: people do Bayesian\
    \ concept learning over the same 45 rules (including the digit concepts) and every\
    \ interval of 1-100, with the size principle and 10% of examples random, and on\
    \ a fixed fraction of trials they ignore the concept and guess \"yes\" at their\
    \ own baseline rate \u2014 but they hold no learned preference among the rules:\
    \ every rule gets the same prior weight. The one change is replacing the 45 separately\
    \ inferred rule weights with a single shared rule prior, which claims that the\
    \ lapse model's advantage comes from occasional guessing, not from idiosyncratic\
    \ rule preferences, so the model should generalize as well with 43 fewer free\
    \ parameters."
- name: first_example_anchored_concept_learning
  rationale: 'People do Bayesian concept learning over the same arithmetic rules,
    digit concepts and numeric intervals as the best model (size principle, equal
    rule prior, occasional guessing), but they build their guess about the concept
    from the first example they read and treat it as a sure member of the concept:
    only the examples that follow can be dismissed as stray random numbers. This primacy-of-the-anchor
    claim predicts that a set whose first example misfits a tight rule shared by the
    later ones generalizes broadly (the rule must include the anchor), whereas the
    same misfit shown last is discounted and the tight rule survives.'
- name: spread_adaptive_magnitude_gradient
  rationale: 'People judge a target by its numerical closeness to the nearest shown
    example, with an exponentially decaying (Shepard) generalization gradient whose
    width is not fixed but scales with how spread out the examples are: tightly clustered
    examples (e.g. 60, 62, 64) produce a sharp gradient that says "yes" only to nearby
    numbers, while widely scattered examples produce a broad gradient that extends
    "yes" to distant numbers. The single claim is this spread-adaptive magnitude similarity,
    with no rules or digit features.'
- name: soft_confidence_criterion_decision
  rationale: People do Bayesian concept learning exactly as in the simplest digit-concept
    model (equal-prior mathematical and digit rules plus size-weighted intervals),
    but they do not answer "yes" with the probability that the concept contains the
    target; instead they compare their degree of belief against a personal criterion
    of how sure they must be, answering "yes" when their confidence that the target
    belongs exceeds that criterion, with graded (noisy) sensitivity around it. This
    single decision-threshold rule predicts that moderately probable targets are pushed
    toward "no" (or "yes") depending on where the criterion sits, and that near-certain
    beliefs are softened or sharpened by how steeply responses track the confidence-versus-criterion
    gap.
- name: iter2_candidate3
  rationale: "Refinement of `equal_prior_concepts_with_guess_lapse`: people do Bayesian\
    \ concept learning over the same 45 rules (including the digit concepts) and every\
    \ interval of 1-100, with the size principle, 10% of examples random, and a guess\
    \ lapse at their own baseline \"yes\" rate \u2014 but the rules are not all equally\
    \ salient: each rule's prior weight is a draw from a shared population of rule\
    \ saliences whose spread is inferred, so a rule departs from the common weight\
    \ only as far as the answers demand. The one change is replacing the single shared\
    \ rule prior with this partially pooled (hierarchical) rule prior, which claims\
    \ that some rules (e.g. \"odd numbers\") are systematically less or more attractive\
    \ than others, yet predicts generalization closer to the equal-prior model than\
    \ 45 freely inferred weights would."
- name: rule_breadth_prior_concepts
  rationale: "Refinement of `equal_prior_concepts_with_guess_lapse`: people do Bayesian\
    \ concept learning over the same 45 arithmetic and digit rules and every interval\
    \ of 1-100 (size principle, 10% of examples random), with occasional guessing\
    \ at their own yes rate \u2014 but before seeing any examples they already prefer\
    \ rules by their breadth, giving each rule a prior weight that rises or falls\
    \ as a power of how many numbers it contains (a preference for specific, \"interesting\"\
    \ rules over broad ones, or the reverse). The one change is replacing the flat\
    \ prior across rules with this single size-graded rule prior, which predicts that\
    \ broad rules such as \"odd\" or \"even\" win less (or more) of the posterior\
    \ than an equal-prior learner gives them, e.g. fewer \"yes\" answers to arbitrary\
    \ odd numbers after 85, 19, 91."
- name: occam_specificity_prior_all_concepts
  rationale: 'Refinement of `equal_prior_concepts_with_guess_lapse`: people do Bayesian
    concept learning over the same 45 arithmetic and digit rules and every interval
    of 1-100 (size principle, 10% of examples random, occasional guessing at their
    own yes rate), but they bring one general Occam-style specificity bias to every
    candidate concept, rules and numeric ranges alike: before seeing any examples,
    a concept''s prior plausibility falls (or rises) as a power of how many numbers
    it contains. The one change is replacing the flat priors within the rules and
    within the intervals with this single shared size-graded prior, which predicts
    not only weaker generalization to broad rules (e.g. all odd numbers after 85,
    19, 91) but also tighter, more local "yes" ranges around clustered examples than
    an equal-prior learner, with both effects set by the same one parameter.'
- name: counting_by_twos_run_concepts
  rationale: 'Refinement of `rule_breadth_prior_concepts`: people do Bayesian concept
    learning over the same arithmetic and digit rules (with their size-graded rule
    prior) and every interval of 1-100, with the size principle, 10% of examples random
    and occasional guessing. They also entertain one more kind of concept, "counting
    by twos" runs: a bounded stretch of every other number, such as 60, 62, 64, 66
    or 31, 33, 35, i.e. the even or the odd numbers within a limited range. All such
    runs are equally likely a priori, and the family as a whole takes an inferred
    share of prior belief relative to the rules. This predicts that examples spaced
    by two (e.g. 60, 62, 64) draw "yes" to nearby same-parity numbers but not to same-parity
    numbers far away, a pattern that neither "even numbers" nor a numeric range gives.'
- name: concept_mediated_exemplar_similarity
  rationale: "People do not infer a single concept that covers all the examples; they\
    \ store each example and judge the target by its summed (averaged) similarity\
    \ to those stored examples, as in an exemplar model. The similarity of the target\
    \ to one example is how likely the two are to share a number concept \u2014 an\
    \ arithmetic or digit rule (e.g. \"powers of 2\", \"contains a 3\") or a numeric\
    \ range \u2014 judged from that example alone, so sharing a narrow property counts\
    \ for more than sharing a broad one, and the more summed similarity, the more\
    \ likely a \"yes\". Because similarity is added across examples rather than requiring\
    \ one concept to fit them all, a target resembling only one of the examples (e.g.\
    \ 17 after 16, 8, 64) still draws a substantial share of \"yes\" answers."
- name: pedagogical_sampling_concepts
  rationale: 'People treat the examples as chosen on purpose by a helpful teacher
    rather than drawn at random from the hidden concept: they assume the program picks,
    from among the concept''s members, numbers that would best lead a learner to that
    concept (numbers that few other plausible concepts contain), and they infer the
    concept by reasoning about why these particular examples were chosen. Over the
    same arithmetic rules, digit concepts and numeric ranges (with occasional guessing),
    this pedagogical reading predicts that an example typical of many concepts (e.g.
    a small even number) says less about the concept than a distinctive one, so generalization
    follows the concept the examples single out more than the size principle alone
    implies, with the strength of this teacher assumption inferred from the answers.'
- name: breadth_prior_concepts_free_outlier_rate
  rationale: "Refinement of `rule_breadth_prior_concepts`: people do Bayesian concept\
    \ learning over the same 45 arithmetic and digit rules (with the same breadth-graded\
    \ rule prior) and every interval of 1-100, with the size principle and occasional\
    \ guessing at their own yes rate \u2014 but how often they believe the program\
    \ emits a stray random example is a property of the learner, inferred from their\
    \ answers, rather than fixed at one in ten. The one change is freeing this outlier\
    \ rate (the component taken from `digit_concepts_inferred_outlier_rate`), which\
    \ claims that part of what the lapse now absorbs is really people discounting\
    \ a misfitting example as a stray, so tight rules survive an odd-one-out example\
    \ (e.g. 85, 19, 91 or 14, 47) instead of being abandoned for broad ones."
- name: concepts_sampled_without_replacement
  rationale: 'Refinement of `rule_breadth_prior_concepts`: people do Bayesian concept
    learning over the same 45 arithmetic and digit rules and every interval of 1-100,
    with a size-graded rule prior, 10% of examples random and occasional guessing
    at their own yes rate. They also take it that the program shows distinct numbers,
    so each further example is a draw from the concept''s members not yet shown (strong
    sampling without replacement). The one change is this sampling assumption. It
    sharpens the size principle most for small concepts that are nearly used up by
    the examples (e.g. 8, 64 or 16, 8, 64 strongly favour "powers of 2", or 1, 8,
    27 "cubes"), so people say "yes" less often to members of broader rules and wide
    ranges than a with-replacement learner predicts.'
- name: without_replacement_size_principle
  rationale: 'Refinement of `equal_prior_concepts_with_guess_lapse`: people do Bayesian
    concept learning over the same 45 arithmetic and digit rules and every interval
    of 1-100 (equal rule prior, 10% of examples random, occasional guessing at their
    own yes rate), but they understand that the program shows distinct examples, so
    each further example is read as a draw from the concept''s members not yet shown
    (sampling without replacement) rather than from all its members again. The one
    change is this without-replacement size principle, which adds no free parameter
    and predicts that several examples sharpen generalization toward small concepts
    more than the standard model does: a few examples that nearly exhaust a small
    rule (e.g. 16, 8, 64 for powers of 2) or a short range make that concept far more
    credible than broader alternatives.'
- name: round_number_salient_sampling
  rationale: 'People do Bayesian concept learning over the same arithmetic and digit
    rules (with a size-graded rule prior) and every interval of 1-100, with occasional
    guessing, treating the examples as distinct draws from the hidden concept (strong
    sampling without replacement, with some stray random examples). The one new claim
    is about how they believe the program picks numbers: not uniformly, but with round
    numbers (multiples of 5 and 10) more or less likely to be produced than other
    numbers, with the strength and direction of this round-number bias inferred from
    their answers. Because a concept''s members are then weighted by how readily the
    program would emit them, this predicts that concepts made mostly of round numbers
    (e.g. "multiples of 10", "ends in 0" or "ends in 5") gain or lose credibility
    relative to other rules and ranges. It also predicts that a round example says
    less about the concept than a non-round one does, or more.'
- name: without_replacement_free_outlier_rate
  rationale: "Refinement of `concepts_sampled_without_replacement`: people do Bayesian\
    \ concept learning over the same 45 arithmetic and digit rules (with the size-graded\
    \ rule prior) and every interval of 1-100, reading each further example as a draw\
    \ from the concept's members not yet shown (strong sampling without replacement),\
    \ with occasional guessing at their own yes rate. The one change (the component\
    \ taken from `breadth_prior_concepts_free_outlier_rate`) is that how often they\
    \ believe the program shows a stray random number is a property of the learner,\
    \ inferred from their answers, rather than fixed at one in ten \u2014 so a misfitting\
    \ example (e.g. 14, 47 or 85, 19, 91) is discounted as a stray at the learner's\
    \ own rate, letting tight, nearly exhausted concepts survive it instead of yielding\
    \ to broad rules and wide ranges."
- name: occam_prior_without_replacement
  rationale: 'Refinement of `occam_specificity_prior_all_concepts`: people do Bayesian
    concept learning over the same 45 arithmetic and digit rules and every interval
    of 1-100, with one shared Occam-style specificity bias that makes every concept''s
    prior (rules and ranges alike) fall or rise as a power of its size, 10% of examples
    random and occasional guessing at their own yes rate. The one change, taken from
    `without_replacement_size_principle`, is that people take the program''s examples
    to be distinct, so each further example is a draw from the concept''s members
    not yet shown (strong sampling without replacement). Together with the shared
    specificity prior, this predicts that examples that nearly use up a small rule
    or a short range (e.g. 16, 8, 64 for powers of 2, or 60, 62, 64 for a tight range)
    make that concept even more credible, so people say "yes" less to members of broad
    rules and wide ranges than either change alone predicts.'
- name: round_number_bounded_ranges
  rationale: 'People do Bayesian concept learning over the same arithmetic and digit
    rules as the best model (size-graded rule prior, distinct examples drawn without
    replacement, 10% strays, occasional guessing), but they think of numeric ranges
    in round-number terms: the ranges they entertain begin and end at multiples of
    five ("from 60 to 70", "from 35 to 85"), not at arbitrary numbers. This disagrees
    most sharply with the best model at the edges of the examples'' span: after clustered
    examples such as 60, 62, 64 or 92, 82, 27, 42, "yes" should stay high right up
    to the next multiple of five beyond the outermost example and then drop in a step,
    rather than fall off smoothly from the examples themselves.'
- name: win_stay_lose_shift_concept_testing
  rationale: People do not hold a full posterior over concepts; they read the examples
    one at a time while holding a single candidate concept (from the same arithmetic
    and digit rules, with a breadth-graded rule prior, and numeric ranges), keeping
    it as long as each new example is one of its members ("win-stay") and, only when
    an example falls outside it, discarding it and drawing a fresh concept in proportion
    to how well concepts explain all the examples so far ("lose-shift"). Because a
    concept that survives is never re-weighed, later examples that fit a broad concept
    do not sharpen belief toward a narrower one, so this sequential hypothesis-testing
    process predicts more "yes" answers to members of broad rules and wide ranges
    after several consistent examples (e.g. 16, 8, 64 or 60, 62, 64) than full Bayesian
    updating, and it makes the answer depend on which example came first.
- name: shown_examples_not_repeated
  rationale: 'Refinement of `concepts_sampled_without_replacement` (the incumbent):
    people do Bayesian concept learning over the same 45 arithmetic and digit rules
    and every interval of 1-100, with the size-graded rule prior, 10% of examples
    random, occasional guessing at their own yes rate, and the belief that the program
    shows distinct numbers, so each further example is a draw from the concept''s
    members not yet shown. The one change follows from that same belief: when the
    number asked about is one of the examples already shown, people sometimes (at
    a rate inferred from their answers) read "would the program also produce it?"
    as asking whether it would come up again as a new example, and since the program
    does not repeat itself they answer "no". This predicts fewer "yes" answers to
    targets that are themselves examples than the concept''s membership implies (about
    two-thirds rather than three-quarters), while leaving every other judgment governed
    by the incumbent''s concept learning and making the guessing lapse smaller.'
