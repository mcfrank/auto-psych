models:
- name: rule_breadth_prior_concepts
  rationale: "Refinement of `equal_prior_concepts_with_guess_lapse`: people do Bayesian\
    \ concept learning over the same 45 arithmetic and digit rules and every interval\
    \ of 1-100 (size principle, 10% of examples random), with occasional guessing\
    \ at their own yes rate \u2014 but before seeing any examples they already prefer\
    \ rules by their breadth, giving each rule a prior weight that rises or falls\
    \ as a power of how many numbers it contains (a preference for specific, \"interesting\"\
    \ rules over broad ones, or the reverse). The one change is replacing the flat\
    \ prior across rules with this single size-graded rule prior, which predicts that\
    \ broad rules such as \"odd\" or \"even\" win less (or more) of the posterior\
    \ than an equal-prior learner gives them, e.g. fewer \"yes\" answers to arbitrary\
    \ odd numbers after 85, 19, 91."
- name: counting_by_twos_run_concepts
  rationale: 'Refinement of `rule_breadth_prior_concepts`: people do Bayesian concept
    learning over the same arithmetic and digit rules (with their size-graded rule
    prior) and every interval of 1-100, with the size principle, 10% of examples random
    and occasional guessing. They also entertain one more kind of concept, "counting
    by twos" runs: a bounded stretch of every other number, such as 60, 62, 64, 66
    or 31, 33, 35, i.e. the even or the odd numbers within a limited range. All such
    runs are equally likely a priori, and the family as a whole takes an inferred
    share of prior belief relative to the rules. This predicts that examples spaced
    by two (e.g. 60, 62, 64) draw "yes" to nearby same-parity numbers but not to same-parity
    numbers far away, a pattern that neither "even numbers" nor a numeric range gives.'
- name: breadth_prior_concepts_free_outlier_rate
  rationale: "Refinement of `rule_breadth_prior_concepts`: people do Bayesian concept\
    \ learning over the same 45 arithmetic and digit rules (with the same breadth-graded\
    \ rule prior) and every interval of 1-100, with the size principle and occasional\
    \ guessing at their own yes rate \u2014 but how often they believe the program\
    \ emits a stray random example is a property of the learner, inferred from their\
    \ answers, rather than fixed at one in ten. The one change is freeing this outlier\
    \ rate (the component taken from `digit_concepts_inferred_outlier_rate`), which\
    \ claims that part of what the lapse now absorbs is really people discounting\
    \ a misfitting example as a stray, so tight rules survive an odd-one-out example\
    \ (e.g. 85, 19, 91 or 14, 47) instead of being abandoned for broad ones."
- name: concepts_sampled_without_replacement
  rationale: 'Refinement of `rule_breadth_prior_concepts`: people do Bayesian concept
    learning over the same 45 arithmetic and digit rules and every interval of 1-100,
    with a size-graded rule prior, 10% of examples random and occasional guessing
    at their own yes rate. They also take it that the program shows distinct numbers,
    so each further example is a draw from the concept''s members not yet shown (strong
    sampling without replacement). The one change is this sampling assumption. It
    sharpens the size principle most for small concepts that are nearly used up by
    the examples (e.g. 8, 64 or 16, 8, 64 strongly favour "powers of 2", or 1, 8,
    27 "cubes"), so people say "yes" less often to members of broader rules and wide
    ranges than a with-replacement learner predicts.'
- name: without_replacement_size_principle
  rationale: 'Refinement of `equal_prior_concepts_with_guess_lapse`: people do Bayesian
    concept learning over the same 45 arithmetic and digit rules and every interval
    of 1-100 (equal rule prior, 10% of examples random, occasional guessing at their
    own yes rate), but they understand that the program shows distinct examples, so
    each further example is read as a draw from the concept''s members not yet shown
    (sampling without replacement) rather than from all its members again. The one
    change is this without-replacement size principle, which adds no free parameter
    and predicts that several examples sharpen generalization toward small concepts
    more than the standard model does: a few examples that nearly exhaust a small
    rule (e.g. 16, 8, 64 for powers of 2) or a short range make that concept far more
    credible than broader alternatives.'
- name: round_number_salient_sampling
  rationale: 'People do Bayesian concept learning over the same arithmetic and digit
    rules (with a size-graded rule prior) and every interval of 1-100, with occasional
    guessing, treating the examples as distinct draws from the hidden concept (strong
    sampling without replacement, with some stray random examples). The one new claim
    is about how they believe the program picks numbers: not uniformly, but with round
    numbers (multiples of 5 and 10) more or less likely to be produced than other
    numbers, with the strength and direction of this round-number bias inferred from
    their answers. Because a concept''s members are then weighted by how readily the
    program would emit them, this predicts that concepts made mostly of round numbers
    (e.g. "multiples of 10", "ends in 0" or "ends in 5") gain or lose credibility
    relative to other rules and ranges. It also predicts that a round example says
    less about the concept than a non-round one does, or more.'
- name: without_replacement_free_outlier_rate
  rationale: "Refinement of `concepts_sampled_without_replacement`: people do Bayesian\
    \ concept learning over the same 45 arithmetic and digit rules (with the size-graded\
    \ rule prior) and every interval of 1-100, reading each further example as a draw\
    \ from the concept's members not yet shown (strong sampling without replacement),\
    \ with occasional guessing at their own yes rate. The one change (the component\
    \ taken from `breadth_prior_concepts_free_outlier_rate`) is that how often they\
    \ believe the program shows a stray random number is a property of the learner,\
    \ inferred from their answers, rather than fixed at one in ten \u2014 so a misfitting\
    \ example (e.g. 14, 47 or 85, 19, 91) is discounted as a stray at the learner's\
    \ own rate, letting tight, nearly exhausted concepts survive it instead of yielding\
    \ to broad rules and wide ranges."
- name: shown_examples_not_repeated
  rationale: 'Refinement of `concepts_sampled_without_replacement` (the incumbent):
    people do Bayesian concept learning over the same 45 arithmetic and digit rules
    and every interval of 1-100, with the size-graded rule prior, 10% of examples
    random, occasional guessing at their own yes rate, and the belief that the program
    shows distinct numbers, so each further example is a draw from the concept''s
    members not yet shown. The one change follows from that same belief: when the
    number asked about is one of the examples already shown, people sometimes (at
    a rate inferred from their answers) read "would the program also produce it?"
    as asking whether it would come up again as a new example, and since the program
    does not repeat itself they answer "no". This predicts fewer "yes" answers to
    targets that are themselves examples than the concept''s membership implies (about
    two-thirds rather than three-quarters), while leaving every other judgment governed
    by the incumbent''s concept learning and making the guessing lapse smaller.'
