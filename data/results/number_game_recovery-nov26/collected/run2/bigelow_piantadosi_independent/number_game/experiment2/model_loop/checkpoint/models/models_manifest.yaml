models:
- name: learned_rule_prior_mixture
  rationale: "Refinement of bigelow_piantadosi_mixture: people learn concepts by the\
    \ same Bayesian inference over 45 mathematical rules and all intervals of 1-100\
    \ with the size principle, but they do not hold the rules as equally likely a\
    \ priori \u2014 each rule (e.g. odd, even, ends in a digit) carries its own prior\
    \ plausibility, inferred from the data. The single change is replacing the uniform\
    \ prior over rules with a learned, non-uniform one (the core idea of Bigelow &\
    \ Piantadosi's prior inference), so favoured rules such as parity and shared final\
    \ digits can dominate interval-based similarity when the examples support them."
- name: tempered_learned_rule_prior
  rationale: "Refinement of `learned_rule_prior_mixture`: people learn concepts by\
    \ the same Bayesian inference over 45 mathematical rules (each with its own learned\
    \ prior plausibility) and all intervals of 1-100, but they apply the size principle\
    \ only partially \u2014 they discount the evidence that the examples were sampled\
    \ from a small concept, so the likelihood of the examples is tempered by a free\
    \ sampling-strength exponent (1 = full strong sampling, 0 = weak sampling). The\
    \ single change is grafting this tempered size principle (from `tempered_size_principle_mixture`)\
    \ onto the learned-rule-prior model, predicting that broad favoured rules and\
    \ wide intervals keep more posterior weight after a few examples than an ideal\
    \ strong-sampling learner allows."
- name: response_sharpened_tempered_rule_prior
  rationale: "Refinement of `tempered_learned_rule_prior`: people do the same Bayesian\
    \ concept learning over 45 rules (each with its own learned prior plausibility)\
    \ and all intervals of 1-100 with a tempered size principle, but they turn their\
    \ belief that the target is in the concept into a yes/no answer more decisively\
    \ than probability matching \u2014 their answer follows the belief's log-odds\
    \ scaled by a free decisiveness exponent, so targets the learner thinks are probably\
    \ in (or probably out of) the concept are answered yes (or no) more consistently\
    \ than the belief itself. The single change is this sharpened belief-to-response\
    \ mapping (a one-parameter log-odds scaling, from `llo_distorted_concept_posterior`)\
    \ grafted onto `tempered_learned_rule_prior`, motivated by the critique that people's\
    \ repeated answers to the same set and target are more unanimous than the graded\
    \ posterior predicts."
- name: familiarity_relaxed_size_principle
  rationale: 'People do the same recency-weighted Bayesian concept learning over rules
    and numerical ranges as the best model, but how strongly they apply the size principle
    depends on how familiar the example set is: the first time a participant meets
    a set they read its examples as tightly sampled from a small concept, and each
    further time they are asked about that same set (having already been probed with
    other targets for it) they discount that sampling evidence more, so their generalization
    broadens. This predicts fewer yeses on a set''s first encounter than on its repeats,
    concentrated on targets outside the tightest range or rule covering the examples.'
- name: exposure_weakened_size_principle
  rationale: "Refinement of `even_odd_split_family_prior`: people do the same Bayesian\
    \ concept learning over the same 45 rules (separate prior plausibilities for even,\
    \ odd and the other kinds of rule) and all intervals of 1-100 with a tempered\
    \ size principle, but the strength with which they apply the size principle is\
    \ not fixed \u2014 each further question about the same set of examples within\
    \ a session weakens it (a fitted power-law decay with the number of earlier trials\
    \ on that set), so the learner who is repeatedly probed about one set comes to\
    \ treat its examples as less diagnostic of a small concept and generalizes more\
    \ broadly. The single change is making the sampling strength depend on the set's\
    \ exposure history, motivated by the critique that first encounters of a set are\
    \ judged less generously than later ones, which an exposure-blind learner cannot\
    \ produce."
- name: capacity_limited_evidence_integration
  rationale: 'People infer the hidden concept by Bayesian learning over mathematical
    rules (with separate prior plausibilities for even, odd and the other kinds of
    rule) and numerical intervals, but they have a limited capacity for integrating
    examples: the examples of a set compete for the same limited working memory, so
    each additional example adds less evidence than the one before, and the total
    evidence grows more slowly than the number of examples. This predicts that larger
    sets are generalized more broadly (broad rules and wide ranges keep more weight)
    than an ideal learner, which counts every example fully, would allow, while single-example
    sets are judged as the ideal learner does.'
- name: recency_family_prior_sharpened_response
  rationale: "Refinement of `recency_weighted_even_odd_family_prior`: people do the\
    \ same recency-weighted Bayesian concept learning over the same 45 rules (separate\
    \ prior plausibilities for even, odd and the other kinds of rule) and all intervals\
    \ of 1-100 with a tempered size principle, but they do not answer by probability\
    \ matching to their belief that the target is in the concept \u2014 they turn\
    \ that belief into a yes/no answer more (or less) decisively, following the belief's\
    \ log-odds scaled by a free decisiveness exponent. The single change is grafting\
    \ this sharpened belief-to-response mapping (from `response_sharpened_tempered_rule_prior`)\
    \ onto the incumbent, predicting that targets the learner judges probably in (or\
    \ probably out of) the concept are answered yes (or no) more consistently across\
    \ people than the graded posterior itself implies."
- name: magnitude_privileged_size_principle
  rationale: 'People infer the hidden concept by Bayesian learning over mathematical
    rules (with separate prior plausibilities for even, odd and the other kinds of
    rule) and numerical ranges, with capacity-limited integration of the examples,
    but they mis-weight the two kinds of evidence: the "suspicious coincidence" that
    the examples all fall in a narrow stretch of the number line is applied more strongly
    than the coincidence that they all obey an arithmetic rule, because magnitude
    is perceived effortlessly while rule membership must be computed. This predicts
    that when no rule fits well (for example sets mixing odd and even numbers) people
    confine their yeses to the span of the examples more sharply than a learner who
    applies one sampling strength to every concept.'
- name: kind_specific_sampling_assumption
  rationale: 'People infer the hidden concept by Bayesian learning over mathematical
    rules (with separate prior plausibilities for even, odd and the other kinds of
    rule) and numerical ranges, but they make different sampling assumptions for the
    two kinds of concept: they treat the examples as deliberately drawn from a magnitude
    range (a strong size principle, so the tightest range covering the examples wins
    sharply), while they treat a mathematical rule as merely compatible with the examples,
    discounting how suspiciously the examples fit a small rule (a separately fitted,
    weaker size principle). This predicts sharp yes/no edges at the examples'' smallest
    and largest values when no rule explains them (e.g. mixed-parity sets), while
    broad rules such as parity still survive when the examples do fit them.'
- name: surprise_weighted_sequential_updating
  rationale: 'People read the examples one at a time, revising a running Bayesian
    guess about the concept (over mathematical rules, with separate prior plausibilities
    for even, odd and the other kinds of rule, and numerical ranges), and how much
    each new example counts depends on how surprising it is given the guess formed
    from the examples before it: an example the current guess predicted well is skimmed
    over, while an example that violates it (breaks the parity pattern, falls outside
    the range seen so far) captures attention and is weighted more heavily. Because
    the weight depends on the preceding examples, the same set shown in a different
    order is generalized differently, and pattern-breaking sets such as mixed-parity
    ones end up with their range taken more sharply than an order-blind learner would
    allow.'
- name: learned_outlier_tolerance_capacity
  rationale: "Refinement of `capacity_limited_evidence_integration`: people do the\
    \ same capacity-limited Bayesian concept learning over rules (separate prior plausibilities\
    \ for even, odd and the other kinds of rule) and numerical ranges, but how much\
    \ they suspect the program of producing stray, random numbers is not fixed at\
    \ 10% \u2014 their belief in such \"noise\" examples is a free parameter inferred\
    \ from the data. The single change is learning this outlier tolerance: if people\
    \ trust every example as a genuine member of the concept, ranges that fail to\
    \ cover all examples are ruled out, so in sets with no fitting rule (e.g. mixed\
    \ odd and even numbers) they say yes inside the span of the examples and no outside\
    \ it more sharply than a learner who tolerates stray examples."
- name: range_sharpened_exposure_size_principle
  rationale: "Refinement of `exposure_weakened_size_principle`: people do the same\
    \ Bayesian concept learning over the same 45 rules (separate prior plausibilities\
    \ for even, odd and the other kinds of rule) and all intervals of 1-100, with\
    \ a size principle that weakens as the same set is probed again, but they do not\
    \ apply the size principle equally to the two kinds of concept \u2014 magnitude\
    \ ranges are read as tightly sampled (a separate, fitted sampling strength for\
    \ intervals), so the range spanned by the examples is taken far more literally\
    \ than an arithmetic rule's extension. The single change is splitting the one\
    \ sampling strength into a rule strength and an interval strength, motivated by\
    \ the critique that in mixed-parity sets (where ranges dominate) people separate\
    \ targets inside the examples' range from those outside it more sharply than the\
    \ model predicts."
- name: narrow_range_prior_capacity_limited
  rationale: "Refinement of `capacity_limited_evidence_integration`: people do the\
    \ same capacity-limited Bayesian learning over rules (separate prior plausibilities\
    \ for even, odd and the other kinds of rule) and numerical ranges, with each added\
    \ example contributing less evidence, but before seeing any example they expect\
    \ the program's numerical range to be narrow \u2014 a range's prior plausibility\
    \ falls as a fitted power of its width, instead of all ranges being equally plausible.\
    \ The single change is this narrow-range prior expectation, which, unlike the\
    \ evidence from the examples, is not diluted by the capacity limit as sets grow,\
    \ so for sets that no rule explains (e.g. mixing odd and even numbers) people\
    \ keep their yeses inside the examples' span more sharply than the incumbent predicts,\
    \ as the mixed-parity range-gap critique shows."
- name: spread_scaled_distance_gradient
  rationale: 'People judge a target by its numerical closeness to the nearest example
    shown, with willingness to say yes falling off exponentially (a Shepard generalization
    gradient) with the distance between the target and that example on the 1-100 number
    line. The breadth of this gradient is not fixed but is set by how dispersed the
    examples are: tightly clustered examples produce a narrow gradient, widely scattered
    examples a broad one, so the spread of the examples tells people how far from
    them the program is likely to reach.'
- name: criterion_thresholded_concept_belief
  rationale: "People infer the hidden concept by ordinary Bayesian learning over mathematical\
    \ rules (with separate prior plausibilities for even, odd and the other kinds\
    \ of rule) and numerical ranges with a tempered size principle, but they do not\
    \ answer by probability matching: they say yes only when their belief that the\
    \ target is in the concept clears an internal criterion of how sure they must\
    \ be, applied with some trial-to-trial noise. This predicts that targets with\
    \ intermediate support \u2014 common after two examples, when several rules and\
    \ ranges are still in play \u2014 are rejected more often than their belief implies,\
    \ so moderately uncertain sets get fewer yeses than probability matching allows,\
    \ while clearly supported and clearly unsupported targets are answered nearly\
    \ unanimously."
- name: pair_contrast_capacity_limited
  rationale: "Refinement of `capacity_limited_evidence_integration`: people do the\
    \ same capacity-limited Bayesian learning over rules (separate prior plausibilities\
    \ for even, odd and the other kinds of rule) and numerical ranges, with each added\
    \ example contributing less evidence, but a pair of examples is read as a deliberate\
    \ contrast \u2014 two numbers shown together invite a direct comparison that makes\
    \ the pair look especially diagnostic, so a two-example set is taken as more tightly\
    \ sampled than the smooth capacity limit implies. The single change is a fitted\
    \ pair-comparison boost to the sampling strength of two-example sets, predicting\
    \ that people generalize more narrowly (fewer yeses) from two examples than from\
    \ three or four, the non-monotone two-example dip the critique reports."
- name: two_item_span_evidence_integration
  rationale: "Refinement of `capacity_limited_evidence_integration`: people do the\
    \ same Bayesian learning over rules (separate prior plausibilities for even, odd\
    \ and the other kinds of rule) and numerical ranges, but their limited capacity\
    \ is a fixed span of two examples rather than a smooth power-law dilution \u2014\
    \ the first two examples of a set are each integrated in full, and only examples\
    \ beyond that span are integrated partially (a fitted fraction of an example's\
    \ evidence each). The single change is replacing the incumbent's gradual n^-gamma\
    \ discount with this two-item span, predicting that two-example sets are judged\
    \ as conservatively as an ideal learner would (fewer yeses), while three- and\
    \ four-example sets gain little extra evidence and so generalize relatively broadly\
    \ \u2014 the two-example dip the critique reports."
- name: overload_interference_narrow_range
  rationale: 'Refinement of `narrow_range_prior_capacity_limited`: people do the same
    Bayesian learning over rules (separate prior plausibilities for even, odd and
    the other kinds of rule) and numerical ranges, with a prior expectation that the
    program''s range is narrow, but the examples on display interfere with one another
    in working memory, so every additional example degrades the encoding of *all*
    the examples by a fixed proportion. The single change is replacing the power-law
    dilution of evidence with this multiplicative interference: total evidence first
    rises with set size and can then fall once the display overloads memory, so two-example
    sets are judged most conservatively and three- and four-example sets more generously,
    as the critique''s two-example dip shows (a power-law dilution can only make evidence
    grow monotonically).'
- name: selective_attention_exemplar_similarity
  rationale: 'People do not infer a hidden concept; they judge a target by its average
    similarity to the stored examples (an exemplar account), where similarity is computed
    over the number''s magnitude and its membership in familiar number categories
    (even, odd, primes, squares, powers, multiples, final digit, contained digit),
    and attention is allocated selectively by the examples themselves: the categories
    that all examples share draw attention (with a fitted dependence on how broad
    each category is), and whatever attention they draw is taken away from magnitude.
    So when the examples share a category, targets breaking it are judged dissimilar
    even if numerically close, but when the examples share nothing (e.g. mixed parity)
    attention falls entirely on magnitude and yeses follow numerical proximity to
    the examples.'
- name: approximate_magnitude_target_encoding
  rationale: "People infer the hidden concept by capacity-limited Bayesian learning\
    \ over mathematical rules and numerical ranges, but they check the target against\
    \ that concept through an approximate, logarithmically compressed sense of its\
    \ magnitude rather than its exact identity: the target is confused with numbers\
    \ of similar size, more so for larger numbers (Weber's law), and the answer is\
    \ the concept's average endorsement over those confusable numbers. This predicts\
    \ that targets just outside a rule but numerically close to members \u2014 especially\
    \ large targets \u2014 get more yeses than an exact-identity learner allows (the\
    \ rule-violating near-target leak), while small targets are judged nearly exactly."
- name: base_ten_multiples_capacity_limited
  rationale: "Refinement of `capacity_limited_evidence_integration`: people do the\
    \ same capacity-limited Bayesian learning over rules and numerical ranges, with\
    \ each added example contributing less evidence, but \"multiples of 5\" is not\
    \ just one more multiples rule sharing a single plausibility with multiples of\
    \ 3, 4, 7, 11 and the rest \u2014 because it is aligned with our base-ten number\
    \ notation, it is its own, far more readily entertained kind of rule with a separate\
    \ prior plausibility inferred from the data. The single change is splitting multiples\
    \ of 5 out of the multiples family (as even and odd are already split out of parity),\
    \ predicting that sets such as 90, 100, 5 are generalized to every multiple of\
    \ 5 across the number line, while sets fitting a less familiar multiple (e.g.\
    \ 42, 35, 21, 84 as multiples of 7) are generalized by that rule less than the\
    \ incumbent predicts."
- name: proximity_leak_capacity_limited
  rationale: "Refinement of `capacity_limited_evidence_integration`: people do the\
    \ same capacity-limited Bayesian learning over rules (separate prior plausibilities\
    \ for even, odd and the other kinds of rule) and numerical ranges, with each added\
    \ example contributing less evidence, but when the target falls outside the concept\
    \ they have inferred, its numerical closeness to one of the examples can still\
    \ pull them into saying yes \u2014 a proximity leak whose strength falls off exponentially\
    \ with the distance to the nearest example (fitted leak strength and fall-off).\
    \ The single change is this similarity override of the inferred concept, motivated\
    \ by the critique that, for sets fitting a small rule, targets that break the\
    \ rule but lie within a few units of an example get more yeses than the incumbent\
    \ predicts."
- name: multiplication_fluency_rule_prior
  rationale: 'Refinement of `capacity_limited_evidence_integration`: people do the
    same capacity-limited Bayesian learning over rules (separate prior plausibilities
    for even, odd and the other kinds of rule) and numerical ranges, but a "multiples
    of m" rule is entertained less readily the larger m is, because checking divisibility
    by a larger number is less fluent mental arithmetic (multiples of 3 or 4 come
    to mind easily, multiples of 7, 9, 11 or 12 hardly do). The single change is a
    fitted fluency gradient that lowers each multiples rule''s prior plausibility
    as a power of its base. The disagreement with the best model lives in sets that
    fit multiples of a large base (e.g. 42, 35, 21, 84 or 36, 45, 54, 81): the best
    model generalizes them to the rule''s distant members (91, 98, 90, 99), whereas
    this model predicts fewer yeses there and more yeses to non-member numbers inside
    the examples'' span, which are carried by ranges.'
- name: narrow_range_base_ten_multiples
  rationale: 'Refinement of `base_ten_multiples_capacity_limited`: people do the same
    capacity-limited Bayesian learning over rules and numerical ranges, with "multiples
    of 5" being its own readily entertained kind of rule because it fits base-ten
    notation, and with each added example contributing less evidence. But before seeing
    any example they also expect the program''s numerical range to be narrow: a range''s
    prior plausibility falls as a fitted power of its width, instead of every range
    being equally plausible. The single change is grafting this narrow-range expectation
    (from `narrow_range_prior_capacity_limited`) onto the base-ten model. Because
    the expectation comes before the evidence, the capacity limit does not dilute
    it, so for sets that no rule explains (e.g. mixed odd and even numbers) people
    keep their yeses closer to the examples'' span than the base-ten model predicts,
    while its multiples-of-5 generalization stays the same.'
- name: extreme_examples_anchor_range_edges
  rationale: "People do the same capacity-limited Bayesian learning over mathematical\
    \ rules and numerical ranges as the best model (with \"multiples of 5\" as its\
    \ own, readily entertained kind of rule), but they read the smallest and the largest\
    \ example as marking where the program's range stops: a range whose lower edge\
    \ sits exactly at the smallest example, or whose upper edge sits exactly at the\
    \ largest example, is entertained more readily before any evidence is weighed\
    \ (a fitted boost per anchored edge). This predicts that, when ranges carry the\
    \ judgment, yeses fall off right at the extreme examples \u2014 fewer yeses to\
    \ targets just beyond them, more to targets inside their span \u2014 rather than\
    \ tapering gradually past them as the size principle alone implies."
- name: parity_conflict_decision_veto
  rationale: People infer the hidden concept by the same capacity-limited Bayesian
    learning over rules (with multiples of 5 as its own, base-ten-salient kind of
    rule) and numerical ranges as the best model, but a number's parity is registered
    automatically and effortlessly, so at the moment of judging a target whose parity
    matches none of the examples, that conflict intrudes on the decision and, on a
    fixed fraction of such trials, overrides the inferred concept and produces a "no".
    This decision-stage parity interference predicts that in all-odd or all-even sets,
    opposite-parity targets that the inferred concept covers (for example odd numbers
    inside the span of 20, 32, 92) get fewer yeses than the concept alone implies,
    while same-parity targets are unaffected.
- name: query_as_evidence_concept_learning
  rationale: 'People infer the hidden concept by the same capacity-limited Bayesian
    learning over rules (with multiples of 5 as its own, base-ten-salient kind of
    rule) and numerical ranges as the best model, but they do not treat the question
    as neutral: being asked about a particular number is itself read as information
    about the program, so before answering, the learner updates on the queried number
    as if it were a weak, extra observation (a pragmatic "why are they asking about
    this?" inference), with its strength and direction inferred from the data. If
    the question is read as a hint the target is produced, targets covered only by
    small concepts gain yeses; if it is read as a lure, fewer yeses go to every target
    and narrow concepts lose more than broad ones, which also lowers yeses on small
    sets, where the queried number weighs most against the little evidence the examples
    give.'
- name: repeated_digit_base_ten_rules
  rationale: 'Refinement of `base_ten_multiples_capacity_limited`: people do the same
    capacity-limited Bayesian learning over rules and numerical ranges, with "multiples
    of 5" as its own base-ten-salient kind of rule, but their space of candidate rules
    also includes a digit pattern that base-ten notation makes visually obvious and
    that the incumbent lacks entirely: numbers written with a repeated digit (11,
    22, 33, ..., 99), a new kind of rule with its own prior plausibility inferred
    from the data. The single change is adding this repeated-digit rule, predicting
    that sets such as 3, 33, 99 are generalized to other repdigits (88, 44) that no
    multiples, parity or final-digit rule covers, and that a single repdigit example
    (e.g. 33 or 44) earns fewer yeses for numerically close non-repdigits.'
- name: base_ten_fluency_graded_multiples
  rationale: 'Refinement of `multiplication_fluency_rule_prior`: people do capacity-limited
    Bayesian learning over rules and numerical ranges, and a "multiples of m" rule
    comes to mind less readily the larger m is, because checking divisibility by a
    larger number is less fluent mental arithmetic. The single change is grafting
    the base-ten account of multiples of 5 (from `base_ten_multiples_capacity_limited`)
    onto it: multiples of 5 are not a point on that fluency gradient but their own,
    separately plausible kind of rule because they fit our decimal notation, so the
    gradient describes only the non-decimal bases (3, 4, 6, 7, 8, 9, 11, 12). This
    predicts that sets such as 90, 100, 5 are generalized to every multiple of 5,
    while sets fitting multiples of 7, 9, 11 or 12 (e.g. 42, 35, 21, 84) are generalized
    less to the rule''s distant members and more to non-member numbers within the
    examples'' span than the best model predicts.'
- name: rule_familiarity_within_kinds
  rationale: "Refinement of `base_ten_multiples_capacity_limited`: people do the same\
    \ capacity-limited Bayesian learning over rules and numerical ranges, with a prior\
    \ plausibility for each kind of rule (odd, even, primes, squares/cubes, powers,\
    \ multiples, final digit, contained digit, and multiples of 5 as its own base-ten\
    \ kind), but the rules within a kind are not equally familiar \u2014 each rule\
    \ carries its own familiarity that raises or lowers its prior plausibility relative\
    \ to the other rules of its kind (a substantial, fixed amount of variation, with\
    \ each rule's familiarity inferred from the data). The single change is replacing\
    \ the equal sharing of a kind's plausibility among its rules with these rule-specific\
    \ familiarities, predicting that some rules (e.g. multiples of 7, or \"contains\
    \ the digit 1\") are rarely entertained even when the examples fit them, so those\
    \ sets are generalized by range rather than by the rule, while other rules of\
    \ the same kind (e.g. powers of 10, multiples of 11) are adopted readily."
- name: sticky_running_guess_revision
  rationale: "People read the examples in the order shown and hold a single running\
    \ guess about the program's concept (a mathematical rule or a numerical range),\
    \ formed from the first example by the same capacity-limited Bayesian learning\
    \ as the best model; each new example only revises that guess when it has to \u2014\
    \ a guess the new example fits is kept with a fitted probability (stickiness),\
    \ and only otherwise is a new guess drawn from everything seen so far. Because\
    \ guesses formed from early examples can outlive the evidence of later ones, the\
    \ same examples shown in a different order are generalized differently, and broad\
    \ concepts suggested by the first example survive longer than an order-blind learner\
    \ allows."
- name: feature_contrast_set_similarity
  rationale: 'People do not infer a hidden concept; they judge the target by its similarity
    to the example set on a feature-contrast metric: what counts is how many of the
    properties all the examples share (parity, primes, squares, powers, multiples,
    final or contained digit, weighted by how rare and thus distinctive each property
    is) the target also has, relative to the shared properties it lacks, together
    with how close the target lies to the nearest example on the number line (an exponentially
    falling gradient). The more similar the target is on this metric, the more likely
    people say yes, so a target that matches the examples'' common distinctive properties
    is accepted even far from them, while a target that breaks them is accepted only
    if numerically very close to an example.'
- name: sparse_rule_familiarity_within_kinds
  rationale: 'Refinement of `rule_familiarity_within_kinds`: people do the same capacity-limited
    Bayesian learning over rules and numerical ranges, with a prior plausibility for
    each kind of rule and rule-specific familiarities within each kind, but familiarity
    is sparse: most rules of a kind are about as familiar as one another and simply
    share the kind''s plausibility, while only a few stand out as exceptionally familiar
    (e.g. multiples of 11, powers of 10) or exceptionally unfamiliar (e.g. multiples
    of 7, "contains the digit 1"). The single change is replacing the incumbent''s
    evenly spread (normal) familiarities with heavy-tailed ones, which predicts that
    rules with no standout familiarity are generalized exactly as their kind''s other
    rules are, instead of each being nudged up or down by a moderate amount, while
    the few exceptional rules keep their large deviations.'
- name: familiar_rules_parity_conflict_veto
  rationale: 'Refinement of `rule_familiarity_within_kinds`: people do the same capacity-limited
    Bayesian learning over rules and numerical ranges, with each kind of rule having
    its own prior plausibility and each rule its own familiarity within that kind.
    On top of this, a number''s parity is registered automatically, so when the target''s
    parity matches none of the examples, that conflict intrudes at the moment of answering
    and, on a fixed fraction of those trials, overrides the inferred concept and produces
    a "no". The single change is grafting this decision-stage parity veto (from `parity_conflict_decision_veto`)
    onto the familiarity model. It predicts that in all-odd or all-even sets, opposite-parity
    targets that the inferred concept covers (for example odd numbers inside the span
    of 20, 32, 92) get fewer yeses than the concept implies, while same-parity targets
    are unaffected.'
- name: rule_or_range_kind_commitment
  rationale: 'People learn the hidden concept from the examples by the same capacity-limited
    Bayesian weighing of arithmetic rules and numerical ranges as the best model,
    but they do not blend the two kinds of explanation when they answer: they first
    commit to whether the program follows an arithmetic rule or produces a stretch
    of the number line, by comparing how well each kind as a whole explains the examples
    more decisively than an ideal learner would, and then judge the target only by
    the concepts of the kind they chose. This predicts that when rules and ranges
    both explain the examples moderately well, answers follow whichever kind is ahead
    more sharply than the blend implies, e.g. fewer yeses to far rule-members when
    ranges are slightly favored, and fewer yeses to in-span rule-violators when a
    rule is slightly favored.'
- name: parity_veto_sparse_familiar_rules
  rationale: 'Refinement of `parity_conflict_decision_veto`: people infer the hidden
    concept by capacity-limited Bayesian learning over rules (multiples of 5 as its
    own base-ten kind) and numerical ranges, and a target whose parity matches none
    of the examples triggers an automatic parity conflict that, on a fixed fraction
    of such trials, overrides the inferred concept with a "no". The single change
    is grafting sparse rule familiarity (from `sparse_rule_familiarity_within_kinds`)
    onto the concept-learning stage: most rules share their kind''s plausibility,
    and only a few stand out as exceptionally familiar (multiples of 11, powers of
    10) or unfamiliar (multiples of 7, "contains the digit 1"). The claim is that
    the decision-stage parity veto survives once rule priors are calibrated this way:
    opposite-parity targets in all-odd or all-even sets (e.g. odd numbers inside the
