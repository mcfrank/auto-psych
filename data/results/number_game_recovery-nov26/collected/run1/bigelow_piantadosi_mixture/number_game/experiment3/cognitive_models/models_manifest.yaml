models:
- name: evidence_graded_misfit_tolerance
  rationale: "Refinement of the incumbent misfit_tolerant_coincidence_rethink (a single\
    \ working concept guess \u2014 a rule or a numerical range \u2014 formed from\
    \ the first example by Bayesian concept learning, kept with fitted stickiness\
    \ while later examples fit it, digit rules discounted and salient only once two\
    \ examples share the digit, a newly noticed coincidence triggering a rethink,\
    \ fitted trust, and a contradicting example sometimes written off as a stray).\
    \ The one change: how readily people write off a contradicting example grows with\
    \ how much evidence their guess already has \u2014 each earlier example the guess\
    \ explains is an independent reason to keep it, so the chance of dismissing the\
    \ misfit is one minus the chance that none of those confirmations holds (the same\
    \ fitted tolerance per confirming example, zero for a guess that explains nothing).\
    \ So \"ends in 7\" survives an outlier 8 more often after 77, 17, 37 than after\
    \ 77, 17, and a misfit late in a long set is shrugged off more than one early\
    \ in a short set. (To keep the fit tractable, the incumbent's power-law preference\
    \ for where a range lies on the number line, which earlier rounds found the data\
    \ barely constrain, is fixed at neutral.)"
- name: distance_hesitant_concept_extension
  rationale: "People infer the program's concept as the current best learner does\
    \ (a single sticky working guess \u2014 a rule or a numerical range \u2014 formed\
    \ from the first example, with digit rules salient once two examples share a digit,\
    \ coincidences triggering a rethink, and misfits written off more readily the\
    \ more evidence the guess has), but they hesitate to extrapolate: even when the\
    \ target belongs to their guessed concept, their willingness to say the program\
    \ would produce it falls off smoothly (Gaussian-like) with how far the target\
    \ lies on the number line from the nearest example they have seen, at a fitted\
    \ reach. So far-away members of a rule \u2014 96 after a lone 16, 64 after a lone\
    \ 16 \u2014 are endorsed less than concept membership alone predicts, while members\
    \ close to an example are endorsed fully."
- name: gamma_width_range_prior_guess
  rationale: "Refinement of the incumbent evidence_graded_misfit_tolerance (a single\
    \ working concept guess \u2014 a rule or a numerical range \u2014 formed from\
    \ the first example by Bayesian concept learning, kept with fitted stickiness,\
    \ digit rules discounted and salient only once two examples share the digit, a\
    \ newly noticed coincidence triggering a rethink, fitted trust, and a contradicting\
    \ example written off as a stray more readily the more earlier examples the guess\
    \ explains). The one change: people's prior sense of how wide the program's range\
    \ of numbers is does not have the fixed Erlang form the incumbent assumes, but\
    \ a gamma form whose shape is fitted, so how implausible very narrow ranges hugging\
    \ the examples are, relative to how fast very broad ranges become implausible,\
    \ is set by the data. With a shape below the incumbent's, tight ranges around\
    \ clustered examples are more readily entertained while broad ranges stay plausible\
    \ longer, so people generalise sharply right around clustered examples but with\
    \ a longer tail out to distant numbers."
- name: rule_only_distance_hesitation
  rationale: "Refinement of distance_hesitant_concept_extension (a single sticky working\
    \ guess \u2014 a rule or a numerical range \u2014 formed from the first example\
    \ by Bayesian concept learning, digit rules salient once two examples share a\
    \ digit, coincidences triggering a rethink, misfits written off more readily the\
    \ more evidence the guess has, and a reluctance to extend the guessed concept\
    \ to targets far from the nearest example). The one change: that hesitation applies\
    \ only when the working guess is a rule, not a range. A range guess already says\
    \ where on the number line the program's numbers lie, so its members are endorsed\
    \ as fully as membership implies; but extending a rule such as \"powers of 2\"\
    \ or \"ends in 6\" to a member far from every example seen (64 or 96 after a lone\
    \ 16) feels like a leap, and willingness falls off smoothly with that distance\
    \ at a fitted reach \u2014 so generalisation from range guesses is not doubly\
    \ shrunk while far rule members still are."
- name: span_extrapolation_hesitant_guess
  rationale: "Refinement of the incumbent gamma_width_distance_hesitant_guess (a single\
    \ sticky working concept guess \u2014 a rule or a numerical range with a fitted\
    \ gamma-shaped width prior \u2014 formed from the first example by Bayesian concept\
    \ learning, digit rules salient once two examples share the digit, coincidences\
    \ triggering a rethink, fitted trust, evidence-graded misfit tolerance, and a\
    \ smooth reluctance to extend the guess far from the examples). The one change:\
    \ the reluctance is about extrapolation, not interpolation \u2014 people hesitate\
    \ only to extend their concept beyond the stretch of the number line the examples\
    \ already cover, so willingness falls off with the target's distance outside the\
    \ examples' span (smallest to largest example), while members lying between the\
    \ examples (32 after 16, 8, 64; 50 after 5, 20, 92) are endorsed as fully as membership\
    \ implies; for a single example this is the same as the incumbent."
- name: span_extrapolation_hesitant_guess_2
  rationale: "Refinement of the incumbent gamma_width_distance_hesitant_guess (a single\
    \ sticky working concept guess \u2014 a rule or a numerical range with a fitted\
    \ gamma-shaped width prior \u2014 formed from the first example by Bayesian concept\
    \ learning, digit rules salient once two examples share the digit, coincidences\
    \ triggering a rethink, fitted trust, evidence-graded misfit tolerance, and reluctance\
    \ to extend the guessed concept far from the examples). The one change: the reluctance\
    \ is to extrapolate beyond the region the examples span, not to stray from the\
    \ nearest example \u2014 a target lying between the smallest and largest example\
    \ is endorsed as fully as concept membership implies, and willingness falls off\
    \ smoothly (Gaussian-like, fitted reach) only with how far the target lies outside\
    \ that span. So after 46 and 86, a member such as 66 is not discounted at all,\
    \ while 96 or 6 are discounted by their distance beyond the span; for a single\
    \ example the prediction is unchanged. (To keep the fit tractable, the width prior's\
    \ decay is parameterised by a rate rather than a scale, so a near-flat decay is\
    \ reached smoothly instead of along a ridge to an infinite scale.)"
- name: range_reestimating_span_hesitant_guess
  rationale: "Refinement of span_extrapolation_hesitant_guess (a single working concept\
    \ guess \u2014 a rule or a numerical range with a fitted gamma-shaped width prior\
    \ \u2014 formed from the first example by Bayesian concept learning, kept with\
    \ fitted stickiness, digit rules salient once two examples share the digit, coincidences\
    \ triggering a rethink, fitted trust, evidence-graded misfit tolerance, and reluctance\
    \ to extend the concept beyond the examples' span). The one change: only rule\
    \ guesses are sticky \u2014 a guess about where on the number line the program's\
    \ numbers lie is never simply kept, but re-estimated from all the examples seen\
    \ whenever a new example arrives, so a range formed around the first example does\
    \ not persist and extrapolation beyond the span is no more generous on the first\
    \ example's side than on the later examples' side (while a rule such as \"ends\
    \ in 6\" is still kept with fitted stickiness and survives misfits as before)."
- name: rule_only_span_extrapolation_guess
  rationale: 'Refinement of the incumbent span_extrapolation_hesitant_guess_2 (a single
    sticky working concept guess, either a rule or a numerical range with a fitted
    gamma-shaped width prior, formed from the first example by Bayesian concept learning;
    digit rules salient once two examples share the digit; coincidences triggering
    a rethink; fitted trust; evidence-graded misfit tolerance; and reluctance to extend
    the concept beyond the span the examples cover). The one change: only rule guesses
    carry that reluctance to extrapolate. A range guess already states where on the
    number line the program''s numbers lie, so a target inside a guessed range is
    endorsed as fully as membership implies, even beyond the examples'' span. Extending
    a rule such as "powers of 2" or "ends in 6" to a member past the examples'' span
    (64 after 16 and 8, or 96 after 46 and 86) is a leap, though, and willingness
    falls off smoothly with how far beyond the span it lies.'
