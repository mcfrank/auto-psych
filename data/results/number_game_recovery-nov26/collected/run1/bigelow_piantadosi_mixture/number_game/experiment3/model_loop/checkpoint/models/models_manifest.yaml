models:
- name: coincidence_gated_all_rules_guess
  rationale: "Refinement of digit_coincidence_noticing_guess (a single working concept\
    \ guess \u2014 a rule or a numerical range \u2014 formed from the first example\
    \ by Bayesian concept learning and kept with fitted stickiness while later examples\
    \ fit it, digit rules discounted, fitted trust in the examples, and digit rules\
    \ made salient only once a digit is noticed as shared by at least two examples).\
    \ The one change: the same coincidence-noticing gate applies to arithmetic rules\
    \ too \u2014 \"even\", \"multiples of 7\" or \"squares\" becomes a salient candidate\
    \ only once at least two of the examples seen so far share that property, and\
    \ until then (always after a single example) its plausibility is reduced by its\
    \ own fitted availability factor. So a lone example suggests a range of nearby\
    \ numbers rather than a broad rule, people generalise less to far-away numbers\
    \ from one example, and the first working guess is range-like until a shared property\
    \ is noticed."
- name: compressed_concept_size_sticky_guess
  rationale: "People learn the concept as in the current best model (a single sticky\
    \ working guess \u2014 a rule or a numerical range \u2014 formed from the first\
    \ example by Bayesian concept learning, with the size principle favouring small\
    \ concepts), but with one distortion: they misjudge how many numbers a candidate\
    \ concept contains, perceiving concept size on a compressed, numerosity-like scale\
    \ relative to the whole range 1-100 (with the compression fitted). So they feel\
    \ \"powers of 2\" or a narrow range is less small, and \"even numbers\" less large,\
    \ than it really is, which weakens (or, if expanded, strengthens) the size principle's\
    \ preference for specific concepts without changing how strongly a non-fitting\
    \ example counts against a guess."
- name: coincidence_triggered_guess_rethink
  rationale: "Refinement of the incumbent digit_coincidence_noticing_guess (a single\
    \ working concept guess \u2014 a rule or a numerical range \u2014 formed from\
    \ the first example by Bayesian concept learning, kept with fitted stickiness\
    \ while later examples fit it, digit rules discounted and made salient only once\
    \ a digit is noticed as shared by at least two examples, fitted trust in the examples).\
    \ The one change: noticing a coincidence is itself a trigger to rethink. When\
    \ a new example makes people notice a digit it shares with an earlier example,\
    \ they drop their current guess with a fitted probability and reconsider the concept\
    \ from all the examples, even if that guess still fits. So after 46 then 86, a\
    \ range guess formed from 46 that happens to contain 86 is often given up in favour\
    \ of \"ends in 6\", and far numbers like 96 are endorsed more than the purely\
    \ sticky learner predicts."
- name: graded_digit_salience_guess
  rationale: "Refinement of digit_coincidence_noticing_guess (a single working concept\
    \ guess \u2014 a rule or a numerical range \u2014 formed from the first example\
    \ by Bayesian concept learning, kept with fitted stickiness while later examples\
    \ fit it, digit rules discounted, fitted trust in the examples, and rules about\
    \ how numbers are written made salient only by a noticed shared digit). The one\
    \ change: noticing a shared digit is not all-or-none at two examples but grows\
    \ with every example that carries it \u2014 the reduced plausibility of a written-form\
    \ rule (\"ends in 6\", \"contains a 3\") is divided among the examples that have\
    \ its digit, so it is fully reduced with one such example, half as reduced with\
    \ two, a third with three \u2014 making \"ends in 6\" a gradually more salient\
    \ guess as more examples repeat the digit, rather than fully salient as soon as\
    \ two do."
- name: coincidence_salience_guess_revision
  rationale: "Refinement of coincidence_gated_all_rules_guess (a single sticky working\
    \ guess \u2014 a rule or a numerical range \u2014 formed from the first example\
    \ by Bayesian concept learning, with rules made salient only once two examples\
    \ share them). The one change: noticing a coincidence is itself a trigger for\
    \ rethinking \u2014 when a new example makes a rule shared by two examples for\
    \ the first time, people abandon their current guess and reconsider the concept\
    \ from all examples (even if the guess still fits) with a probability equal to\
    \ how compelling the newly noticed rule is given the examples so far, with no\
    \ extra free parameter. So a striking pattern revealed by later examples overrides\
    \ a guess formed from an unrepresentative first example, while a weak coincidence\
    \ barely unsettles it, and order effects are weaker than pure stickiness predicts."
- name: misfit_tolerant_coincidence_rethink
  rationale: "Refinement of the incumbent coincidence_triggered_guess_rethink (a single\
    \ working concept guess \u2014 a rule or a numerical range \u2014 formed from\
    \ the first example by Bayesian concept learning, kept with fitted stickiness\
    \ while later examples fit it, digit rules discounted and made salient only once\
    \ a digit is shared by two examples, a newly noticed coincidence triggering a\
    \ rethink, fitted trust in the examples). The one change: a guess is not automatically\
    \ abandoned when a new example contradicts it \u2014 people sometimes write the\
    \ misfitting example off as a stray number and keep their guess, with a fitted\
    \ tolerance. So after 77 and 17 a guess of \"ends in 7\" often survives the outlier\
    \ 8, and targets fitting the early examples' concept are still endorsed despite\
    \ a later example that breaks it."
- name: coincidence_noticing_guess_vote
  rationale: "Refinement of digit_coincidence_noticing_guess (a single sticky working\
    \ concept guess \u2014 a rule or a numerical range \u2014 formed from the first\
    \ example by Bayesian concept learning, digit rules discounted and made salient\
    \ only once a digit is noticed as shared by two examples, fitted trust in the\
    \ examples). The one change, the component taken from sampled_guess_vote_threshold:\
    \ people do not answer by consulting a single guess, but call to mind several\
    \ guesses generated by this learner and say \"yes\" only if a sufficient share\
    \ of them contain the target, with the effective number of guesses and the share\
    \ required fitted. So the same belief maps onto a sharpened or softened, more\
    \ liberal or more conservative yes rate \u2014 e.g. targets that only some plausible\
    \ guesses contain (96 after 46 and 86) can be endorsed less, and near-certain\
    \ members more, than probability matching predicts."
- name: noisy_criterion_belief_threshold
  rationale: 'People infer the concept as the simplest current sticky-guess learner
    does, but they do not answer by probability matching: they compare how strongly
    they believe the target belongs against a fixed internal criterion of how sure
    they must be, and that comparison is perturbed by trial-to-trial noise in the
    felt belief, so they say "yes" with a probability that rises smoothly (logistically)
    with belief strength around the criterion. This noisy criterion produces both
    a ceiling below 1 for certain members (the examples themselves) and a floor above
    0 for clear non-members, and makes moderately believed targets fall clearly on
    one side of the criterion rather than being endorsed in proportion to belief.'
- name: compressed_line_category_exemplars
  rationale: 'People do not infer the program''s concept; they retrieve familiar number
    categories (rules such as "even" or "powers of 2", and ranges bounded by multiples
    of five) stored in memory as lists of their member numbers, activating each category
    by how similar the examples are to its stored members, and endorse the target
    by its similarity to the nearest member of the activated categories. The comparison
    is made on a compressed mental number line (compression fitted), so the same numerical
    gap counts as less dissimilar among large numbers than among small ones: generalisation
    from large examples (e.g. 82, 92) spreads further than from small ones (e.g. 2,
    12), and small categories crowded among small numbers are matched more sharply.'
- name: evidence_graded_misfit_tolerance
  rationale: "Refinement of the incumbent misfit_tolerant_coincidence_rethink (a single\
    \ working concept guess \u2014 a rule or a numerical range \u2014 formed from\
    \ the first example by Bayesian concept learning, kept with fitted stickiness\
    \ while later examples fit it, digit rules discounted and salient only once two\
    \ examples share the digit, a newly noticed coincidence triggering a rethink,\
    \ fitted trust, and a contradicting example sometimes written off as a stray).\
    \ The one change: how readily people write off a contradicting example grows with\
    \ how much evidence their guess already has \u2014 each earlier example the guess\
    \ explains is an independent reason to keep it, so the chance of dismissing the\
    \ misfit is one minus the chance that none of those confirmations holds (the same\
    \ fitted tolerance per confirming example, zero for a guess that explains nothing).\
    \ So \"ends in 7\" survives an outlier 8 more often after 77, 17, 37 than after\
    \ 77, 17, and a misfit late in a long set is shrugged off more than one early\
    \ in a short set. (To keep the fit tractable, the incumbent's power-law preference\
    \ for where a range lies on the number line, which earlier rounds found the data\
    \ barely constrain, is fixed at neutral.)"
- name: justification_search_noisy_or
  rationale: "People do not weigh competing explanations against one another; they\
    \ answer by searching memory for any familiar explanation (a rule such as \"even\"\
    \ or \"ends in 6\", or a numerical range) that covers both the examples and the\
    \ target, and say \"yes\" as soon as one comes to mind. Each explanation comes\
    \ to mind with a chance that grows with how well it accounts for the examples\
    \ on its own (how plausible it is and how surprising the examples would be without\
    \ it), so a target is endorsed by the absolute evidence for explanations that\
    \ include it, not by its share relative to better explanations that exclude it\
    \ \u2014 e.g. after 16, 8, 2, 64, \"even\" can still come to mind and license\
    \ 10, even though \"powers of 2\" fits far better."
- name: weak_sampling_range_guess
  rationale: 'Refinement of evidence_graded_misfit_tolerance (a single working concept
    guess, either a rule or a numerical range, formed from the first example by Bayesian
    concept learning; kept with fitted stickiness; digit rules salient only once two
    examples share the digit; a noticed coincidence triggering a rethink; fitted trust;
    misfits written off more readily the more examples the guess already explains).
    The one change: people apply the size principle only to rules, never to ranges.
    They think of a range as a region the program''s numbers merely fall in, not as
    a pool the examples were drawn from, so a range that covers the examples gets
    no extra credit for being tight, and only their prior sense of a typical range
    width decides how far they generalise. Where this disagrees most with the best
    model: for clustered examples (24,35; 68,58; 83,77), and more so the more examples
    there are, it predicts that targets well outside the examples'' span are still
    endorsed, because generalisation does not tighten toward the span as examples
    accumulate. Range guesses also compete less with rules.'
- name: distance_hesitant_concept_extension
  rationale: "People infer the program's concept as the current best learner does\
    \ (a single sticky working guess \u2014 a rule or a numerical range \u2014 formed\
    \ from the first example, with digit rules salient once two examples share a digit,\
    \ coincidences triggering a rethink, and misfits written off more readily the\
    \ more evidence the guess has), but they hesitate to extrapolate: even when the\
    \ target belongs to their guessed concept, their willingness to say the program\
    \ would produce it falls off smoothly (Gaussian-like) with how far the target\
    \ lies on the number line from the nearest example they have seen, at a fitted\
    \ reach. So far-away members of a rule \u2014 96 after a lone 16, 64 after a lone\
    \ 16 \u2014 are endorsed less than concept membership alone predicts, while members\
    \ close to an example are endorsed fully."
- name: compressed_size_misfit_tolerant_guess
  rationale: "Refinement of misfit_tolerant_coincidence_rethink (a single working\
    \ concept guess \u2014 a rule or a numerical range \u2014 formed from the first\
    \ example by Bayesian concept learning, kept with fitted stickiness while later\
    \ examples fit it, digit rules discounted and salient only once two examples share\
    \ the digit, a newly noticed coincidence triggering a rethink, fitted trust, and\
    \ a contradicting example sometimes written off as a stray). The one change, the\
    \ component taken from compressed_concept_size_sticky_guess: people misjudge how\
    \ many numbers a candidate concept contains, perceiving its size on a compressed,\
    \ numerosity-like scale relative to the whole range 1-100 (compression fitted),\
    \ so \"powers of 2\" or a narrow range feels less small and \"even numbers\" less\
    \ large than they are \u2014 tempering the size principle's preference for specific\
    \ concepts, and so changing which guess people first latch onto and which one\
    \ a rethink lands on, while a misfitting example still counts against a guess\
    \ as before."
- name: gamma_width_range_prior_guess
  rationale: "Refinement of the incumbent evidence_graded_misfit_tolerance (a single\
    \ working concept guess \u2014 a rule or a numerical range \u2014 formed from\
    \ the first example by Bayesian concept learning, kept with fitted stickiness,\
    \ digit rules discounted and salient only once two examples share the digit, a\
    \ newly noticed coincidence triggering a rethink, fitted trust, and a contradicting\
    \ example written off as a stray more readily the more earlier examples the guess\
    \ explains). The one change: people's prior sense of how wide the program's range\
    \ of numbers is does not have the fixed Erlang form the incumbent assumes, but\
    \ a gamma form whose shape is fitted, so how implausible very narrow ranges hugging\
    \ the examples are, relative to how fast very broad ranges become implausible,\
    \ is set by the data. With a shape below the incumbent's, tight ranges around\
    \ clustered examples are more readily entertained while broad ranges stay plausible\
    \ longer, so people generalise sharply right around clustered examples but with\
    \ a longer tail out to distant numbers."
- name: sample_size_insensitive_guess
  rationale: "People learn the program's concept as the current best learner does\
    \ (a single sticky working guess \u2014 a rule or a numerical range \u2014 formed\
    \ from the first example by Bayesian concept learning, with digit rules salient\
    \ once two examples share a digit, a noticed coincidence triggering a rethink,\
    \ and misfits written off more readily the more evidence the guess has), but with\
    \ one classic distortion, insensitivity to sample size: they treat successive\
    \ examples as partly redundant, so the evidence from several examples counts for\
    \ less than the sum of each example's evidence, growing only as a fitted power\
    \ of the number of examples seen. As a result, when they form or rethink a guess\
    \ from several examples, the preference for the smallest concept consistent with\
    \ them (and the penalty for a guess that misses an example) sharpens less with\
    \ each added example than a normative learner's would, while generalisation from\
    \ a single example is unchanged."
- name: gamma_width_distance_hesitant_guess
  rationale: "Refinement of the incumbent gamma_width_range_prior_guess (a single\
    \ working concept guess \u2014 a rule or a numerical range with a gamma-shaped\
    \ prior on its width, shape fitted \u2014 formed from the first example by Bayesian\
    \ concept learning, kept with fitted stickiness, digit rules discounted and salient\
    \ only once two examples share the digit, a newly noticed coincidence triggering\
    \ a rethink, fitted trust, and misfits written off more readily the more examples\
    \ the guess explains). The one change, the component taken from distance_hesitant_concept_extension:\
    \ people hesitate to extrapolate their guessed concept, so even for a target inside\
    \ it their willingness to say the program would produce it falls off smoothly\
    \ (Gaussian-like) with the target's distance on the number line from the nearest\
    \ example, at a fitted reach. With far members of rules thus discounted at the\
    \ answer stage, the range-width prior is free to settle where the near-example\
    \ gradient demands, so the claim is that both a heavy-tailed sense of range width\
    \ and reluctance to extend far from the examples shape generalisation."
- name: rule_only_distance_hesitation
  rationale: "Refinement of distance_hesitant_concept_extension (a single sticky working\
    \ guess \u2014 a rule or a numerical range \u2014 formed from the first example\
    \ by Bayesian concept learning, digit rules salient once two examples share a\
    \ digit, coincidences triggering a rethink, misfits written off more readily the\
    \ more evidence the guess has, and a reluctance to extend the guessed concept\
    \ to targets far from the nearest example). The one change: that hesitation applies\
    \ only when the working guess is a rule, not a range. A range guess already says\
    \ where on the number line the program's numbers lie, so its members are endorsed\
    \ as fully as membership implies; but extending a rule such as \"powers of 2\"\
    \ or \"ends in 6\" to a member far from every example seen (64 or 96 after a lone\
    \ 16) feels like a leap, and willingness falls off smoothly with that distance\
    \ at a fitted reach \u2014 so generalisation from range guesses is not doubly\
    \ shrunk while far rule members still are."
- name: span_extrapolation_hesitant_guess
  rationale: "Refinement of the incumbent gamma_width_distance_hesitant_guess (a single\
    \ sticky working concept guess \u2014 a rule or a numerical range with a fitted\
    \ gamma-shaped width prior \u2014 formed from the first example by Bayesian concept\
    \ learning, digit rules salient once two examples share the digit, coincidences\
    \ triggering a rethink, fitted trust, evidence-graded misfit tolerance, and a\
    \ smooth reluctance to extend the guess far from the examples). The one change:\
    \ the reluctance is about extrapolation, not interpolation \u2014 people hesitate\
    \ only to extend their concept beyond the stretch of the number line the examples\
    \ already cover, so willingness falls off with the target's distance outside the\
    \ examples' span (smallest to largest example), while members lying between the\
    \ examples (32 after 16, 8, 64; 50 after 5, 20, 92) are endorsed as fully as membership\
    \ implies; for a single example this is the same as the incumbent."
- name: span_extrapolation_hesitant_guess_2
  rationale: "Refinement of the incumbent gamma_width_distance_hesitant_guess (a single\
    \ sticky working concept guess \u2014 a rule or a numerical range with a fitted\
    \ gamma-shaped width prior \u2014 formed from the first example by Bayesian concept\
    \ learning, digit rules salient once two examples share the digit, coincidences\
    \ triggering a rethink, fitted trust, evidence-graded misfit tolerance, and reluctance\
    \ to extend the guessed concept far from the examples). The one change: the reluctance\
    \ is to extrapolate beyond the region the examples span, not to stray from the\
    \ nearest example \u2014 a target lying between the smallest and largest example\
    \ is endorsed as fully as concept membership implies, and willingness falls off\
    \ smoothly (Gaussian-like, fitted reach) only with how far the target lies outside\
    \ that span. So after 46 and 86, a member such as 66 is not discounted at all,\
    \ while 96 or 6 are discounted by their distance beyond the span; for a single\
    \ example the prediction is unchanged. (To keep the fit tractable, the width prior's\
    \ decay is parameterised by a rate rather than a scale, so a near-flat decay is\
    \ reached smoothly instead of along a ridge to an infinite scale.)"
- name: same_step_progression_concepts
  rationale: "Refinement of span_extrapolation_hesitant_guess_2 (a single sticky working\
    \ guess \u2014 a rule or a numerical range with a fitted gamma-shaped width prior\
    \ \u2014 formed from the first example by Bayesian concept learning, pattern rules\
    \ salient once two examples share them, a newly noticed coincidence triggering\
    \ a rethink, fitted trust, evidence-graded misfit tolerance, and reluctance to\
    \ extrapolate beyond the examples' span). The one change is to the space of concepts:\
    \ people also entertain same-step arithmetic progressions with any offset \u2014\
    \ numbers a fixed step of 3 to 12 apart that are not multiples of it, such as\
    \ 1, 7, 13, \u2026, 97 for 91, 25, 61, 31 or 2, 7, 12, \u2026, 97 for 82, 67,\
    \ 72 \u2014 which, like the written-form \"ends in d\" rules (the step-10 progressions),\
    \ share one fitted a-priori plausibility and become salient guesses only once\
    \ at least two examples seen so far lie on the same progression."
- name: fan_retrieval_member_similarity
  rationale: "People do not infer the program's concept; they retrieve familiar number\
    \ categories from memory \u2014 rules such as \"even\", \"powers of 2\" or \"\
    ends in 6\", and stretches of the number line \u2014 each stored as the list of\
    \ its member numbers. Each example cues the categories that store it, with a memory\
    \ fan effect: a cue's strength is diluted by how many members the category stores,\
    \ and an example a category does not store counts only as a stray number. The\
    \ target is then endorsed by how similar it is, on the number line, to the nearest\
    \ stored member of each retrieved category (similarity falling off exponentially\
    \ at a fitted rate), so near-misses just outside a range or beside a rule's members\
    \ are partly endorsed, and because all the examples cue memory together, their\
    \ order does not matter (no anchoring on the first example)."
- name: intuitive_statistician_range_estimate
  rationale: People do not generalise along the number line by weighing every possible
    range the program might use; when they think the program produces numbers from
    a range, they estimate that range like an intuitive statistician, from the smallest
    and largest examples seen, extending it beyond each extreme by a margin that is
    a fitted base amount plus a fitted share of the examples' spread per example (as
    in estimating a population's range from a sample), and re-estimating it from all
    examples as each new one arrives. Because the estimate depends only on the extremes
    and the number of examples, range-based generalisation is symmetric about the
    examples and independent of their order (no extra extension on the first example's
    side), while rule guesses ("powers of 2", "ends in 6") are formed and kept as
    in the current sticky single-guess learner.
- name: range_reestimating_span_hesitant_guess
  rationale: "Refinement of span_extrapolation_hesitant_guess (a single working concept\
    \ guess \u2014 a rule or a numerical range with a fitted gamma-shaped width prior\
    \ \u2014 formed from the first example by Bayesian concept learning, kept with\
    \ fitted stickiness, digit rules salient once two examples share the digit, coincidences\
    \ triggering a rethink, fitted trust, evidence-graded misfit tolerance, and reluctance\
    \ to extend the concept beyond the examples' span). The one change: only rule\
    \ guesses are sticky \u2014 a guess about where on the number line the program's\
    \ numbers lie is never simply kept, but re-estimated from all the examples seen\
    \ whenever a new example arrives, so a range formed around the first example does\
    \ not persist and extrapolation beyond the span is no more generous on the first\
    \ example's side than on the later examples' side (while a rule such as \"ends\
    \ in 6\" is still kept with fitted stickiness and survives misfits as before)."
- name: rule_only_span_extrapolation_guess
  rationale: 'Refinement of the incumbent span_extrapolation_hesitant_guess_2 (a single
    sticky working concept guess, either a rule or a numerical range with a fitted
    gamma-shaped width prior, formed from the first example by Bayesian concept learning;
    digit rules salient once two examples share the digit; coincidences triggering
    a rethink; fitted trust; evidence-graded misfit tolerance; and reluctance to extend
    the concept beyond the span the examples cover). The one change: only rule guesses
    carry that reluctance to extrapolate. A range guess already states where on the
    number line the program''s numbers lie, so a target inside a guessed range is
    endorsed as fully as membership implies, even beyond the examples'' span. Extending
    a rule such as "powers of 2" or "ends in 6" to a member past the examples'' span
    (64 after 16 and 8, or 96 after 46 and 86) is a leap, though, and willingness
    falls off smoothly with how far beyond the span it lies.'
