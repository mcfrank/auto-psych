models:
- name: centre_weighted_range_sampling
  rationale: "Refinement of `erlang_interval_size_family_prior`: people do the same\
    \ Bayesian concept learning over number rules and numeric ranges, with the size\
    \ principle, a prior mass per concept family (exception rules in their own family)\
    \ and an Erlang prior over range width, but they do not expect a range-based program\
    \ to produce every number in its range equally often \u2014 they expect its outputs\
    \ to cluster toward the middle of the range, with how strongly they do so inferred\
    \ from the data (none recovers the parent model). The one change is this centre-weighted\
    \ sampling from ranges: examples sitting at a range's edge are a \"suspicious\
    \ coincidence\" for it, so ranges that are centred on the examples and extend\
    \ beyond the lowest and highest example gain support, and people say \"yes\" to\
    \ targets somewhat past the examples' extremes more often than a uniform-sampling\
    \ learner predicts."
- name: centre_weighted_ranges_with_thresholds
  rationale: Refinement of `threshold_concepts_erlang_interval`, adding one component
    from `centre_weighted_range_sampling`. People do the same Bayesian concept learning
    over number rules, bounded ranges (with an Erlang prior on width) and one-sided
    thresholds (their own family), with the size principle and a prior mass per concept
    family. The one change is that people expect a bounded-range program ("numbers
    between 30 and 50") to produce numbers clustered toward the middle of its range,
    while a threshold program ("numbers above 60") still produces its members evenly.
    How strongly ranges cluster is inferred from the data, and zero recovers the incumbent.
    An example at a range's edge is then a suspicious coincidence, so ranges centred
    on the examples that reach past them gain belief relative to thresholds and rules.
- name: without_replacement_size_principle
  rationale: "Refinement of `threshold_concepts_erlang_interval`: people do the same\
    \ Bayesian concept learning over number rules, bounded ranges (with an Erlang\
    \ prior on width) and one-sided thresholds, with a prior mass per concept family,\
    \ but they believe the program never repeats itself \u2014 each example is a member\
    \ of the concept not already shown, drawn without replacement. The one change\
    \ is this without-replacement size principle, which makes the \"suspicious coincidence\"\
    \ grow faster than an ideal with-replacement learner's whenever the examples use\
    \ up a large share of a small concept: sets that nearly exhaust a tiny rule or\
    \ a narrow range (e.g. 4 of the 7 powers of 2, or 11, 15 filling a five-number\
    \ band) favour that tight concept even more strongly, so people reject targets\
    \ just outside it more often than the best model predicts, while sets that are\
    \ few relative to every candidate concept behave as before."
- name: round_number_range_boundaries
  rationale: "People infer the hidden program as an ideal Bayesian concept learner\
    \ would (number rules, bounded ranges and one-sided thresholds, weighed by family\
    \ plausibility, range width and the size principle, with examples drawn without\
    \ repetition), but their sense of how plausible a bounded range is is biased by\
    \ round numbers: multiples of ten act as cognitive reference points, so a range\
    \ whose lower or upper boundary falls exactly on one (e.g. 20-37 or 40-60) is\
    \ judged more, or less, likely a priori than an otherwise identical range, with\
    \ the direction and strength of this round-number bias inferred from the data.\
    \ This shifts where people stop saying \"yes\" near multiples of ten \u2014 for\
    \ example whether 40 is included after examples in the low thirties \u2014 while\
    \ leaving rule-based generalisation unchanged."
- name: without_replacement_primes_family
  rationale: "Refinement of `without_replacement_size_principle`, adding one component\
    \ from `threshold_concepts_primes_family`: people do the same Bayesian concept\
    \ learning over number rules, bounded ranges (with an Erlang prior on width) and\
    \ one-sided thresholds, with a prior mass per concept family, and they believe\
    \ the program never repeats itself, so examples are drawn from the concept without\
    \ replacement. The one change is that \"prime numbers\" is no longer lumped with\
    \ squares, cubes and powers in a shared special-sets family but forms its own\
    \ family with a separately inferred prior mass, so prime-like sets (e.g. 3, 7\
    \ or 53, 2) are read as \"primes\" \u2014 people endorse other primes and reject\
    \ nearby composites \u2014 independently of how plausible squares or powers are,\
    \ while the without-replacement coincidence still sharpens generalisation for\
    \ sets that use up much of a small concept."
- name: first_example_evidence_weight
  rationale: 'People infer the hidden program as an ideal Bayesian concept learner
    would (number rules, bounded ranges with a round-number bias on their edges, and
    one-sided thresholds, weighed by family plausibility, range width and the size
    principle, with examples drawn without repetition), but they revise their belief
    example by example in the order shown and the first example carries its own evidential
    weight: met before they have any guess about the program, the opening example
    counts as a looser (or, if the data say so, stronger) piece of evidence than each
    later example, which counts normally. So the "suspicious coincidence" that the
    first example points to a tight concept is discounted relative to later examples,
    which matters most for single-example sets and for which example of a set is shown
    first.'
- name: round_number_ranges_primes_family
  rationale: "Refinement of `round_number_range_boundaries`, adding one component\
    \ from `without_replacement_primes_family`: people do the same Bayesian concept\
    \ learning over number rules, bounded ranges (Erlang width prior, with a learned\
    \ round-number bias on ranges whose boundaries fall on multiples of ten) and one-sided\
    \ thresholds, with a prior mass per concept family and examples drawn without\
    \ replacement. The one change is that \"prime numbers\" is no longer lumped with\
    \ squares, cubes and powers in a shared special-sets family but forms its own\
    \ family with a separately inferred prior mass, so prime-like sets (e.g. 3, 7\
    \ or 53, 2) are read as \"primes\" \u2014 people endorse other primes and reject\
    \ nearby composites \u2014 independently of how plausible squares or powers are,\
    \ while the round-number bias still shapes where magnitude-based \"yes\" answers\
    \ stop."
- name: graded_belief_criterion_decision
  rationale: 'People infer the hidden program as an ideal Bayesian concept learner
    would (number rules, bounded ranges with a typical width, and one-sided thresholds,
    with the size principle and examples drawn without repetition), but they do not
    simply say "yes" with the probability they believe the target belongs. Instead
    they weigh how strongly they believe it belongs against a personal response criterion,
    with some response noise: the criterion sets a bias toward "yes" or "no", and
    the noise sets whether answers are more decisive than the belief (a soft threshold)
    or more hedged than it, so partly-believed targets are pushed toward or away from
    the extremes in the same way for every set.'
- name: graded_prior_digit_sum_concepts
  rationale: "People infer the hidden program as a Bayesian concept learner over number\
    \ rules and numeric ranges (with family plausibility, the size principle, a preference\
    \ for moderate range widths, and range outputs clustered toward the range's middle),\
    \ and their space of candidate programs also includes digit-sum rules \u2014 \"\
    numbers whose digits add up to s\" (e.g. 5, 14, 23, 32, 41, 50) \u2014 as a family\
    \ with its own prior plausibility. Within that family, sums are not equally natural:\
    \ how plausible a digit-sum rule is a priori changes smoothly with the size of\
    \ the sum, in a direction and strength inferred from the data. So when the examples\
    \ share a digit sum, people endorse other numbers with that sum and reject neighbours\
    \ with a different sum, and they do so more strongly for the favoured sums."
- name: attention_weighted_set_prototype
  rationale: "People do not infer a hidden rule; they abstract a single prototype\
    \ of the example set \u2014 its typical magnitude and spread on the number line,\
    \ and the profile of familiar number properties (parity, multiples, final and\
    \ contained digits, primes, squares, powers) the examples tend to have \u2014\
    \ and say \"yes\" to a target in proportion to its similarity to that prototype.\
    \ Attention to a property grows with how consistently the examples share it, and\
    \ rarer, more distinctive properties count more, so a target is rejected mainly\
    \ for lacking properties that all the examples have in common or for lying far\
    \ from the examples' typical magnitude relative to their spread."
- name: centre_weighted_ranges_primes_family
  rationale: "Refinement of `centre_weighted_range_sampling`, adding one component\
    \ from `without_replacement_primes_family`: people do the same Bayesian concept\
    \ learning over number rules and numeric ranges, with the size principle, a prior\
    \ mass per concept family (exception rules in their own family), an Erlang prior\
    \ over range width and range outputs expected to cluster toward the middle of\
    \ the range. The one change is that \"prime numbers\" is no longer lumped with\
    \ squares, cubes and powers in a shared special-sets family but forms its own\
    \ family with a separately inferred prior mass, so how readily people read prime-like\
    \ sets (e.g. 3, 7 or 53, 2) as \"primes\" \u2014 endorsing other primes and rejecting\
    \ nearby composites \u2014 no longer depends on how plausible squares or powers\
    \ are."
- name: centre_weighted_ranges_digit_sums
  rationale: 'Refinement of `centre_weighted_range_sampling`, adding one component
    from `digit_sum_concepts_threshold_erlang`: people do the same Bayesian concept
    learning over number rules and numeric ranges, with the size principle, a prior
    mass per concept family (exception rules in their own family), an Erlang prior
    over range width, and range outputs expected to cluster toward the middle of the
    range. The one change is that the programs people consider also include digit-sum
    concepts, "numbers whose digits add up to s" (e.g. 5, 14, 23, 32, 41, 50), as
    a new family with its own inferred prior mass shared equally among the 18 possible
    sums. Because these concepts are tiny, examples that happen to share a digit sum
    are a suspicious coincidence, so people endorse other numbers with that sum, and
    reject nearby numbers with a different sum, more than the incumbent predicts.'
- name: centre_weighted_round_edge_ranges
  rationale: Refinement of `centre_weighted_ranges_with_thresholds`, adding one component
    from `round_number_range_boundaries`. People do the same Bayesian concept learning
    over number rules, bounded ranges (Erlang width prior, outputs expected to cluster
    toward the range's middle) and one-sided thresholds, with the size principle and
    a prior mass per concept family; the one change is that multiples of ten act as
    reference points in judging how plausible a bounded range is a priori, so a range
    whose lower or upper edge falls exactly on a multiple of ten is judged more or
    less likely than an otherwise identical range, with the direction and strength
    of this bias inferred from the data. Centre-weighting decides how far past the
    examples a range is expected to reach, and the round-number bias decides whether
    "yes" answers stop just before or exactly at a nearby multiple of ten (e.g. whether
    40 is endorsed after examples in the low thirties).
- name: round_edge_ranges_digit_sums
  rationale: 'Refinement of `centre_weighted_ranges_digit_sums`, adding one component
    from `round_number_range_boundaries`: people do the same Bayesian concept learning
    over number rules, digit-sum rules ("numbers whose digits add up to s", one family
    with an equal share per sum) and numeric ranges (Erlang width prior, outputs clustered
    toward the range''s middle), with the size principle and a prior mass per concept
    family. The one change is that multiples of ten act as reference points when people
    judge how plausible a range is a priori. A range whose lower or upper edge falls
    exactly on a multiple of ten is judged more or less likely than an otherwise identical
    range, with the direction and strength inferred from the data. So the digit-sum
    coincidence decides which rule-based numbers are endorsed, while the round-number
    bias decides whether magnitude-based "yes" answers stop just before or exactly
    at a nearby multiple of ten (e.g. whether 40 is endorsed after examples in the
    low thirties).'
- name: weak_sampling_hypothesis_elimination
  rationale: "People consider the same kinds of candidate programs as an ideal concept\
    \ learner \u2014 number rules (parity, primes, squares, powers, multiples, final\
    \ or contained digits, digit sums), each kind with its own prior plausibility,\
    \ and numeric ranges of a typical width \u2014 but they treat each example only\
    \ as a test the program passed, not as a sample it generated: programs that do\
    \ not contain an example are eliminated, and every program consistent with the\
    \ examples keeps its prior share however large it is, with no \"suspicious coincidence\"\
    \ favouring tight concepts. They say \"yes\" in proportion to how much of the\
    \ surviving, prior-weighted belief contains the target, so adding consistent examples\
    \ does not narrow generalisation (e.g. after 16, 8, 64 \"even\" stays as credible\
    \ as \"powers of 2\")."
- name: location_biased_range_prior
  rationale: 'People infer the hidden program as a Bayesian concept learner over number
    rules (including digit-sum rules such as "digits add up to 5") and numeric ranges
    of a typical width, but they do not regard a range as equally plausible wherever
    it sits on the number line: they expect a magnitude-based program to live in a
    particular region (lower or higher numbers), so a range''s prior plausibility
    rises or falls steadily with where its middle lies, with the direction and strength
    inferred from the data. The sharpest disagreement with the best model is in the
    direction of magnitude generalisation: after a single example or a tight cluster
    in mid-range, this model predicts asymmetric "yes" answers, more for targets on
    the favoured side of the examples than for equally distant targets on the other
    side, whereas the best model generalises symmetrically.'
- name: graded_digit_sums_primes_family
  rationale: "Refinement of `graded_prior_digit_sum_concepts`, adding one component\
    \ from `centre_weighted_ranges_primes_family`: people do the same Bayesian concept\
    \ learning over number rules, digit-sum rules (with a smoothly graded prior over\
    \ the sum) and centre-weighted numeric ranges with an Erlang width prior, the\
    \ size principle and a prior mass per concept family. The one change is that \"\
    prime numbers\" is no longer lumped with squares, cubes and powers in a shared\
    \ special-sets family but forms its own family with a separately inferred prior\
    \ mass, so how readily people read prime-like sets as \"primes\" \u2014 endorsing\
    \ other primes and rejecting nearby composites \u2014 no longer depends on how\
    \ plausible squares or powers are."
- name: sequential_kind_revision
  rationale: 'People infer the hidden program as a Bayesian concept learner over number
    rules (parity, special sets, multiples, final or contained digits, exception rules,
    digit sums) and numeric ranges of a typical width, but they read the examples
    one at a time and form an impression of what *kind* of program it is (a rule of
    some type, or a range) from the first example, which the later examples then revise
    by a different amount than an ideal learner would: later examples fully decide
    which program within a kind is meant, but the weight they get in deciding the
    kind itself is inferred from the data (less than full weight means sticking with
    the first impression; more than full weight means discounting it). So for multi-example
    sets, how much belief ends up on ranges versus rules (e.g. "a band around 16"
    versus "powers of 2" after 16, 8, 64) depends on which example came first, while
    single-example sets behave as in the ideal learner.'
- name: kind_level_overcommitment
  rationale: 'People infer the hidden program as a Bayesian concept learner over number
    rules (parity, special sets, multiples, final and contained digits, exception
    rules, digit sums) and numeric ranges of a typical width, with the size principle,
    but they reason in two stages and mis-weight the first: they first judge what
    kind of program it is (a parity rule, a multiples rule, a range, ...) and commit
    to the more convincing kinds more strongly (or, if the data say so, less strongly)
    than the evidence warrants, then generalise within each kind exactly as an ideal
    learner would. So when one kind of explanation is ahead (e.g. "a range" for 42,
    47), the competing kinds'' targets (other multiples, other numbers ending in the
    same digit) are endorsed less than Bayes predicts, while the choice among programs
    of the same kind is unaffected.'
- name: two_rule_disjunction_concepts
  rationale: People infer the hidden program as a Bayesian concept learner over number
    rules (parity, primes, squares, powers, multiples, final and contained digits,
    digit sums) and numeric ranges of a typical width, with the size principle, but
    they take every example as a genuine output of the program and almost never write
    one off as a random slip. Instead, an example that breaks the rule the others
    share is explained by a disjunctive program joining two simple rules ("ends in
    2 or ends in 7", "squares or multiples of 5"), a kind of program with its own
    prior plausibility, so after a set such as 92, 82, 27, 42 people endorse targets
    that satisfy either rule rather than only the majority rule.
- name: equal_prior_familiar_rules_digit_sums
  rationale: "Refinement of `graded_prior_digit_sum_concepts`: people do the same\
    \ Bayesian concept learning over number rules, digit-sum rules (with a prior that\
    \ changes smoothly with the sum) and numeric ranges (Erlang width prior, outputs\
    \ clustered toward the range's middle, the size principle), but they have no learned\
    \ preferences among the familiar kinds of arithmetic rule. The one change is to\
    \ the rule prior: every familiar rule \u2014 odd, even, primes, squares, cubes,\
    \ powers of m, multiples of k, \"ends in d\" \u2014 is equally plausible a priori,\
    \ with a single inferred share of belief for all of them together (instead of\
    \ a separate prior mass per family), and ad-hoc rules such as \"contains the digit\
    \ d\" or \"powers of 2 except 32\" are not entertained at all; so how readily\
    \ a set is read as, say, \"multiples of 7\" versus \"ends in 3\" depends only\
    \ on how well each rule explains the examples."
- name: graded_final_digit_digit_sum_concepts
  rationale: 'Refinement of `graded_prior_digit_sum_concepts`: people do the same
    Bayesian concept learning over number rules, digit-sum rules whose prior plausibility
    changes smoothly with the size of the sum, and numeric ranges with a preference
    for moderate-to-broad widths, the size principle and a prior plausibility per
    concept family. The one change is that final-digit rules ("numbers ending in d")
    are not equally natural either: within that family, how plausible a rule is a
    priori changes smoothly with the final digit, with direction and strength inferred
    from the data. So after examples that share a final digit, how readily people
    generalise to other numbers ending in that digit depends on which digit it is.
    (Range outputs are taken as uniform within the range: the incumbent''s centre-clustering
    was inferred to be essentially zero, and dropping it makes the model fast enough
    to fit.)'
- name: round_edge_digit_sums_primes_family
  rationale: Refinement of `round_edge_ranges_digit_sums`, adding one component from
    `centre_weighted_ranges_primes_family`. People do the same Bayesian concept learning
    over number rules, digit-sum rules ("numbers whose digits add up to s") and numeric
    ranges, with an Erlang width prior, range outputs clustered toward the middle,
    the size principle, a prior mass per concept family, and multiples of ten acting
    as preferred or avoided range edges. The one change is that "prime numbers" is
    no longer lumped with squares, cubes and powers in a shared special-sets family.
    Primes form their own family with a separately inferred prior mass, so how readily
    people read prime-like sets (e.g. 3, 7 or 53, 2) as "primes", endorsing other
    primes and rejecting nearby composites, no longer depends on how plausible squares
    or powers are.
- name: last_example_recency_weight
  rationale: 'People infer the hidden program as a Bayesian concept learner over familiar
    number rules (all equally plausible), digit-sum rules and numeric ranges of a
    typical width, with the size principle, but they read the examples in the order
    shown and the most recently seen example stays most vivid: it carries its own
    evidential weight (more than an earlier example if recency dominates, less if
    it is discounted), while the earlier examples count normally. So for multi-example
    sets, which concepts survive depends on which example came last (16, 8, 64 is
    not read exactly like 64, 8, 16), while single-example sets behave as in the ideal
    learner.'
- name: place_value_grid_similarity
  rationale: "People do not infer a rule; they represent each number by its written\
    \ place-value form \u2014 a tens digit and a units digit, i.e. a point on a 10-by-10\
    \ grid \u2014 and judge a target by its average similarity to the examples, where\
    \ similarity decays exponentially with the city-block distance between the target\
    \ and an example on that grid, with a separate attention weight on the tens and\
    \ the units dimension. So a target is endorsed when it shares (or nearly shares)\
    \ the examples' decade and final digit, e.g. 43 after 13, 23 is close on the units\
    \ axis even though it is far in magnitude, while 44 is a near miss and 47 is far."
- name: prelec_weighted_belief_response
  rationale: 'People infer the hidden program as the simplest current concept learner
    does (equally plausible familiar number rules, digit-sum rules and numeric ranges,
    with the size principle), but they do not answer "yes" with exactly the probability
    they believe the target belongs: before responding they pass that belief through
    a probability-weighting function of the kind seen in risky choice (Prelec''s two-parameter
    form), which can make weakly believed targets feel less (or more) likely and strongly
    believed ones more (or less) likely, around a pivot set by the data. So partly-believed
    targets are answered with a systematically distorted, S-shaped or inverse-S-shaped
    version of the belief, the same distortion for every set, and the identity recovers
    probability matching.'
- name: equal_prior_rules_round_edge_ranges
  rationale: 'Refinement of `equal_prior_familiar_rules_digit_sums`, adding one component
    from `round_number_range_boundaries`: people do the same Bayesian concept learning
    over equally plausible familiar number rules, digit-sum rules (with a prior that
    changes smoothly with the sum) and numeric ranges (Erlang width prior, the size
    principle). The one change is that multiples of ten act as reference points when
    people judge how plausible a range is a priori: a range whose lower or upper edge
    falls exactly on a multiple of ten is judged more or less likely than an otherwise
    identical range, with the direction and strength inferred from the data. So the
    magnitude-based "yes" answers stop just before, or exactly at, a nearby multiple
    of ten (for example, whether 40 is endorsed after examples in the low thirties).
    Range outputs are taken as uniform within the range, because the parent''s centre-clustering
    was inferred to be essentially zero.'
- name: graded_final_digit_equal_rule_prior
  rationale: 'Refinement of `equal_prior_familiar_rules_digit_sums`, adding one component
    from `graded_final_digit_digit_sum_concepts`: people do the same Bayesian concept
    learning over equally plausible familiar number rules, digit-sum rules (prior
    changing smoothly with the sum) and numeric ranges (Erlang width prior, outputs
    clustered toward the middle, the size principle). The one change is that the "ends
    in d" rules are not equally natural to each other. They keep the same total share
    of belief as before, but within that share a rule''s prior plausibility changes
    smoothly with its final digit, with the direction and strength inferred from the
    data. So after examples that share a final digit, how readily people go on to
    endorse other numbers ending in that digit, rather than a range around the examples,
    depends on which digit it is.'
- name: round_edge_graded_final_digit_sums
  rationale: 'Refinement of `graded_final_digit_digit_sum_concepts`, adding one component
    from `round_number_range_boundaries`. People do the same Bayesian concept learning
    as before: number rules with a prior plausibility per family, digit-sum rules
    and final-digit rules whose prior plausibility changes smoothly with the sum or
    digit, and numeric ranges with an Erlang width prior and the size principle. The
    one change is that multiples of ten act as reference points when people judge
    how plausible a range is a priori, so a range whose lower or upper edge falls
    exactly on a multiple of ten is judged more or less likely than an otherwise identical
    range, with direction and strength inferred from the data. This decides whether
    magnitude-based "yes" answers stop just before or exactly at a nearby multiple
    of ten (e.g. whether 40 is endorsed after examples in the low thirties).'
- name: digit_reversal_pair_concepts
  rationale: 'People infer the hidden program as a Bayesian concept learner over equally
    plausible familiar number rules, digit-sum rules and numeric ranges of a typical
    width, with the size principle. Their space of programs also contains "digit-reversal
    pair" programs: a program that produces only a two-digit number and its mirror
    image (e.g. 38 and 83, or 47 and 74). These programs are a kind of their own,
    with a prior plausibility inferred from the data. Because each one contains just
    two numbers, a set that holds both a number and its reversal is a strong suspicious
    coincidence, so people endorse the pair and reject other numbers more than the
    current models predict. Seeing only one member of a pair barely changes how readily
    people endorse its reversal.'
- name: factorization_exemplar_similarity
  rationale: 'People do not infer a rule; they store the examples as exemplars and
    judge a target by its average similarity to them, where two numbers are represented
    by their multiplicative make-up (prime factorisation) as well as their magnitude:
    similarity decays exponentially with an attention-weighted sum of how far apart
    the numbers are on the number line and how many prime factors they do not share
    (the size of their least common multiple relative to their greatest common divisor).
    So a target is endorsed when it is close in size to the examples or built from
    the same factors (64 after 16 and 8, 42 after 14 and 28), and rejected when it
    is a near neighbour with unrelated factors (17 after 16).'
- name: evidence_quantity_decisiveness
  rationale: 'People infer the hidden program as a Bayesian concept learner would
    (equally plausible familiar number rules, digit-sum rules and numeric ranges of
    a typical width, with the size principle), but how decisively they act on that
    belief depends on how much evidence they were given: their confidence grows (or
    shrinks) with the number of examples shown, so after one example they answer "yes"
    with the probability they believe the target belongs, while after each further
    example the same belief is pushed further toward a firm "yes" or "no". So a target
    believed to belong with, say, 70% is endorsed more often after four examples than
    after two, which no model that maps belief to answers in the same way for every
    set can produce.'
- name: set_size_dependent_example_trust
  rationale: 'Refinement of `last_example_recency_weight`: people do the same Bayesian
    concept learning over equally plausible familiar number rules, digit-sum rules
    and numeric ranges of a typical width, with the size principle and the last-seen
    example carrying its own evidential weight. The one change is to how far people
    trust the examples as genuine outputs of the program. The incumbent fixes a 10%
    chance that any example is a random slip. Here the chance that an example is a
    slip is inferred, and it changes smoothly with how many examples were shown, so
    an odd-one-out example in a four-example set is written off more (or less) readily
    than one in a two-example set, which changes how tightly people generalise from
    small versus large sets.'
- name: set_size_response_decisiveness
  rationale: 'Refinement of `last_example_recency_weight`. People infer the program
    as that model says: Bayesian concept learning over equally plausible familiar
    rules, digit-sum rules and ranges, with the size principle, and the last example
    given its own evidential weight. The one change is in how they answer. How decisively
    belief becomes a yes or no depends on how many examples were shown. After more
    examples, people feel better informed and push their answers toward the extremes
    of their belief, so confident targets are endorsed or rejected more firmly. After
    a single example they hedge toward 50/50, so the same strength of belief gives
    a less extreme yes rate. The direction and strength of this effect are inferred
    from the data, and no effect recovers the parent.'
- name: individual_range_vs_rule_preference
  rationale: 'Refinement of `equal_prior_rules_round_edge_ranges`: people do the same
    Bayesian concept learning over equally plausible familiar number rules, digit-sum
    rules and numeric ranges (Erlang width prior with round-number edges, the size
    principle), but they are not all alike in how readily they think of the program
    as a magnitude range rather than a number rule. The one change is that each person
    has their own prior odds of ranges versus rules, inferred from that person''s
    answers, so the same set is read as "multiples of 7" or "ends in 3" by rule-seekers
    and as a band of nearby numbers by magnitude-seekers, while how the examples weigh
    programs within each kind is the same for everyone.'
