models:
- name: exception_rule_family_prior
  rationale: 'Refinement of `size_principle_strength_family_prior`: people do the
    same Bayesian concept learning over rules and intervals, with a prior weight per
    concept family and a learned strength of the size principle, but they do not treat
    ad-hoc "exception" rules (powers of 2 except 32, powers of 2 plus 37) as being
    as natural as clean mathematical sets. The one change is to give these exception
    rules their own concept family with its own inferred prior mass, so people can
    find "powers of 2, or 37" implausible and reject the 37 lure for sets of powers
    of 2 while still generalising to the other powers of 2.'
- name: exception_rule_family_prior_2
  rationale: "Refinement of `family_weighted_concept_prior`: people do the same Bayesian\
    \ concept learning over rules and intervals with the size principle and a separate\
    \ prior mass per concept family, but the two gerrymandered exception rules (\"\
    powers of 2 except 32\" and \"powers of 2 plus 37\") are not natural mathematical\
    \ sets \u2014 people give them their own, separately inferred (and expectedly\
    \ tiny) prior mass rather than an equal share of the \"special sets\" family alongside\
    \ primes, squares and powers. The one change is this separate family for exception\
    \ rules, so for sets of powers of 2 people should reject the lure 37 nearly always\
    \ while still endorsing the other powers of 2."
- name: erlang_interval_size_family_prior
  rationale: 'Refinement of `exception_rule_family_prior_2`: people do the same Bayesian
    concept learning over rules and intervals, with the size principle and a separate
    prior mass per concept family (exception rules in their own family), but they
    do not regard all numeric intervals as equally plausible a priori. The one change
    is an Erlang-shaped prior over interval width with a learned characteristic size
    (as in Tenenbaum''s number game): very narrow and very wide ranges are a priori
    unlikely, so after a single example or tightly clustered examples people generalise
    to a band of moderate width around them rather than collapsing onto the tightest
    interval, and after widely spread examples broad ranges are penalised relative
    to natural rules.'
- name: erlang_interval_size_family_prior_2
  rationale: "Refinement of `exception_rule_family_prior_2`: people do the same Bayesian\
    \ concept learning over rules (with a prior mass per concept family, the two exception\
    \ rules in their own family) and numeric intervals with the size principle, but\
    \ they do not treat every interval of 1-100 as equally likely a priori \u2014\
    \ they expect a magnitude-based concept to span a characteristic, moderate range,\
    \ so their prior over intervals follows an Erlang distribution over interval width\
    \ with an inferred typical size (Tenenbaum's interval prior). The one change is\
    \ this size-dependent interval prior: it penalises both the hairline intervals\
    \ that hug the examples and the very broad ones, which changes how far people\
    \ generalise by magnitude beyond the examples (e.g. to targets 10-20 away from\
    \ a single example) relative to the incumbent's flat interval prior."
- name: erlang_interval_size_exception_prior
  rationale: 'Refinement of `exception_rule_family_prior`: people do the same Bayesian
    concept learning over rules and intervals, with a prior mass per concept family
    (exception rules as their own family) and a learned strength of the size principle,
    but they do not consider every numeric interval equally likely a priori. The one
    change is an Erlang prior on interval size with a learned typical size, as in
    Tenenbaum''s number game: people expect a magnitude-based program to cover a range
    of moderate width, so very narrow intervals hugging the examples and very broad
    ones are both discounted, which reshapes how far "yes" answers extend beyond the
    examples in magnitude.'
- name: power_base_family_prior
  rationale: 'Refinement of `exception_rule_family_prior_2`: people do the same Bayesian
    concept learning over rules and intervals with the size principle, a separate
    prior mass per concept family and the exception rules in their own family, but
    they do not lump "powers of a base" (powers of 2, 3, ... 10) together with primes,
    squares and cubes as one "special sets" family. The one change is to give powers-of-a-base
    rules their own family with its own inferred prior mass: people readily think
    of a set as successive powers (or repeated multiplication) of a number, while
    primes, squares and cubes each have a separate, independently inferred plausibility,
    so generalisation after power-like sets (e.g. 8, 64) and after square- or prime-like
    sets (e.g. 81, 9 or 3, 31) can differ in strength instead of being tied to a shared
    per-rule prior.'
- name: powers_own_family_erlang_interval
  rationale: "Refinement of `erlang_interval_size_family_prior`: people do the same\
    \ Bayesian concept learning over rules and numeric intervals, with the size principle,\
    \ a prior mass per concept family (exception rules in their own family) and an\
    \ Erlang prior over interval width, but they do not lump \"powers of m\" (2, 4,\
    \ 8, 16, \u2026; 3, 9, 27, 81; 8, 64; \u2026) together with primes, squares and\
    \ cubes. The one change is that repeated-multiplication rules form their own concept\
    \ family with a separately inferred prior mass, so if people find powers an especially\
    \ natural kind of program, examples like 8 and 64 are read as \"powers of 8\"\
    \ (rejecting 2, 4, 16 and 32), and sets of powers of 2 crowd out \"even\" more\
    \ strongly than the current model predicts."
- name: parity_bounded_range_concepts
  rationale: "Refinement of `exception_rule_family_prior_2`: people do the same Bayesian\
    \ concept learning over rules and numeric intervals, with the size principle and\
    \ a prior mass per concept family (the exception rules in their own family), but\
    \ their hypothesis space also contains conjunctive \"parity within a range\" concepts\
    \ \u2014 \"even numbers between 20 and 60\", \"odd numbers from 9 to 69\" \u2014\
    \ as a new family with its own inferred prior mass. The one change is this composed\
    \ rule-plus-magnitude family: when examples are all even (or all odd) and clustered\
    \ in magnitude, people generalise to same-parity numbers near the examples while\
    \ rejecting both nearby numbers of the other parity and same-parity numbers far\
    \ outside the examples' range, which neither a pure parity rule nor a pure interval\
    \ predicts."
