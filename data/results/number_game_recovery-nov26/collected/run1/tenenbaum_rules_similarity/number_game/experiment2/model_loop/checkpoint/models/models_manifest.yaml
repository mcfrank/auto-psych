models:
- name: exception_rule_family_prior
  rationale: 'Refinement of `size_principle_strength_family_prior`: people do the
    same Bayesian concept learning over rules and intervals, with a prior weight per
    concept family and a learned strength of the size principle, but they do not treat
    ad-hoc "exception" rules (powers of 2 except 32, powers of 2 plus 37) as being
    as natural as clean mathematical sets. The one change is to give these exception
    rules their own concept family with its own inferred prior mass, so people can
    find "powers of 2, or 37" implausible and reject the 37 lure for sets of powers
    of 2 while still generalising to the other powers of 2.'
- name: exception_rule_family_prior_2
  rationale: "Refinement of `family_weighted_concept_prior`: people do the same Bayesian\
    \ concept learning over rules and intervals with the size principle and a separate\
    \ prior mass per concept family, but the two gerrymandered exception rules (\"\
    powers of 2 except 32\" and \"powers of 2 plus 37\") are not natural mathematical\
    \ sets \u2014 people give them their own, separately inferred (and expectedly\
    \ tiny) prior mass rather than an equal share of the \"special sets\" family alongside\
    \ primes, squares and powers. The one change is this separate family for exception\
    \ rules, so for sets of powers of 2 people should reject the lure 37 nearly always\
    \ while still endorsing the other powers of 2."
- name: erlang_interval_size_family_prior
  rationale: 'Refinement of `exception_rule_family_prior_2`: people do the same Bayesian
    concept learning over rules and intervals, with the size principle and a separate
    prior mass per concept family (exception rules in their own family), but they
    do not regard all numeric intervals as equally plausible a priori. The one change
    is an Erlang-shaped prior over interval width with a learned characteristic size
    (as in Tenenbaum''s number game): very narrow and very wide ranges are a priori
    unlikely, so after a single example or tightly clustered examples people generalise
    to a band of moderate width around them rather than collapsing onto the tightest
    interval, and after widely spread examples broad ranges are penalised relative
    to natural rules.'
- name: erlang_interval_size_exception_prior
  rationale: 'Refinement of `exception_rule_family_prior`: people do the same Bayesian
    concept learning over rules and intervals, with a prior mass per concept family
    (exception rules as their own family) and a learned strength of the size principle,
    but they do not consider every numeric interval equally likely a priori. The one
    change is an Erlang prior on interval size with a learned typical size, as in
    Tenenbaum''s number game: people expect a magnitude-based program to cover a range
    of moderate width, so very narrow intervals hugging the examples and very broad
    ones are both discounted, which reshapes how far "yes" answers extend beyond the
    examples in magnitude.'
- name: power_base_family_prior
  rationale: 'Refinement of `exception_rule_family_prior_2`: people do the same Bayesian
    concept learning over rules and intervals with the size principle, a separate
    prior mass per concept family and the exception rules in their own family, but
    they do not lump "powers of a base" (powers of 2, 3, ... 10) together with primes,
    squares and cubes as one "special sets" family. The one change is to give powers-of-a-base
    rules their own family with its own inferred prior mass: people readily think
    of a set as successive powers (or repeated multiplication) of a number, while
    primes, squares and cubes each have a separate, independently inferred plausibility,
    so generalisation after power-like sets (e.g. 8, 64) and after square- or prime-like
    sets (e.g. 81, 9 or 3, 31) can differ in strength instead of being tied to a shared
    per-rule prior.'
- name: powers_own_family_erlang_interval
  rationale: "Refinement of `erlang_interval_size_family_prior`: people do the same\
    \ Bayesian concept learning over rules and numeric intervals, with the size principle,\
    \ a prior mass per concept family (exception rules in their own family) and an\
    \ Erlang prior over interval width, but they do not lump \"powers of m\" (2, 4,\
    \ 8, 16, \u2026; 3, 9, 27, 81; 8, 64; \u2026) together with primes, squares and\
    \ cubes. The one change is that repeated-multiplication rules form their own concept\
    \ family with a separately inferred prior mass, so if people find powers an especially\
    \ natural kind of program, examples like 8 and 64 are read as \"powers of 8\"\
    \ (rejecting 2, 4, 16 and 32), and sets of powers of 2 crowd out \"even\" more\
    \ strongly than the current model predicts."
- name: parity_bounded_range_concepts
  rationale: "Refinement of `exception_rule_family_prior_2`: people do the same Bayesian\
    \ concept learning over rules and numeric intervals, with the size principle and\
    \ a prior mass per concept family (the exception rules in their own family), but\
    \ their hypothesis space also contains conjunctive \"parity within a range\" concepts\
    \ \u2014 \"even numbers between 20 and 60\", \"odd numbers from 9 to 69\" \u2014\
    \ as a new family with its own inferred prior mass. The one change is this composed\
    \ rule-plus-magnitude family: when examples are all even (or all odd) and clustered\
    \ in magnitude, people generalise to same-parity numbers near the examples while\
    \ rejecting both nearby numbers of the other parity and same-parity numbers far\
    \ outside the examples' range, which neither a pure parity rule nor a pure interval\
    \ predicts."
- name: weber_noisy_interval_membership
  rationale: 'People do Bayesian concept learning over natural rules and numeric ranges
    as in the best model (size principle, a prior mass per concept family, an Erlang
    prior on range width), but they check whether a target falls inside a magnitude
    range using their approximate, noisy sense of number rather than exact arithmetic.
    The one distortion is this Weber-like perceptual noise, which grows in proportion
    to a number''s size: symbolic rules (even, ends in 3, powers of 2) are checked
    exactly, but the edges of a range are blurred, so large targets just outside a
    range are often accepted and large targets just inside are sometimes rejected,
    while range boundaries among small numbers stay sharp.'
- name: log_number_line_ranges
  rationale: "People do Bayesian concept learning over number rules (with a prior\
    \ mass per concept family, the exception rules in their own family) and numeric\
    \ ranges with the size principle, but they represent magnitude on a compressed,\
    \ logarithmic mental number line: a range is a band on that line, so ranges are\
    \ a priori equally likely wherever they sit on the log line and their plausibility\
    \ depends on their ratio width (e.g. 5-10 is as natural as 50-100), not their\
    \ width in units. As a result, magnitude-based generalisation scales with the\
    \ examples' size \u2014 after small examples people generalise only to nearby\
    \ small numbers, after large examples to a proportionally much wider band."
- name: weber_scaled_interval_size_prior
  rationale: 'Refinement of `erlang_interval_size_family_prior`: people do the same
    Bayesian concept learning over rules and numeric intervals, with the size principle,
    a prior mass per concept family (exception rules in their own family) and an Erlang
    prior over interval size, but they judge how big a range is relative to its magnitude
    (Weber''s law) rather than in absolute units. The one change is that the Erlang
    prior is placed on the interval''s width divided by a learned power of its location
    on the number line, so a range of ten numbers around 85 counts as "narrower" than
    one around 8; people therefore generalise to wider bands of nearby numbers after
    large examples than after small ones, with the strength of this magnitude scaling
    inferred from the data (zero recovers the incumbent).'
- name: primes_own_family_erlang_interval
  rationale: 'Refinement of `powers_own_family_erlang_interval`: people do the same
    Bayesian concept learning over rules and numeric intervals, with the size principle,
    a prior mass per concept family (exception rules and powers of m each in their
    own family) and an Erlang prior over interval width, but they do not treat "prime
    numbers" as the same kind of program as squares and cubes. The one change is that
    primes form their own concept family with a separately inferred prior mass, so
    how readily people read examples such as 3, 7 or 53, 2 as "primes" (endorsing
    29 or 59 and rejecting nearby composites) is no longer tied to how readily they
    read 81, 25 as "squares".'
- name: newest_example_size_principle_wsls
  rationale: "People hold a single running guess about the program (a rule or a numeric\
    \ range, weighed by family plausibility and an Erlang prior on range width) and\
    \ revise it example by example in the order shown: they keep their current guess\
    \ with a probability that grows with how well it explains the newest example,\
    \ and otherwise draw a fresh guess \u2014 but when they redraw they judge the\
    \ \"suspicious coincidence\" (the size principle) only for the newest example,\
    \ merely requiring the guess to cover the earlier ones. So evidence for tight\
    \ concepts does not compound across examples as in an ideal Bayesian learner,\
    \ and which example drives specificity depends on the order shown (the last examples,\
    \ plus whatever guess has survived from the first)."
- name: threshold_concepts_erlang_interval
  rationale: 'Refinement of `erlang_interval_size_family_prior`: people do the same
    Bayesian concept learning over rules and numeric intervals, with the size principle,
    a prior mass per concept family (exception rules in their own family) and an Erlang
    prior over the width of bounded ranges, but they treat one-sided magnitude thresholds
    ("numbers above 60", "numbers below 20") as a distinct kind of program rather
    than as just very wide intervals that happen to touch 1 or 100. The one change
    is that these threshold concepts form their own family with a separately inferred
    prior mass, shared equally among them and exempt from the width prior, so when
    all the examples are large (or all small) people extend "yes" all the way to the
    end of the number line, not just to a band of moderate width around the examples.'
- name: average_digit_magnitude_similarity
  rationale: People do not infer a rule; they judge a target by its average similarity
    to the examples, where two numbers are similar if they are close in magnitude
    and share their final digit, with similarity decaying exponentially along the
    number line and dropping by a fixed factor when the final digits differ. Because
    the similarity is averaged rather than summed over examples, "yes" depends on
    the proportion of the examples the target resembles, not on how many examples
    were shown, so adding dissimilar examples to a set dilutes generalisation to a
    target near one of them.
- name: digit_sum_concepts_threshold_erlang
  rationale: "Refinement of `threshold_concepts_erlang_interval`: people do the same\
    \ Bayesian concept learning over number rules, bounded numeric ranges (with an\
    \ Erlang prior on width) and one-sided thresholds, with the size principle and\
    \ a prior mass per concept family. The one change is that their space of candidate\
    \ programs also includes digit-sum concepts \u2014 \"numbers whose digits add\
    \ up to s\" (e.g. 5, 14, 23, 32, 41, 50 for s = 5) \u2014 as a new family with\
    \ its own inferred prior mass, shared equally among the 18 possible sums. When\
    \ the examples happen to share a digit sum (especially a single example with a\
    \ small, rare sum), people endorse other numbers with that digit sum more, and\
    \ neighbours with a different digit sum less, than the incumbent predicts."
- name: threshold_concepts_primes_family
  rationale: 'Refinement of `threshold_concepts_erlang_interval`: people do the same
    Bayesian concept learning over number rules, bounded numeric ranges (with an Erlang
    prior on width) and one-sided magnitude thresholds (their own family), with the
    size principle and a prior mass per concept family, but they do not treat "prime
    numbers" as just one more member of a shared "special sets" family with squares,
    cubes and powers. The one change is that primes form their own concept family
    with a separately inferred prior mass, so examples such as 3, 7 or 53, 2 can be
    read as "primes" strongly enough that people endorse other primes (13, 29, 5,
    11) and reject nearby composites, independently of how readily they read 81, 25
    as "squares" or 8, 64 as "powers".'
- name: set_size_amplified_size_principle
  rationale: 'Refinement of `threshold_concepts_erlang_interval`: people do the same
    Bayesian concept learning over rules, bounded numeric ranges (with an Erlang prior
    on width) and one-sided thresholds, with the size principle and a prior mass per
    concept family, but the "suspicious coincidence" does not accumulate additively
    over examples. The one change is that each example''s evidential weight scales
    with a learned power of how many examples were shown, so the more examples a set
    has, the more decisively each one favours tight concepts over broad ones (zero
    recovers the incumbent): generalisation narrows faster from one to four examples
    than an ideal learner predicts.'
- name: centre_weighted_range_sampling
  rationale: "Refinement of `erlang_interval_size_family_prior`: people do the same\
    \ Bayesian concept learning over number rules and numeric ranges, with the size\
    \ principle, a prior mass per concept family (exception rules in their own family)\
    \ and an Erlang prior over range width, but they do not expect a range-based program\
    \ to produce every number in its range equally often \u2014 they expect its outputs\
    \ to cluster toward the middle of the range, with how strongly they do so inferred\
    \ from the data (none recovers the parent model). The one change is this centre-weighted\
    \ sampling from ranges: examples sitting at a range's edge are a \"suspicious\
    \ coincidence\" for it, so ranges that are centred on the examples and extend\
    \ beyond the lowest and highest example gain support, and people say \"yes\" to\
    \ targets somewhat past the examples' extremes more often than a uniform-sampling\
    \ learner predicts."
- name: recognition_shortcut_for_examples
  rationale: 'People infer the hidden program as in the best current model (Bayesian
    concept learning over number rules, bounded ranges and one-sided thresholds) and
    answer most targets by probability matching on that belief, but when the target
    is one of the numbers they were just shown they do not consult their inferred
    concept at all: they answer from recognition, saying "yes" at a single fixed rate
    that does not depend on the set. So the yes rate for a repeated example is the
    same whether one example or four were shown and whatever concept they suggest,
    unlike the best model, where it falls as tight concepts that exclude random-looking
    examples gain belief.'
- name: shared_category_exemplar_averaging
  rationale: 'People do not infer one program that explains all the examples together;
    they store each example as a separate exemplar and judge the target by its average
    similarity to the stored examples, where two numbers are similar to the degree
    that they fall together in the familiar number categories people know (parity,
    multiples, final or contained digits, primes, squares, powers, magnitude ranges
    and thresholds), with small, distinctive shared categories counting more than
    broad ones (Shepard''s additive-clustering view of number similarity). Because
    each example generalises on its own and the similarities are averaged rather than
    multiplied, the "suspicious coincidence" of several examples sharing a tight category
    never accumulates: a target similar to only one example of a set gets partial
    "yes" support, and adding examples does not sharpen generalisation the way it
    does for a Bayesian concept learner.'
- name: range_size_principle_strength
  rationale: 'Refinement of `threshold_concepts_erlang_interval`: people do the same
    Bayesian concept learning over number rules, bounded numeric ranges (with an Erlang
    prior on width) and one-sided magnitude thresholds (their own family), with a
    prior mass per concept family, but they do not apply the "suspicious coincidence"
    of the size principle to magnitude concepts as strongly as to arithmetic and digit
    rules. The one change is that, for ranges and thresholds only, how much an example''s
    probability shrinks with the concept''s width is governed by a learned exponent
    (one recovers the incumbent, zero means ranges are treated as mere filters the
    examples pass), so how tightly people''s magnitude-based generalisation hugs the
    examples, relative to rule-based generalisation, is inferred from the data rather
    than fixed by the ideal learner.'
- name: centre_weighted_ranges_with_thresholds
  rationale: Refinement of `threshold_concepts_erlang_interval`, adding one component
    from `centre_weighted_range_sampling`. People do the same Bayesian concept learning
    over number rules, bounded ranges (with an Erlang prior on width) and one-sided
    thresholds (their own family), with the size principle and a prior mass per concept
    family. The one change is that people expect a bounded-range program ("numbers
    between 30 and 50") to produce numbers clustered toward the middle of its range,
    while a threshold program ("numbers above 60") still produces its members evenly.
    How strongly ranges cluster is inferred from the data, and zero recovers the incumbent.
    An example at a range's edge is then a suspicious coincidence, so ranges centred
    on the examples that reach past them gain belief relative to thresholds and rules.
- name: pedagogical_teacher_sampling
  rationale: 'People assume the program''s examples were chosen to be helpful, as
    a teacher would choose them, rather than drawn at random from its concept (rational
    pedagogy): a teacher holding a concept picks examples in proportion to how strongly
    each one, on its own, would point a naive learner (one with no preference among
    kinds of concept) to that concept. People judge each candidate rule, range or
    threshold by how likely such a teacher would be to have shown exactly these examples,
    so examples that would point equally well to many other concepts count as weak
    evidence and a concept is favoured when the examples are the ones most diagnostic
    of it; they then say "yes" with the probability that the inferred concept contains
    the target.'
- name: without_replacement_size_principle
  rationale: "Refinement of `threshold_concepts_erlang_interval`: people do the same\
    \ Bayesian concept learning over number rules, bounded ranges (with an Erlang\
    \ prior on width) and one-sided thresholds, with a prior mass per concept family,\
    \ but they believe the program never repeats itself \u2014 each example is a member\
    \ of the concept not already shown, drawn without replacement. The one change\
    \ is this without-replacement size principle, which makes the \"suspicious coincidence\"\
    \ grow faster than an ideal with-replacement learner's whenever the examples use\
    \ up a large share of a small concept: sets that nearly exhaust a tiny rule or\
    \ a narrow range (e.g. 4 of the 7 powers of 2, or 11, 15 filling a five-number\
    \ band) favour that tight concept even more strongly, so people reject targets\
    \ just outside it more often than the best model predicts, while sets that are\
    \ few relative to every candidate concept behave as before."
- name: primes_family_set_size_amplified
  rationale: Refinement of `set_size_amplified_size_principle`, adding one component
    from `threshold_concepts_primes_family`. People do the same Bayesian concept learning
    over number rules, bounded ranges (with an Erlang prior on width) and one-sided
    thresholds, with a prior mass per concept family and a size principle whose per-example
    weight grows with how many examples were shown. The one change is that "prime
    numbers" leaves the shared special-sets family (squares, cubes, powers) and becomes
    its own family with a separately inferred prior mass, so prime-like sets such
    as 3, 7 or 53, 2 are read as "primes" (endorsing other primes, rejecting nearby
    composites) independently of how plausible squares or powers are, and this reading
    tightens with more prime examples faster than an ideal learner's would.
- name: gaussian_prototype_magnitude_concepts
  rationale: "People do Bayesian concept learning over number rules and one-sided\
    \ thresholds as in the best model, but they do not represent a magnitude-based\
    \ program as a sharp-edged range; they represent it as a graded prototype \u2014\
    \ a typical value on the number line with a spread \u2014 that produces numbers\
    \ mostly near its centre and fewer the further away they lie. A target then belongs\
    \ to such a concept to the degree it is close to the prototype's centre, so magnitude\
    \ generalisation falls off smoothly with distance from the examples instead of\
    \ dropping at a boundary."
- name: limited_family_consideration_set
  rationale: 'People do not search the whole space of possible programs on every trial:
    each kind of program (parity, special sets such as primes, squares and powers,
    multiples, final digit, contained digit, exception rules, bounded ranges, one-sided
    thresholds) comes to mind only with its own probability, and people do Bayesian
    concept learning with the size principle only over the kinds that came to mind,
    giving each considered kind an equal share of their prior. When the kind of program
    that best fits the examples is not thought of, they fall back on whatever kind
    they did consider, so "yes" is the average, over which kinds came to mind, of
    the probability that the inferred program produces the target. How available each
    kind is to recall replaces a fixed prior plausibility per kind.'
- name: round_number_range_boundaries
  rationale: "People infer the hidden program as an ideal Bayesian concept learner\
    \ would (number rules, bounded ranges and one-sided thresholds, weighed by family\
    \ plausibility, range width and the size principle, with examples drawn without\
    \ repetition), but their sense of how plausible a bounded range is is biased by\
    \ round numbers: multiples of ten act as cognitive reference points, so a range\
    \ whose lower or upper boundary falls exactly on one (e.g. 20-37 or 40-60) is\
    \ judged more, or less, likely a priori than an otherwise identical range, with\
    \ the direction and strength of this round-number bias inferred from the data.\
    \ This shifts where people stop saying \"yes\" near multiples of ten \u2014 for\
    \ example whether 40 is included after examples in the low thirties \u2014 while\
    \ leaving rule-based generalisation unchanged."
- name: without_replacement_primes_family
  rationale: "Refinement of `without_replacement_size_principle`, adding one component\
    \ from `threshold_concepts_primes_family`: people do the same Bayesian concept\
    \ learning over number rules, bounded ranges (with an Erlang prior on width) and\
    \ one-sided thresholds, with a prior mass per concept family, and they believe\
    \ the program never repeats itself, so examples are drawn from the concept without\
    \ replacement. The one change is that \"prime numbers\" is no longer lumped with\
    \ squares, cubes and powers in a shared special-sets family but forms its own\
    \ family with a separately inferred prior mass, so prime-like sets (e.g. 3, 7\
    \ or 53, 2) are read as \"primes\" \u2014 people endorse other primes and reject\
    \ nearby composites \u2014 independently of how plausible squares or powers are,\
    \ while the without-replacement coincidence still sharpens generalisation for\
    \ sets that use up much of a small concept."
- name: without_replacement_digit_sum_concepts
  rationale: "Refinement of `without_replacement_size_principle`, adding one component\
    \ from `digit_sum_concepts_threshold_erlang`: people do the same Bayesian concept\
    \ learning over number rules, bounded ranges (with an Erlang prior on width) and\
    \ one-sided thresholds, with a prior mass per concept family and examples believed\
    \ to be drawn from the concept without replacement, but their space of candidate\
    \ programs also includes digit-sum concepts \u2014 \"numbers whose digits add\
    \ up to s\" (e.g. 5, 14, 23, 32, 41, 50) \u2014 as a new family with its own inferred\
    \ prior mass, shared equally among the 18 possible sums. The one change is this\
    \ digit-sum family: because these concepts are tiny, examples that happen to share\
    \ a digit sum are an especially suspicious coincidence when drawn without replacement,\
    \ so people endorse other numbers with that digit sum, and reject neighbours with\
    \ a different sum, more than the incumbent predicts."
- name: set_size_amplified_digit_sum_concepts
  rationale: "Refinement of `set_size_amplified_size_principle`, adding one component\
    \ from `digit_sum_concepts_threshold_erlang`. People do the same Bayesian concept\
    \ learning over number rules, bounded ranges (with an Erlang prior on width) and\
    \ one-sided thresholds, with a prior mass per concept family and a size principle\
    \ whose per-example weight grows with how many examples were shown. The one change\
    \ is that their space of candidate programs also includes digit-sum concepts \u2014\
    \ \"numbers whose digits add up to s\" (e.g. 5, 14, 23, 32, 41, 50) \u2014 as\
    \ a new family with its own inferred prior mass shared equally among the 18 sums,\
    \ so when the examples share a digit sum people endorse other numbers with that\
    \ sum (and reject neighbours with a different sum) more than the parent predicts,\
    \ and this reading sharpens with more examples faster than an ideal learner's\
    \ would."
- name: simplicity_description_length_prior
  rationale: "People infer the hidden program as a Bayesian concept learner would\
    \ \u2014 weighing number rules, bounded ranges and one-sided thresholds by how\
    \ well they explain the examples, with the size principle and examples drawn without\
    \ repetition \u2014 but their sense of how plausible a program is a priori comes\
    \ from a single simplicity bias rather than learned preferences for particular\
    \ kinds of concept: every program is penalised by the same amount for each symbol\
    \ it takes to state it (\"odd\" is one, \"multiples of 7\" two, \"between 23 and\
    \ 41\" three, \"powers of 2 except 32\" four). So how readily people read examples\
    \ as a rule versus a range versus a threshold is fixed by description length alone,\
    \ with one inferred cost per symbol."
- name: first_example_evidence_weight
  rationale: 'People infer the hidden program as an ideal Bayesian concept learner
    would (number rules, bounded ranges with a round-number bias on their edges, and
    one-sided thresholds, weighed by family plausibility, range width and the size
    principle, with examples drawn without repetition), but they revise their belief
    example by example in the order shown and the first example carries its own evidential
    weight: met before they have any guess about the program, the opening example
    counts as a looser (or, if the data say so, stronger) piece of evidence than each
    later example, which counts normally. So the "suspicious coincidence" that the
    first example points to a tight concept is discounted relative to later examples,
    which matters most for single-example sets and for which example of a set is shown
    first.'
- name: conjunctive_category_similarity
  rationale: 'People do not infer a program; they judge a target by its similarity
    to the examples, where two numbers are similar to the degree that they fall together
    in familiar number categories (parity, multiples, final or contained digit, primes,
    squares, powers, magnitude ranges and thresholds), small distinctive shared categories
    counting more than broad ones. The similarities are combined conjunctively, as
    a geometric mean over the examples, so a target must resemble every example: being
    very dissimilar to any single example drags "yes" down sharply, unlike an average
    in which closeness to one example is enough. The willingness to say "yes" rises
    smoothly (logistically) with this geometric-mean similarity on a log scale.'
- name: round_number_ranges_primes_family
  rationale: "Refinement of `round_number_range_boundaries`, adding one component\
    \ from `without_replacement_primes_family`: people do the same Bayesian concept\
    \ learning over number rules, bounded ranges (Erlang width prior, with a learned\
    \ round-number bias on ranges whose boundaries fall on multiples of ten) and one-sided\
    \ thresholds, with a prior mass per concept family and examples drawn without\
    \ replacement. The one change is that \"prime numbers\" is no longer lumped with\
    \ squares, cubes and powers in a shared special-sets family but forms its own\
    \ family with a separately inferred prior mass, so prime-like sets (e.g. 3, 7\
    \ or 53, 2) are read as \"primes\" \u2014 people endorse other primes and reject\
    \ nearby composites \u2014 independently of how plausible squares or powers are,\
    \ while the round-number bias still shapes where magnitude-based \"yes\" answers\
    \ stop."
- name: round_number_ranges_digit_sums
  rationale: "Refinement of `round_number_range_boundaries`, adding one component\
    \ from `digit_sum_concepts_threshold_erlang`: people do the same Bayesian concept\
    \ learning over number rules, bounded ranges (Erlang width prior, with a learned\
    \ round-number bias on ranges whose boundaries fall on multiples of ten) and one-sided\
    \ thresholds, with a prior mass per concept family and examples drawn without\
    \ replacement. The one change is that their space of candidate programs also includes\
    \ digit-sum concepts \u2014 \"numbers whose digits add up to s\" (e.g. 5, 14,\
    \ 23, 32, 41, 50) \u2014 as a new family with its own inferred prior mass, shared\
    \ equally among the 18 possible sums. Because these concepts are tiny, examples\
    \ that share a digit sum are a suspicious coincidence, so people endorse other\
    \ numbers with that sum and reject neighbours with a different sum more than the\
    \ incumbent predicts, while the round-number bias still shapes where magnitude-based\
    \ \"yes\" answers stop."
- name: without_replacement_primes_digit_sums
  rationale: "Refinement of `without_replacement_primes_family`, adding one component\
    \ from `digit_sum_concepts_threshold_erlang`: people do the same Bayesian concept\
    \ learning over number rules (with \"prime numbers\" as its own family), bounded\
    \ ranges (with an Erlang prior on width) and one-sided thresholds, with a prior\
    \ mass per concept family, and they believe the program never repeats itself,\
    \ so examples are drawn from the concept without replacement. The one change is\
    \ that their space of candidate programs also includes digit-sum concepts \u2014\
    \ \"numbers whose digits add up to s\" (e.g. 5, 14, 23, 32, 41, 50) \u2014 as\
    \ a new family with its own inferred prior mass, shared equally among the 18 possible\
    \ sums. When the examples happen to share a digit sum, people endorse other numbers\
    \ with that sum and reject neighbours with a different sum more than the parent\
    \ predicts, and this works independently of how readily they read prime-like sets\
    \ as \"primes\"."
