models:
- name: salient_decade_place_value_rules
  rationale: 'Refinement of `salient_contained_digit_rules`: people do the same tempered,
    exception-tolerant Bayesian concept learning (salient final-digit and contained-digit
    rules, ranges on a compressed number line with a gamma-shaped width prior, and
    rule-plus-neighbourhood exceptions anchored on an off-pattern example and emitted
    through a side channel), but they also read the tens digit of a numeral as a place-value
    category: "numbers in the forties" (tens digit 4) is a rule they entertain directly,
    with its own fitted salience, not only as one range among the thousands of possible
    stretches of the number line. The one change is this set of salient decade rules:
    when the examples share a tens digit (e.g. 42, 47, 45), people fill in exactly
    that decade, endorsing its members, even those far from any example, and rejecting
    numbers just across the decade boundary (39, 50) more sharply than a learner whose
    only magnitude concepts are ranges with arbitrary edges.'
- name: individual_rule_vs_range_style
  rationale: 'Refinement of `salient_contained_digit_rules`: people do the same tempered,
    exception-tolerant Bayesian concept learning (salient final-digit and contained-digit
    rules, ranges on a compressed number line with a gamma-shaped width prior, and
    rule-plus-neighbourhood exceptions emitted through a side channel), but individuals
    differ stably in how readily they think of the hidden program as an arithmetic
    or digit rule rather than a range of magnitudes. The one change is this person-specific
    prior share for rules versus ranges, fitted for each person: some participants
    consistently extend shared rules to distant numbers, while others consistently
    stay near the examples'' stretch of the number line across every set they judge.'
