models:
- name: tenenbaum_rules_similarity
  rationale: Bayesian concept learning over 33 mathematical rules (odd, even, squares,
    cubes, primes, multiples of 3-12, powers of 2-10, ending in 1-9) and every interval
    of 1-100. The rules share a prior fraction lambda equally; the intervals share
    the rest by an Erlang density on their size (scale sigma). Examples are sampled
    from the concept (the size principle), 10% of them uniformly from 1-100, and "yes"
    is the posterior probability that the concept contains the target.
- name: bigelow_piantadosi_mixture
  rationale: Bayesian concept learning over 45 rules (odd, even, primes, squares,
    cubes, powers of 2-10, powers of 2 without 32 or with 37, multiples of 3-9, 11
    and 12, ending in 0-9, containing the digit 0-9) and every interval of 1-100.
    A rule is chosen with probability lambda_0, and the rules are equally likely;
    each interval has prior (1 - lambda_0) / 100^2. Examples are sampled from the
    concept (the size principle), 10% of them uniformly from 1-100, and "yes" is the
    posterior probability that the concept contains the target.
- name: tversky_prototype_feature_contrast
  rationale: 'People judge membership by feature matching rather than by Bayesian
    inference over concepts: they abstract a prototype made of every property all
    the examples share (parity, divisibility, being a square/cube/prime/power, last
    digit, digits contained, decade, lying within the examples'' range), and say "yes"
    the more of those shared properties the target has, penalised for each shared
    property it lacks and, more weakly, for each property it has that the prototype
    lacks (Tversky''s contrast model of similarity). There is no size principle: a
    broad shared property counts as much as a narrow one.'
- name: tempered_posterior_commitment
  rationale: 'People hold a belief over candidate concepts (mathematical rules and
    numeric intervals, with the size principle) whose commitment differs from Bayesian
    averaging by a single tempering exponent: the posterior over concepts is raised
    to a free power and renormalised, so people either commit almost entirely to the
    best concept (exponent above 1) or hedge conservatively across many weaker ones
    (exponent below 1). It disagrees most sharply with the averaging model on sets
    where a rule and an interval compete, such as targets just outside the examples''
    range or numeric neighbours that fit no rule, because there the weight on the
    runner-up concepts (set by the exponent) decides the answer.'
- name: sharpened_map_concept_selection
  rationale: People do not average over all concepts consistent with the examples;
    they commit, nearly all-or-none, to the one or few concepts (a mathematical rule
    or a tight numerical interval) that best explain the examples under the size principle,
    and answer yes only if the target falls in the concept they committed to. This
    sharpened, winner-take-most choice of concept makes answers more deterministic
    and leaves far less graded "nearby number" generalization than full Bayesian averaging
    predicts.
- name: stray_tolerant_concept_learning
  rationale: 'Refinement of bigelow_piantadosi_mixture: people do Bayesian concept
    learning over the same 45 rules and all intervals of 1-100 with the same grammar
    prior, and say yes with the posterior probability that the concept contains the
    target. The one change is that how often people think an example is a stray number
    unrelated to the concept is learned from the data rather than fixed at 10%; tolerating
    more strays lets a scattered set be read as a tight rule plus an outlier, so people
    generalise less to the examples'' numerical neighbours than the incumbent predicts.'
- name: concept_posterior_with_lapse_guessing
  rationale: "Refinement of `bigelow_piantadosi_mixture`: people do Bayesian concept\
    \ learning over the same 45 rules and all intervals of 1-100 (size principle,\
    \ rule prior lambda_0), but they do not answer every trial from that posterior\
    \ \u2014 on a fixed fraction of trials (a lapse) they ignore the examples and\
    \ guess \"yes\" with a fixed base rate. The one change is this lapse-and-guess\
    \ response stage, which makes answers to the same (set, target) less deterministic\
    \ than the concept posterior alone implies and pulls confident predictions toward\
    \ the guess rate."
- name: overweighted_evidence_rules_intervals
  rationale: "Refinement of `tenenbaum_rules_similarity`: people do Bayesian concept\
    \ learning over the same mathematical rules and Erlang-weighted intervals, but\
    \ they treat the examples as stronger evidence than ideal random sampling warrants\
    \ \u2014 the size-principle likelihood is raised to a fitted power (an \"evidence-weight\"\
    \ exponent), so the posterior concentrates on the tightest rules and intervals\
    \ consistent with the examples. The one change is this fitted exponent (fixed\
    \ at 1 in the original), which predicts less generalization to numerical neighbours\
    \ and to numbers just outside the examples' range than the ideal learner, as the\
    \ critique of the incumbent reports."
- name: simplicity_cost_concept_search
  rationale: "People search for a concept by building it from simple mental primitives,\
    \ and every extra primitive a concept needs costs them: the simplest concepts\
    \ (odd, even) come to mind readily, while compound concepts (multiples of 7, ending\
    \ in 2, powers of 3, a rule with an exception) are penalised in proportion to\
    \ how many primitives describe them, on top of the size principle and the near-all-or-none\
    \ commitment to the best-explaining concept. This complexity cost makes people\
    \ fall back on broad parity rules much more than the size principle alone predicts\
    \ \u2014 e.g. saying yes to any even number after 22, 62, 26, 82 rather than only\
    \ to numbers ending in 2."
- name: weakened_size_principle_sampling
  rationale: 'People do Bayesian concept learning over mathematical rules and numerical
    intervals, but they apply the size principle only partially: they discount the
    evidence that a small concept explains the examples better than a large one, as
    if the examples were only partly sampled from the concept rather than just happening
    to fall in it. This weakened size penalty keeps broad concepts such as "odd numbers",
    "even numbers" or a wide stretch of the number line alive, so people generalise
    along parity and across a region of numbers more than an ideal strong-sampling
    learner does.'
- name: range_bounded_rule_learning
  rationale: 'People never entertain an unbounded mathematical rule on its own: every
    concept they consider is a rule confined to a numerical range (e.g. "even numbers
    between 20 and 60", with "any number between 20 and 60" as the plain-interval
    case), and they infer which range-bounded rule produced the examples under the
    size principle, answering yes by how much of that inference contains the target.
    Because a rule bounded tightly around the examples is always a smaller, better
    explanation than the same rule across all of 1-100, this predicts strong use of
    shared properties like parity inside the examples'' span but sharply less generalization
    of those properties to targets outside it.'
- name: breadth_biased_rule_commitment
  rationale: "Refinement of `sharpened_map_concept_selection`: people still commit,\
    \ nearly all-or-none, to the one or few concepts (a mathematical rule or a numerical\
    \ interval) that best explain the examples under the size principle, and answer\
    \ yes only if the target is in that concept. The one change is the prior over\
    \ rules: rather than treating all rules as equally likely, people find broad,\
    \ familiar rules (odd, even, and other large categories) a priori more natural\
    \ in proportion to how many numbers they cover, with the strength of this breadth\
    \ bias fitted from data \u2014 so a broad rule like parity can win over tighter\
    \ rules and intervals when all examples share it, predicting stronger parity-based\
    \ generalization than the incumbent, as the critique reports."
- name: parity_restricted_range_commitment
  rationale: 'Refinement of `sharpened_map_concept_selection`: people still commit,
    nearly all-or-none, to the concept that best explains the examples under the size
    principle, but the concepts they can commit to include parity-restricted ranges
    ("even numbers between 16 and 64", "odd numbers from 31 to 47") alongside plain
    mathematical rules and plain intervals. The one change is adding these parity-by-interval
    conjunctions to the hypothesis space (with a fitted share of the interval prior),
    so that when all examples share parity people say yes to parity-matching targets
    inside the examples'' range and no to opposite-parity near neighbours and to numbers
    outside the range.'
- name: parity_salient_concept_learning
  rationale: "Refinement of `concept_posterior_with_lapse_guessing`: people do Bayesian\
    \ concept learning over the same 45 rules and all intervals of 1-100 (size principle,\
    \ lapse-and-guess response stage), but parity \u2014 odd versus even \u2014 is\
    \ a privileged, highly accessible concept whose prior is boosted above the other\
    \ rules by a fitted salience factor. The one change is this non-uniform rule prior\
    \ favouring odd/even, which lets parity survive the size principle against tighter\
    \ rules and intervals, so people say yes to parity-matching targets of an all-odd\
    \ or all-even set far more than the uniform-prior learner predicts."
- name: serial_position_weighted_concept_search
  rationale: 'People search for the simplest concept that explains the examples (complexity-costed
    rules and intervals, size principle, near-all-or-none commitment), but they do
    not weigh the examples equally: the evidence each example contributes depends
    on its position in the order shown, growing or shrinking steadily from the first
    example to the last at a fitted rate. If the first example anchors the guess (primacy),
    a concept fitting the early examples survives a later example that breaks it;
    if the latest example dominates (recency), the concept is pulled toward what the
    last examples share.'
- name: digit_space_exemplar_similarity
  rationale: 'People judge a target by its exemplar similarity to the examples in
    a digit-based representation of numbers: each number is coded by its tens digit
    and its ones digit, the psychological distance between the target and an example
    is a weighted city-block distance (a graded penalty for each step apart in tens
    digit plus a penalty for a differing ones digit, with fitted attention weights
    on the two dimensions), and similarity falls off exponentially with that distance.
    The probability of saying yes rises with the target''s summed similarity to all
    the examples, so targets sharing the examples'' final digit or lying in their
    decades are accepted in graded fashion, with no rule inference or size principle.'
- name: confidence_criterion_decision
  rationale: 'People infer how likely the target is to belong to the hidden concept
    exactly as a simple Bayesian concept learner would (rules and intervals under
    the size principle), but they do not report that belief by probability matching:
    they compare it against a personal criterion of how sure they must be to say "yes",
    answering yes when their confidence exceeds the criterion and no otherwise, with
    only a little noise around the cut-off. This soft-threshold decision rule makes
    answers far more all-or-none than the belief itself, and shifts borderline targets
    toward "no" (or "yes") depending on whether the criterion sits above (or below)
    even odds.'
- name: erlang_interval_simplicity_search
  rationale: "Refinement of `simplicity_cost_concept_search`: people still build concepts\
    \ from mental primitives, paying a fitted cost per extra primitive for rules,\
    \ weighing examples by the size principle and committing nearly all-or-none to\
    \ the best-explaining concept. The one change (taken from `tenenbaum_rules_similarity`)\
    \ is the prior over numerical intervals: instead of treating every stretch of\
    \ the number line as equally natural, people favour intervals of a typical width\
    \ (an Erlang prior on interval size with a fitted scale), so tight ranges hugging\
    \ the examples are a priori unlikely and rules win more often \u2014 predicting\
    \ less \"same decade / nearby number\" generalisation and stricter respect for\
    \ shared properties such as parity than the incumbent."
- name: no_default_lapse_simplicity_search
  rationale: "Refinement of `simplicity_cost_concept_search`: people still search\
    \ for a concept built from simple primitives (a fitted cost per extra primitive,\
    \ the size principle, near-all-or-none commitment to the best concept), and on\
    \ a fraction of trials they lapse and answer without consulting the concept. The\
    \ one change is what a lapse produces: instead of a coin-flip yes/no, a lapsing\
    \ person falls back on a learned default answer \u2014 a fitted, typically low,\
    \ base rate of saying yes (a \"when in doubt, say no\" bias) \u2014 so parity-violating\
    \ and merely nearby targets get fewer stray yeses and repeated answers to the\
    \ same item are more consistent than the coin-flip lapse predicts."
- name: interval_breadth_biased_commitment
  rationale: 'Refinement of `breadth_biased_rule_commitment`: people commit nearly
    all-or-none to the concept (a mathematical rule or a numerical interval) that
    best explains the examples under the size principle, with broad rules a priori
    more natural in proportion to their size. The one change is that the same size-graded
    naturalness applies to numerical ranges: instead of all intervals being equally
    likely a priori, an interval''s prior grows (or shrinks) with its width by a fitted
    breadth exponent, so if people favour broad ranges, tight "nearby number" intervals
    rarely win and people say yes to non-example numbers in the examples'' own decade
    less than a flat interval prior predicts.'
- name: multiplicative_not_exponential_concepts
  rationale: "People's concept space for numbers is built on multiplication, not exponentiation:\
    \ they readily entertain parity, \"multiples of m\", final digits, digits contained\
    \ and numerical ranges, but concepts that require repeated multiplication \u2014\
    \ powers of a base, perfect squares, perfect cubes \u2014 are a priori much less\
    \ accessible, carrying a fitted extra cost on top of the ordinary per-primitive\
    \ simplicity cost, size principle and near-all-or-none commitment. So after 32,\
    \ 4, 16 or 4, 64 people generalise to other multiples of 4 (12, 72) rather than\
    \ restricting themselves to powers of 2 or 4, extending shared-divisor rules more\
    \ than a learner who finds powers as natural as multiples."
- name: additive_cluster_exemplar_similarity
  rationale: People do not infer a hidden concept; they compare the target to each
    stored example, one at a time, and judge how similar the two numbers are by the
    stored number categories they have in common (odd/even, multiples of m, squares,
    powers, last digit, digits contained, and stretches of the number line), with
    a shared small category counting far more than a shared broad one. They say yes
    the more the target resembles every example (a geometric-mean, all-examples-must-match
    comparison), so a target sharing a divisor with all the examples, or lying close
    to all of them, is accepted in graded fashion.
- name: stepwise_progression_induction
  rationale: "People assume the hidden program is a counting procedure: it starts\
    \ at some number and steps upward by a fixed stride until it stops (e.g. \"from\
    \ 22 to 82 in steps of 4\", \"from 8 to 64 in steps of 8\", or \"every number\
    \ from 40 to 60\" for a stride of 1). They infer which start, stride and stop\
    \ produced the examples \u2014 preferring small strides and, by the size principle,\
    \ short progressions \u2014 and say yes to a target if the inferred progressions\
    \ land on it. This predicts generalisation along shared step sizes (multiples\
    \ of m, numbers spaced by the examples' common difference) more than fixed rule\
    \ lists do, and less generalisation to immediate neighbours (1-3 away) that fall\
    \ between the steps than to numbers a full stride away."
- name: costly_power_rule_simplicity_search
  rationale: "Refinement of `simplicity_cost_concept_search`: people still build concepts\
    \ from simple mental primitives, paying a fitted cost per extra primitive, weighing\
    \ examples by the size principle and committing nearly all-or-none to the best-explaining\
    \ concept. The one change is that rules built on repeated multiplication \u2014\
    \ squares, cubes, powers of a number and their exception variants \u2014 are harder\
    \ to conceive than other rules of the same length and pay a fitted extra prior\
    \ cost, so when examples such as 32, 4, 16 fit both \"powers of 2\" and \"multiples\
    \ of 4\", people favour the multiplicative rule and extend it to new multiples\
    \ (12, 72) far more than the size principle predicts \u2014 addressing the critique\
    \ that people extend shared-divisor rules more than the best model does."
- name: notation_cheap_simplicity_search
  rationale: "Refinement of `erlang_interval_simplicity_search`: people still build\
    \ concepts from mental primitives (a fitted cost per extra primitive, the size\
    \ principle, an Erlang size prior on intervals, near-all-or-none commitment to\
    \ the best-explaining concept). The one change is that concepts read straight\
    \ off the written numeral \u2014 \"ends in 2\", \"contains a 7\" \u2014 cost a\
    \ different, fitted amount from arithmetic concepts that must be computed (primes,\
    \ squares, cubes, powers, multiples of m), instead of every two-primitive rule\
    \ costing the same. If digit-notation concepts are cheaper, people more readily\
    \ read a set like 92, 82, 27, 42 as \"ends in 2\" with one stray, and reject numbers\
    \ that only share a range with the examples or are merely odd/even neighbours\
    \ of them."
- name: final_digit_salient_concept_search
  rationale: 'Refinement of `erlang_interval_simplicity_search`: people still build
    concepts from mental primitives (a fitted cost per extra primitive, Erlang-weighted
    intervals, the size principle and near-all-or-none commitment to the best-explaining
    concept). The one change is that the final digit of a written number is a privileged,
    perceptually salient feature: rules of the form "ends in d" get a fitted prior
    discount compared with other compound rules (multiples, powers, primes, contains-a-digit).
    So after 62, 32, 22 or 92, 82, 27, 42 people commit to "ends in 2" instead of
    "even numbers" or "contains a 2", and say no to other even numbers and to the
    rest of the 20s.'
- name: contains_digit_costly_concepts
  rationale: 'Refinement of `multiplicative_not_exponential_concepts`: people still
    build number concepts from simple primitives (a fitted cost per extra primitive,
    the size principle, Erlang-weighted intervals, near-all-or-none commitment to
    the best-explaining concept), with an extra cost on powers, squares and cubes.
    The one change is that "contains the digit d anywhere" is a hard, rarely entertained
    concept, because it ignores where the digit is written. It pays its own fitted
    prior cost, so people seldom commit to it. The sharpest disagreement with the
    best model is on sets whose examples all contain a digit d (e.g. 92, 82, 27, 42).
    There, people say no to targets that contain d without sharing an example''s last
    digit (e.g. 23, 29, 12), while the best model predicts yes.'
- name: final_digit_multiplicative_concepts
  rationale: 'Refinement of `multiplicative_not_exponential_concepts`: people still
    build number concepts from mental primitives. They pay a fitted cost per extra
    primitive and a fitted extra cost for concepts built on repeated multiplication
    (powers, squares, cubes), they weigh examples by the size principle, and they
    commit nearly all-or-none to the concept that best explains the examples. The
    one change, taken from `final_digit_salient_concept_search`, is that a written
    number''s final digit is perceptually privileged: "ends in d" rules get a fitted
    prior discount over other compound rules, including "contains the digit d". So
    when every example contains some digit, people read the set as "ends in d" where
    they can, and say no to targets that only contain that digit somewhere else. This
    addresses the critique that people use "contains digit d" less than the incumbent
    predicts.'
- name: ascending_range_sampling_concepts
  rationale: People think of a range-type program as counting upward from where its
    range starts, so they expect the examples they have seen to be bunched toward
    the bottom of the range, with the rest of the range lying above them. A range
    that starts just below the examples and runs well above them therefore explains
    the examples better than one centred on them, and people generalise more to numbers
    a little above the examples than to numbers equally far below. Rule-type concepts
    (parity, multiples, final digits, with powers, squares and cubes costing extra)
    are judged as before.
- name: forward_counting_range_sampling
  rationale: People assume the hidden program produces a numerical range by counting
    upward from its starting point, so the examples they see are taken to be early,
    low members of the range rather than evenly spread across it; a range that starts
    near the examples and extends above them therefore explains the examples better
    than one extending below them, with the strength (and direction) of this counting-forward
    assumption fitted from data. Everything else follows the best model (primitive-built
    rules with a per-primitive cost and an extra cost on powers/squares/cubes, the
    size principle, Erlang-weighted ranges, near-all-or-none commitment), so people
    generalise from a set to numbers just above the examples more than to numbers
    just below them.
- name: place_value_disjunctive_contains
  rationale: 'Refinement of `multiplicative_not_exponential_concepts`: people still
    build number concepts from mental primitives (a fitted cost per extra primitive,
    a fitted extra cost on powers, squares and cubes, Erlang-weighted intervals, the
    size principle and near-all-or-none commitment to the best-explaining concept).
    The one change is how "contains the digit d" is represented: people read numerals
    by place value (tens digit, ones digit), so "contains d" is not an elementary
    property but a disjunction, "the ones digit is d OR the tens digit is d", and
    it costs one more primitive than "ends in d" or "multiples of m", priced by the
    same per-primitive cost with no new free parameter. So when every example contains
    a digit (e.g. 92, 82, 27, 42), people seldom commit to "contains 2" and say no
    to targets that contain the digit without sharing an example''s ending (23, 29,
    12), as the critique reports.'
- name: costly_squares_final_digit_concepts
  rationale: 'Refinement of `final_digit_multiplicative_concepts`. People still build
    number concepts from mental primitives: a fitted cost per extra primitive, a fitted
    prior discount for salient "ends in d" rules, Erlang-weighted intervals, the size
    principle and near-all-or-none commitment to the best-explaining concept. The
    one change splits the single cost on repeated-multiplication concepts in two.
    "Perfect squares" (a number multiplied by itself) pays its own fitted extra cost,
    separate from the cost shared by powers of a base (and their exception variants)
    and cubes. The claim is that self-multiplication is the hardest of these to conceive,
    harder than repeatedly multiplying by a fixed base. So after square sets such
    as 100, 1, 16 or 4, 64, 25, 81, people rarely commit to "squares". Instead they
    fall back on other rules, ranges or scattered guesses. Meanwhile, powers of 2
    or 3 stay more available than a single cost on all of these concepts allows.'
