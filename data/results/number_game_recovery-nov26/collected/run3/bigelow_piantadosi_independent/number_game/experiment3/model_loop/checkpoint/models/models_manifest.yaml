models:
- name: prime_salient_hundred_chart
  rationale: 'Refinement of `hundred_chart_row_ranges` (everything kept: primitive-built
    rules with a per-primitive cost, final-digit discount, costs on powers/cubes and
    squares, times-table-graded multiples, Erlang ranges with a bonus for whole hundred-chart
    rows, the size principle and near-all-or-none commitment). The one change, taken
    from `prime_salient_concepts`, is that "prime numbers" is a familiar school-math
    category kept ready to hand, so it gets a fitted prior bonus over other compound
    rules. So after all-prime sets such as 2, 47 or 67, 31, 17, 61, people commit
    to "primes": they say yes to other primes more than to odd composite numbers,
    which the current best model gets backwards.'
- name: prime_over_odd_reading
  rationale: 'Refinement of `hundred_chart_row_ranges` (everything kept: primitive-built
    rules with a per-primitive cost, final-digit discount, costs on powers/cubes and
    squares, times-table-graded multiples, Erlang ranges with a bonus for whole hundred-chart
    rows, the size principle and near-all-or-none commitment). The one change is that
    "odd numbers" and "prime numbers" are rival readings of the same kind of evidence
    (numbers with no factor of 2), and people find "prime" the more meaningful reading
    and "odd" the emptier, merely "not even" one: a single fitted preference moves
    prior plausibility away from "odd numbers" and onto "prime numbers" by the same
    amount. So after all-prime sets (2, 47; 53, 2; 67, 31, 17, 61) people say yes
    to other primes and no to odd composites, and after all-odd non-prime sets (69,
    9, 39, 21) they extend "odd" less than the incumbent predicts and fall back on
    ranges or narrower rules.'
- name: prime_salient_marked_odd
  rationale: 'Refinement of `prime_salient_hundred_chart` (everything kept: primitive-built
    rules with a per-primitive cost, final-digit discount, costs on powers/cubes and
    squares, times-table-graded multiples, Erlang ranges with a bonus for whole hundred-chart
    rows, a fitted prior bonus for the familiar category "prime numbers", the size
    principle and near-all-or-none commitment). The one change, taken from `marked_odd_parity_concepts`,
    is that "odd" is a marked, negatively defined category ("not even"), so the rule
    "odd numbers" carries a fitted extra prior cost that "even numbers" does not.
    As a result, after all-prime sets of odd primes (53, 47, 41; 67, 31, 17, 61) "odd"
    competes less with "primes", and people say yes to other primes but no to odd
    composites (9, 21, 63, 81) more sharply than prime salience alone predicts, while
    after all-even sets they still extend "even" readily.'
- name: hidden_divisibility_by_three
  rationale: 'Refinement of `prime_salient_marked_odd` (everything kept: primitive-built
    rules with a per-primitive cost, final-digit discount, costs on powers/cubes and
    squares, times-table-graded multiples, Erlang ranges with a bonus for whole hundred-chart
    rows, a prime bonus, a marked-odd cost, the size principle and near-all-or-none
    commitment). The one change is that divisibility by 3 cannot be read off a numeral''s
    last digit the way divisibility by 2, 5 or 10 can; it needs a digit-sum check.
    So every rule whose membership test contains that check ("multiples of 3", "of
    6", "of 9", "of 12") carries one shared, fitted extra prior cost. As a result,
    after odd multiples of 3 such as 69, 9, 39, 21 or 63, 27, 99, 33, people seldom
    commit to "multiples of 3". They extend "odd", a final digit or a range instead,
    and say yes to odd non-multiples of 3 (19, 29, 49, 23, 37) about as readily as
    to other multiples of 3.'
- name: irregular_threes_times_table
  rationale: 'Refinement of the incumbent `prime_over_odd_reading`. Everything in
    it is kept: primitive-built rules with a per-primitive cost, the final-digit discount,
    costs on powers/cubes and squares, times-table-graded multiples, the single preference
    that moves plausibility from "odd" to "prime", Erlang ranges with a bonus for
    whole hundred-chart rows, the size principle and near-all-or-none commitment.
    The one change is that the 3 times table has no visible pattern in the written
    numeral (multiples of 2, 5 or 10 can be read off the last digit, multiples of
    3 cannot), so people seldom notice that a set is all "multiples of 3", and that
    one rule carries its own fitted extra prior cost. So after sets of multiples of
    3 such as 69, 9, 39, 21 or 63, 27, 99, 33, people extend "odd", a final digit
    or a range instead, and say yes to other multiples of 3 hardly more often than
    to non-multiples, where the incumbent over-generalises "multiples of 3".'
- name: repdigit_pattern_chart_concepts
  rationale: 'Refinement of the incumbent `prime_over_odd_reading`, with everything
    in it kept: primitive-built rules with a per-primitive cost, the final-digit discount,
    costs on powers/cubes and squares, times-table-graded multiples, the single preference
    that moves plausibility from "odd" to "prime", Erlang ranges with a bonus for
    whole hundred-chart rows, the size principle and near-all-or-none commitment.
    The one change adds a concept the incumbent lacks. People notice when a numeral''s
    two digits are the same (11, 22, ..., 99), so "repeated-digit numbers" is a candidate
    rule, priced like other two-primitive rules plus its own fitted prior bonus. After
    sets holding two or more repdigits (e.g. 33, 77 or 44, 11, 88), people say yes
    to other repdigits and no to numbers that merely lie near the examples, which
    closes the critique''s report that the incumbent under-predicts yes to repdigit
    targets after repdigit sets.'
- name: single_example_guessing
  rationale: A single example is too little evidence to settle on a rule, so on a
    fitted share of single-example trials people stop trying to work out the program
    and simply guess yes or no at even odds. With two or more examples they answer
    from the concept they inferred, using the best model's inference unchanged. So
    after a lone example (e.g. 16 or 81), numbers far from it get noticeably more
    yeses than the inferred concept implies, and the falloff from near to far targets
    is flatter than it is after sets of several examples.
- name: digit_reversal_pair_concepts
  rationale: 'People notice when two numerals are written with the same two digits
    in swapped order (16 and 61, 47 and 74, 38 and 83). So "a number and its digit-reversal"
    is a concept they can entertain for the hidden program. It is a tiny two-member
    rule, priced like other two-part rules plus its own fitted prior cost or bonus,
    added to the current best model''s concept search, which is otherwise unchanged:
    primitive-built rules, final-digit discount, power and square costs, graded times
    tables, prime over odd, repdigits, hundred-chart ranges, the size principle and
    near-all-or-none commitment. So after a set such as 47, 2, 74, or a lone example
    such as 61, people say yes to the reversed numeral (74, 16) more than to its numerical
    neighbours, which the current best model cannot predict.'
- name: minerva_category_trace_echo
  rationale: "People do not infer a concept; they hold in long-term memory traces\
    \ of familiar number categories (parity, primes, squares, cubes, powers, times\
    \ tables, final digits, contained digits, repeated digits, and stretches of the\
    \ number line), and the examples act as a memory probe that activates each stored\
    \ trace in proportion to a steep power of its overlap with the examples (shared\
    \ members over members in either, as in MINERVA 2 echo retrieval). They say yes\
    \ to the target in proportion to how strongly the resulting echo \u2014 the activation-weighted\
    \ blend of the retrieved traces \u2014 contains it, so broad categories are only\
    \ weakly retrieved by a few examples and, unlike the size principle, the sharpness\
    \ of retrieval does not grow with the number of examples shown."
- name: set_size_graded_evidence_weight
  rationale: 'Refinement of the incumbent `repdigit_pattern_chart_concepts`. Everything
    in it is kept: primitive-built rules with per-primitive costs, the final-digit
    discount, costs on powers and squares, graded multiples, prime over odd, the repdigit
    rule, hundred-chart ranges, the size principle and near-all-or-none commitment.
    The one change is how people pool evidence across examples. Agreeing examples
    are more convincing together than one at a time, so the weight each example carries
    grows with the set''s size at a fitted rate. From a single example people therefore
    commit only weakly to a tight range or rule and generalise broadly; they do not
    answer by a steep nearness gradient around it. Once three or four examples agree,
    they commit more sharply than an ideal learner would.'
- name: prime_bonus_odd_cost_decoupled
  rationale: 'Refinement of the incumbent `repdigit_pattern_chart_concepts`, with
    everything kept: primitive-built rules with a per-primitive cost, the final-digit
    discount, costs on powers/cubes and squares, times-table-graded multiples, the
    repeated-digit rule with its own bonus, Erlang ranges with a bonus for whole hundred-chart
    rows, the size principle and near-all-or-none commitment. The one change is about
    "prime" versus "odd". The incumbent treats them as one trade-off: whatever plausibility
    "prime numbers" gains, "odd numbers" loses. Here they are two separate facts about
    people, taken from `prime_salient_marked_odd`. "Prime" is a familiar category
    with its own fitted bonus, and "odd" is a marked "not even" category with its
    own fitted cost of a different size. So after all-prime sets people still commit
    to "primes", but after odd sets with no primes in them (63, 27, 99, 33) they extend
    "odd" to odd non-examples (23, 31, 37, 43) more than the incumbent''s coupled
    trade-off allows.'
- name: fives_privileged_decoupled_prime_odd
  rationale: 'Refinement of `prime_bonus_odd_cost_decoupled`, with everything in it
    kept: primitive-built rules with a per-primitive cost, the final-digit discount,
    costs on powers/cubes and squares, times-table-graded multiples, a separate fitted
    bonus for "prime numbers" and cost for "odd numbers", the repeated-digit rule,
    Erlang ranges with a bonus for whole hundred-chart rows, the size principle and
    near-all-or-none commitment. The one change is that "multiples of 5" is unlike
    the other times tables. Counting by fives is a drilled skill, and membership can
    be read straight off the numeral (it ends in 0 or 5), so this one rule gets its
    own fitted prior bonus. So after sets of multiples of 5 that are not all multiples
    of 10 (e.g. 90, 100, 5 or 35, 15, 85), people commit to "multiples of 5": they
    say yes to other numbers ending in 0 or 5 and no to neighbouring non-multiples
    more sharply than the base model predicts, while sets that fit other times tables
    are unaffected.'
- name: hard_seven_eight_tables
  rationale: 'The 7 and 8 times tables are the hardest multiplication facts people
    learn. They are recalled slowly and with errors, so people rarely notice that
    a set of examples is all "multiples of 7" or all "multiples of 8". Those two rules
    carry their own fitted extra prior cost, on top of the best model''s concept search,
    which is otherwise unchanged: primitive-built rules, final-digit discount, power
    and square costs, graded times tables, a prime bonus and an odd cost, repdigits,
    a privileged fives table, hundred-chart ranges, the size principle and near-all-or-none
    commitment. The disagreement with the best model is after sets such as 14, 98,
    91 or 8, 64. There people say no to other multiples of 7 (7, 21, 35, 63) or of
    8 (24, 40, 56, 72) and fall back on ranges, powers or digit rules, while the best
    model predicts they extend the times table.'
- name: example_spacing_sparsity_bias
  rationale: 'People read how far apart the examples are as a clue to how sparse the
    hidden program''s output is: widely spaced examples (e.g. 3, 48, 99) suggest a
    program that produces only a few scattered numbers, while closely spaced examples
    suggest a program that produces many. So the wider the average gap between neighbouring
    examples, the less ready people are to say yes to any new number, beyond what
    the rule or range they infer from the examples implies. That inference is otherwise
    unchanged from the current best model.'
- name: set_size_evidence_privileged_fives
  rationale: 'Refinement of the incumbent `fives_privileged_decoupled_prime_odd`.
    Everything in it is kept: primitive-built rules with a per-primitive cost, the
    final-digit discount, costs on powers/cubes and squares, graded times tables,
    a separate prime bonus and odd cost, the repeated-digit rule, the privileged "multiples
    of 5" rule, hundred-chart ranges, the size principle and near-all-or-none commitment.
    The one change is taken from `set_size_graded_evidence_weight` and concerns how
    people pool evidence. Agreeing examples are more convincing together than one
    at a time, so the weight each example carries grows with the size of the set at
    a fitted rate. After a single example people therefore commit only weakly and
    generalise broadly, and once three or four examples agree they commit to the shared
    rule or tight range more sharply than an ideal learner would.'
- name: set_size_evidence_privileged_fives_2
  rationale: 'I refined `set_size_graded_evidence_weight` and kept everything in it:
    primitive-built rules with a per-primitive cost, the final-digit discount, costs
    on powers and squares, graded times tables, prime over odd, the repdigit rule,
    hundred-chart ranges, the size principle, near-all-or-none commitment, and evidence
    from agreeing examples that grows stronger with the set''s size. The one change
    is taken from `fives_privileged_decoupled_prime_odd`. "Multiples of 5" is a privileged
    times table, because counting by fives is drilled and membership can be read off
    the numeral (it ends in 0 or 5), so that rule gets its own fitted prior bonus.
    So after sets such as 35, 15, 85 people commit to "multiples of 5" and say yes
    to other numbers ending in 0 or 5. That commitment is weak after a single example
    such as 35 and sharp after three or four.'
- name: weber_scaled_range_widths
  rationale: 'People represent numbers on a compressed mental number line, so the
    same numerical gap feels smaller among large numbers than among small ones (Weber''s
    law). When they consider that the program produces a stretch of the number line,
    the range width they find natural is therefore proportional to the magnitude of
    the examples: after examples in the 70s-90s they readily extend to numbers ten
    or twenty away, while after examples below 20 they expect a tight range and reject
    numbers only a few steps away. How they infer rules (parity, primes, times tables,
    final digits, repdigits, powers) is unchanged from the current best model.'
- name: singleton_guessing_privileged_fives
  rationale: 'Refinement of the incumbent `fives_privileged_decoupled_prime_odd`,
    with all of its concept inference kept: primitive-built rules with per-primitive
    costs, the final-digit discount, power and square costs, graded times tables,
    a separate prime bonus and odd cost, the repeated-digit rule, privileged multiples
    of 5, hundred-chart ranges, the size principle and near-all-or-none commitment.
    The one change is taken from `single_example_guessing` and concerns the response
    stage: a lone example is too little evidence to work out a program, so on a fitted
    share of single-example trials people give up on inference and guess yes or no
    at even odds, while with two or more examples they answer from the inferred concept
    as before. After a lone example (e.g. 16 or 81) far-off targets therefore get
    more yeses, and near ones fewer, than the inferred concept implies, unlike the
    incumbent, which treats every set size alike.'
- name: round_landmark_veto
  rationale: 'Round numbers (10, 20, ..., 100) are landmarks on the mental number
    line rather than ordinary outputs, so people check a round target against the
    examples before accepting it: if none of the examples is itself a round number,
    on a fitted share of such trials they doubt that the program produces round numbers
    and answer no, whatever concept they inferred. Concept inference itself is unchanged
    from the current best model, so the claim shows up only after sets with no multiple
    of 10 (e.g. 8, 64 or 32, 4, 16), where people say no to 10, 20, 30 or 70 more
    often than the concept they inferred (e.g. "even numbers") implies.'
- name: round_number_unrepresentativeness
  rationale: People infer the hidden program as an ideal concept learner does (simple,
    familiar rules and ranges weighed by how well they explain the examples), but
    they add one representativeness bias. Round numbers (multiples of 10) are a salient
    class of their own, so when none of the examples is round, a round target looks
    unlike anything the program has produced, and people say yes to it less often
    than the concept they inferred implies. When some example is round, round targets
    are judged by the inferred concept alone.
- name: decade_block_ranges
  rationale: People divide the number line into spoken decades ("the thirties" = 30
    to 39), not into the rows of a hundred chart (31 to 40). When they fall back on
    a range around the examples, the natural blocks they prefer are whole decades,
    which start at a round number and stop just before the next one. So after examples
    such as 34, 37 people say yes to 30 more readily than to 40, and in general a
    round number just above the examples' decade gets fewer yeses than the current
    best model (whose favoured blocks end on round numbers) predicts. Everything else
    in how they infer the program is as in the current best model.
- name: round_number_atypical_members
  rationale: 'I refined the incumbent `set_size_evidence_privileged_fives` and kept
    everything in it: primitive-built rules with a per-primitive cost, the final-digit
    discount, power and square costs, graded times tables, the prime bonus and odd
    cost, repdigits, privileged multiples of 5, hundred-chart ranges, the size principle,
    near-all-or-none commitment and evidence that grows stronger with set size. The
    one change is about round numbers. Multiples of 10 (10, 20, ..., 100) are landmarks
    and reference points, not typical outputs of a pattern, so people are less ready
    to accept a round target as a member of the concept they inferred, by a fitted
    factor. This holds for "even", "multiples of 4" or a range around the examples,
    but not for a concept that is explicitly about numbers ending in 0. So after 8,
    64 or 12, 84, 8, people say yes to even targets such as 24 or 56 but less often
    to 20, 40 or 70, which the incumbent treats as equally good members.'
- name: spacing_sparsity_graded_evidence
  rationale: 'I refined `example_spacing_sparsity_bias` and kept all of it. People
    read wide gaps between neighbouring examples as a sign that the program produces
    only a few scattered numbers, so they say yes less often. Underneath that sits
    the privileged-fives concept learner: primitive-built rules with per-primitive
    costs, the final-digit discount, power and square costs, graded times tables,
    a separate prime bonus and odd cost, repdigits, multiples of 5, hundred-chart
    ranges, the size principle and near-all-or-none commitment. The one change is
    taken from `set_size_graded_evidence_weight` and concerns how people pool evidence:
    the weight each agreeing example carries grows with the set''s size at a fitted
    rate. So after a lone example people commit weakly and generalise broadly. After
    three or four widely spaced examples they commit sharply to the shared rule but
    still hold back from saying yes, because the gaps suggest a sparse program.'
- name: accumulating_round_skip_evidence
  rationale: 'Refinement of the incumbent `set_size_evidence_privileged_fives`, with
    all of its concept inference kept (primitive-built rules with per-primitive costs,
    final-digit discount, power and square costs, graded times tables, prime bonus
    and odd cost, repdigits, privileged multiples of 5, hundred-chart ranges, the
    size principle, set-size-graded evidence and near-all-or-none commitment). The
    one change is that people notice, example by example, that the program seems to
    skip round numbers (10, 20, ..., 100): each example that is not round is a separate
    chance to notice this, and once they have noticed it they reject a round target
    even if it fits the rule they inferred. So rejection of round targets grows with
    the number of non-round examples: it is weak after a lone 16 and strong after
    32, 4, 16, 8, unlike a fixed round-number veto. Round targets after sets with
    any round example are judged by the inferred concept alone.'
- name: first_example_anchored_trust
  rationale: 'People build their guess about the program from the first example they
    see and then check each later example against that guess, so the first example
    anchors the concept: it is less readily set aside as a stray number than any later
    example, at a fitted rate. Concept inference is otherwise that of the current
    best model, with the round-number veto kept. So a rule or range that fits the
    first example but misses a later one survives better than one that fits the later
    examples but misses the first, and a target that shares the first example''s rule
    or region gets more yeses than one that shares only a later example''s.'
- name: log_ratio_nearest_example_similarity
  rationale: 'People judge a target by its similarity to the nearest example on a
    logarithmically compressed mental number line: the farther the target lies from
    the closest example in log-magnitude (ratio) terms, the less likely they are to
    say yes, falling off smoothly at a fitted rate. Because the scale is compressed,
    a gap of 10 counts as small among numbers in the 80s but as large among numbers
    below 20, so people generalise widely around large examples and tightly around
    small ones, with no rule inference at all.'
- name: forward_continuation_response_bias
  rationale: At the answer stage people treat the examples as what the program has
    produced so far, and they assume it runs upward. So, beyond what the concept they
    inferred implies, they lean toward yes for a target above the largest example
    and toward no for a target below the smallest. The strength of this lean is fitted,
    and targets inside the examples' span are unaffected. Concept inference is the
    current best model's, unchanged (including its round-number veto). So after 32,
    4, 16, a target such as 40 or 60 gets more yeses than 2 or 3, even where the inferred
    concept rates them equally.
- name: round_veto_spacing_sparsity
  rationale: 'I refined the incumbent `round_landmark_veto` and kept all of it: people
    infer the program with the set-size-graded privileged-fives concept learner, and
    when no example is a round number they veto round targets (10, 20, ..., 100) on
    a fitted share of trials. The one change is taken from `example_spacing_sparsity_bias`:
    people also read how far apart the examples are as a clue to how sparse the program''s
    output is, so the wider the average gap between neighbouring examples, the less
    ready they are to say yes to any target, beyond what the inferred concept implies.
    So after widely spaced sets such as 3, 48, 99 or 8, 64, people say yes less often
    than the incumbent predicts even to targets that fit the inferred rule or range,
    and after tightly clustered sets they say yes more often.'
- name: atypical_round_spacing_sparsity
  rationale: 'I refined `round_number_atypical_members` and kept all of it. People
    infer the program with the privileged-fives concept learner, whose evidence per
    example grows with set size, and they accept a round target (10, 20, ..., 100)
    as a member of the concept they inferred only by a fitted typicality factor, unless
    the concept is explicitly about a final or contained 0. The one change is taken
    from `example_spacing_sparsity_bias`: people read wide gaps between neighbouring
    examples as a sign that the program produces only a few scattered numbers, so
    the wider the examples'' mean gap, the less ready they are to say yes to any target.
    So after widely spaced sets such as 8, 64 or 14, 98, 91, people say yes less often
    across the board, and less still to round targets that the inferred concept contains.'
- name: trusted_example_round_landmark_veto
  rationale: 'I refined the incumbent `round_landmark_veto` and kept all of it: the
    set-size-graded privileged-fives concept learner, plus the veto of round targets
    (10, 20, ..., 100) on a fitted share of trials when no example is round. The one
    change is how often people think an example is a stray number that the program
    did not really produce. The incumbent fixes this at 10%; here it is a fitted belief,
    and if people trust each example more than that, they will not read a set as a
    tight rule plus an outlier. Instead, every example must fit the concept, so after
    sets such as 92, 82, 27, 42 or 14, 98, 91 people fall back on rules or ranges
    that cover all the examples, rather than a narrow rule that leaves one example
    out.'
- name: square_pair_concepts
  rationale: People can read a set of examples as "a number and its square" (for example
    8 and 64, 9 and 81, or 4 and 16), so the pair made up of a number and its square
    is one more concept they consider for the program. It is priced like the other
    two-part rules, plus its own fitted prior cost or bonus, and is added to the current
    best model's concept search, which stays the same in every other way. Because
    the concept has only two members, the size principle makes it win whenever the
    examples are exactly such a pair. So after 8, 64 people say no to almost every
    other number, including other even numbers, multiples of 8 and powers of 2 such
    as 24, 32, 56 or 72, which the current best model predicts they accept.
- name: iter4_candidate1
  rationale: 'People do not infer a concept: they store the examples as exemplars
    and judge a target by how similar it is to them, where similarity between two
    numbers falls off with their distance in a space of magnitude and familiar number
    properties (parity, primality, squares, cubes, powers of 2, times tables, final
    digit, tens digit). They say yes when the target is more similar to the stored
    examples than it is to numbers in general, so the decision rests on the target''s
    familiarity relative to its baseline similarity to all of 1-100. A target that
    shares a rare property with the examples (e.g. 27 after 1, 8, 64) therefore stands
    out more than one that shares only a common property, without any explicit rule
    or size principle.'
- name: pedagogical_example_selection
  rationale: People do not treat the examples as random draws from the program's output.
    They assume a helpful teacher picked them to be diagnostic, favouring telling
    numbers that few candidate stretches of the number line contain, namely those
    near the ends of 1-100. So a concept that contains many such telling numbers seems
    unlikely when none of them was shown ("if the program reached the 90s, I would
    have been shown one"). The concept's effective size is weighted by how diagnostic
    its members are, at a fitted strength, in place of the plain size principle. Everything
    else in the current best model is kept, including its round-number veto and upward
    response lean.
- name: forward_continuation_spacing_sparsity
  rationale: 'I refined the incumbent `forward_continuation_response_bias` and kept
    all of it: people infer the program with the set-size-graded privileged-fives
    concept learner, veto round targets that no round example supports, and at the
    answer stage lean toward yes above the largest example and toward no below the
    smallest. The one change is taken from `example_spacing_sparsity_bias`: people
    also read the average gap between neighbouring examples as a clue to how sparse
    the program''s output is, so the wider the examples are spread, the less ready
    they are to say yes to any target, on top of the upward lean. So after widely
    spaced sets such as 8, 64 or 14, 98, 91 people say yes less often than the incumbent
    predicts, even above the examples, and after tightly clustered sets they say yes
    more often.'
- name: trusted_example_forward_continuation
  rationale: 'I refined the incumbent `forward_continuation_response_bias` and kept
    all of it: people infer the program with the set-size-graded privileged-fives
    concept learner, veto round targets that no round example supports on a fitted
    share of trials, and at the answer stage lean toward yes for targets above the
    largest example and toward no for targets below the smallest. The one change,
    taken from `trusted_example_round_landmark_veto`, is how often people believe
    an example is a stray number the program did not really produce: the incumbent
    fixes this at 10%, here it is a fitted belief. If people trust each example more
    than that, they rarely read a set as a tight rule plus one outlier, so after sets
    such as 92, 82, 27, 42 they fall back on rules or ranges that cover every example,
    while the upward lean on targets outside the examples'' span stays as before.'
- name: widest_gap_sparsity_round_veto
  rationale: 'I refined `round_veto_spacing_sparsity` and kept all of it: the set-size-graded
    privileged-fives concept learner, the veto of round targets (10, 20, ..., 100)
    on a fitted share of trials when no example is round, and a fitted lowering of
    yes answers the sparser the program''s output looks. The one change is how people
    judge that sparsity: not from the average gap between neighbouring examples but
    from the widest empty stretch between them, because a long run of numbers the
    program skipped is what signals that it produces few numbers. So a set with one
    big hole, such as 27, 42, 82, 92, makes people as reluctant to say yes as an evenly
    spread set with the same hole, even though its average gap is much smaller.'
