models:
- name: place_value_disjunctive_contains
  rationale: 'Refinement of `multiplicative_not_exponential_concepts`: people still
    build number concepts from mental primitives (a fitted cost per extra primitive,
    a fitted extra cost on powers, squares and cubes, Erlang-weighted intervals, the
    size principle and near-all-or-none commitment to the best-explaining concept).
    The one change is how "contains the digit d" is represented: people read numerals
    by place value (tens digit, ones digit), so "contains d" is not an elementary
    property but a disjunction, "the ones digit is d OR the tens digit is d", and
    it costs one more primitive than "ends in d" or "multiples of m", priced by the
    same per-primitive cost with no new free parameter. So when every example contains
    a digit (e.g. 92, 82, 27, 42), people seldom commit to "contains 2" and say no
    to targets that contain the digit without sharing an example''s ending (23, 29,
    12), as the critique reports.'
- name: costly_squares_final_digit_concepts
  rationale: 'Refinement of `final_digit_multiplicative_concepts`. People still build
    number concepts from mental primitives: a fitted cost per extra primitive, a fitted
    prior discount for salient "ends in d" rules, Erlang-weighted intervals, the size
    principle and near-all-or-none commitment to the best-explaining concept. The
    one change splits the single cost on repeated-multiplication concepts in two.
    "Perfect squares" (a number multiplied by itself) pays its own fitted extra cost,
    separate from the cost shared by powers of a base (and their exception variants)
    and cubes. The claim is that self-multiplication is the hardest of these to conceive,
    harder than repeatedly multiplying by a fixed base. So after square sets such
    as 100, 1, 16 or 4, 64, 25, 81, people rarely commit to "squares". Instead they
    fall back on other rules, ranges or scattered guesses. Meanwhile, powers of 2
    or 3 stay more available than a single cost on all of these concepts allows.'
- name: repeat_averse_concept_learning
  rationale: 'People infer the hidden concept as a Bayesian learner would: they build
    number rules from simple primitives and weigh them, and numeric ranges, by the
    size principle. The one distortion is that they treat the program as producing
    distinct numbers, as if it sampled without replacement, so a number already shown
    as an example seems less likely to come up again. As a result they sometimes say
    "no" to a target that is itself one of the examples, even though it certainly
    fits the concept, while their answers to every other target are unchanged.'
- name: first_example_overridden_concepts
  rationale: 'People revise their guess about the concept as each example arrives,
    so the later examples carry the final say: the first example shown is the one
    most readily dismissed as a stray that the program did not really mean, while
    later examples are trusted to belong to the concept. The concept they settle on
    (built from primitives with simplicity costs, a final-digit discount, extra costs
    for powers and squares, the size principle and near-all-or-none commitment) may
    therefore ignore a first example that breaks the pattern the later ones share,
    and reordering the same examples (e.g. 8,16 versus 16,8) changes which concept
    wins.'
- name: small_number_expectation_concepts
  rationale: 'Refinement of `costly_squares_final_digit_concepts`: people infer the
    hidden concept exactly as in that model (primitive-built rules with a per-primitive
    cost, a final-digit discount, extra costs on powers/cubes and on squares, Erlang-weighted
    intervals, the size principle, near-all-or-none commitment). The one change is
    a small-number expectation: people believe a computer program is more likely to
    produce small numbers than large ones, so their readiness to say "yes" falls steadily
    with the target''s magnitude at a fitted rate. For the same concept belief, a
    target in the 80s or 90s gets fewer yeses than one in the teens or 20s.'
- name: factor_graded_multiples_concepts
  rationale: 'Refinement of `costly_squares_final_digit_concepts`. Everything is kept:
    concepts built from mental primitives with a fitted cost per extra primitive,
    a discount for "ends in d" rules, separate extra costs for powers/cubes and for
    perfect squares, Erlang-weighted ranges, the size principle and near-all-or-none
    commitment. The one change is that "multiples of m" rules are not equally available
    for every m. People check divisibility by recalling a times table, and larger
    tables are less fluent, so the prior cost of a multiples rule grows with the logarithm
    of its factor, at a fitted rate. People therefore readily read sets as multiples
    of 3, 4 or 5 (e.g. 20, 32, 92 as multiples of 4; 90, 100, 5 as multiples of 5).
    After 14, 98, 91 or 8, 64 they seldom commit to "multiples of 7" or "multiples
    of 8" and say no to other multiples (7, 35, 63; 24, 40, 56).'
- name: forward_counting_final_digit_concepts
  rationale: 'Refinement of the pruned `final_digit_multiplicative_concepts`: people
    still build number concepts from mental primitives (a fitted cost per extra primitive,
    a fitted extra cost on powers, squares and cubes, a fitted prior discount on salient
    "ends in d" rules, Erlang-weighted ranges, the size principle and near-all-or-none
    commitment). The one change, taken from `forward_counting_range_sampling`, is
    how people think a range-type program produces its numbers: they picture it counting
    upward from where the range starts, so the examples are read as early, low members
    of the range, with the strength of this forward-counting assumption fitted. So
    when a set is explained by a range, people say yes more to numbers a little above
    the examples than to numbers equally far below them, while their rule-based answers
    (parity, multiples, final digits) are unchanged.'
- name: spacing_scaled_distance_gradient
  rationale: 'People judge a target by its numerical distance to the nearest example:
    willingness to say yes falls off exponentially (a Shepard generalization gradient)
    as the target moves away from the closest example on the number line. The width
    of that gradient is not fixed but scales with how widely spaced the examples are,
    so tightly clustered examples (e.g. 60, 62, 64) produce a narrow gradient that
    rejects numbers a few steps away, while widely spaced examples (e.g. 16, 8, 64)
    produce a broad gradient that accepts numbers far from any example.'
- name: prime_salient_concepts
  rationale: 'Refinement of `factor_graded_multiples_concepts` that changes how likely
    one concept is a priori. "Prime numbers" is a familiar school-math category. People
    keep it ready to hand, so it carries a fitted prior bonus over other compound
    rules (multiples, powers, final digits, digits contained). Everything else is
    kept: primitive costs, the final-digit discount, the costs on powers and squares,
    factor-graded multiples, Erlang ranges, the size principle and near-all-or-none
    commitment. So after sets such as 2, 47 or 53, 2 or 67, 31, 17, 61, people commit
    to "primes": they say yes to other primes (5, 13, 73, 89) and no to non-prime
    numbers inside the examples'' range, more often than the current best model predicts.'
- name: hundred_chart_row_ranges
  rationale: 'Refinement of `factor_graded_multiples_concepts`: everything is kept
    (primitive-built rules with a fitted cost per extra primitive, a final-digit discount,
    extra costs for powers/cubes and for squares, times-table-graded multiples costs,
    Erlang-weighted ranges, the size principle and near-all-or-none commitment). The
    one change is how people picture numerical ranges: they lay 1-100 out as a hundred
    chart of ten rows (1-10, 11-20, ..., 91-100), so ranges made of whole rows ("1
    to 50", "21 to 40", "81 to 90", "1 to 100") get a fitted prior bonus over ranges
    with arbitrary endpoints. When no rule explains the examples well, people therefore
    fall back on a broad round block of the chart and say yes fairly uniformly to
    targets within it, rather than to a tight range hugging the examples.'
- name: chain_length_graded_powers
  rationale: 'Refinement of `factor_graded_multiples_concepts`. Everything in it is
    kept: concepts built from mental primitives with a fitted cost per extra primitive,
    the "ends in d" discount, extra costs for powers/cubes and for squares, factor-graded
    multiples costs, Erlang-weighted ranges, the size principle and near-all-or-none
    commitment. The one change is that a "powers of b" rule is held in mind as a chain
    of repeated multiplications, so it is harder to conceive the longer the chain
    it spans within 1-100. Its prior cost grows with the logarithm of the chain''s
    length at a fitted rate. Short chains made of familiar times-table facts (1, 8,
    64; 1, 9, 81; 1, 10, 100) are therefore readily entertained, while long chains
    such as powers of 2 stay costly. After 8, 64, people commit to "powers of 8" and
    say no to the other multiples of 8 (24, 40, 56) more than the incumbent predicts.'
- name: forward_counting_graded_multiples
  rationale: 'Refinement of `forward_counting_final_digit_concepts`: people build
    number concepts from mental primitives (a cost per extra primitive, an extra cost
    on powers/squares/cubes, a discount on "ends in d" rules, Erlang-weighted ranges,
    the size principle, near-all-or-none commitment) and picture a range-type program
    as counting upward from its start, so they generalise a little more above the
    examples than below. The one change, taken from `factor_graded_multiples_concepts`,
    is that "multiples of m" rules are not equally available for every m: divisibility
    is checked by recalling a times table, and larger tables are less fluent, so a
    multiples rule''s prior cost grows with the logarithm of its factor at a fitted
    rate. People therefore readily read sets as multiples of 3, 4 or 5 but seldom
    commit to multiples of 7, 8, 11 or 12, and when they do not, they fall back on
    an upward-tilted range around the examples.'
- name: diagnostic_attention_exemplar_similarity
  rationale: 'People do not infer a hidden concept: they hold the examples in memory
    as exemplars and say yes to a target the more similar it is, on average, to those
    stored examples. Similarity is judged over familiar number properties (parity,
    primality, squares, cubes, powers of 2, multiples, final digit, decade, digits
    contained) and magnitude. Attention shifts to whatever the examples conspicuously
    share, with more attention the rarer the shared property is and, for magnitude,
    the more tightly the examples cluster. So after an all-prime set, a non-prime
    target mismatches every example on a heavily attended dimension and is rejected,
    while other primes are accepted.'
- name: marked_odd_parity_concepts
  rationale: '"Odd" is a marked, negatively defined category: people think of an odd
    number as one that is "not even" rather than by a positive property, so "odd numbers"
    is harder to entertain as the program''s rule than "even numbers", even though
    both are equally simple and equally large. As a result, after all-odd examples
    (e.g. 19, 73 or 7, 31) people often reject other odd numbers (63, 81, 87, 21)
    and fall back on a range or a narrower rule. After all-even examples they readily
    extend "even". Everything else in how they infer the rule is unchanged: primitive-built
    rules, the size principle, hundred-chart ranges and near-all-or-none commitment.'
- name: sieve_prime_concepts
  rationale: 'People recognise "prime numbers" not by knowing the true primes but
    by a quick divisibility sieve: a number counts as prime-like if it is not even,
    does not end in 0 or 5, and is not in the 3 times table (2, 3 and 5 themselves
    included). This sieve concept is a familiar, readily entertained rule with its
    own fitted prior bonus, layered on the best model''s concept search (primitive
    costs, final-digit discount, power/square costs, factor-graded multiples, hundred-chart
    row ranges, size principle, near-all-or-none commitment), so after all-prime sets
    such as 53, 47, 41 or 19, 73 people say yes to other primes and no to odd multiples
    of 3 or 5. The sharpest disagreement with the best model (and with true-prime
    salience) lives at odd composites that survive the sieve, 49, 77 and 91: after
    a prime set people should say yes to them about as often as to real primes.'
- name: prime_salient_hundred_chart
  rationale: 'Refinement of `hundred_chart_row_ranges` (everything kept: primitive-built
    rules with a per-primitive cost, final-digit discount, costs on powers/cubes and
    squares, times-table-graded multiples, Erlang ranges with a bonus for whole hundred-chart
    rows, the size principle and near-all-or-none commitment). The one change, taken
    from `prime_salient_concepts`, is that "prime numbers" is a familiar school-math
    category kept ready to hand, so it gets a fitted prior bonus over other compound
    rules. So after all-prime sets such as 2, 47 or 67, 31, 17, 61, people commit
    to "primes": they say yes to other primes more than to odd composite numbers,
    which the current best model gets backwards.'
- name: prime_over_odd_reading
  rationale: 'Refinement of `hundred_chart_row_ranges` (everything kept: primitive-built
    rules with a per-primitive cost, final-digit discount, costs on powers/cubes and
    squares, times-table-graded multiples, Erlang ranges with a bonus for whole hundred-chart
    rows, the size principle and near-all-or-none commitment). The one change is that
    "odd numbers" and "prime numbers" are rival readings of the same kind of evidence
    (numbers with no factor of 2), and people find "prime" the more meaningful reading
    and "odd" the emptier, merely "not even" one: a single fitted preference moves
    prior plausibility away from "odd numbers" and onto "prime numbers" by the same
    amount. So after all-prime sets (2, 47; 53, 2; 67, 31, 17, 61) people say yes
    to other primes and no to odd composites, and after all-odd non-prime sets (69,
    9, 39, 21) they extend "odd" less than the incumbent predicts and fall back on
    ranges or narrower rules.'
- name: prime_salient_marked_odd
  rationale: 'Refinement of `prime_salient_hundred_chart` (everything kept: primitive-built
    rules with a per-primitive cost, final-digit discount, costs on powers/cubes and
    squares, times-table-graded multiples, Erlang ranges with a bonus for whole hundred-chart
    rows, a fitted prior bonus for the familiar category "prime numbers", the size
    principle and near-all-or-none commitment). The one change, taken from `marked_odd_parity_concepts`,
    is that "odd" is a marked, negatively defined category ("not even"), so the rule
    "odd numbers" carries a fitted extra prior cost that "even numbers" does not.
    As a result, after all-prime sets of odd primes (53, 47, 41; 67, 31, 17, 61) "odd"
    competes less with "primes", and people say yes to other primes but no to odd
    composites (9, 21, 63, 81) more sharply than prime salience alone predicts, while
    after all-even sets they still extend "even" readily.'
- name: hidden_divisibility_by_three
  rationale: 'Refinement of `prime_salient_marked_odd` (everything kept: primitive-built
    rules with a per-primitive cost, final-digit discount, costs on powers/cubes and
    squares, times-table-graded multiples, Erlang ranges with a bonus for whole hundred-chart
    rows, a prime bonus, a marked-odd cost, the size principle and near-all-or-none
    commitment). The one change is that divisibility by 3 cannot be read off a numeral''s
    last digit the way divisibility by 2, 5 or 10 can; it needs a digit-sum check.
    So every rule whose membership test contains that check ("multiples of 3", "of
    6", "of 9", "of 12") carries one shared, fitted extra prior cost. As a result,
    after odd multiples of 3 such as 69, 9, 39, 21 or 63, 27, 99, 33, people seldom
    commit to "multiples of 3". They extend "odd", a final digit or a range instead,
    and say yes to odd non-multiples of 3 (19, 29, 49, 23, 37) about as readily as
    to other multiples of 3.'
- name: normalized_attention_budget_similarity
  rationale: 'People judge a target by its similarity to the examples, and they have
    a fixed budget of attention that they split across ways the examples could be
    alike. The budget goes to each property all the examples share (parity, primality,
    squares, cubes, powers of 2, multiples of 3-12, final digit, hundred-chart row,
    repeated digits, a digit contained), more to rarer properties and more the more
    examples share them. The remainder goes to position on the number line, more when
    the examples cluster tightly. A target''s psychological distance is the attention-weighted
    share of that budget it violates: lacking a shared property, or lying outside
    the examples'' span, scaled by how far outside. The probability of saying yes
    falls off with this distance. Because attention is normalised, a set with a striking
    shared property (such as all multiples of 5, or all repdigits) makes magnitude
    nearly irrelevant, while a set sharing nothing rare is judged almost purely by
    nearness on the number line.'
- name: irregular_threes_times_table
  rationale: 'Refinement of the incumbent `prime_over_odd_reading`. Everything in
    it is kept: primitive-built rules with a per-primitive cost, the final-digit discount,
    costs on powers/cubes and squares, times-table-graded multiples, the single preference
    that moves plausibility from "odd" to "prime", Erlang ranges with a bonus for
    whole hundred-chart rows, the size principle and near-all-or-none commitment.
    The one change is that the 3 times table has no visible pattern in the written
    numeral (multiples of 2, 5 or 10 can be read off the last digit, multiples of
    3 cannot), so people seldom notice that a set is all "multiples of 3", and that
    one rule carries its own fitted extra prior cost. So after sets of multiples of
    3 such as 69, 9, 39, 21 or 63, 27, 99, 33, people extend "odd", a final digit
    or a range instead, and say yes to other multiples of 3 hardly more often than
    to non-multiples, where the incumbent over-generalises "multiples of 3".'
- name: repdigit_pattern_chart_concepts
  rationale: 'Refinement of the incumbent `prime_over_odd_reading`, with everything
    in it kept: primitive-built rules with a per-primitive cost, the final-digit discount,
    costs on powers/cubes and squares, times-table-graded multiples, the single preference
    that moves plausibility from "odd" to "prime", Erlang ranges with a bonus for
    whole hundred-chart rows, the size principle and near-all-or-none commitment.
    The one change adds a concept the incumbent lacks. People notice when a numeral''s
    two digits are the same (11, 22, ..., 99), so "repeated-digit numbers" is a candidate
    rule, priced like other two-primitive rules plus its own fitted prior bonus. After
    sets holding two or more repdigits (e.g. 33, 77 or 44, 11, 88), people say yes
    to other repdigits and no to numbers that merely lie near the examples, which
    closes the critique''s report that the incumbent under-predicts yes to repdigit
    targets after repdigit sets.'
