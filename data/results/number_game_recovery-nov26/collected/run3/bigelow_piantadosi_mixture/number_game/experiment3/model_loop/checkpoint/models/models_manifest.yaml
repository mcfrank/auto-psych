models:
- name: familiar_strays_equal_rule_prior
  rationale: "Refinement of `familiar_strays_family_level_prior`: people do the same\
    \ Bayesian concept learning over mathematical rules and magnitude ranges of 1-100,\
    \ with the size principle, an uncertain belief about how often an example is a\
    \ stray, and strays that are sometimes \"familiar\" numbers (a member of some\
    \ well-known rule) rather than random ones. The one change is the rule prior:\
    \ people have no preference among kinds of rule at all \u2014 parity, primes,\
    \ squares, cubes, powers, multiples, final digit and contained digit rules are\
    \ all equally plausible a priori \u2014 so which rule they adopt is decided only\
    \ by how many examples it explains and how small it is (the size principle), and\
    \ the rules they would generate a familiar stray from are the same equally weighted\
    \ rules."
- name: two_source_program_concepts
  rationale: 'People think the hidden program may run two sources at once: a main
    concept (a mathematical rule or a magnitude range of 1-100, learned with the size
    principle and an uncertain belief about how many examples come from it) and a
    secondary source that produced the off-pattern examples, which is either random
    glitches or a second familiar rule. Examples that break the main concept are therefore
    not just written off: if they fit a small familiar rule (e.g. 64 among 13, 23,
    43), people infer the program also uses that rule and say "yes" to its other members
    (32, 8), whereas off-pattern examples that fit no small rule are treated as glitches
    that license no further generalisation.'
- name: rule_count_familiar_strays
  rationale: 'Refinement of `familiar_strays_equal_rule_prior`: people do the same
    Bayesian concept learning over equally plausible mathematical rules and magnitude
    ranges of 1-100, with the size principle, an uncertain belief about how often
    an example is a stray, and strays that are sometimes "familiar" numbers rather
    than random ones. The one change is what makes a number familiar. It is not how
    readily a random member of a random rule lands on it, which favours members of
    tiny rules such as 27, 64 and 81. It is how many well-known rules the number belongs
    to, its breadth of mathematical associations. So richly connected numbers (12,
    24, 36, 60, 100) are the easiest examples to write off as strays, while a lone
    member of a tiny rule is no more excusable than other numbers with as many associations.
    This adds no free parameter.'
- name: prior_matched_familiar_strays
  rationale: 'Refinement of `familiar_strays_equal_rule_prior`: people do the same
    Bayesian concept learning over equally plausible mathematical rules and magnitude
    ranges of 1-100, with the size principle, an uncertain belief about how often
    an example is a stray, and strays that are sometimes "familiar" numbers (a member
    of some well-known rule). The one change is where their idea of a stray comes
    from. A stray is simply the output of some other program drawn from their own
    prior over programs: with the same probability they give a rule-based program
    a priori, it is a member of a randomly chosen rule, and otherwise it is any number
    at all. So how often strays are familiar numbers is not a separate free belief.
    It is fixed by how strongly people expect rule-based programs to begin with, and
    someone who favours rules more also writes off familiar-looking outliers more
    readily.'
- name: graded_exemplar_equal_rule_prior
  rationale: 'Refinement of `graded_exemplar_familiar_strays`: people hold familiar
    number concepts (mathematical rules and magnitude ranges of 1-100) as stored member
    lists, retrieve a concept to the extent that the examples resemble its members
    on the number line, allow for an uncertain rate of stray examples that are sometimes
    familiar numbers, and endorse a target by its closeness to the nearest stored
    member of the retrieved concepts. The one change, taken from `familiar_strays_equal_rule_prior`,
    is the rule prior: people have no preference among kinds of rule at all (parity,
    primes, squares, cubes, powers, multiples, final digit, contained digit are equally
    plausible a priori), so which rule is retrieved is decided only by how closely
    and how tightly its members match the examples.'
- name: bounded_arithmetic_progressions
  rationale: People do the same Bayesian concept learning as the best model (equally
    plausible mathematical rules and magnitude ranges of 1-100, the size principle,
    an uncertain belief about how often an example is a stray, strays sometimes familiar
    numbers), but they also consider bounded arithmetic progressions as possible programs,
    "every d-th number from a to b" (e.g. 20, 40, 60, 80 or 61, 64, 67), which together
    take a small stated share of their prior belief (about 5%), split equally among
    all such progressions. Because a progression stops at its ends, people should
    fill in the regular gaps between the examples (60 after 20, 40, 80) more readily
    than extend the pattern beyond the examples' range (100), and say yes to evenly
    spaced continuations that no familiar rule contains (47, 59, 71 after 23, 35,
    83, 95).
- name: concept_gated_exemplar_similarity
  rationale: 'People judge a target by comparing it with the stored examples themselves.
    A target counts as similar to an example only to the extent that both fall under
    a common number concept: a mathematical rule or magnitude range, learned with
    the size principle and an uncertain belief that some examples are strays, which
    are sometimes familiar numbers. Within that, similarity falls off smoothly with
    the target''s distance on the number line from the nearest example, at an inferred
    rate. So members of the inferred rule that lie close to the examples (inside their
    range) are endorsed more readily than equally valid members far away from every
    example.'
- name: range_restricted_familiar_strays
  rationale: 'Refinement of `rule_count_familiar_strays`: people do the same Bayesian
    concept learning over equally plausible mathematical rules and magnitude ranges
    of 1-100, with the size principle, an uncertain belief about how often an example
    is a stray, and strays that are sometimes familiar numbers (judged by how many
    rules a number belongs to). The one change is that people can also think the program
    uses a rule only over a stretch of the number line, a run of the rule''s consecutive
    members such as "odd numbers from 5 to 89" or "multiples of 7 from 14 to 42",
    with how much prior belief these restricted rules get inferred. Because a short
    run is a small concept, when the examples fit a rule and cluster in magnitude
    people endorse the rule''s members inside the examples'' range more than its members
    far outside it, and they reject non-members inside that range more firmly than
    a magnitude range alone would.'
- name: range_limited_rule_familiar_strays
  rationale: 'Refinement of `rule_count_familiar_strays`: people do the same Bayesian
    concept learning over equally plausible mathematical rules and magnitude ranges
    of 1-100, with the size principle, an uncertain belief about how often an example
    is a stray, and strays that are sometimes familiar numbers (familiarity = how
    many rules a number belongs to). The one change is the concept space: people also
    consider that the program applies a rule only within a magnitude range (e.g. "odd
    numbers between 9 and 33", "multiples of 4 from 52 to 88"), with an inferred share
    of their belief in rules going to such range-limited rules. So when the examples
    fit a rule and sit in part of the number line, people endorse the rule''s members
    inside the examples'' span more than its members far outside it, instead of treating
    every member of the rule alike.'
- name: attention_lapse_guessing
  rationale: People infer the hidden concept by ordinary Bayesian concept learning
    (equally plausible mathematical rules and magnitude ranges of 1-100, the size
    principle, an uncertain belief about how often an example is a stray, strays sometimes
    being familiar numbers), and they answer with their belief. But on a small, fixed
    share of trials, about 2% as is typical of attention lapses in long sessions,
    they do not consult that belief at all and give a guess with its own yes/no bias.
    So even targets the concept certainly contains get an occasional "no", and targets
    it certainly excludes get an occasional "yes", at the same floor rate whatever
    the examples are.
- name: two_source_familiar_glitches
  rationale: 'Refinement of `two_source_program_concepts`: people think the hidden
    program may run two sources at once, a main concept (a mathematical rule or a
    magnitude range of 1-100, learned with the size principle and an uncertain belief
    about how many examples come from it) and a secondary source behind the off-pattern
    examples, which is either a second familiar rule they generalise from or glitches
    that license no generalisation. The one change, taken from `rule_count_familiar_strays`,
    is what a glitch looks like: not any number with equal chance, but sometimes (at
    an inferred rate) a "familiar" number, in proportion to how many well-known rules
    it belongs to. So richly connected off-pattern numbers (12, 24, 36, 60, 100) are
    cheaply written off as glitches without endorsing any rule they fit, while an
    unremarkable off-pattern number that fits a small rule is better explained as
    that second rule''s output, whose other members people then accept.'
- name: typical_width_magnitude_bands
  rationale: 'People think of magnitude concepts not as arbitrary ranges of 1-100
    but as bands of a characteristic width ("numbers around 60", "the teens"): a range
    is a priori plausible to the extent that its width is typical of such bands, with
    the typical width inferred, while mathematical rules (equally plausible, size
    principle, uncertain stray rate, strays sometimes familiar numbers) are learned
    as usual. So tightly clustered examples are readily read as a band and the non-members
    between them are filled in, whereas examples spread over most of 1-100 are not
    taken as a range at all and people fall back on the rule they share.'
- name: erlang_sized_magnitude_ranges
  rationale: 'Refinement of `range_limited_rule_familiar_strays` (the same Bayesian
    concept learning over equally plausible rules, range-limited rules and magnitude
    ranges, with the size principle, uncertain reliability and familiar strays): people
    expect a magnitude-range program to cover a typical width of numbers, so ranges
    a few dozen numbers wide are a priori plausible while very wide ranges are not
    (an Erlang prior on range size, typical width inferred), instead of every range
    being equally plausible. The disagreement with the best model lives in sets whose
    examples share a rule: when they span a narrow stretch, people believe a range
    and fill it with the rule''s non-members (e.g. 7, 13, 15 after 4, 16, 12), but
    when the examples span more than about 40 numbers the range explanation collapses
    and non-members inside the span are rejected more firmly than the best model predicts.'
- name: cluster_cued_range_salience
  rationale: Which kind of explanation comes to mind depends on how the examples look.
    People infer the hidden program by ordinary Bayesian concept learning over mathematical
    rules, rules held within a magnitude range, and magnitude ranges (the size principle,
    an uncertain belief about how often an example is a stray, strays sometimes familiar
    numbers). But the more tightly the examples cluster on the number line, the more
    readily the idea "it produces numbers around here" comes to mind, so magnitude
    ranges gain prior weight in proportion to the cluster's tightness. So when examples
    that share a rule sit close together (e.g. 31, 3, 1, 15 or 63, 23, 43), people
    accept the rule's non-members inside the examples' span (even numbers between
    them) more than the size principle predicts, while for widely spread examples
    they keep to the rule.
- name: one_sided_threshold_ranges
  rationale: 'Refinement of `range_limited_rule_familiar_strays`: people do the same
    Bayesian concept learning over equally plausible mathematical rules, magnitude
    ranges of 1-100 and rules held within a range, with the size principle, an uncertain
    belief about how often an example is a stray, and strays that are sometimes familiar
    numbers. The one change is the prior over magnitude ranges: besides an arbitrary
    stretch of the number line, people readily think of one-sided thresholds ("numbers
    below 32", "numbers above 60"), which get an inferred extra share of the prior
    on ranges. So when examples sit together at one end of the number line (31, 3,
    1, 15), people fill in the non-members of the fitting rule (2, 4, 16) more readily
    than when the same rule''s examples span an arbitrary middle stretch.'
- name: variable_rule_range_expectation
  rationale: 'Refinement of `range_limited_rule_familiar_strays`. People do the same
    Bayesian concept learning over equally plausible mathematical rules, rules held
    within a magnitude range, and magnitude ranges of 1-100, with the size principle,
    an uncertain belief about how often an example is a stray, and strays that are
    sometimes familiar numbers. The one change is that how strongly people expect
    the program to follow a mathematical rule rather than produce a magnitude range
    is not fixed: it varies from one judgement to the next around an inferred average,
    with an inferred spread. So on some judgements a set that fits a rule is read
    as a range and the person endorses non-members inside the examples'' span, and
    on others the same set is read as a rule. This blurs the commitment to rule or
    range most where the two are close competitors, such as clustered examples that
    share only a broad rule like "odd", and least where one explanation wins decisively.'
- name: two_source_range_limited_rules
  rationale: 'Refinement of `two_source_familiar_glitches`: people think the hidden
    program may run two sources at once, a main concept learned with the size principle
    and an uncertain belief about how many examples come from it, and a secondary
    source behind the off-pattern examples, which is either a second familiar rule
    they generalise from or glitches (sometimes familiar numbers, in proportion to
    how many well-known rules they belong to) that license no generalisation. The
    one change, taken from `range_limited_rule_familiar_strays`, is what the main
    concept can be: besides a rule over all of 1-100 or a magnitude range, the main
    program may apply a rule only within a magnitude range ("odd numbers from 9 to
    33", "multiples of 4 from 52 to 88"), with an inferred share of the rule prior.
    So when the main pattern fits a rule and sits in part of the number line, people
    endorse its members inside the examples'' span more than members far outside it,
    while an off-pattern example that fits a small rule still makes them accept that
    rule''s other members.'
- name: gist_memory_examples
  rationale: 'People infer the hidden program by Bayesian concept learning over equally
    plausible mathematical rules, rules held within a magnitude range, and magnitude
    ranges of 1-100 (the size principle, an uncertain belief about how often an example
    is a stray, strays sometimes familiar numbers), but their memory for the examples
    is limited: each example is kept verbatim only with some inferred probability,
    and otherwise only its gist, its rough place on the number line, is kept. A gist-only
    example still supports a range covering that stretch as strongly as before, but
    supports a mathematical rule only as much as the rule happens to have members
    nearby, so when examples sit close together people often reason from their magnitudes
    and fill in the rule''s non-members inside the examples'' span (e.g. 44 after
    37, 57), while for widely spread examples the gist supports only wide, weak ranges
    and the rule still wins.'
- name: representative_sample_rules
  rationale: 'Refinement of `variable_rule_range_expectation`, adding one representativeness
    bias to its Bayesian concept learning. That learning is unchanged: equally plausible
    rules, rules held within a range, and magnitude ranges; the size principle; uncertain
    reliability with familiar strays; and a rule-versus-range expectation that varies
    from judgement to judgement. The bias is this: people expect a sample from a rule
    that runs across the whole number line (such as "odd numbers" or "multiples of
    4") to look like that rule, spread over its members. So examples that fit such
    a rule but sit unusually close together (31, 3, 1, 15 or 37, 57) count against
    it, to an inferred degree, beyond what the size principle implies. In those narrow
    clustered sets people then lean towards a magnitude range and fill in the rule''s
    non-members inside the examples'' span, while widely spread examples keep the
    rule.'
- name: min_max_bounded_range
  rationale: 'People take the smallest and largest example shown as the limits of
    a possible program, so "numbers from the lowest to the highest example" comes
    to mind as a magnitude explanation much more readily than any other range. Otherwise
    they learn the concept in the usual Bayesian way: equally plausible mathematical
    rules, rules held within a range, and magnitude ranges, the size principle, an
    uncertain stray rate, and strays that are sometimes familiar numbers. So when
    examples that share a rule sit close together (37, 57 or 4, 16, 12), people often
    fill in the rule''s non-members between them (44, 7, 13) but do not stretch that
    magnitude reading past the outermost examples, whereas the min-to-max range of
    a widely spread set is too large to compete with the rule.'
- name: tightness_cued_rule_range_expectation
  rationale: 'Refinement of `variable_rule_range_expectation`: people do the same
    Bayesian concept learning over equally plausible mathematical rules, rules held
    within a magnitude range, and magnitude ranges of 1-100 (size principle, uncertain
    belief about how often an example is a stray, strays sometimes familiar numbers),
    and their expectation that the program follows a rule rather than produces a magnitude
    range still varies from one judgement to the next. The one change, taken from
    `cluster_cued_range_salience`, is that the average of that expectation depends
    on how the examples look: the more tightly the examples cluster on the number
    line, the more people expect a "numbers around here" program instead of a rule.
    So when examples that share a rule sit close together (31, 3, 1, 15 or 37, 57),
    people fill in the rule''s non-members inside the examples'' span more often than
    for the same rule spread widely across 1-100.'
- name: two_source_cluster_cued_ranges
  rationale: 'Refinement of `two_source_range_limited_rules`. People think the hidden
    program may run two sources at once: a main concept (a rule over 1-100, a magnitude
    range, or a rule held within a range), learned with the size principle and an
    uncertain belief about how many examples come from it, and a secondary source
    behind the off-pattern examples, which is either a second familiar rule they generalise
    from or glitches (sometimes familiar numbers) that license no generalisation.
    The one change, taken from `cluster_cued_range_salience`, is that the main program''s
    being a magnitude range comes to mind more readily the more tightly the examples
    cluster on the number line. So when examples that share a broad rule sit close
    together (31, 3, 1, 15 or 37, 57), people fill in the rule''s non-members inside
    the examples'' span, while for widely spread sets they keep to the rule, and an
    off-pattern example that fits a small rule still leads them to accept that rule''s
    other members.'
- name: two_source_variable_rule_expectation
  rationale: 'Refinement of `variable_rule_range_expectation`. People do the same
    Bayesian concept learning over equally plausible mathematical rules, rules held
    within a magnitude range, and magnitude ranges of 1-100, with the size principle
    and an uncertain belief about how many examples come from the main concept, and
    their expectation that the program follows a rule rather than produces a magnitude
    range still varies from one judgement to the next. The one change, taken from
    `two_source_range_limited_rules`, is what people think the off-pattern examples
    are: either glitches (sometimes familiar numbers) that license no generalisation,
    or the output of a second familiar rule the program also runs, whose other members
    they then also endorse. So an off-pattern example that fits a small rule (e.g.
    64 among 13, 23, 43) makes people say yes to that rule''s other members, while
    the main pattern''s commitment to rule or range stays as variable as before.'
- name: win_stay_rule_range_guess
  rationale: 'People take the examples one at a time, in the order shown, and hold
    a single working guess about the program (a mathematical rule, a rule held within
    a magnitude range, or a magnitude range) instead of weighing all possibilities
    at once. Their first guess, and any re-guess, is drawn from ordinary Bayesian
    concept learning over the examples seen so far: equally plausible rules, the size
    principle, an uncertain stray rate with sometimes-familiar strays, and a rule-versus-range
    expectation that varies from judgement to judgement. When a new example arrives,
    people keep their current guess with some inferred probability if it still contains
    that example, and otherwise re-guess. So a concept adopted from the early examples,
    such as a broad rule or a wide range, survives later examples it happens to contain,
    and the same set shown in a different order generalises differently.'
- name: ratio_scale_exemplar_retrieval
  rationale: 'People hold familiar number concepts (equally plausible mathematical
    rules and magnitude ranges of 1-100) as stored lists of member numbers. They judge
    how alike two numbers are by their ratio rather than their difference, as on a
    logarithmic mental number line: 8 and 10 are as similar as 80 and 100, so similarity
    falls off steeply among small numbers and gently among large ones, at an inferred
    rate. A concept is retrieved to the extent that each example resembles its members
    on this ratio scale (allowing an uncertain rate of stray examples, sometimes familiar
    numbers), and a target is endorsed by its ratio-similarity to the nearest member
    of the retrieved concepts. So near-misses next to large examples (e.g. 62 or 66
    after 64) are partly endorsed, but near-misses next to small ones (3 or 5 after
    4) are not.'
- name: thurstonian_decision_noise
  rationale: 'People learn the hidden concept by the simplest Bayesian concept learning
    (equally plausible mathematical rules and magnitude ranges, the size principle,
    an uncertain belief about how often an example is a stray, strays sometimes familiar
    numbers), but they do not read out their belief exactly when answering: on every
    judgement their felt confidence that the target belongs fluctuates randomly around
    that belief, and they say "yes" when the fluctuating confidence favours membership.
    This decision noise pulls near-certain judgements slightly towards even odds in
    proportion to how extreme they are (unlike a lapse''s constant floor), while leaving
    uncertain judgements almost unchanged.'
- name: variable_expectation_threshold_ranges
  rationale: 'Refinement of `variable_rule_range_expectation`. People do the same
    Bayesian concept learning over equally plausible mathematical rules, rules held
    within a magnitude range, and magnitude ranges of 1-100, with the size principle,
    an uncertain belief about how often an example is a stray, strays that are sometimes
    familiar numbers, and an expectation of a rule rather than a range that varies
    from one judgement to the next. The one change, taken from `one_sided_threshold_ranges`,
    is which magnitude ranges come to mind: besides an arbitrary stretch of the number
    line, people readily think of one-sided thresholds ("numbers below 32", "numbers
    above 60"), which get an inferred extra share of their belief in ranges. So on
    judgements where examples bunched at one end of the number line (31, 3, 1, 15)
    are read as a range, people fill in the fitting rule''s non-members and accept
    numbers out to that end of the line, rather than only inside the examples'' span.'
- name: variable_min_max_bounded_range
  rationale: 'Refinement of `min_max_bounded_range`: people do the same Bayesian concept
    learning over equally plausible mathematical rules, rules held within a magnitude
    range, and magnitude ranges of 1-100 (size principle, uncertain stray rate, strays
    sometimes familiar numbers), and they treat the smallest and largest example as
    the natural limits of a range, so "numbers from the lowest to the highest example"
    comes to mind far more readily than any other range. The one change, taken from
    `variable_rule_range_expectation`, is that how strongly people expect the program
    to follow a rule rather than produce a magnitude range varies from one judgement
    to the next around an inferred average. So for clustered examples that share a
    rule (37, 57 or 4, 16, 12), people on some judgements adopt the min-to-max range
    and fill in the rule''s non-members between the examples, never beyond them, and
    on other judgements they keep the rule.'
- name: variable_expectation_decision_noise
  rationale: 'Refinement of `variable_rule_range_expectation`: people do the same
    Bayesian concept learning over equally plausible mathematical rules, rules held
    within a magnitude range, and magnitude ranges of 1-100, with the size principle,
    an uncertain belief about how often an example is a stray, strays that are sometimes
    familiar numbers, and an expectation of a rule rather than a range that varies
    from one judgement to the next. The one change, taken from `thurstonian_decision_noise`,
    is how that belief becomes an answer: people do not read out their belief exactly.
    Their felt confidence that the target belongs fluctuates from trial to trial around
    the belief, by a stated typical amount (about half a unit of log-odds), and they
    say yes when it favours membership. So near-certain judgements, such as "no" to
    a number outside every plausible concept or "yes" to a member of a decisively
    winning rule, are pulled slightly towards even odds, in proportion to how extreme
    they are, while judgements where rule and range compete stay as variable as before.'
- name: approximate_near_miss_rules
  rationale: 'Besides exact mathematical rules, people entertain approximate versions
    of sparse rules: "numbers at or just next to a power of 2 / square / multiple
    of 10", so a set of near-misses of a small rule (1, 3, 15, 31 are each one off
    a power of 2) is explained by the approximate rule, and people then endorse the
    rule''s exact members and its other near-misses (2, 4, 16, 17). These approximate
    rules hold a small stated share of the belief in rules (about 3%), split equally
    among them; otherwise learning is the incumbent''s Bayesian concept learning over
    equally plausible rules, rules held within a range, and magnitude ranges with
    a salient min-to-max range, the size principle, uncertain reliability with familiar
    strays, and a rule-versus-range expectation that varies across judgements.'
- name: minerva_echo_concept_traces
  rationale: People do not infer which concept generated the examples; they hold familiar
    number concepts (mathematical rules and magnitude ranges of 1-100) as stored memory
    traces and use the examples together as a retrieval probe, as in an echo-based
    exemplar memory. Each stored concept is activated by a steep, inferred power of
    its similarity to the probe (how many examples it contains relative to its own
    size and the number of examples), and a target is endorsed in proportion to the
    share of the total activation coming from stored concepts that contain it. Because
    activation grows only by a fixed power of overlap, small concepts gain from more
    examples far less than under Bayesian inference, and a concept missing one example
    is merely weakened, not excluded.
- name: previous_set_concept_intrusion
  rationale: 'People judge each target by Bayesian concept learning over the examples
    in front of them (equally plausible mathematical rules, rules held within a magnitude
    range, magnitude ranges of 1-100 with the lowest-to-highest-example range especially
    salient, the size principle, an uncertain stray rate with sometimes-familiar strays,
    and a rule-versus-range expectation that varies across judgements), but because
    different example sets are interleaved in a session, the concept from the most
    recent other example set they judged sometimes intrudes (proactive interference):
    on a small, stated share of judgements (about 1%) they check the target against
    the previous set''s concept instead of the current one. So the same (set, target)
    question is answered differently depending on which set preceded it, with stray
    "yes" answers to targets that fit the preceding set''s concept but not the current
    one.'
- name: tightness_cued_min_max_range
  rationale: 'Refinement of `variable_min_max_bounded_range`: people do the same Bayesian
    concept learning over equally plausible mathematical rules, rules held within
    a magnitude range, and magnitude ranges of 1-100 (size principle, uncertain stray
    rate, strays sometimes familiar numbers), the range from the smallest to the largest
    example comes to mind far more readily than any other range, and their expectation
    of a rule rather than a range varies from one judgement to the next. The one change,
    taken from `cluster_cued_range_salience`, is that the average of that expectation
    depends on how the examples look: the more tightly the examples cluster on the
    number line, the more people expect a "numbers from the lowest to the highest
    example" program instead of a rule. So clustered examples that share a rule (37,
    57 or 4, 16, 12) lead people to fill in the rule''s non-members between the examples
    (but not beyond them) more often than the same rule''s examples spread widely
    across 1-100.'
- name: example_count_scaled_hull
  rationale: 'Refinement of `variable_min_max_bounded_range`. People do the same Bayesian
    concept learning over equally plausible mathematical rules, rules held within
    a magnitude range, and magnitude ranges of 1-100 (size principle, uncertain stray
    rate, strays sometimes familiar numbers), with a rule-versus-range expectation
    that varies from one judgement to the next, and the range from the smallest to
    the largest example comes to mind more readily than any other range. The one change
    is how readily it comes to mind: each example after the first that falls between
    those limits adds another bit of evidence that "numbers from the lowest to the
    highest example" is the program, so the extra salience of that range grows in
    proportion to the number of examples minus one, with no new parameter. With two
    examples people therefore fill in the span between them less often than the incumbent
    predicts, and with four clustered examples they fill it in more often.'
- name: gist_memory_min_max_range
  rationale: Refinement of `gist_memory_examples`, with one component taken from `min_max_bounded_range`.
    People infer the program by Bayesian concept learning over equally plausible rules,
    rules held within a range, and magnitude ranges (size principle, uncertain stray
    rate, strays sometimes familiar numbers), while keeping each example verbatim
    only with some probability and otherwise only its rough place on the number line.
    The one change is that people treat the smallest and largest example as the natural
    limits of a range, so "numbers from the lowest to the highest example" comes to
    mind far more readily than any other range. As a result, clustered examples that
    are partly remembered only as magnitudes lead people to fill in the rule's non-members
    between the outermost examples, but not beyond them.
