models:
- name: parity_within_range_concepts
  rationale: 'Refinement of the incumbent `arbitrary_exception_rule_prior`: people
    do the same Bayesian concept learning over rules (family-organised rule prior,
    exception rules as their own kind) and magnitude ranges with a preferred width
    and the size principle, but they can also entertain a conjunctive kind of concept,
    "odd (or even) numbers within a range" (e.g. "even numbers above 60"), with its
    own inferred plausibility and the same width preference. The one change is adding
    this parity-within-a-range kind of concept, so that after 4, 66, 78, 96 people
    say yes to large even numbers (70, 74) but no to small ones (8, 22), and after
    23, 35, 95, 83 they reject even numbers between the examples, rather than spreading
    "yes" evenly over all even (or all in-range) numbers.'
- name: gamma_width_exception_family_concepts
  rationale: 'Refinement of `gamma_width_family_prior_concepts`: people do the same
    Bayesian concept learning over rules and magnitude ranges (size principle, family-organised
    rule prior, and a gamma prior over range width whose sharpness is inferred along
    with its typical width). The one change, taken from `arbitrary_exception_rule_prior`,
    is that rules with an arbitrary exception ("powers of 2 except 32", "powers of
    2 plus 37") form their own kind of rule with their own, presumably very low, plausibility,
    instead of being ordinary power rules. So people expect ranges of a sharply characteristic
    width and also firmly reject 37 (and accept 32) after seeing powers of 2.'
- name: doubling_chain_concepts
  rationale: 'People do the same Bayesian concept learning as the best model (family-organised
    rule prior with exception rules as their own kind, magnitude ranges and odd/even-within-a-range
    concepts with a preferred width, and the size principle), but they also hold a
    kind of concept the best model lacks: multiplicative chains, in which each number
    is double (or triple) the one before, starting from some number other than 1 (e.g.
    3, 6, 12, 24, 48, 96 or 5, 10, 20, 40, 80 or 2, 6, 18, 54). This kind has its
    own inferred plausibility. The disagreement with the best model shows up on example
    sets that form such a chain (e.g. 5, 10, 20 or 6, 12, 24): there this model predicts
    "yes" to the next links (40, 80 or 48, 96) and "no" to other multiples (15, 25,
    30 or 18, 30, 36), whereas the best model spreads "yes" over all multiples of
    5 (or 6) and nearby numbers.'
- name: rule_noticing_grows_with_examples
  rationale: 'People do the same Bayesian concept learning over arithmetic rules,
    magnitude ranges and odd/even-within-a-range concepts as the best model, but whether
    a rule even comes to mind depends on how many examples they have seen: the prior
    odds of thinking of a rule rather than a magnitude range grow steadily, at an
    inferred rate, with each additional example. So after one or two examples people
    generalise mostly by magnitude, and after four examples they look for a rule more
    readily than the examples'' likelihood alone would warrant.'
- name: gamma_width_parity_range_concepts
  rationale: "Refinement of the incumbent `parity_within_range_concepts`: people do\
    \ the same Bayesian concept learning over rules (family-organised rule prior,\
    \ exception rules as their own kind), magnitude ranges and \"odd (or even) numbers\
    \ within a range\", with the size principle. The one change, taken from `gamma_width_exception_family_concepts`,\
    \ is the shape of their expectation about how wide a range (plain or parity-restricted)\
    \ is: a gamma prior whose sharpness is inferred along with its typical width,\
    \ instead of the fixed, loose Erlang form \u2014 so people may expect ranges of\
    \ one sharply characteristic width, strongly disfavouring both very narrow and\
    \ very wide ranges around the examples."
- name: example_recall_limited_concepts
  rationale: 'People do the same Bayesian concept learning as the best model (rules
    with a family-organised prior and exception rules as their own kind, magnitude
    ranges and odd/even-within-a-range concepts with a preferred width, size principle),
    but their memory for the examples is limited: each example shown is retained,
    independently, only with an inferred probability, and they generalise from whichever
    examples they still hold. So a judgment is sometimes based on only part of the
    set, which broadens generalisation for longer sets (a forgotten example no longer
    rules out a broader or different concept) in proportion to how many examples could
    have been lost.'
- name: multiples_within_range_concepts
  rationale: 'Refinement of the incumbent `parity_within_range_concepts`: people do
    the same Bayesian concept learning over rules (family-organised prior, exception
    rules as their own kind), magnitude ranges and "odd (or even) numbers within a
    range", with the Erlang width preference and the size principle. The one change
    is that the conjunctive "rule within a range" idea extends beyond parity: people
    also entertain "multiples of m within a range" (e.g. "multiples of 3 between 10
    and 60", "multiples of 9 from 27 to 81") as a further kind of concept with its
    own inferred plausibility and the same width preference. So after 39, 60, 12,
    45 or 63, 27, 81 they accept multiples near the examples (e.g. 36, 54) but reject
    multiples far outside the examples'' span (e.g. 90, 99, or 3), instead of spreading
    "yes" over all multiples of 3 or over every number in the range.'
- name: decade_and_parity_range_concepts
  rationale: "Refinement of `decade_concept_family_prior` (tied with the best): people\
    \ do the same Bayesian concept learning over rules (family-organised prior, exception-laden\
    \ rules as their own kind, and decades such as \"numbers in the 60s\" as their\
    \ own kind of rule) and magnitude ranges with a preferred width and the size principle.\
    \ The one change, taken from `parity_within_range_concepts`, is that people can\
    \ also entertain \"odd (or even) numbers within a range\" as a kind of concept\
    \ with its own inferred plausibility, so examples sharing a tens digit (61, 64,\
    \ 67) confine \"yes\" to that decade while examples such as 4, 66, 78, 96 confine\
    \ it to large even numbers \u2014 two ready-made ways of bounding generalisation\
    \ that the incumbent and the decade model each have only one of."
- name: prior_leaking_membership_judgment
  rationale: 'People infer the hidden concept as a normative Bayesian concept learner
    does (rules with a family-organised prior and arbitrary-exception rules as their
    own kind, magnitude ranges with a preferred width, the size principle), but their
    yes/no judgment is distorted by how plausible the target was before they saw any
    examples: the log-odds of saying yes is the posterior log-odds that the concept
    contains the target, shifted by an inferred share of the target''s prior log-odds
    of membership. So a priori "typical" numbers (mid-range, even, multiples) get
    more "yes" than the examples warrant (prior leakage), or, if the share is negative,
    less (contrast against what was expected anyway).'
- name: without_replacement_sampling_concepts
  rationale: 'People do the same Bayesian concept learning as the best model (rules
    with a family-organised prior, arbitrary-exception rules as their own kind, magnitude
    ranges of a characteristic width), but they assume the program never repeats a
    number, so they treat the examples as drawn from the concept without replacement:
    each further example is one of the concept''s members not yet shown. As a result,
    examples that nearly exhaust a small concept (e.g. 8, 64 or 81, 9) point to that
    concept, such as cubes or powers of 3, much more strongly than under sampling
    with replacement, and generalisation narrows faster onto small, nearly exhausted
    rules.'
- name: first_example_trust_concepts
  rationale: 'People treat the first example they see differently from the later ones
    when judging how far each example is a genuine output of the hidden concept: the
    first example sets the concepts they entertain and is trusted to belong to the
    concept at its own inferred rate. Each later example is trusted at the usual fixed
    rate, and one that does not fit can be dismissed as a stray output. Apart from
    this, they generalise by the same Bayesian concept learning as the best model
    (size principle, rule prior organised by kind with exception rules as their own
    kind, gamma prior over range width). So if the first example is trusted more,
    an odd-one-out example is discounted when it comes late in the set (8, 24, 48,
    63 still suggests multiples of 8) but forces a broader concept when it comes first.'
- name: beta_share_width_exception_concepts
  rationale: "Refinement of `gamma_width_exception_family_concepts`: people do the\
    \ same Bayesian concept learning over rules (family-organised rule prior, exception\
    \ rules as their own kind) and magnitude ranges, with the size principle. The\
    \ one change is the shape of their prior about how wide a range is: they think\
    \ of a range as a portion of the bounded 1\u2013100 line and expect it to cover\
    \ a typical share of it (a beta prior over that share, with its mean and sharpness\
    \ inferred), rather than holding an unbounded gamma expectation over raw width.\
    \ So ranges covering nearly the whole line are as implausible to them as very\
    \ narrow ones, and when the examples are spread widely (e.g. 43, 4, 91, 9) people\
    \ fall back on a rule instead of an \"almost any number\" range. As a result they\
    \ say \"yes\" less often to numbers that only such a near-total range would include."
- name: inferred_stray_rate_concepts
  rationale: 'Refinement of `gamma_width_exception_family_concepts`: people do the
    same Bayesian concept learning over rules (family-organised prior, exception rules
    as their own kind) and magnitude ranges with a gamma width preference and the
    size principle, and they also allow that any example may be a stray number the
    program produced at random rather than a member of the concept. The one change
    is that how often they expect such strays is no longer fixed at one example in
    ten but is a belief inferred from their judgments: the more strays they expect,
    the more readily they keep concepts that miss an example (and so sometimes reject
    an example they were shown), and the weaker the size principle becomes.'
- name: gamma_width_doubling_chain_concepts
  rationale: "Refinement of `doubling_chain_concepts`: people do Bayesian concept\
    \ learning over arithmetic rules (organised by kind, with exception rules as their\
    \ own kind), magnitude ranges and odd/even-within-a-range concepts, using the\
    \ size principle, and they also entertain multiplicative chains \u2014 each number\
    \ double (or triple) the one before, starting from a number other than 1 (e.g.\
    \ 5, 10, 20, 40, 80) \u2014 as a kind of rule with its own plausibility. The one\
    \ change, taken from the best model `gamma_width_exception_family_concepts`, is\
    \ their expectation about how wide a range is: a gamma prior whose sharpness is\
    \ inferred along with its typical width, in place of the fixed, loose Erlang form.\
    \ With ranges judged as the best model judges them, chains are put to a fair test:\
    \ after a chain-like set such as 5, 10, 20 this model still predicts \"yes\" to\
    \ 40 and 80 and \"no\" to other multiples of 5 such as 15, 25 and 30, where the\
    \ best model spreads \"yes\" over all multiples of 5."
- name: gaussian_neighbourhood_magnitude_concepts
  rationale: 'People generalise by rules exactly as the best Bayesian concept learner
    does, but their magnitude-based concepts are not hard-edged ranges: such a concept
    is a neighbourhood around a central number, membership falls off smoothly with
    numerical distance from that centre along a Gaussian similarity gradient whose
    breadth they infer from the examples (narrow neighbourhoods favoured by the size
    principle), and examples are produced in proportion to that similarity. A target''s
    graded similarity to the inferred neighbourhood is the probability they say "yes",
    so "yes" fades gradually with distance from the examples'' centre instead of being
    flat inside the examples'' range and stopping at an edge.'
- name: uncertainty_shifted_criterion
  rationale: 'People infer the hidden concept exactly as the best model''s Bayesian
    concept learner does, but their yes/no decision criterion depends on how sure
    they are which concept the program uses: the more their belief is spread over
    many competing concepts (rules and range widths), the more they shift their answer
    away from the inferred membership probability toward "no" (uncertainty aversion)
    or, if the inferred shift is negative, toward "yes". So two targets with the same
    membership probability get different answers depending on whether the examples
    point clearly to one concept or leave many open.'
- name: off_by_one_power_concepts
  rationale: "People do the same Bayesian concept learning as the best model (rules\
    \ with a family-organised prior and arbitrary-exception rules as their own kind,\
    \ magnitude ranges with a beta prior over the share of the 1\u2013100 line they\
    \ cover, and the size principle), but their space of rules also contains near-misses\
    \ of the sparse multiplicative rules: \"one more than\" or \"one less than\" a\
    \ power or a square (e.g. 3, 5, 9, 17, 33, 65 or 1, 3, 7, 15, 31, 63, or 2, 5,\
    \ 10, 17, 26, 37), forming their own kind of rule with its own inferred, presumably\
    \ low, plausibility. So after examples such as 31, 3, 1, 15 or 33, 17, 5, 9 people\
    \ say \"yes\" to the next shifted power (63, 65) and \"no\" to other odd numbers\
    \ or nearby numbers, rather than spreading \"yes\" over all odd numbers or a range."
- name: beta_share_width_prior_leaking_judgment
  rationale: "Refinement of `beta_share_width_exception_concepts` with one component\
    \ taken from `prior_leaking_membership_judgment`: people infer the hidden concept\
    \ exactly as the incumbent's Bayesian learner does (family-organised rules with\
    \ exception rules as their own kind, magnitude ranges judged as a typical share\
    \ of the 1\u2013100 line, the size principle), but their yes/no judgment is pulled\
    \ by how plausible the target was before any examples were shown. The log-odds\
    \ of saying yes is the posterior log-odds that the concept contains the target,\
    \ shifted by an inferred share of the target's prior log-odds of membership (under\
    \ the same share-of-the-line range prior), so a priori typical numbers \u2014\
    \ mid-range numbers that most moderately wide ranges contain, and numbers belonging\
    \ to many rules \u2014 get more \"yes\" than the examples alone warrant (or less,\
    \ if the share is negative)."
- name: beta_share_parity_range_concepts
  rationale: "Refinement of `beta_share_width_exception_concepts` with one component\
    \ taken from `parity_within_range_concepts`: people do the same Bayesian concept\
    \ learning over rules (family-organised prior, exception rules as their own kind)\
    \ and magnitude ranges judged as a typical share of the 1\u2013100 line, with\
    \ the size principle, but they can also entertain the conjunctive concept \"odd\
    \ (or even) numbers within a range\" (e.g. \"even numbers above 60\") as its own\
    \ kind of concept, with its own inferred plausibility and the same share-of-the-line\
    \ width prior as plain ranges. So after 4, 66, 78, 96 people say \"yes\" to large\
    \ even numbers (70, 74) but \"no\" to small ones and to odd numbers between the\
    \ examples, and after 23, 35, 95, 83 they reject even numbers between the examples,\
    \ rather than spreading \"yes\" over every number in the range or over all even\
    \ (odd) numbers."
- name: exemplar_concept_similarity_pooling
  rationale: People do not infer one concept that explains all the examples together;
    they store each example as a separate exemplar and judge the target by its average
    similarity to the stored exemplars, where the similarity of two numbers is how
    readily a familiar number concept (a rule such as "multiples of 9", or a magnitude
    range of typical width) suggested by the exemplar would also contain the target,
    with more specific shared concepts counting for more. So a target strongly similar
    to just one example (e.g. a number close to only one of several widely spread
    examples, or an odd number after 3, 9, 27, 81) still gets a fair share of "yes"
    answers, and adding consistent examples narrows generalisation much less than
    a learner who requires one concept to cover them all.
- name: pedagogical_teacher_sampling_concepts
  rationale: "People assume the examples were chosen by a helpful teacher rather than\
    \ drawn at random from the concept: they reason that a program meaning a given\
    \ concept would pick examples that point distinctively to that concept (numbers\
    \ that few other plausible concepts would also produce), and they infer the concept,\
    \ over the same rules and magnitude ranges as the best model, by asking which\
    \ concept such a teacher would most likely have chosen these examples for. So\
    \ when every example also fits a narrower rule (e.g. all multiples of 9), people\
    \ conclude the teacher meant the narrower rule \u2014 a broader one (multiples\
    \ of 3) would have been shown with examples that are not multiples of 9 \u2014\
    \ and they reject the broader rule's other members more firmly than random sampling\
    \ alone implies."
- name: specificity_biased_rule_prior
  rationale: "People do the same Bayesian concept learning as the best model (rules\
    \ with a family-organised prior and exception rules as their own kind, magnitude\
    \ ranges judged as a typical share of the 1\u2013100 line, the size principle),\
    \ but within each kind of rule they do not find all rules equally plausible beforehand:\
    \ a rule's prior plausibility scales with how specific it is (how few numbers\
    \ it contains), to an inferred degree, so \"multiples of 9\" is a priori favoured\
    \ over \"multiples of 3\" and \"multiples of 8\" over \"multiples of 4\" (or disfavoured,\
    \ if the degree is negative). The sharpest disagreement with the best model lives\
    \ in example sets that fit a sparse rule nested inside a broader rule of the same\
    \ kind, especially with only two examples (e.g. 81, 9; 8, 32; 6, 66): there this\
    \ model confines \"yes\" to multiples of the larger base and rejects the other\
    \ multiples of its divisor far more firmly than the size principle alone does."
- name: times_table_familiarity_concepts
  rationale: "Refinement of `beta_share_width_exception_concepts`: people do the same\
    \ Bayesian concept learning over rules (family-organised prior, exception rules\
    \ as their own kind) and magnitude ranges judged as a typical share of the 1\u2013\
    100 line, with the size principle. The one change is how prior belief is shared\
    \ among the \"multiples of m\" rules: not equally, but by how familiar each times\
    \ table is to them, with a separate inferred plausibility for each table that\
    \ is not tied to how many numbers it contains. So familiar tables (e.g. multiples\
    \ of 5 or 9) are a readier explanation of examples they fit than unfamiliar (7,\
    \ 11, 12) or broader (3) tables, and after examples that are all multiples of\
    \ 9 people confine \"yes\" to the 9-table more firmly than the size principle\
    \ alone implies (or, if the 3-table is the more familiar, spread it further)."
- name: dominated_rule_discount_concepts
  rationale: "Refinement of `beta_share_width_exception_concepts`: people do the same\
    \ Bayesian concept learning over rules (family-organised prior, exception rules\
    \ as their own kind) and magnitude ranges judged as a typical share of the 1\u2013\
    100 line, with the size principle. The one change is which rules they seriously\
    \ entertain given the examples: when every example also fits a strictly narrower\
    \ rule (all multiples of 9 fit \"multiples of 3\"; 4, 16, 64 fit both \"powers\
    \ of 4\" and \"powers of 2\"), they settle on the narrower rule and discount the\
    \ broader, dominated one by an inferred factor beyond what the size principle\
    \ already does (arbitrary-exception rules never count as the narrower rule). So\
    \ after 36, 45, 54, 81 people say \"yes\" to other multiples of 9 and \"no\" to\
    \ multiples of 3 that are not multiples of 9 more sharply than the incumbent predicts\
    \ \u2014 unlike a prior favouring specific rules, the discount applies only when\
    \ a narrower rule actually fits the examples."
- name: beta_share_without_replacement_concepts
  rationale: "Refinement of `without_replacement_sampling_concepts` with one component\
    \ taken from `beta_share_width_exception_concepts`: people assume the program\
    \ never repeats a number, so they treat the examples as drawn from the hidden\
    \ concept without replacement (each further example is one of the concept's members\
    \ not yet shown), and they do Bayesian concept learning over rules (family-organised\
    \ prior, exception rules as their own kind) and magnitude ranges on that basis.\
    \ The one change is their prior about how wide a range is: they judge a range\
    \ as a typical share of the bounded 1\u2013100 line, so near-total \"almost any\
    \ number\" ranges are implausible. As a result, when the examples use up a good\
    \ part of a small rule (e.g. 36, 45, 54, 81 out of the multiples of 9), people\
    \ favour that most specific rule over the broader one around it (multiples of\
    \ 3) more strongly than random sampling with replacement allows, saying \"yes\"\
    \ to other multiples of 9 and \"no\" to multiples of 3 that are not multiples\
    \ of 9."
- name: hundred_chart_block_concepts
  rationale: "People picture the numbers 1\u2013100 laid out on the familiar hundred\
    \ chart (tens digit as the row, units digit as the column), and besides arithmetic\
    \ rules and ranges on the number line they entertain rectangular blocks of that\
    \ chart as concepts, such as \"numbers in the 20s to 80s that end in 2 to 6\"\
    , with this kind's plausibility inferred and its size judged as a share of the\
    \ chart. With the size principle, examples that cluster in a few columns across\
    \ several rows (e.g. 22, 62, 26, 82) lead people to say \"yes\" to other numbers\
    \ in that block (42, 66) and \"no\" to numbers outside its columns (28, 63), instead\
    \ of spreading \"yes\" over all even numbers or one wide range."
- name: boundary_examples_anchor_ranges
  rationale: When people consider whether the examples come from a magnitude range,
    they judge the range mainly by the smallest and largest examples, which mark its
    edges. The examples in between tell them nothing new about where the edges are,
    so they count for less (to an inferred degree) as evidence that the range is narrow,
    while every example counts fully when they test an arithmetic rule. As a result,
    with three or four examples people keep entertaining wider ranges, and a range
    explanation stays more competitive with a rule, than an ideal learner who weighs
    every example equally would.
- name: range_size_misperception_concepts
  rationale: "People do Bayesian concept learning over rules (family-organised prior,\
    \ exception rules as their own kind) and magnitude ranges judged as a typical\
    \ share of the 1\u2013100 line, with the size principle, but they misjudge how\
    \ many numbers a range holds: a range's felt size grows as an inferred power of\
    \ its true width, so (if the power is below one) wide ranges seem to hold fewer\
    \ numbers than they do and are penalised too little by the size principle \u2014\
    \ or, above one, too much. Because this distortion acts on the evidence each example\
    \ gives rather than on the prior, it shows up most with more examples: with a\
    \ compressed sense of range size, adding examples inside a span narrows magnitude\
    \ generalisation less than the normative learner predicts, so \"yes\" extends\
    \ further beyond the examples' span for three- and four-example sets."
- name: range_placement_prior_concepts
  rationale: "Refinement of `beta_share_width_exception_concepts`: people do the same\
    \ Bayesian concept learning over rules (family-organised prior, exception rules\
    \ as their own kind) and magnitude ranges, with the size principle and the same\
    \ expectation that a range covers a typical share of the 1\u2013100 line. The\
    \ one change is that people also expect ranges to sit in a typical place on the\
    \ line: instead of every placement of a range of a given width being equally plausible,\
    \ they hold a prior (inferred mean position and sharpness) over where a range's\
    \ centre lies, so ranges among, say, small numbers can be a priori more plausible\
    \ than equally wide ranges among large numbers. As a result, examples falling\
    \ in a disfavoured region of the line are explained by a rule more readily, and\
    \ \"yes\" to nearby numbers there is lower, than for the same pattern of examples\
    \ in a favoured region."
- name: mixed_strong_weak_sampling_concepts
  rationale: "Refinement of `beta_share_width_exception_concepts`: people do the same\
    \ Bayesian concept learning over rules (family-organised prior, exception rules\
    \ as their own kind) and magnitude ranges judged as a typical share of the 1\u2013\
    100 line, with occasional stray examples. The one change is their assumption about\
    \ how the examples were generated: they believe only some genuine examples (an\
    \ inferred share) were drawn at random from the concept, which is what drives\
    \ the size principle, while the rest were merely numbers the concept happens to\
    \ contain, chosen without regard to how big the concept is (mixed strong/weak\
    \ sampling). So the size principle is diluted most for big concepts, and after\
    \ examples that fit both a narrow and a broad concept (multiples of 9 vs multiples\
    \ of 3, a tight range vs a wide one) people keep the broad concept in play and\
    \ say \"yes\" to its other members more than pure random sampling predicts."
- name: individual_rule_vs_range_tendency
  rationale: "Refinement of `beta_share_width_exception_concepts`: people do the same\
    \ Bayesian concept learning over rules (family-organised prior, exception rules\
    \ as their own kind) and magnitude ranges judged as a typical share of the 1\u2013\
    100 line, with the size principle. The one change is that people differ, stably\
    \ across their session, in how readily they take the hidden program to follow\
    \ an arithmetic rule rather than a magnitude range: each person has their own\
    \ prior rule-versus-range odds, drawn from a population distribution whose mean\
    \ and spread are inferred. For the same examples, a \"rule-minded\" person confines\
    \ \"yes\" to members of the fitting rule while a \"magnitude-minded\" person spreads\
    \ \"yes\" over nearby numbers, so their answers to the same (set, target) pair\
    \ disagree systematically rather than at random."
- name: generative_next_output_likelihood
  rationale: "People read \"would the program produce this number?\" as a question\
    \ about how likely the program is to output that particular number next, not about\
    \ whether the number belongs to the hidden concept. They infer the concept as\
    \ a Bayesian concept learner does (family-organised rules with exception rules\
    \ as their own kind, magnitude ranges covering a typical share of the 1\u2013\
    100 line, the size principle), but they say \"yes\" according to how much more\
    \ likely the target is as the next output than a number picked at random. So targets\
    \ that only a broad concept contains (any even number, anywhere in a wide range)\
    \ get fewer \"yes\" answers than their membership probability implies, while members\
    \ of a small, well-fitting concept (powers of 2, a tight range) are accepted readily."
- name: tversky_prototype_feature_similarity
  rationale: "People judge the target by its similarity to the prototype of the examples\
    \ \u2014 the set of familiar number properties (parity, being a multiple of some\
    \ number, being a square, cube or power, being prime, final digit, decade) that\
    \ all the examples share, plus their place on the number line \u2014 using Tversky's\
    \ ratio-of-features similarity: the salience-weighted properties the target has\
    \ in common with that prototype, relative to those plus the prototype's properties\
    \ the target lacks and the target's own properties the prototype lacks, with numerical\
    \ closeness to the nearest example falling off exponentially and counting as one\
    \ more weighted property. The more similar the target is to the prototype by this\
    \ metric, the more likely they say \"yes\", so a target is rejected both for missing\
    \ what the examples share and for having salient properties of its own that the\
    \ examples do not."
- name: inferred_sampling_regime_concepts
  rationale: "Refinement of `mixed_strong_weak_sampling_concepts`: people do the same\
    \ Bayesian concept learning over rules (family-organised prior, exception rules\
    \ as their own kind) and magnitude ranges judged as a typical share of the 1\u2013\
    100 line, with occasional stray examples, and they allow both random sampling\
    \ from the concept (the size principle) and weak sampling (examples merely members\
    \ of it). The one change is where that uncertainty sits: rather than each example\
    \ independently being a random draw or not, people are unsure whether the program\
    \ as a whole draws its outputs at random from its concept, and they infer this\
    \ from the whole set together with the concept. So a suspicious coincidence (every\
    \ example fits a small rule, e.g. 2, 8, 16, 64) is itself taken as evidence of\
    \ random sampling and sharpens generalisation onto the small rule, while sets\
    \ that no small concept explains well tilt belief towards weak sampling and keep\
    \ broad rules and wide ranges in play."
- name: decade_kind_beta_share_concepts
  rationale: "Refinement of `beta_share_width_exception_concepts`, with one component\
    \ taken from the pruned `decade_concept_family_prior`. People do the same Bayesian\
    \ concept learning over rules (family-organised prior, exception rules as their\
    \ own kind) and magnitude ranges judged as a typical share of the 1\u2013100 line,\
    \ with the size principle. They also hold the decade as a ready-made concept (\"\
    single-digit numbers\", \"numbers in the teens\", \"numbers in the 60s\"), which\
    \ forms its own kind of rule with its own inferred plausibility. So when the examples\
    \ share a tens digit (e.g. 63, 67 or 2, 8), people confine \"yes\" sharply to\
    \ that decade, accepting 60 and 69 but rejecting 70 and 59. A free-floating range\
    \ of the same width would give a smooth fall-off around the examples instead."
- name: arbitrary_opening_example
  rationale: "People take the first example shown as an arbitrary starting point \u2014\
    \ just some number the hidden concept contains, picked without regard to how many\
    \ numbers the concept holds \u2014 and treat only the examples that follow as\
    \ drawn at random from the concept, so only those later examples make them favour\
    \ small concepts (the size principle). Otherwise they do the same Bayesian concept\
    \ learning as the best model (rules with a family-organised prior and exception\
    \ rules as their own kind, ranges judged as a typical share of the 1\u2013100\
    \ line, mixed strong/weak sampling for the later examples). So a single example\
    \ leads to broad generalisation, each further example narrows it sharply, and\
    \ the same numbers in a different order give different answers depending on which\
    \ one came first."
- name: mixed_sampling_prior_leaking_judgment
  rationale: "Refinement of `mixed_strong_weak_sampling_concepts` with one component\
    \ taken from `beta_share_width_prior_leaking_judgment`: people infer the hidden\
    \ concept exactly as the incumbent's learner does (family-organised rules with\
    \ exception rules as their own kind, magnitude ranges judged as a typical share\
    \ of the 1\u2013100 line, occasional stray examples, and only an inferred share\
    \ of examples taken as random draws that drive the size principle). The one change\
    \ is in the yes/no judgment: it is pulled by how plausible the target was before\
    \ any examples were shown, so the log-odds of saying \"yes\" is the posterior\
    \ log-odds that the concept contains the target, shifted by an inferred share\
    \ of the target's prior log-odds of membership. A priori typical numbers (mid-range\
    \ numbers that most moderately wide ranges contain, members of many rules) therefore\
    \ get more \"yes\" than the examples warrant, or less if the share is negative,\
    \ on top of the broad-concept generalisation that mixed sampling produces."
