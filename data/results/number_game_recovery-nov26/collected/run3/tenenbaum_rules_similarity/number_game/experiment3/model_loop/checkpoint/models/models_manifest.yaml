models:
- name: beta_share_width_exception_concepts
  rationale: "Refinement of `gamma_width_exception_family_concepts`: people do the\
    \ same Bayesian concept learning over rules (family-organised rule prior, exception\
    \ rules as their own kind) and magnitude ranges, with the size principle. The\
    \ one change is the shape of their prior about how wide a range is: they think\
    \ of a range as a portion of the bounded 1\u2013100 line and expect it to cover\
    \ a typical share of it (a beta prior over that share, with its mean and sharpness\
    \ inferred), rather than holding an unbounded gamma expectation over raw width.\
    \ So ranges covering nearly the whole line are as implausible to them as very\
    \ narrow ones, and when the examples are spread widely (e.g. 43, 4, 91, 9) people\
    \ fall back on a rule instead of an \"almost any number\" range. As a result they\
    \ say \"yes\" less often to numbers that only such a near-total range would include."
- name: uncertainty_shifted_criterion
  rationale: 'People infer the hidden concept exactly as the best model''s Bayesian
    concept learner does, but their yes/no decision criterion depends on how sure
    they are which concept the program uses: the more their belief is spread over
    many competing concepts (rules and range widths), the more they shift their answer
    away from the inferred membership probability toward "no" (uncertainty aversion)
    or, if the inferred shift is negative, toward "yes". So two targets with the same
    membership probability get different answers depending on whether the examples
    point clearly to one concept or leave many open.'
- name: specificity_biased_rule_prior
  rationale: "People do the same Bayesian concept learning as the best model (rules\
    \ with a family-organised prior and exception rules as their own kind, magnitude\
    \ ranges judged as a typical share of the 1\u2013100 line, the size principle),\
    \ but within each kind of rule they do not find all rules equally plausible beforehand:\
    \ a rule's prior plausibility scales with how specific it is (how few numbers\
    \ it contains), to an inferred degree, so \"multiples of 9\" is a priori favoured\
    \ over \"multiples of 3\" and \"multiples of 8\" over \"multiples of 4\" (or disfavoured,\
    \ if the degree is negative). The sharpest disagreement with the best model lives\
    \ in example sets that fit a sparse rule nested inside a broader rule of the same\
    \ kind, especially with only two examples (e.g. 81, 9; 8, 32; 6, 66): there this\
    \ model confines \"yes\" to multiples of the larger base and rejects the other\
    \ multiples of its divisor far more firmly than the size principle alone does."
- name: boundary_examples_anchor_ranges
  rationale: When people consider whether the examples come from a magnitude range,
    they judge the range mainly by the smallest and largest examples, which mark its
    edges. The examples in between tell them nothing new about where the edges are,
    so they count for less (to an inferred degree) as evidence that the range is narrow,
    while every example counts fully when they test an arithmetic rule. As a result,
    with three or four examples people keep entertaining wider ranges, and a range
    explanation stays more competitive with a rule, than an ideal learner who weighs
    every example equally would.
- name: range_size_misperception_concepts
  rationale: "People do Bayesian concept learning over rules (family-organised prior,\
    \ exception rules as their own kind) and magnitude ranges judged as a typical\
    \ share of the 1\u2013100 line, with the size principle, but they misjudge how\
    \ many numbers a range holds: a range's felt size grows as an inferred power of\
    \ its true width, so (if the power is below one) wide ranges seem to hold fewer\
    \ numbers than they do and are penalised too little by the size principle \u2014\
    \ or, above one, too much. Because this distortion acts on the evidence each example\
    \ gives rather than on the prior, it shows up most with more examples: with a\
    \ compressed sense of range size, adding examples inside a span narrows magnitude\
    \ generalisation less than the normative learner predicts, so \"yes\" extends\
    \ further beyond the examples' span for three- and four-example sets."
- name: mixed_strong_weak_sampling_concepts
  rationale: "Refinement of `beta_share_width_exception_concepts`: people do the same\
    \ Bayesian concept learning over rules (family-organised prior, exception rules\
    \ as their own kind) and magnitude ranges judged as a typical share of the 1\u2013\
    100 line, with occasional stray examples. The one change is their assumption about\
    \ how the examples were generated: they believe only some genuine examples (an\
    \ inferred share) were drawn at random from the concept, which is what drives\
    \ the size principle, while the rest were merely numbers the concept happens to\
    \ contain, chosen without regard to how big the concept is (mixed strong/weak\
    \ sampling). So the size principle is diluted most for big concepts, and after\
    \ examples that fit both a narrow and a broad concept (multiples of 9 vs multiples\
    \ of 3, a tight range vs a wide one) people keep the broad concept in play and\
    \ say \"yes\" to its other members more than pure random sampling predicts."
- name: individual_rule_vs_range_tendency
  rationale: "Refinement of `beta_share_width_exception_concepts`: people do the same\
    \ Bayesian concept learning over rules (family-organised prior, exception rules\
    \ as their own kind) and magnitude ranges judged as a typical share of the 1\u2013\
    100 line, with the size principle. The one change is that people differ, stably\
    \ across their session, in how readily they take the hidden program to follow\
    \ an arithmetic rule rather than a magnitude range: each person has their own\
    \ prior rule-versus-range odds, drawn from a population distribution whose mean\
    \ and spread are inferred. For the same examples, a \"rule-minded\" person confines\
    \ \"yes\" to members of the fitting rule while a \"magnitude-minded\" person spreads\
    \ \"yes\" over nearby numbers, so their answers to the same (set, target) pair\
    \ disagree systematically rather than at random."
- name: mixed_sampling_prior_leaking_judgment
  rationale: "Refinement of `mixed_strong_weak_sampling_concepts` with one component\
    \ taken from `beta_share_width_prior_leaking_judgment`: people infer the hidden\
    \ concept exactly as the incumbent's learner does (family-organised rules with\
    \ exception rules as their own kind, magnitude ranges judged as a typical share\
    \ of the 1\u2013100 line, occasional stray examples, and only an inferred share\
    \ of examples taken as random draws that drive the size principle). The one change\
    \ is in the yes/no judgment: it is pulled by how plausible the target was before\
    \ any examples were shown, so the log-odds of saying \"yes\" is the posterior\
    \ log-odds that the concept contains the target, shifted by an inferred share\
    \ of the target's prior log-odds of membership. A priori typical numbers (mid-range\
    \ numbers that most moderately wide ranges contain, members of many rules) therefore\
    \ get more \"yes\" than the examples warrant, or less if the share is negative,\
    \ on top of the broad-concept generalisation that mixed sampling produces."
- name: person_specific_response_bias
  rationale: "People infer how likely the target is to belong to the hidden concept\
    \ as the simplest Bayesian concept learner does (rules with a family-organised\
    \ prior and exception rules as their own kind, magnitude ranges judged as a typical\
    \ share of the 1\u2013100 line, the size principle), but each person brings a\
    \ stable bias toward answering \"yes\" or \"no\" that holds across their whole\
    \ session: their decision criterion is shifted, by a person-specific amount drawn\
    \ from a population distribution, so the log-odds of saying \"yes\" is the inferred\
    \ membership log-odds plus that person's own bias. So, for the same examples and\
    \ target, a yes-prone person accepts more targets of every kind (including clear\
    \ non-members), and a no-prone person rejects more (including shown examples),\
    \ rather than everyone answering with the same probability."
- name: digit_parity_concepts
  rationale: "People do the same Bayesian concept learning over arithmetic rules (organised\
    \ by kind, with exception rules as their own kind) and magnitude ranges judged\
    \ as a typical share of the 1\u2013100 line, with the size principle, but they\
    \ also read numbers by their written digits and hold a kind of concept the current\
    \ models lack: \"numbers written only with odd digits\" (1, 3, 5, ..., 11, 13,\
    \ ..., 99) and \"numbers written only with even digits\" (2, 4, 6, 8, 20, 22,\
    \ ..., 88), with this kind's plausibility inferred. So after examples such as\
    \ 31, 3, 1, 15 or 9, 33, 73, 99 people say \"yes\" to odd numbers like 71, 77\
    \ or 95 but \"no\" to odd numbers with an even tens digit such as 63 or 85, rather\
    \ than spreading \"yes\" evenly over all odd numbers."
- name: conjunctive_shared_feature_exemplars
  rationale: 'People do not infer a hidden concept; they compare the target with each
    stored example using a shared-feature (additive-clustering) similarity: two numbers
    are similar to the extent that they share familiar number properties (parity,
    multiples, powers, squares, primes, final digit, digits contained), each property
    weighted by how salient its kind is and how distinctive it is (properties held
    by few numbers count more), plus their closeness in magnitude. The judgment is
    conjunctive: the target is accepted to the extent that it is similar to every
    example (the geometric mean of its normalised similarities to the examples), so
    a target must resemble all the examples, not just one, to be called "yes".'
- name: mixed_sampling_uncertainty_criterion
  rationale: "Refinement of `uncertainty_shifted_criterion` with one component taken\
    \ from `mixed_strong_weak_sampling_concepts`: people infer the hidden concept\
    \ by the same Bayesian concept learning (family-organised rules with exception\
    \ rules as their own kind, ranges judged as a typical share of the 1\u2013100\
    \ line, occasional stray examples) and shift their yes/no criterion toward \"\
    no\" (or \"yes\") the more their belief is spread over competing concepts. The\
    \ one change is their sampling assumption: they take only an inferred share of\
    \ the examples as random draws from the concept (the size principle) and the rest\
    \ as mere members of it, so broad rules and wide ranges stay in play after examples\
    \ that also fit a narrower concept \u2014 which both broadens generalisation to\
    \ the broad concept's other members and raises the uncertainty that drives the\
    \ criterion shift for exactly those sets."
- name: kind_uncertainty_shifted_criterion
  rationale: "Refinement of `uncertainty_shifted_criterion`: people infer the hidden\
    \ concept exactly as its Bayesian concept learner does and shift their yes/no\
    \ criterion with how unsure they are, but the one change is what that uncertainty\
    \ is about. It is not their spread of belief over individual concepts (which rule,\
    \ which range width) but their uncertainty about what kind of program they face\
    \ \u2014 a parity rule, a prime rule, a power rule, a multiples rule, a digit\
    \ rule, or a magnitude range \u2014 so examples that leave it open whether the\
    \ program follows an arithmetic rule or a stretch of the number line move the\
    \ answer toward \"no\" (or \"yes\"), while examples that clearly point to one\
    \ kind do not, however many concepts of that kind remain open."
- name: range_misperception_uncertainty_criterion
  rationale: "Refinement of `range_size_misperception_concepts`, with one component\
    \ taken from `uncertainty_shifted_criterion`. People do Bayesian concept learning\
    \ over rules (family-organised prior, exception rules as their own kind) and magnitude\
    \ ranges judged as a typical share of the 1\u2013100 line, and they misjudge how\
    \ many numbers a range holds (its felt size grows as an inferred power of its\
    \ true width), so wide ranges are penalised too little or too much by the size\
    \ principle. The one change is the yes/no criterion: the more their belief is\
    \ spread over competing concepts, the further people shift away from the inferred\
    \ membership probability, toward \"no\" (uncertainty aversion) or, if the inferred\
    \ shift is negative, toward \"yes\". Because a compressed sense of range size\
    \ keeps many range widths open for three- and four-example sets, this shift is\
    \ strongest for exactly the sets where magnitude generalisation already reaches\
    \ beyond the examples' span."
- name: single_kind_commitment_inference
  rationale: "People reason about the hidden program in two steps, as in single-category\
    \ inference (Murphy & Ross): they first work out what kind of program it is \u2014\
    \ a parity rule, a prime rule, a square/cube rule, a power rule, a multiples rule,\
    \ a final-digit rule, a contained-digit rule, an exception rule, or a magnitude\
    \ range \u2014 and then judge the target mostly within the kind they favour, rather\
    \ than weighing every kind by its full posterior plausibility. So when the examples\
    \ leave two kinds open (e.g. \"multiples of 4\" versus \"numbers between 20 and\
    \ 60\"), the less favoured kind is discounted to an inferred degree, and targets\
    \ that only it would contain get fewer \"yes\" answers than a fully Bayesian learner\
    \ predicts (or more, if people hedge across kinds more evenly than the posterior\
    \ warrants)."
- name: two_cluster_range_concepts
  rationale: "People do the same Bayesian concept learning over arithmetic rules (organised\
    \ by kind, with exception rules as their own kind) and magnitude ranges judged\
    \ as a typical share of the 1\u2013100 line, with the size principle, but their\
    \ magnitude concepts are not limited to one unbroken stretch of the line: when\
    \ the examples fall into two separated groups, they can take the program to produce\
    \ \"small numbers and large numbers\" \u2014 two separate ranges with a gap between\
    \ them \u2014 as a kind of concept with its own inferred plausibility. The sharpest\
    \ disagreement with the best model lies in targets in the empty middle of widely\
    \ split sets (e.g. 50 after 13, 91 or 43, 4, 91, 9; 60 after 20, 32, 92): this\
    \ model says \"no\" to them while still saying \"yes\" to numbers near either\
    \ group, whereas a single-range learner must either cover the gap or fall back\
    \ on a rule."
- name: rule_vs_range_doubt_criterion
  rationale: 'Refinement of `kind_uncertainty_shifted_criterion`: people infer the
    hidden concept exactly as its Bayesian concept learner does and shift their yes/no
    criterion with how unsure they are about what kind of program they face. The one
    change is how coarse that kind judgment is: the only question that moves their
    criterion is whether the program follows an arithmetic rule at all or picks out
    a stretch of the number line, so examples that leave rule-versus-range open shift
    answers toward "no" (or "yes"), while doubt among kinds of rule (say multiples
    versus final digit) does not shift them, unlike in the incumbent.'
- name: sample_size_shifted_criterion
  rationale: "People infer the hidden concept as a Bayesian concept learner does (rules\
    \ organised by kind with exception rules as their own kind, magnitude ranges judged\
    \ as a typical share of the 1\u2013100 line, the size principle), but how readily\
    \ they act on that inference depends on how much evidence they were shown: their\
    \ yes/no criterion shifts by an inferred amount with each additional example (a\
    \ sample-size heuristic). So for the same membership probability, people answer\
    \ \"yes\" differently after one example than after four, regardless of how sure\
    \ the examples make them about which concept, or which kind of concept, the program\
    \ uses."
- name: mixed_sampling_kind_uncertainty
  rationale: "Refinement of `kind_uncertainty_shifted_criterion` with one component\
    \ taken from `mixed_strong_weak_sampling_concepts`: people infer the hidden concept\
    \ by the same Bayesian concept learning (family-organised rules with exception\
    \ rules as their own kind, ranges judged as a typical share of the 1\u2013100\
    \ line, occasional stray examples) and shift their yes/no criterion with how unsure\
    \ they are what kind of program they face (which family of rule, or a magnitude\
    \ range). The one change is their sampling assumption: they take only an inferred\
    \ share of the examples as random draws from the concept (the size principle)\
    \ and the rest as mere members of it, so broad rules and wide ranges of other\
    \ kinds stay in play after examples that also fit a narrow concept \u2014 broadening\
    \ generalisation to the broad concept's members and raising exactly the kind-level\
    \ doubt that moves the criterion for those sets."
- name: two_cluster_kind_doubt_criterion
  rationale: "Refinement of `two_cluster_range_concepts`, with one component taken\
    \ from the incumbent `kind_uncertainty_shifted_criterion`. People do Bayesian\
    \ concept learning over arithmetic rules (organised by kind, with exception rules\
    \ as their own kind), single magnitude ranges, and \"two separate groups\" concepts\
    \ (two ranges with a gap between them), all judged as a typical share of the 1\u2013\
    100 line and with the size principle. The one change is the yes/no criterion:\
    \ the more the examples leave open what kind of program it is, including whether\
    \ the numbers form one stretch of the line, two separate groups or an arithmetic\
    \ rule, the further people shift their answer from the inferred membership probability\
    \ toward \"no\" (or toward \"yes\" if the inferred shift is negative). So widely\
    \ split sets such as 13, 91, which leave one range, two clusters and a rule all\
    \ in play, get a shifted criterion that the single-range incumbent cannot produce."
- name: best_explanation_contrast
  rationale: 'People do not weigh every concept that could explain the examples; they
    answer by comparing two best explanations: the single most plausible concept (rule
    or magnitude range, judged with the same priors and size principle as the Bayesian
    learner) that includes the target, against the single most plausible concept that
    excludes it. They say "yes" with a probability that grows with how much better
    the best target-including explanation is than the best target-excluding one, so
    a target is accepted when one good concept contains it, regardless of how many
    other good concepts do or do not.'
- name: rule_family_doubt_criterion
  rationale: "Refinement of `kind_uncertainty_shifted_criterion`: people infer the\
    \ hidden concept exactly as its Bayesian concept learner does and shift their\
    \ yes/no criterion with how unsure they are about what kind of program they face.\
    \ The one change is which part of that kind-level doubt moves the criterion: only\
    \ doubt about which kind of arithmetic rule it is (parity, primes, powers, multiples,\
    \ final digit, ...), weighted by how much they believe it is a rule at all, shifts\
    \ answers toward \"no\" (or \"yes\"), while doubt about whether the program is\
    \ a rule or a stretch of the number line does not \u2014 the complement of `rule_vs_range_doubt_criterion`,\
    \ which kept only that rule-versus-range part."
- name: kind_disagreement_target_criterion
  rationale: "Refinement of `kind_uncertainty_shifted_criterion`: people infer the\
    \ hidden concept exactly as its Bayesian concept learner does and shift their\
    \ yes/no criterion when their doubt comes from not knowing what kind of program\
    \ they face. The one change is that this doubt is judged for the target in question\
    \ rather than for the example set as a whole: the criterion moves toward \"no\"\
    \ (or \"yes\") in proportion to how much of their uncertainty about this particular\
    \ target stems from the open kinds disagreeing about it (e.g. a range would include\
    \ it but the favoured rule would not), as opposed to fuzziness within one kind\
    \ (where a range's edge lies, which multiples rule) \u2014 so on the same set,\
    \ a target that the remaining kinds agree on is answered by the membership probability\
    \ alone, while one they disagree on is shifted."
- name: range_first_satisficing_search
  rationale: "People search for the hidden program in a fixed order of ease: they\
    \ first ask whether the examples simply fall in some stretch of the number line,\
    \ and they go on to look for an arithmetic rule (parity, multiples, powers, digits\
    \ and so on) less thoroughly the better such a stretch already accounts for the\
    \ examples (satisficing), to an inferred degree \u2014 or more thoroughly, if\
    \ that degree is negative. Otherwise they infer the concept as a Bayesian concept\
    \ learner does, so for tightly clustered examples rule members outside the cluster\
    \ get fewer \"yes\" answers than full search predicts, while for widely scattered\
    \ examples rules keep their full weight."
- name: first_impression_kind_anchoring
  rationale: People decide what kind of program they face (a parity, prime, square/cube,
    power, multiples, final-digit, contained-digit or exception rule, or a stretch
    of the number line) largely from their first impression of the first example,
    and later examples only partly adjust that impression (anchoring and adjustment),
    while which particular concept of the favoured kind it is gets worked out from
    all the examples. So the same examples in a different order lead to different
    answers, and a set whose first example suggests a different kind than the whole
    set does (e.g. 50 then 2, 8, 64) keeps the first-suggested kind in play, giving
    "yes" to targets that only that kind contains more often than a learner who weighs
    all examples equally would; otherwise they answer as the best model does, including
    its shift of criterion with doubt about which kind of rule it is.
- name: relative_concept_size_criterion
  rationale: "People infer the hidden concept as the simplest Bayesian concept learner\
    \ does, but they set their yes/no criterion relative to how many numbers they\
    \ believe the program produces (an adaptation-level, or \"yes-rationing\", criterion):\
    \ when the examples suggest a broad concept that contains much of the 1\u2013\
    100 line, they demand more before saying \"yes\" to any one target, and when the\
    \ examples suggest a sparse concept they accept a member more readily \u2014 or\
    \ the reverse, if the inferred dependence is positive. So two targets with the\
    \ same membership probability are answered differently depending on how large\
    \ the inferred concept is expected to be."
- name: prototype_magnitude_pull
  rationale: "People infer the hidden concept as a Bayesian concept learner does (rules\
    \ organised by kind with exception rules as their own kind, magnitude ranges judged\
    \ as a typical share of the 1\u2013100 line, the size principle), but they also\
    \ summarise the examples by a prototype, their average magnitude, and their yes/no\
    \ answer is pulled by the target's numerical similarity to that prototype. That\
    \ similarity falls off exponentially with the target's distance on the number\
    \ line from the examples' mean, with an inferred rate and strength. So targets\
    \ near the centre of the examples get more \"yes\" than the inferred concept warrants\
    \ (or fewer, if the strength is negative), even when no example lies near them\
    \ (e.g. 50 after 13, 91, or 33 after 2, 64), while targets equally close to a\
    \ single example but far from the centre get no such pull."
- name: doubt_driven_magnitude_fallback
  rationale: 'Refinement of the incumbent `rule_family_doubt_criterion`: people infer
    the hidden concept as its Bayesian concept learner does, and their doubt about
    which kind of arithmetic rule the program follows (parity, primes, powers, multiples,
    final digit, ...), weighted by how much they believe it is a rule at all, shapes
    their answer. The one change is what that doubt does: rather than shifting their
    yes/no criterion toward "no" or "yes", it makes them fall back on the number line,
    so the more unsure they are which kind of rule it is, the more (to an inferred
    degree) they judge the target by how a stretch of the number line around the examples
    would generalise. Under rule-kind doubt, numbers near the examples therefore gain
    "yes" answers and members of only one candidate rule lose them, while sets that
    clearly point to one kind of rule are judged by the full posterior.'
- name: digit_parity_family_doubt
  rationale: "Refinement of `rule_family_doubt_criterion`, with one component taken\
    \ from `digit_parity_concepts`. People infer the hidden concept as the incumbent's\
    \ Bayesian learner does and shift their yes/no criterion with how unsure they\
    \ are which kind of arithmetic rule the program follows (weighted by how much\
    \ they believe it is a rule at all); the one change is that their repertoire of\
    \ rule kinds also includes a digit-based kind \u2014 \"numbers written only with\
    \ odd digits\" and \"numbers written only with even digits\" \u2014 with its own\
    \ inferred plausibility. So after examples such as 31, 3, 1, 15 people say \"\
    yes\" to 71 or 95 but \"no\" to 63 or 85, and sets that leave this digit kind\
    \ open alongside parity or other rules carry more kind-of-rule doubt, shifting\
    \ the criterion where the incumbent's does not."
- name: two_cluster_rule_family_doubt
  rationale: "Refinement of `two_cluster_range_concepts`, with one component taken\
    \ from the incumbent `rule_family_doubt_criterion`. People do Bayesian concept\
    \ learning over arithmetic rules (organised by kind, with exception rules as their\
    \ own kind), single magnitude ranges and \"two separate groups\" concepts (two\
    \ ranges with a gap between them), all judged as a typical share of the 1\u2013\
    100 line and with the size principle. The one change is the yes/no criterion:\
    \ only doubt about which kind of arithmetic rule the program follows, weighted\
    \ by how much they believe it is a rule at all, shifts the answer from the inferred\
    \ membership probability toward \"no\" (or \"yes\"), while doubt about whether\
    \ the numbers form one stretch, two groups or a rule does not \u2014 so for widely\
    \ split sets the two-group concept both carries generalisation away from the empty\
    \ middle and, by drawing belief away from rules, weakens the criterion shift there."
- name: digit_sum_concepts
  rationale: People read a number not only by its magnitude and arithmetic properties
    but also by the sum of its digits, and they hold "numbers whose digits add up
    to the same total" (e.g. 19, 28, 37, 46, 55, 64, 73, 82, 91) as a further kind
    of rule with its own prior plausibility, alongside the parity, prime, power, multiples
    and digit rules and the magnitude ranges of the best model, judged with the size
    principle and with the same criterion shift from doubt about which kind of rule
    it is. So after examples sharing a digit sum (e.g. 19, 73 or 92, 56) people say
    "yes" to other numbers with that digit sum more than to equally near numbers with
    a different digit sum.
- name: conjunctive_concept_similarity_exemplars
  rationale: "People do not infer one concept that explains all the examples; they\
    \ store each example as a separate exemplar and judge the target by its similarity\
    \ to each stored exemplar, where two numbers are similar to the extent that the\
    \ familiar number concepts (arithmetic rules and stretches of the number line\
    \ of a typical width) one of them brings to mind would also contain the other.\
    \ The comparisons combine multiplicatively, as in an exemplar model's conjunctive\
    \ similarity rule: the target is accepted to the degree that its geometric-mean\
    \ similarity to all the exemplars clears a criterion, so a target must resemble\
    \ every example \u2014 being very dissimilar to just one example is enough to\
    \ reject it."
- name: representative_coverage_sampling
  rationale: 'People assume the examples they are shown are representative of the
    hidden program''s output: a fair sample spreads out over the concept rather than
    bunching in one corner of it. So, beyond the size principle, they discount a candidate
    concept (rule or range) to an inferred degree when most of its members lie outside
    the stretch the examples cover (e.g. "all even numbers" after 2, 4, 6, 8) and
    favour concepts the examples span well (e.g. powers of 2 after 2, 8, 16, 64),
    and they say "yes" to the target by how strongly the concepts they then believe
    contain it.'
- name: prototype_pull_rule_family_doubt
  rationale: "Refinement of `rule_family_doubt_criterion`, with one component taken\
    \ from `prototype_magnitude_pull`: people infer the hidden concept as the incumbent's\
    \ Bayesian learner does and shift their yes/no criterion with how unsure they\
    \ are which kind of arithmetic rule the program follows (weighted by how much\
    \ they believe it is a rule at all). The one change is that they also summarise\
    \ the examples by a prototype, their average magnitude, and their answer is pulled\
    \ toward \"yes\" (or \"no\", if the inferred strength is negative) by the target's\
    \ closeness on the number line to that average, falling off exponentially at an\
    \ inferred rate \u2014 so targets near the centre of the examples (e.g. 50 after\
    \ 13, 91) get more \"yes\" than the concept and the doubt-shifted criterion alone\
    \ predict, even when no example lies near them."
- name: mixed_sampling_rule_family_doubt
  rationale: "Refinement of the incumbent `rule_family_doubt_criterion`, with one\
    \ component taken from `mixed_strong_weak_sampling_concepts`: people infer the\
    \ hidden concept as the incumbent's Bayesian learner does and shift their yes/no\
    \ criterion with their doubt about which kind of arithmetic rule the program follows\
    \ (weighted by how much they believe it is a rule at all). The one change is their\
    \ sampling assumption: they take only an inferred share of the examples as random\
    \ draws from the concept (the size principle) and the rest as mere members of\
    \ it, so after examples that fit a narrow rule, broad rules of other kinds (e.g.\
    \ all even numbers alongside powers of 2) stay in play \u2014 broadening \"yes\"\
    \ to those rules' other members and raising exactly the rule-kind doubt that shifts\
    \ the criterion for those sets."
- name: representative_coverage_family_doubt
  rationale: 'Refinement of the live model `representative_coverage_sampling`, with
    one component taken from the incumbent `rule_family_doubt_criterion`. People infer
    the hidden concept as a Bayesian concept learner does but assume the examples
    are representative of the program''s output, so they discount (or, if the inferred
    degree is negative, favour) concepts most of whose members lie outside the stretch
    the examples cover. The one change is the yes/no criterion: as in the incumbent,
    whatever doubt remains about which kind of arithmetic rule the program follows
    (weighted by how much they believe it is a rule at all) shifts their answer toward
    "no" (or "yes"), so the representativeness judgment both changes which concepts
    they generalise from and how much rule-kind doubt is left to move the criterion.'
