models:
- name: span_filling_size_exemplar
  rationale: "Refinement of drifting_criterion_dual_route_exemplar: people still judge\
    \ a target by its recency-weighted exponential similarity to the remembered examples\
    \ on final digit, parity and graded shared factor (with coherence-stretched attention),\
    \ still consult the \"multiples of g\" and \"ends in d\" rules as separate evidence,\
    \ and still relax their criterion over the session. The single change is how closeness\
    \ in size is judged: people treat the examples as marking out a filled-in stretch\
    \ of the number line, so a target's size mismatch is how far it falls outside\
    \ the span from the smallest to the largest example (zero anywhere inside it),\
    \ not its distance from each example. The disagreement with the best model lives\
    \ inside widely spaced sets \u2014 after 10, 90 the target 50 is as close in size\
    \ as 10 itself and is endorsed far more often, so widely spread sets are generalized\
    \ much more broadly than tight ones (the too-compressed between-set yes-rate spread\
    \ in the critique)."
- name: sequence_momentum_span_exemplar
  rationale: "People read the examples as a sequence the program is producing in the\
    \ order shown and expect it to keep going in the direction it has been moving:\
    \ beyond the span the examples fill in, a number lying ahead of the last-shown\
    \ example in the direction of travel from the first example to the last feels\
    \ much closer in size than an equally distant number lying back behind where the\
    \ sequence started. So after 20, 40 people generalize to 50-60 more than to 0-10,\
    \ but after 40, 20 they generalize to 10 more than to 50 \u2014 a momentum in\
    \ the order of presentation, not a fixed upward preference, which produces the\
    \ critique's recency (closer-to-last) advantage."
- name: recency_anchored_span_exemplar
  rationale: 'Refinement of span_filling_size_exemplar (all other parts unchanged:
    recency-weighted exemplar similarity on final digit, parity and graded shared
    factor with coherence-stretched attention, the "multiples of g" and "ends in d"
    rules, and a criterion that relaxes over the session). The single change is a
    memory process in how the filled-in size span is held: people anchor the span
    on the most recently shown example, and the positions of earlier examples fade
    in memory, so the stretch each earlier example adds to the span shrinks back toward
    the last example the further back it was shown. Targets lying on the last example''s
    side of the set are therefore treated as inside the span (and endorsed) more often
    than equally placed targets on the first example''s side, the recency bias in
    size generalization that the critique reports.'
- name: recency_anchored_span_exemplar_2
  rationale: Refinement of set_size_scaled_magnitude_gradient (recency-weighted exponential
    similarity to the examples on size, final digit, parity and graded shared factor
    with coherence-stretched attention, the "multiples of g" and "ends in d" rules
    as separate evidence, a criterion that relaxes over the session, and a size gradient
    that broadens with the number of examples). The single change, adapting the incumbent's
    span-filling idea, is that people treat each earlier example as connected to the
    most recently shown one by a filled-in path the program travelled, so a target's
    size mismatch with an earlier example is how far it lies outside the stretch between
    that example and the last one (zero inside it), while its mismatch with the last
    example is its plain distance from it. Generalization thus fills the gaps between
    the examples yet stays centred on the latest example, so among targets inside
    or near a set, those nearer the last-shown example are endorsed more than those
    nearer the first (the recency gap the critique reports, which an order-blind span
    cannot produce).
- name: spread_calibrated_size_gradient
  rationale: "People judge how close a target is in size to a set of examples on a\
    \ yardstick calibrated by the examples themselves: the distance by which a target\
    \ falls outside the stretch the examples span is felt relative to how widely the\
    \ examples are spread, so after tightly clustered examples (e.g. 41, 43, 44) a\
    \ number ten steps away feels far, whereas after widely scattered examples (e.g.\
    \ 12, 47, 83) the same ten steps feel negligible. The size-similarity gradient\
    \ around a set therefore flattens as the examples' spread grows, making scattered\
    \ sets generalized far more broadly beyond their span than tight ones (the too-compressed\
    \ between-set yes-rate spread in the critique); everything else \u2014 recency-weighted\
    \ similarity on final digit, parity and shared factor with coherence-stretched\
    \ attention, the \"multiples of g\" and \"ends in d\" rules, the drifting criterion\
    \ and the order-directed momentum of the incumbent \u2014 is unchanged."
- name: spread_scaled_recency_span_exemplar
  rationale: "Refinement of recency_anchored_span_exemplar_2 (recency-weighted exemplar\
    \ similarity on size, final digit, parity and graded shared factor with coherence-stretched\
    \ attention; each earlier example joined to the last-shown one by a filled-in\
    \ path; the \"multiples of g\" and \"ends in d\" rules as separate evidence; a\
    \ criterion that relaxes over the session). The single change is what sets how\
    \ broadly people generalize in size: instead of the number of examples, it is\
    \ how widely the examples are spread \u2014 people take the spread of the examples\
    \ as evidence of how far the program ranges, so the size gradient around a tightly\
    \ clustered set (e.g. 41, 43, 44) is steep and around a widely spread set (e.g.\
    \ 12, 57, 90) is shallow, even beyond the span the examples fill. Tight sets are\
    \ thus generalized narrowly and spread sets broadly, widening the between-set\
    \ differences in yes-rate that the critique finds too compressed."
- name: zigzag_breadth_sequence_exemplar
  rationale: 'Refinement of sequence_momentum_span_exemplar (all else unchanged: recency-weighted
    similarity on size, final digit, parity and graded shared factor with coherence-stretched
    attention, the "multiples of g" and "ends in d" rules, a relaxing criterion, the
    filled-in span and the momentum of the sequence''s direction of travel). The single
    change is that people read how orderly the sequence of examples is in the order
    shown: when the examples march steadily in one direction (20, 40, 60) they take
    the program to be systematic and generalize narrowly in size beyond the examples,
    whereas when the sequence zigzags back and forth (40, 20, 60) they take the program
    to be scattering numbers widely and generalize broadly beyond them. The same numbers
    shown in a different order are thus generalized differently, and sets differ more
    in their breadth than a span-only model predicts (the critique''s too-compressed
    between-set yes-rate spread).'
- name: set_homogeneity_criterion_momentum
  rationale: "Refinement of sequence_momentum_span_exemplar (all of it kept: recency-weighted\
    \ exemplar similarity on size, final digit, parity and graded shared factor with\
    \ coherence-stretched attention, an order-directed momentum in size generalization\
    \ beyond the filled-in span, the \"multiples of g\" and \"ends in d\" rules, and\
    \ a criterion that relaxes over the session). The single change is that each set's\
    \ overall look sets how inclusive people take the program to be: the more the\
    \ examples resemble one another (in size, final digit, parity and shared factors),\
    \ the narrower a program people think produced them, so they raise their yes-criterion\
    \ for every target after a homogeneous set and lower it after a heterogeneous\
    \ one. Whole sets therefore differ in how generously they are generalized more\
    \ than similarity alone predicts \u2014 the too-compressed between-set yes-rate\
    \ spread the critique reports \u2014 while the ordering of targets within a set\
    \ is still set by similarity, momentum and rules."
