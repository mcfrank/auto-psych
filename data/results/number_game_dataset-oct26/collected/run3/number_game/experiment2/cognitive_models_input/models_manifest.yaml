models:
- name: decade_concept_bayesian_learning
  rationale: "People do the same conservative Bayesian concept learning as the best\
    \ model (42 arithmetic rules and midpoint-weighted intervals of 1-100, evidence\
    \ weight growing with set size, attention lapses), but they also hold decades\
    \ \u2014 \"numbers in the 20s\", \"numbers in the 60s\" (same tens digit) \u2014\
    \ as named concepts with their own inferred prior share, split equally across\
    \ the ten decades. Because a decade is a privileged, a-priori-likely range rather\
    \ than one of thousands of arbitrary intervals, a target just outside the examples'\
    \ range is endorsed more when it shares their tens decade than when an equally\
    \ close target crosses a decade boundary."
- name: decade_concepts_lapsing_learner
  rationale: "Refinement of `lapsing_growing_evidence_concepts`: people do the same\
    \ conservative Bayesian concept learning (42 arithmetic rules plus midpoint-weighted\
    \ intervals, evidence weight growing with set size, blind \"yes\"/\"no\" lapses),\
    \ but they also treat the decades of the written number system (1-9, 10-19, ...,\
    \ 90-99) as privileged, ready-made concepts with their own inferred prior share,\
    \ over and above the same ranges' standing as ordinary intervals. The one change\
    \ is this decade hypothesis family, which predicts that a nearby target outside\
    \ the examples' range is endorsed more when it shares the examples' tens digit\
    \ than when it crosses into the next decade \u2014 the same-decade bonus the incumbent's\
    \ critique flags."
- name: decade_aligned_range_concepts
  rationale: 'Refinement of `sample_size_growing_evidence_concepts`: people do the
    same conservative Bayesian concept learning over the 42 arithmetic rules and midpoint-weighted
    intervals of 1-100, with evidence weight growing with set size, but they think
    about number ranges in round decades, so a range whose edges fall on decade boundaries
    (such as 20-29 or 30-59) is a priori more plausible than an arbitrarily bounded
    one by an inferred bonus. The one change is this decade-aligned prior bonus on
    intervals, which predicts that a target just outside the examples'' span is endorsed
    more when it lies in the same decade as an example (e.g. 29 after 23 and 25) than
    an equally near target across a decade boundary (e.g. 19), the decade-grouping
    discrepancy the critique of the best model flags.'
- name: log_compressed_range_concepts
  rationale: "Refinement of `decade_aligned_range_concepts`: people do the same conservative\
    \ Bayesian concept learning (42 arithmetic rules plus midpoint-weighted, decade-favoured\
    \ intervals, evidence weight growing with set size), but they judge how big a\
    \ number range is on a compressed mental number line, where the distance from\
    \ 80 to 90 feels smaller than the distance from 5 to 15. The one change is that\
    \ the size principle measures an interval's size, and how likely it is to have\
    \ produced each example, on this compressed scale (an inferred compression exponent;\
    \ no compression recovers the incumbent), so generalization is scale-invariant:\
    \ people extend a range around large examples (e.g. 85, 88) much further in absolute\
    \ terms than around small ones (e.g. 5, 8) \u2014 the region, single and clustered\
    \ examples at the two ends of 1-100, where it disagrees most with the incumbent's\
    \ uniform-width generalization."
- name: log_compressed_sampling_concepts
  rationale: People do the same conservative Bayesian concept learning over arithmetic
    rules and number ranges as the best model (size principle, evidence weight growing
    with set size, decade-aligned ranges favoured), but they imagine the program's
    examples as drawn evenly along a compressed, roughly logarithmic mental number
    line rather than evenly over the integers, so a concept's small members are expected
    far more often than its large ones. The one change is this inferred compression
    of the sampling assumption, which predicts that a large example is weak evidence
    for a narrow range around it (generalization from 85 spreads much wider in absolute
    terms than from 5), and that a concept whose members are mostly large is not penalised
    for its size as much as one spanning small numbers.
- name: session_drifting_decade_concepts
  rationale: "Refinement of `decade_concept_bayesian_learning`: people do the same\
    \ conservative Bayesian concept learning over arithmetic rules, midpoint-weighted\
    \ intervals and decade concepts (evidence weight growing with set size, blind\
    \ \"yes\"/\"no\" lapses), but as the long session wears on they increasingly answer\
    \ \"yes\" without consulting their concept, so the chance of a blind \"yes\" drifts\
    \ with how far into the session the trial falls, at an inferred rate. The one\
    \ change is this session-drifting yes-lapse rate, which predicts that targets\
    \ the concept excludes are endorsed more often late in the session than early\
    \ \u2014 the growing liberality the critique of the best model flags."
- name: session_growing_acquiescence_concepts
  rationale: "Refinement of `decade_aligned_range_concepts`: people do the same conservative\
    \ Bayesian concept learning over the 42 arithmetic rules and midpoint-weighted,\
    \ decade-favouring intervals of 1-100, with evidence weight growing with set size,\
    \ but as the session wears on they increasingly answer \"yes\" without consulting\
    \ their concept at all \u2014 a blind-\"yes\" lapse whose rate rises steadily\
    \ with how far into the session the trial falls (an inferred starting rate and\
    \ growth rate). The one change is this session-growing acquiescence, which predicts\
    \ more \"yes\" late in the session than early, chiefly to targets the concept\
    \ clearly excludes (where a blind \"yes\" makes the most difference), closing\
    \ the session-liberalization discrepancy the incumbent's critique flags."
