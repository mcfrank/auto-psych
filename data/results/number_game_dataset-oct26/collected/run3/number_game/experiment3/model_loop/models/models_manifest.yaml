models:
- name: outlier_tolerant_rule_concepts
  rationale: 'Refinement of `evidence_scarce_guessing_concepts`: people do the same
    conservative Bayesian concept learning over the 42 arithmetic rules and midpoint-weighted,
    decade-favoured intervals of 1-100 (evidence weight growing with set size, guessing
    that becomes rarer as more examples are shown), but how readily they accept that
    an example could be a stray number the program produced outside its rule is their
    own inferred belief, rather than a fixed one-in-ten chance. The one change is
    this inferred tolerance for exceptions, which matters most for sets where all
    examples but one share a rule (e.g. 92, 82, 27, 42 or 71, 61, 26, 81): a tolerant
    learner keeps the near-fitting rule and says "yes" to far targets that fit it
    (52, 62; 11, 41), while an intolerant learner abandons the rule for a range spanning
    every example and rejects them.'
- name: parity_banded_range_concepts
  rationale: "People learn the program's concept by the same conservative Bayesian\
    \ concept learning as the best model (arithmetic rules and decade-favoured number\
    \ ranges, evidence weight growing with set size, an inferred tolerance for stray\
    \ examples, guessing that becomes rarer as examples accumulate), but their space\
    \ of concepts also contains parity-restricted ranges \u2014 \"the even numbers\
    \ from 20 to 40\", \"the odd numbers from 51 to 67\" \u2014 held as a family with\
    \ its own inferred share of prior belief, split equally among them. Because such\
    \ a range has half the members of the plain range, the size principle favours\
    \ it whenever several examples lie close together and share a parity, so people\
    \ endorse same-parity targets inside and near the examples' span (e.g. 30, 36,\
    \ 40 after 52, 22, 94) but reject nearby opposite-parity targets more sharply\
    \ than a learner with only plain ranges and global parity rules."
- name: late_session_acquiescence_concepts
  rationale: "Refinement of `outlier_tolerant_rule_concepts`: people do the same conservative\
    \ Bayesian concept learning over the 42 arithmetic rules and midpoint-weighted,\
    \ decade-favoured intervals of 1-100 (evidence weight growing with set size, an\
    \ inferred tolerance for stray examples, guessing that becomes rarer as more examples\
    \ are shown), but as the long session wears on they increasingly answer \"yes\"\
    \ without consulting their concept at all, whatever the number of examples \u2014\
    \ a blind-\"yes\" acquiescence whose rate rises with how far into the session\
    \ the trial falls. The one change is this session-growing acquiescence (the mechanism\
    \ of `session_acquiescent_tolerant_concepts`, admitted earlier but dropped only\
    \ because its fit ran too long, here computed exactly but far more cheaply), which\
    \ predicts that targets the concept excludes are endorsed more late in the session\
    \ than early, even after three or four examples where evidence-scarce guessing\
    \ is rare \u2014 the late-minus-early \"yes\" drift the incumbent's critique flags."
- name: parity_banded_session_acquiescence
  rationale: "Refinement of `parity_banded_range_concepts`: people do the same conservative\
    \ Bayesian concept learning over arithmetic rules, decade-favoured number ranges\
    \ and parity-restricted ranges (\"the odd numbers from 51 to 67\"), with evidence\
    \ weight growing with set size, an inferred tolerance for stray examples and guessing\
    \ that becomes rarer as examples accumulate \u2014 but as the long session wears\
    \ on they increasingly answer \"yes\" without consulting their concept at all,\
    \ a blind-\"yes\" acquiescence whose rate rises with how far into the session\
    \ the trial falls. The one change is this session-growing acquiescence (the component\
    \ of `late_session_acquiescence_concepts`, grafted onto the parity-banded learner),\
    \ which predicts that targets the concept excludes \u2014 including opposite-parity\
    \ neighbours that parity-banded ranges reject sharply \u2014 are endorsed more\
    \ late in the session than early for the same stimulus, the within-stimulus late-session\
    \ \"yes\" drift the incumbent's critique flags."
- name: single_exception_rule_concepts
  rationale: "Refinement of `outlier_tolerant_rule_concepts`: people do the same conservative\
    \ Bayesian concept learning over the 42 arithmetic rules and midpoint-weighted,\
    \ decade-favoured intervals of 1-100 (evidence weight growing with set size, an\
    \ inferred tolerance for a stray example, guessing that becomes rarer as more\
    \ examples are shown), but they allow the program at most one exception per set:\
    \ either every example came from the concept, or exactly one of them is a stray\
    \ number, never two or more. The one change is this single-exception limit (replacing\
    \ independent strays for each example), which stops a patternless set of three\
    \ or four examples from being explained as a tight cluster plus several strays,\
    \ so people credit a range spanning (nearly) all the examples and fill its gaps\
    \ with \"yes\" \u2014 the excess in-range \"yes\" for patternless sets the incumbent's\
    \ critique flags."
- name: width_preferring_range_concepts
  rationale: "Refinement of `outlier_tolerant_rule_concepts`: people do the same conservative\
    \ Bayesian concept learning over the 42 arithmetic rules and midpoint-weighted,\
    \ decade-favoured number ranges (evidence weight growing with set size, an inferred\
    \ tolerance for stray examples, guessing that becomes rarer as more examples are\
    \ shown), but before seeing any examples they also hold a graded belief about\
    \ how wide a program's number range tends to be \u2014 a smooth preference for\
    \ broader (or narrower) ranges whose strength is inferred, where the incumbent\
    \ treats every width alike. The one change is this width preference in the prior\
    \ over ranges; if people expect a range-producing program to cover a broad stretch\
    \ of numbers, then after a patternless set they rarely settle on a narrow range\
    \ that leaves an example out and instead credit ranges spanning all the examples\
    \ and more, filling the gaps between the examples with \"yes\" (e.g. 40 or 55\
    \ after 67, 31, 17, 61) more than the incumbent \u2014 the excess in-range \"\
    yes\" for rule-less sets its critique flags \u2014 while sets with a clear rule\
    \ are still explained by the rule."
- name: rule_favoring_width_range_concepts
  rationale: "Refinement of `width_preferring_range_concepts`: people do the same\
    \ conservative Bayesian concept learning over the 42 arithmetic rules and midpoint-weighted,\
    \ decade-favoured number ranges with an inferred preference over range width (evidence\
    \ weight growing with set size, an inferred tolerance for stray examples, guessing\
    \ that becomes rarer as more examples are shown), but they find it a stronger\
    \ coincidence when the examples all fit an arithmetic rule than when they merely\
    \ cluster within a range, so the size-principle evidence counts more for rules\
    \ than for ranges by an inferred ratio (the family-specific evidence weight grafted\
    \ from `family_weighted_evidence_concepts`). The one change is this rule-versus-range\
    \ evidence ratio, which predicts that sets whose examples share a rule (e.g. 80,\
    \ 70, 90, 100 \u2014 all multiples of ten) are explained by the rule rather than\
    \ by a range spanning them, so in-span targets lacking the property (75, 85) are\
    \ rejected almost always \u2014 the over-acceptance of non-round targets after\
    \ all-round sets flagged in the incumbent's critique \u2014 while a broad range\
    \ still explains patternless sets."
