models:
- name: digit_reversal_mirror_concept
  rationale: 'Among the programs people consider is a digit-reversal concept: the
    program writes the examples'' digits backwards, so a number that is one of the
    examples with its two digits swapped (27 after 72, 83 after 38, 4 after 40) feels
    like something the program would produce. Such mirror targets get extra support
    toward "yes", by an inferred amount, beyond what their final digit, parity, magnitude
    or arithmetic relation to the examples would predict. All other judgments follow
    the current best model (final-digit similarity judged by its shortfall from the
    examples'' mutual similarity, rule-pre-empted parity credit, privileged round
    common-factor rule, rule-gated decade-band familiarity, step-costed counting up
    from single examples, and the size principle on a shared final-digit rule).'
- name: even_rule_digit_size_principle_counting
  rationale: 'A refinement of the incumbent `digit_rule_size_principle_counting` (shortfall
    from the examples'' mutual final-digit similarity, rule-pre-empted parity credit,
    a privileged round common-factor rule, rule-gated decade-band familiarity, step-costed
    counting up from single examples, and the size principle on a shared final-digit
    rule, all kept). The one change, a component taken from `privileged_named_number_concepts`,
    is that "even numbers" is a privileged, named concept while "odd numbers" is not:
    when every example is even, people readily take "even numbers" as the program''s
    rule and reject odd targets by an extra, inferred amount (e.g. 37 after 16, 8,
    64 or after 68, 58), whereas an all-odd set evokes no "odd numbers" rule and its
    even targets pay nothing extra.'
- name: parity_and_digit_size_principle
  rationale: "A refinement of the incumbent `digit_rule_size_principle_counting` (final-digit\
    \ similarity judged by its shortfall from the examples' mutual similarity, rule-pre-empted\
    \ parity credit, a privileged round common-factor rule, rule-gated decade-band\
    \ familiarity, step-costed counting up from single examples and the size principle\
    \ on a shared final digit, all kept). The one change extends the size principle\
    \ to parity: when every example is even (or every example is odd), each example\
    \ beyond the first is another suspicious coincidence that firms up an \"even numbers\"\
    \ (or \"odd numbers\") rule, so a target of the opposite parity is rejected by\
    \ an inferred, additional amount per confirming example \u2014 e.g. 37 is rejected\
    \ more after 4, 16, 12, 64 than after 4, 16 \u2014 whereas the incumbent's mutual-similarity\
    \ shortfall is the same for two or four same-parity examples."
- name: bayesian_digit_veto_counting_up
  rationale: A refinement of `bayesian_digit_rule_veto` (shortfall from the examples'
    mutual final-digit similarity, rule-pre-empted parity credit, the privileged "even
    numbers" rule, separate round and non-round common-factor boosts, rule-gated decade-band
    familiarity, and the Bayesian "ends in digit d" belief that vetoes targets ending
    in another digit, all kept). The one change, a component taken from `counting_up_from_single_example`,
    is that people also count up mentally from each single example of 3 or more (x,
    2x, 3x, ...), so a target reached this way gets extra support toward "yes" even
    when it is not a multiple of what all the examples share (e.g. 66 after 33, 3;
    48 after 4, 16, 12), strongest for double an example and fading by an inferred
    cost per further counting step. The claim is that the saturating digit-rule veto
    and step-costed counting together explain judgments better than the incumbent's
    linear per-example digit penalty.
