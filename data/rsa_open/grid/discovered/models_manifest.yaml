- name: closed_c0e1_candidate_load_codability_listener
  group: closed
  origin: data/rsa/live/live_rsa_c0/outputs/experiment1/model_loop/models/candidate_load_codability_listener.py
  rationale: "Pragmatic listener at depth 2 with referential candidate load attentional capture, referential codability prior,\
    \ expected communicative success, competitor confusion avoidance, and visual salience prior. Refining candidate_load_attention_listener\
    \ by incorporating the referential codability component from referential_codability_listener: listeners expect speakers\
    \ to refer to objects with high referential codability\u2014objects possessing distinguishing descriptive features that\
    \ make them viable communicative targets in the scene context. Before hearing an informative word, listeners evaluate\
    \ each referent by its communicative affordance, defined as the total discriminative capacity of the available expressions\
    \ that describe it, elevating a priori expectations for distinguishable entities. This communicative affordance prior\
    \ directly moderates overly aggressive scalar implicatures on two-object displays, suppresses choices of intermediate\
    \ feature-count competitors on multi-match displays, and elevates choices of feature-rich objects on ubiquitous utterance\
    \ and mumble displays. Differences from candidate_load_attention_listener: - Recursion depth remains depth 2 (choice_probs\
