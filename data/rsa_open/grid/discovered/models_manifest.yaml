  rationale: 'Pragmatic listener at depth 2 under capacity-limited executive inhibitory control with contextual category typicality
    and bounded speaker consideration. Refining prototype_typicality_listener by incorporating bounded speaker consideration
    from bounded_consideration_speaker: speakers evaluate communicative alternatives probabilistically rather than exhaustively,
