  origin: data/rsa_open/seeds/bar/oddity_heuristic_listener.py
  rationale: Perceptual oddity heuristic listener. Listeners interpret referring expressions using a perceptual oddity heuristic
    rather than recursive Theory of Mind. When hearing a word that applies to multiple referents, listeners select the contextually
    unique singleton that lacks identical duplicates in the visual display. On uninformative trials without an informative
    word, listeners spontaneously choose the unique singleton, defaulting to uniform choice when all items are distinct or
