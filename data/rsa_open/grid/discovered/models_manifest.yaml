- name: pilot1_e1_speaker_alternative_necessity_tom
  group: open pilot 1
  origin: data/rsa_open/live/open_chain_0/experiment1/loop/models/speaker_alternative_necessity_tom.py
  rationale: "Speakers in reference games select expressions by evaluating candidate words against a target object's alternative\
    \ naming options: narrow individuating features strongly inhibit choosing other words, partially diagnostic three-object\
    \ features compete weakly, and universal scene-wide words serve as last-resort labels that are strongly suppressed for\
    \ any referent possessing an alternative word whenever a unique sole-label referent in the display can only be named by\
    \ the universal word. Listeners invert this alternative-constrained speaker across two levels of recursive reasoning while\
