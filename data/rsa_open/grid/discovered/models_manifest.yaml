- name: fixed2_contrastive_anchor_decision_l2
  group: stage 1 fixed
  origin: data/rsa_open/live_v2/fixed_chain_0/experiment2/loop/models/contrastive_anchor_decision_l2.py
  rationale: Listeners infer speaker intent through depth-2 recursive reasoning over a confusion-averse speaker and convert
    those posterior beliefs into a response via a contrastive anchor decision rule. When selecting a referent, the listener's
    decision rule boosts complete complexity-boundary prototypes and unique upper-boundary referents against cloned minimal
