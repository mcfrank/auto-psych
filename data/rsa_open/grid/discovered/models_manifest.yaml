- name: pilot1_e2_attentional_buffer_anchor_sampling
  group: open pilot 1
  origin: data/rsa_open/live/open_chain_0/experiment2/loop/models/attentional_buffer_anchor_sampling.py
  rationale: "Listeners and speakers process multi-object displays under a resource-limited two-slot attentional buffer that\
    \ anchors pre-utterance display scanning on polar figure-ground extremes\u2014complete multi-feature figures, negative-space\
    \ blank oddballs, and unique singletons\u2014while compressing unanchored intermediate feature bundles and discounting\
    \ redundant contrasts against blank ground foils. When a word's extension fits within the two-item buffer, listeners track\
    \ both candidate referents with recursive pragmatic inference\u2014shielding complex singleton figures on non-minimal\
    \ pairs while preserving sole-label priority for single-feature targets\u2014whereas when an expression overflows the\
    \ buffer across three or more objects, inference falls back on approximate anchor sampling over minimal prototypes and\
    \ singleton exemplars while suppressing unanchored same-tier distractors. Because a three-referent expression in a four-object\
    \ scene overflows the two-item focal buffer while leaving one referent outside it, incomplete attentional inhibition leaks\
    \ boundary support onto low-complexity excluded foils across both clone-bearing and clone-free displays."
