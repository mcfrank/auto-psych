    \ w_features, w_valence, w_color, w_confusion, and lapse). - In choice_probs, added compute_codability(ctx) to compute\
    \ contextual communicative affordance as the sum of inverse utterance extensions (real_lex / k_u) across true features,\
    \ adding params[\"w_codable\"] * codability to the prior logits passed to softmax_prior."
