- name: fixed1_prototype_tier_confusion_l2
  group: stage 1 fixed
  origin: data/rsa_open/live_v2/fixed_chain_0/experiment1/loop/models/prototype_tier_confusion_l2.py
  rationale: We refine `tier_competitor_confusion_l2` while keeping recursion depth 2 (`L2` inverting a speaker who simulates
    `L1`, which inverts a speaker simulating `L0`) and the exact same two free parameters (`alpha` and `w_confusion`, both
    with `LogNormal(0.0, 0.5)` priors), by extending complexity-tier confusion with incomplete-prototype penalty and complete-prototype
    anchoring on upper-tier literal referents alongside singleton uniqueness in the object priors. Specifically, in `confusion`
    we add `(is_non_all_max - is_all_utt * (min_cloned + gap_utt)) / n_obj`, penalizing upper-tier literal referents (`is_max_utt`)
    that lack at least one scene feature (`is_non_all_max`, where `fc < n_real_words`) while reducing confusion on complete
    all-features literal referents (`is_all_utt`, where `fc == n_real_words`) when the minimal-complexity literal tier is
    cloned (`min_cloned`) or separated by a multi-feature span (`gap_utt = max(fc - min_true_fc - 1, 0) / n_real_words`);
    in `word_prior` we subtract `is_singleton / (n_obj * n_real_words)` inside the `-w_confusion` weight; and in `prior_choice`
    we replace `-is_max_fc / n_obj` with `-(is_max_fc * (1.0 + is_singleton * inter_frac) + is_singleton) / n_obj` (where
    `inter_frac = sum(is_inter_scene) / n_obj`). Penalizing incomplete upper-tier literal referents and rewarding complete
    all-features prototypes explains why listeners on word trials reject partial-feature competitors in favor of minimal-feature
    referents (`unique_single_feature_referent_vs_partial_feature_competitor_rate`, `max_literal_referent_rate_in_three_referent_false_distractor_scenes`,
    and `cloned_min_referent_vs_distinct_max_competitors_rate`) yet select all-features prototypes against single-feature
    referents (`cloned_single_feature_referent_rate_against_unique_all_features_competitor` and `all_features_referent_rate_against_unique_single_feature_with_false_distractor`),
    while singleton and unique-maximum anchoring in the prior explains why listeners favor unique maximal-feature objects
    on three-tier prior displays (`prior_unique_max_feature_rate_in_four_object_three_tier_scenes`).
  seen:
    literature: all
    studies:
    - s1_fixed_exp1
