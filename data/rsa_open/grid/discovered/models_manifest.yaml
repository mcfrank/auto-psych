- name: isolated_graded_costly_l3
  group: seed
  origin: data/rsa_open/seeds/bar/isolated_graded_costly_l3.py
  rationale: Pragmatic listener at depth 3 with perceptual isolation, graded semantics, and utterance extension costs. Refines
    isolated_graded_costly_l2 by increasing the recursion depth from depth 2 to depth 3. Listeners reason at depth 3, inverting
    a speaker who simulates a depth-2 pragmatic listener. Visual pop-out is determined by an object's perceptual isolation
    (minimum Hamming distance to any other context object), semantic applicability diminishes with additional competing features
    (graded truth), and speakers evaluate communicative utility trade-offs with utterance extension costs proportional to
    the fraction of display objects sharing each feature. On uninformative prior trials, choice follows the perceptual isolation
    prior. A lapse parameter mixes in uniform guessing.
