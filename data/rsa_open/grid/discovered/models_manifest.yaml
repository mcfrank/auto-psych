- name: lexical_preemption_heuristic
  group: seed
  origin: data/rsa_open/seeds/bar/lexical_preemption_heuristic.py
  rationale: Lexical preemption heuristic listener. Listeners interpret referring expressions using a non-Bayesian lexical
    preemption heuristic rather than recursive Theory of Mind. When hearing a word that applies to multiple referents, listeners
    choose among candidate objects possessing that feature by penalizing candidates that possess unmentioned distinguishing
    features that could have uniquely identified them in the context, favoring referents that lack an exclusive alternative
    label. On uninformative trials without an informative word, listeners choose uniformly among available objects.
