  group: closed
  origin: data/rsa/live/live_rsa_c1/outputs/experiment2/model_loop/models/contrastive_extremity_noisy_speaker.py
  rationale: 'Pragmatic listeners reason at depth 1 about a similarity-contrast speaker under common knowledge of visual endpoint
    extremity, but account for stochastic execution noise in the speaker''s feature articulation. Refining contrastive_extremity_speaker
