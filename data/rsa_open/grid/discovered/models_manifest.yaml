- name: open3_complexity_gated_retrieval_decision_l2
  group: stage 1 open
  origin: data/rsa_open/live_v2/open_chain_0/experiment3/loop/models/complexity_gated_retrieval_decision_l2.py
  rationale: 'Listeners and speakers map pragmatic beliefs into responses through a complexity-gated retrieval decision rule
    rather than pure expected-utility maximization: when selecting a referring expression for a target object, a speaker combines
    a specificity-and-cost-weighted pragmatic choice (whose extension penalty grows with the word''s extension share and the
    target''s unmentioned feature load) with a structured feature-availability fallback weighted by both literal and feature-diluted
    target recovery. In comprehension, listeners invert a depth-two graded-semantics speaker under a shared salience prior
    favoring contextual singletons, distinctive objects, and complexity-extreme referents, with referential crowding noise
    bounded by display size and attenuated at the top listener level by the word''s non-universal contrast. Grounding the
    speaker''s decision rule in complexity-and-crowding-scaled extension cost and dual-recovery availability explains why
    speakers strongly prefer the narrowest true feature (extension size 2) on multi-feature non-unique targets in exp3 while
    preserving runner-up specificity gradation, competitor-complexity sensitivity, and comprehension accuracy across E, exp1,
    and exp2.'
