- name: closed_c2e2_competition_endpoint_binding_l2
  group: closed
  origin: data/rsa/live/live_rsa_c2/outputs/experiment2/model_loop/models/competition_endpoint_binding_l2.py
  rationale: 'We refine endpoint_binding_uncertainty_lapse_l2 by incorporating lexical competition in speaker utterance production
    from lexical_competition_speaker_l2 into communicative inference. When communicating about an object with multiple applicable
    visual features, candidate labels compete for lexical retrieval and selection in the speaker''s lexicon, attenuating the
    speaker''s communicative precision and increasing the production of shared or redundant expressions. Pragmatic listeners
    invert this competition-bounded speaker via recursive Theory of Mind at depth 2, which softens recursive preemption penalties
    against multi-featured competitor referents in two-object subset displays and cross-cutting contexts while preserving
    extremity expectations, perceptual feature binding, and contextual lexical uncertainty. Differences from endpoint_binding_uncertainty_lapse_l2:
    - Recursion depth: Unchanged; choice_probs calls L_choice, which marginalizes over depth-2 pragmatic listener L2. - Parameters
    added: w_competition (prior: dist.LogNormal(-1.0, 1.0)). - Parameters removed: None. - Speaker utterance production /
    lexical competition: In S1 and S2, the speaker''s communicative precision varies by referent feature complexity (alpha
    = params["alpha"] / (1.0 + params["w_competition"] * jnp.maximum(ctx.feature_count - 1.0, 0.0))) from lexical_competition_speaker_l2,
    attenuating speaker rationality when describing objects that possess multiple competing candidate labels. - Shared visual
    referent prior: Unchanged; combines singleton salience (w_singleton), contextual distinctiveness (w_distinct), visual
    feature count (w_features), featureless baseline ground salience (w_empty), contextual endpoint salience (w_endpoint *
    is_endpoint), and color contrast (w_color). - Perceptual feature-binding mechanism: Unchanged; non-matching distractor
    objects receive illusory conjunction probability scaling with relative visual feature complexity and prior salience (binding_weight
    = is_false * (ctx.feature_count / max_fc) * prior, normalized as p_bind), mixed into the pragmatic interpretation as p_word
    = (1.0 - effective_bind) * heard + effective_bind * p_bind. - Contextual lexical feature uncertainty: Unchanged; listeners
    marginalize over alternative feature interpretations that co-occur in context with the uttered word via transition matrix
    p_feat (weighted by beta) in L_choice. - Response choice lapse mechanism: Retains salience-captured attentional lapse
