- name: closed_c1e1_softmax_belief_listener
  group: closed
  origin: data/rsa/live/live_rsa_c1/outputs/experiment1/model_loop/models/softmax_belief_listener.py
  rationale: Listeners evaluate candidate referents through pragmatic counterfactual reasoning, but rather than strictly matching
    choice probabilities to posterior beliefs, they select their click via a bounded-precision softmax decision rule over
    beliefs. When choosing among semantically valid referents, response sensitivity determines how strongly differences in
    subjective belief translate into click probabilities, softening extreme pragmatic inferences and generating bounded, probabilistic
    choice. On uninformative trials, choices likewise reflect this bounded softmax response rule applied over prior perceptual
    and contextual expectations.
