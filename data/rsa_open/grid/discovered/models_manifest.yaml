- name: competitor_confusion_speaker
  group: seed
  origin: data/rsa_open/seeds/bar/competitor_confusion_speaker.py
  rationale: Pragmatic listener reasoning about a competitor-confusion-averse speaker. Speakers in reference games actively
    avoid referring expressions that are shared with visually similar or confusable distractors in the context. Candidate
    words are penalized proportionally to their feature overlap with alternative referents that also satisfy the word. Pragmatic
    listeners invert this confusion-averse speaker, expecting words to target referents whose competitors are visually distinct
    rather than near-identical clones.
