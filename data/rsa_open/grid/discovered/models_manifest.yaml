- name: closed_c1e3_feature_surprisal_ensemble_listener
  group: closed
  origin: data/rsa/live/live_rsa_c1/outputs/experiment3/model_loop/models/feature_surprisal_ensemble_listener.py
  rationale: Visual scene expectations and communicative topic focus are governed by information-theoretic feature surprisal
    and Gestalt type-token ensemble grouping. Human visual attention and communicative expectations prioritize candidate referents
    according to the contextual surprisal of their present visual features, while identical objects form perceptual ensembles
    whose collective attention is partitioned equally among individual members. The unadorned baseline object serves as the
    contrastive ground of the visual scene while the maximally elaborated focal exemplar anchors topical prominence, compressing
    intermediate-complexity items and preventing empty singletons from dominating feature-rich duplicate objects.
