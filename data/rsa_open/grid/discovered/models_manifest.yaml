  rationale: 'Refining noisy_graded_semantics_l2 with no parameters added or removed (retaining only alpha and w_salience)
    and the same recursion depth (L2 calling L1, which calls L0), by scaling each real word''s semantic confusion noise on
    false objects by the squared proportion of display objects in that word''s literal extension: defining ext_size = jnp.sum(real_lex,
    axis=1, keepdims=True) and replacing sem_noise = 1.0 / (n_utt * n_obj) with sem_noise = (ext_size * ext_size) / (n_utt
    * n_obj * n_obj), while keeping all other terms (real_mask, real_lex, diff, pair_dist, is_singleton, distinct, n_real,
    fc_norm, fc_dev, extremity, prior, fc_safe, graded_true, noisy_real, soft_lex, L0, L1, L2, listener, and speaker) unchanged.
    Under uniform constant noise across utterances, depth-two pragmatic recursion suppresses false-alarm probabilities on
    three-of-four valid-referent trials to nearly zero because two levels of speaker likelihood inversion amplify the ratio
    between valid and false referents. Because a word that spans most of the display induces greater referential crowding
    and feature-verification interference across objects than a word with a small extension, scaling semantic confusion by
    the squared extension proportion explains why listeners make substantially more false-alarm choices when a heard word
    applies to three of four objects than when it applies to two across E and exp1.'
