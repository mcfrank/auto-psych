- name: closed_c0e3_boundary_avoidable_ambiguity_listener
  group: closed
  origin: data/rsa/live/live_rsa_c0/outputs/experiment3/model_loop/models/boundary_avoidable_ambiguity_listener.py
  rationale: "Listeners interpret referring expressions through boundary polarization with avoidable ambiguity avoidance:\
    \ when a referring expression matches multiple candidate referents that vary in feature complexity, evaluative attention\
    \ anchors on the range extrema\u2014the minimal pragmatic target and the maximal category prototype\u2014while candidates\
    \ located in the interior of the feature range suffer cognitive suppression due to lack of boundary contrast. When evaluating\
    \ alternative referring expressions, listeners expect that speakers adhere to Gricean clarity by penalizing ambiguous\
    \ expressions specifically when the ambiguity is avoidable\u2014that is, when the intended referent possessed an alternative\
    \ distinguishing expression that would have uniquely identified it in context. Consequently, competitors that possessed\
    \ uniquely distinguishing alternatives are decisively precluded under shared expressions, while minimal pragmatic targets\
    \ and multi-feature candidates lacking distinguishing options are strongly favored. Refining boundary_polarization_listener\
    \ by incorporating the avoidable ambiguity avoidance component from avoidable_ambiguity_speaker: speakers in reference\
    \ games adhere to Gricean clarity by penalizing referentially ambiguous expressions specifically when the ambiguity is\
    \ avoidable\u2014that is, when the intended referent possessed an alternative distinguishing expression that would have\
    \ uniquely identified it in context. Pragmatic listeners invert this avoidable-ambiguity-sensitive speaker under boundary\
    \ polarization, recognizing that hearing an ambiguous word provides strong evidence for referents that lacked distinguishing\
    \ alternatives. This directly rectifies the observed under-selection of multi-feature pragmatic targets over all-feature\
    \ competitors in four-object displays (four_object_multifeature_target_vs_all_feature_rate and four_object_two_feature_target_vs_three_feature_competitor_rate),\
    \ the under-selection of pragmatic targets possessing unique alternative features (unique_alternative_target_choice_rate),\
    \ and the over-selection of single-feature targets over three-feature competitors in two-object displays (two_object_one_feature_target_vs_three_feature_competitor_rate),\
    \ while fully preserving range-frequency boundary polarization, capacity-limited executive attention, competitor confusion\
    \ avoidance, and contrastive outlier pop-out. Differences from boundary_polarization_listener: - Recursion depth remains\
    \ depth 2 (choice_probs calls L2, which inverts a speaker simulating depth-1 listener L1). - Added parameter: c_avoid\
    \ (prior dist.Normal(0.0, 1.0)). - Removed parameters: None (retains alpha, w_interior, logit_p_base, w_load, w_popout,\
    \ w_candidate, logit_p_outlier, w_inhibit_leak, w_typical, w_singleton, w_distinct, w_features, w_valence, w_color, w_confusion,\
    \ and lapse with identical priors). - In choice_probs: added compute_avoidable(ctx) computing the contextual avoidable\
    \ ambiguity matrix as avoidable = real_lex * ambiguity[:, None] * has_unique[None, :] where ambiguity = (k_u - 1.0) /\
    \ jnp.maximum(1.0, n_obj - 1.0) * (1.0 - ctx.is_sink) and has_unique indicates whether the referent possesses any unique\
    \ word with k_u == 1, scaled by params[\"c_avoid\"] as avoidable = params[\"c_avoid\"] * compute_avoidable(ctx), and passed\
    \ avoidable to L2. - Speaker utility in both L1 and L2: added avoidable ambiguity penalty term - at(avoidable, u, r) inside\
    \ communicative utility, evaluating as alpha * (L - w_interior * at(interior, u, r) - at(avoidable, u, r)) - w_confusion\
    \ * at(confusion, u, r) (where L is L0 in L1 and L1 in L2)."
