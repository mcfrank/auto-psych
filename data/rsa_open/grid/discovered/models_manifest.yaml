- name: evaluative_prominence_l2
  group: seed
  origin: data/rsa_open/seeds/bar/evaluative_prominence_l2.py
  rationale: 'Pragmatic listener at depth 2 with evaluative stance and visual prominence. Speakers select referents according
    to evaluative prominence: the alignment between an object''s sensory visual prominence (chromatic vibrancy and visual
    feature elaboration) and the speaker''s evaluative stance. Under positive framing (''favorite''), speakers seek objects
    of high visual prominence; under negative framing (''least favorite''), this evaluative stance inverts toward minimal,
    unadorned objects; and under neutral framing, choices follow a baseline positive orientation toward visual features and
    chromatic pop-out. Listeners reason at depth 2, inverting a speaker who anticipates a pragmatic listener. On uninformative
    prior trials, choices directly follow the evaluative prominence distribution. A lapse parameter mixes in uniform guessing.'
