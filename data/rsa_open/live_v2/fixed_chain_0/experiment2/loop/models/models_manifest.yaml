models:
- name: sparse_singleton_prototype_qud_l2
  rationale: We refine `prototype_anchored_tier_qud_l2` while keeping recursion depth
    2 (`L2` inverting a speaker who simulates `L1`, which inverts a speaker simulating
    `L0`) and the exact same two free parameters (`alpha` and `w_qud`, both with `LogNormal(0.0,
    0.5)` priors), by incorporating low-probability false lexical access on sparse
    minimal-complexity singletons from `alternative_competition_cost_l2` (`sem_lex
    = ctx.lex + is_false_min * jnp.exp(-w_qud * (n_obj - min_cloned))`, where `is_false_min
    = real_words * (1.0 - real_lex) * is_min_fc[None, :] * (1.0 - is_clone[None, :])
    * jnp.where((min_fc > 0.0) & (min_fc < min_true_fc), 1.0, 0.0)`) into the speaker's
    lexical weights at `L1` and `L2`. Allowing the pragmatic speaker to occasionally
    apply an utterance to the scene's unique positive minimal-complexity object when
    it lacks the heard feature and all literal referents are strictly more complex
    explains why listeners intrude on literally false minimal-feature singletons more
    often than random lapse predicts (`false_minimal_singleton_choice_rate` in `critiques.md`)
    and reduces over-prediction of the unique maximal referent against cloned multi-feature
    minimal referents (`four_object_cloned_minimal_non_maximal_rate`).
- name: prototype_span_false_access_l2
  rationale: 'We refine `alternative_competition_cost_l2` while keeping recursion
    depth 2 (`L2` inverting a speaker who simulates `L1`, which inverts a speaker
    simulating `L0`) and the exact same two free parameters (`alpha` and `w_cost`,
    both with `LogNormal(0.0, 0.5)` priors), by extending false minimal lexical access
    (`sem_lex`) to both literal and pragmatic listeners while replacing the speaker''s
    equivalence-class competition cost (`utt_cost`) and object priors (`word_prior`,
    `prior_choice`) with diagnostic incomplete-referent suppression, prototype-span
    anchoring, and clone-resolved scene priors. Specifically, in `L0`, `L1`, and `L2`,
    we pass `sem_lex` to `L0` (`L0[u: UTT, r: OBJ](sem_lex: ...)` instead of `lex:
    ...`, removing `lex` from `L1` and `L2` signatures); in `compute_speaker_terms`,
    we add `min_scene_cloned = jnp.max(is_min_fc * is_clone)`, `inter_scene_cloned
    = jnp.max(is_inter_scene * is_clone)`, `is_max_utt = jnp.where((real_lex > 0)
    & (fc[None, :] == max_true_fc) & (max_true_fc > min_true_fc), 1.0, 0.0)`, `max_cloned
    = jnp.max(is_max_utt * is_clone[None, :], axis=1, keepdims=True)`, `gap_utt =
    jnp.maximum(fc[None, :] - min_true_fc - 1.0, 0.0) / n_real_utt`, and `has_uniq_feat
    = jnp.max(jnp.where(jnp.sum(real_lex, axis=1, keepdims=True) == 1.0, real_lex,
    0.0), axis=0)`; redefine `min_cloned = jnp.max(is_min_utt * is_clone[None, :],
    axis=1, keepdims=True)` (removing `(1.0 - jnp.max(is_inter_utt, axis=1, keepdims=True))`);
    replace `sem_lex = ctx.lex + is_false_min * jnp.exp(-w_cost * (n_obj - min_cloned))`
    with `sem_lex = ctx.lex + is_false_min * jnp.where(jnp.sum(real_lex, axis=1, keepdims=True)
    > 1.0, 1.0, 0.0) * jnp.exp(-w_cost * (n_obj - min_cloned - max_cloned))`; replace
    `(real_lex @ unique_sim) + (copy_count[None, :] - 1.0) * real_lex` with `(real_lex
    @ sim)`, `is_incomplete_utt * is_singleton[None, :] / n_real_utt` with `is_incomplete_utt
    * is_singleton[None, :] * (1.0 + is_max_utt * (1.0 - has_uniq_feat[None, :]) *
    jnp.where(jnp.sum(is_max_utt, axis=1, keepdims=True) > 1.0, 1.0, 0.0) * (1.0 -
    max_cloned)) / n_real_utt`, and `- is_all_utt * min_cloned * is_singleton[None,
    :] / n_obj` with `- is_all_utt * (min_cloned + gap_utt) / n_obj` in `utt_cost`
    (dropping `unique_sim`); replace `is_clone * (1.0 - is_inter_scene) / n_obj` with
    `is_clone / n_obj` in `baseline_crowd`; remove `- is_all_feats * (max_fc - min_fc
    - 1.0) / (n_obj * n_real_utt)` from `word_prior`; and in `prior_choice` replace
    `(1.0 - 1.0 / n_obj) / (1.0 + is_singleton / n_obj)` with `(n_obj - 1.0 - min_scene_cloned
    * (1.0 + is_singleton)) / n_obj` and `(is_max_fc + is_all_feats * (has_inter_scene
    * is_singleton + is_clone / n_obj)) / n_obj` with `(is_max_fc * (1.0 - inter_scene_cloned)
    + is_all_feats * (has_inter_scene * is_singleton + min_scene_cloned + inter_scene_cloned))
    / n_obj`. This single refinement explains why listeners on word trials intrude
    on literally false minimal-feature singletons under referential ambiguity (`false_minimal_singleton_choice_rate`),
    reject incomplete maximal referents lacking a scene-unique feature (`incomplete_max_referent_no_unique_feature_preference`),
    and balance cloned minimal referents against prototypes (`four_object_cloned_minimal_non_maximal_rate`),
    while on silent prior trials favoring unique intermediate-tier objects over cloned
    minimal objects (`prior_unique_intermediate_vs_cloned_minimal_preference`) and
    unique minimal-tier objects over non-prototype maximal-tier objects when intermediate
    tiers are cloned (`prior_unique_minimal_vs_maximal_tier_preference`).'
- name: diagnostic_prototype_contrast_heuristic
  rationale: Listeners interpret referring expressions through a non-Bayesian diagnostic
    contrast and prototype-boundary heuristic rather than recursive speaker simulation.
    On word trials, listeners directly score candidate referents by comparing the
    heard feature's uniqueness against the referent's strongest unmentioned feature
    while discounting similarity-crowded, cloned, and incomplete upper-tier competitors
    in favor of minimal-complexity matches and complete all-feature prototypes (with
    low-rate lexical intrusion onto sparse minimal singletons). On silent prior trials,
    listeners directly select referents using the same figure-ground contrast between
    unique complexity-boundary anchors and crowded or intermediate-tier items.
- name: contrastive_anchor_decision_l2
  rationale: Listeners infer speaker intent through depth-2 recursive reasoning over
    a confusion-averse speaker and convert those posterior beliefs into a response
    via a contrastive anchor decision rule. When selecting a referent, the listener's
    decision rule boosts complete complexity-boundary prototypes and unique upper-boundary
    referents against cloned minimal competitors, suppresses incomplete referents
    that lack a uniquely identifying feature, and allows low-rate decision intrusion
    onto a unique minimal-complexity singleton when it is the sole object excluded
    by an ambiguous word. On silent prior trials, listeners apply the same contrastive
    boundary decision rule to favor perceptually isolated singletons and maximal prototypes
    over duplicated items.
- name: holistic_diagnostic_qud_l2
  rationale: Speakers communicate under a holistic-prototype versus diagnostic-feature
    Question Under Discussion (QUD), selecting utterances to resolve either the scene's
    holistic all-features prototype or a target referent's diagnostic feature tier
    while avoiding similarity-based and non-unique incomplete competitor confusion,
    with low-probability false lexical access on sparse minimal singletons. Listeners
    reason recursively at depth 2 about this dual QUD goal, which explains why people
    intrude on literally false minimal-feature singletons under referential ambiguity,
    temper their selection of cloned minimal referents in favor of holistic prototypes,
    treat same-tier minimal referents symmetrically despite asymmetric overlap with
    cloned upper-tier distractors, and preserve support for intermediate-tier objects
    on silent prior displays with cloned tiers.
- name: type_crowding_prototype_span_l2
  rationale: We refine `prototype_span_false_access_l2` while keeping recursion depth
    2 (`L2` inverting a speaker who simulates `L1`, which inverts a speaker simulating
    `L0`) and the exact same two free parameters (`alpha` and `w_cost`, both with
    `LogNormal(0.0, 0.5)` priors), by restoring type-normalized perceptual similarity
    and equivalence-class crowding from `alternative_competition_cost_l2` alongside
    distinctive-feature competition on incomplete referents from `distinctive_tier_qud_l2`,
    clone-adjusted prototype-span anchoring, and multi-tier false minimal lexical
    access. Specifically, in `compute_speaker_terms`, we add `unique_sim = sim / copy_count[None,
    :]` and `utt_has_uniq = jnp.max(is_incomplete_utt * has_uniq_feat[None, :], axis=1,
    keepdims=True)`; replace `sem_lex = ctx.lex + is_false_min * jnp.exp(-w_cost *
    (n_obj - min_cloned - max_cloned))` with `sem_lex = ctx.lex + is_false_min * jnp.exp(-w_cost
    * (n_obj - min_cloned - max_cloned - (1.0 - max_cloned) * jnp.where(max_true_fc
    > min_true_fc, 1.0, 0.0)))`; in `utt_cost`, replace `(real_lex @ sim)` with `(real_lex
    @ unique_sim) + (copy_count[None, :] - 1.0) * real_lex`, replace `is_incomplete_utt
    * is_singleton[None, :] * (1.0 + is_max_utt * (1.0 - has_uniq_feat[None, :]) *
    jnp.where(jnp.sum(is_max_utt, axis=1, keepdims=True) > 1.0, 1.0, 0.0) * (1.0 -
    max_cloned)) / n_real_utt` with `is_incomplete_utt * is_singleton[None, :] * (1.0
    / n_real_utt + (1.0 - has_uniq_feat[None, :]) * utt_has_uniq) + is_min_utt * is_singleton[None,
    :] * has_uniq_feat[None, :] * max_cloned / n_obj`, and replace `- is_all_utt *
    (min_cloned + gap_utt) / n_obj` with `- is_all_utt * (min_cloned + gap_utt) /
    (n_obj - min_cloned)`; and in `prior_choice`, replace `(n_obj - 1.0 - min_scene_cloned
    * (1.0 + is_singleton))` with `(n_obj - 1.0 - min_scene_cloned * (n_obj - 1.0)
    - inter_scene_cloned)`. Accounting for unique maximal-referent tier separation
    in `sem_lex`, normalizing prototype-span anchoring by the number of distinct literal
    referent types `(n_obj - min_cloned)` alongside type-normalized similarity and
    minimal-singleton diagnostic competition in `utt_cost`, and relaxing intermediate-tier
    suppression when either the minimal or intermediate tier is cloned in `prior_choice`
    explain why listeners intrude on literally false minimal singletons (`false_minimal_singleton_choice_rate`),
    temper selection of cloned minimal referents in favor of the prototype (`cloned_minimal_true_referent_choice_rate`),
    select intermediate-tier objects more often on cloned-tier silent prior trials
    (`prior_intermediate_tier_choice_rate`), and treat same-tier minimal referents
    more symmetrically (`equal_tier_minimal_referent_asymmetry`).
- name: prototype_uniqueness_false_access_l2
  rationale: We refine `prototype_span_false_access_l2` while keeping recursion depth
    2 (`L2` inverting a speaker who simulates `L1`, which inverts a speaker simulating
    `L0`) and the exact same two free parameters (`alpha` and `w_cost`, both with
    `LogNormal(0.0, 0.5)` priors), by boosting false minimal singleton lexical access
    (`sem_lex`) when competing multi-tier true referents are cloned (`has_true_clone`),
    extending incomplete-referent suppression to intermediate-tier referents lacking
    a unique feature when a competing incomplete referent has one (`utt_has_uniq`),
    and reducing the silent-prior penalty on unique intermediate-tier objects by `min_scene_cloned
    * is_singleton / n_obj` while boosting complete all-feature prototypes when intermediate
    tiers are unique (`has_inter_scene * is_singleton / n_real_utt`). Specifically,
    in `compute_speaker_terms`, we add `has_true_clone = jnp.max(jnp.where((real_lex
    > 0) & (max_true_fc > min_true_fc), is_clone[None, :], 0.0), axis=1, keepdims=True)`
    and `utt_has_uniq = jnp.max(is_incomplete_utt * has_uniq_feat[None, :], axis=1,
    keepdims=True)`; in `sem_lex`, we replace `jnp.exp(-w_cost * (n_obj - min_cloned
    - max_cloned))` with `jnp.exp(-w_cost * (n_obj - min_cloned - max_cloned - has_true_clone))`;
    in `utt_cost`, we replace `is_max_utt * (1.0 - has_uniq_feat[None, :]) * jnp.where(jnp.sum(is_max_utt,
    axis=1, keepdims=True) > 1.0, 1.0, 0.0) * (1.0 - max_cloned)` with `(is_max_utt
    * jnp.where(jnp.sum(is_max_utt, axis=1, keepdims=True) > 1.0, 1.0, 0.0) + (1.0
    - is_max_utt) * utt_has_uniq) * (1.0 - has_uniq_feat[None, :]) * (1.0 - max_cloned)`;
    in `word_prior`, we replace `baseline_crowd` with `baseline_crowd - is_all_feats
    * has_inter_scene * is_singleton / (n_obj * n_real_utt)`; and in `prior_choice`,
    we replace `(n_obj - 1.0 - min_scene_cloned * (1.0 + is_singleton))` with `(n_obj
    - 1.0 - min_scene_cloned * (1.0 + is_singleton)) * (1.0 - min_scene_cloned * is_singleton
    / n_obj)`. This refinement explains why listeners intrude on literally false minimal-feature
    singletons more often when competing multi-tier true referents are cloned (`false_minimal_singleton_choice_rate`),
    temper selection of cloned minimal referents against unique maximal prototypes
    (`cloned_minimal_true_referent_choice_rate`), and select unique intermediate-tier
    objects more often on silent prior trials when the minimal tier is cloned (`prior_intermediate_tier_choice_rate`).
- name: prototype_span_speaker_access_l2
  rationale: 'We refine `sparse_singleton_prototype_qud_l2` while keeping recursion
    depth 2 (`L2` inverting a speaker who simulates `L1`, which inverts a speaker
    simulating `L0`) and the exact same two free parameters (`alpha` and `w_qud`,
    both with `LogNormal(0.0, 0.5)` priors), by restricting false minimal lexical
    access (`sem_lex`) to the pragmatic speaker simulated in `L1` and `L2` (keeping
    `L0` strictly literal on `lex`) while incorporating diagnostic incomplete-referent
    suppression, uncrowded minimal-singleton equilibration, and clone-resolved prototype-span
    scene priors. Specifically, in `L0`, `L1`, and `L2`, we restore literal `lex`
    in `L0` (`L0[u: UTT, r: OBJ](lex: ...)` instead of `sem_lex: ...`, passing both
    `lex` and `sem_lex` to `L1` and `L2`); in `compute_qud_and_prior`, we add `is_singleton
    = 1.0 - is_clone`, `inter_scene_cloned = jnp.max(is_inter_scene * is_clone)`,
    `max_cloned = jnp.max(is_max_utt * is_clone[None, :], axis=1, keepdims=True)`,
    `has_uniq_feat = jnp.max(jnp.where(jnp.sum(real_lex, axis=1, keepdims=True) ==
    1.0, real_lex, 0.0), axis=0)`, and `two_min_singletons = jnp.where(jnp.sum(is_min_utt
    * is_singleton[None, :], axis=1, keepdims=True) > 1.0, 1.0, 0.0)`; replace `is_false_min`
    and `sem_lex` with `is_false_min = real_words * (1.0 - real_lex) * is_min_fc[None,
    :] * is_singleton[None, :] * jnp.where((min_fc > 0.0) & (min_fc < min_true_fc),
    1.0, 0.0) * jnp.where(jnp.sum(real_lex, axis=1, keepdims=True) > 1.0, 1.0, 0.0)`
    and `sem_lex = ctx.lex + is_false_min * jnp.exp(-w_qud * (n_obj - 1.0 - min_cloned
    - max_cloned))`; in `qud_cost`, replace `(real_lex @ sim)` with `((real_lex *
    (1.0 - two_min_singletons * is_min_utt * max_cloned)) @ sim)`, replace `is_incomplete_utt
    * (1.0 - is_clone[None, :]) / n_real_utt` with `is_incomplete_utt * is_singleton[None,
    :] * (1.0 + is_max_utt * (1.0 - has_uniq_feat[None, :]) * jnp.where(jnp.sum(is_max_utt,
    axis=1, keepdims=True) > 1.0, 1.0, 0.0) * (1.0 - max_cloned)) / n_real_utt`, and
    replace `- is_all_utt * (min_cloned + gap_utt) / n_obj` with `- is_all_utt * (min_cloned
    + gap_utt * (1.0 + min_cloned / n_real_utt)) / n_obj`; and in `prior_choice`,
    replace `(n_obj - 1.0 - min_scene_cloned)` with `(n_obj - 1.0 - min_scene_cloned
    * (1.0 + is_singleton) - inter_scene_cloned)` and replace `(is_max_fc + is_all_feats
    * (has_inter_scene * (1.0 - is_clone) + min_scene_cloned))` with `(is_max_fc *
    (1.0 - inter_scene_cloned) + is_all_feats * (has_inter_scene * is_singleton +
    min_scene_cloned + inter_scene_cloned))`. Keeping `L0` literal while scaling speaker
    false-minimal access by `n_obj - 1.0 - min_cloned - max_cloned` prevents double-dilution
    on `E` while increasing false-minimal singleton intrusions on ambiguous word trials
    (`false_minimal_singleton_choice_rate`), strengthening prototype-span anchoring
    when minimal referents are cloned reduces over-selection of cloned minimal true
    referents (`cloned_minimal_true_referent_choice_rate`), equilibrating minimal
    singletons under cloned maximal competition eliminates artificial crowding asymmetry
    (`equal_tier_minimal_referent_asymmetry`), and reducing intermediate-tier prior
    suppression when intermediate objects are cloned increases intermediate-tier choices
    on silent trials (`prior_intermediate_tier_choice_rate`).'
