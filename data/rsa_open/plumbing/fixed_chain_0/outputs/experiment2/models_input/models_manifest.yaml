models:
- name: rsa_l2_singleton_feat_color_valence_l0
  rationale: 'RSA pragmatic listener at depth 2 with singleton salience, contextual
    distinctiveness, visual feature complexity, evaluative valence framing, visual
    color contrast, and literal L0. Refining rsa_l2_singleton_distinct_feat_color_l0
    by incorporating the evaluative valence framing component from polarity_congruence_listener:
    speakers and listeners reason at depth 2 (inverting a speaker who simulates a
    depth-1 pragmatic listener) with common knowledge of an object prior combining
    discrete visual singleton salience (favoring unique objects with no duplicates
    in the scene), continuous contextual distinctiveness (favoring objects with greater
    feature contrast relative to the rest of the display), visual feature complexity
    modulated by evaluative framing valence (favoring feature-rich items under neutral/positive
    framing but inverting to favor sparse, featureless items when referring to a least
    favorite object), and visual color contrast (favoring fully colored objects over
    desaturated grayscale distractors). Crucially, the foundational simulated literal
    listener L0 operates purely on truth-conditional semantics without perceptual
    bias, preventing redundant prior compounding across reasoning tiers. On prior
    trials with no informative word, choices are governed directly by the combined
    perceptual prior. A lapse parameter mixes in uniform guessing.'
- name: similarity_crowded_pragmatics
  rationale: Listeners and speakers in reference games operate under Shepard-Tversky
    similarity crowding, where candidate referents with similar feature profiles and
    candidate words with similar extensions in the scene group into perceptual and
    semantic clusters rather than competing as independent tokens. Inside the communicative
    hierarchy, listeners divide literal and intermediate reference weight across each
    object's similarity cluster while speakers divide lexical choice weight across
    co-extensional or similarly extending words true of their intended target, preventing
    redundant features or duplicate objects from artificially inflating choice probabilities.
    At the top decision level and on uninformative trials without a heard word, listeners
    favor perceptually uncrowded pop-out objects over crowded clusters, separating
    attentional crowding aversion on wordless prior displays from pragmatic speaker
    rationality on informative utterance displays.
- name: competitor_confusion_shared_prior
  rationale: 'Pragmatic listener at depth 1 reasoning about a competitor-confusion-averse
    speaker under a shared visual confusability object prior. Refining competitor_confusion_speaker
    with one change: rather than applying the baseline visual confusability prior
    only on uninformative prior trials while assuming a uniform object prior when
    interpreting heard words, the depth-1 listener and simulated speaker share the
    baseline visual confusability prior over objects when interpreting heard words
    as well. Recursion depth remains at depth 1 (where the listener L1 inverts a speaker
    reasoning about a literal listener L0), the parameter set is unchanged with no
    parameters added or removed (keeping only speaker rationality alpha and confusion
    aversion w_confusion), and all other terms (exponential feature-distance similarity,
    utterance-specific competitor confusion penalty, and prior-trial choice probabilities)
    remain identical.'
