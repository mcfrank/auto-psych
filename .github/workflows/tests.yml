name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Compile every Python source file
        run: uv run pytest -q tests/test_python_sources_compile.py
      - name: Run fast test suite
        run: uv run pytest -q -m "not slow"
