# ============================================================================
#  Unified config for a pilot human run. EDIT THIS FILE — it is the single
#  source of truth. `run_pilot.sh` reads it, renders the project's
#  prolific_config.yaml from the `prolific:` block, and passes the rest to the
#  Slurm job. (Credentials stay in .secrets, never here.)
#
#  Launch:  bash scripts/outer_loop_live/run_pilot.sh
#           CONFIG=path/to/other.yaml bash scripts/outer_loop_live/run_pilot.sh
# ============================================================================

# --- what to run -----------------------------------------------------------
project: subjective_randomness     # project under projects/<project>/
run_label: km_pilot                  # names the run: URL path /e{k}-{label}/, output dir, session ids
experiments: 2                     # how many experiments to run, in sequence (1..N). Each is its
                                   # own deploy + Prolific study; experiment k's design uses k-1's posterior.
                                   # (Stimulus design is always the exhaustive joint-EIG selection.)
coding_agent: opencode             # backend for ALL coding agents (implement/inner loop):
                                   # opencode (opencode + Gemini, default) | claude (Claude Code)
agent_model: google/gemini-3.7-flash  # testing only: the free-tier key has no gemini-3.1-pro quota
# claude_auth: subscription        # required with coding_agent: claude — how its agents are billed:
                                   # subscription (CLAUDE_CODE_OAUTH_TOKEN) | api (ANTHROPIC_API_KEY)
prolific_mode: test                # test = deploy, then create a DRAFT study (NOT published) and STOP so you
                                   #        can preview it (open it in Prolific, use a made-up PROLIFIC_PID);
                                   #        no recruiting, no payment, no auto collect/model.
                                   # none = deploy the page only (no study), then STOP; try it yourself.
                                   # live = REAL paid participants + full pipeline; also needs
                                   #        `confirm_live_recruitment: true`. Set live ONLY when you mean to
                                   #        recruit + pay people.

# --- where / how it runs (Slurm + Firebase) --------------------------------
firebase_project: auto-psych-2c5da
walltime: "1-23:00:00"             # Slurm walltime D-HH:MM:SS. A live experiment can wait up to 3h
                                   # for recruiting, plus its model stage; budget ~N_experiments x that.
qos: ""                            # "" normal (<=2 days) | "long" for up to 7 days

# --- the Prolific study (defines who is recruited and what they're paid) ---
# Rendered to projects/<project>/prolific_config.yaml on launch.
prolific:
  participants: 2                 # per experiment (-> total_available_places)
  reward_per_hour: 1200            # cents/hour ($12/hr). OR delete this line and set a flat `reward:`.
  # reward: 200                    # flat cents/participant (used only when reward_per_hour is absent)
  estimated_completion_time: 7     # minutes; grounded in lit (~5 s/trial x 64 + consent/instructions/debrief
                                   # ~= 6.5 min; Reimers et al. 2018: 120 trials in ~10 min). 7 = small fair-pay buffer.
                                   # At reward_per_hour 1200 this pays ~$1.40/participant. Keep in sync with task length.
  name: "Which sequence is more random?"
  description: >-
    In this study, you will see a series of coin flip results and be asked to judge which is more random.
  device_compatibility: [desktop]
  completion_code: AUTO_PSYCH_COMPLETE_FR
  # Data-quality eligibility: every live study recruits only US-resident,
  # English-fluent participants with an approval rate >= the threshold below.
  # Residence/language defaults are fixed in code; the approval floor is here.
  min_approval_rate: 98            # percent (0-100); Prolific approval-rate floor

# --- modeling / inner loop -------------------------------------------------
modeling:
  inner_loop_iterations: 2         # candidate-improvement rounds per experiment
  inner_loop_candidates: 3         # candidate models proposed per round
  draws: 2000                      # MCMC posterior draws / chain
  tune: 2000                       # MCMC warmup / chain
  chains: 4                        # MCMC chains (<= cpus-per-task in run_live.sbatch)
