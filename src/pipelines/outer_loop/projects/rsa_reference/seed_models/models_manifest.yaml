# Seed models for the RSA reference-game project: memo files, each exposing
# PARAMS (numpyro priors) and choice_probs(params, ctx) -> probabilities over
# the context's objects (the contract is src/rsa/model_file.py). They span the
# dimensions the pragmods paper compared: recursion depth (0, 1, 2) and where
# a salience prior over objects enters (nowhere, the listener only, every level).
models:
  - name: literal_listener
    rationale: Listeners pick uniformly among the objects the word is literally true of.
  - name: rsa_l1
    rationale: Listeners invert a softmax-rational speaker who simulates a literal listener (depth 1), with a uniform prior over objects.
  - name: rsa_l2
    rationale: Listeners reason one level deeper (depth 2), inverting a speaker who simulates the depth-1 pragmatic listener.
  - name: rsa_l1_salience
    rationale: Depth-1 RSA whose listener has a salience prior over objects (feature count, familiarization base rate) that the simulated literal listener lacks.
  - name: rsa_l1_shared_prior
    rationale: Depth-1 RSA with the salience prior as common knowledge, used by the simulated literal listener as well as the pragmatic listener.
