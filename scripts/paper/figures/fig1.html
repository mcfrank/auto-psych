<!--
Fig. 1 of the PNAS paper: (a) the framework's two loops, (b) the three domains.
Printed to data/paper/figures/fig1_loops.{pdf,png} by scripts/paper/figures/fig1.py
(uv run python -m scripts.paper.figures --figures 1).

Units: the SVG's user unit is the PDF point, and the page is the original figure's size, 505.92 x 214.08 pt.
The paper prints the figure at \textwidth (510.09 pt), so printed size = font-size x 1.0082. PNAS wants
6-12 pt text, so no font-size here is under 6.05 or over 11.9 (tests/test_paper_figures.py checks).
Text is live text. The Prolific logo and the people, robot and plot pictograms are vector paths taken from
the original figure (figures/auto-psych-fig1.pdf in the Overleaf project); the rest is redrawn to match it.
-->
