# Holdout recovery with the literature-faithful registry models as ground
# truths. Each GT (falk_konold_dp, motif_stack, finite_experience_occurrence,
# local_representativeness) generates fixed-param synthetic data; the agentic
# loop is seeded with the live project pool, which mirrors this registry, so
# the GT is held out of that pool and the loop starts from the other three —
# the question is whether it discovers a model that approximates the held-out
# faithful theory.
project_id: subjective_randomness
# The GT/baseline registry: the four literature-faithful models, all with
# pure-Python family twins for data generation.
seed_models_dir: src/subjective_randomness/pymc_model_families

# null params -> the family's DEFAULT_PARAMS.
gt_models:
  falk_konold_dp:
  motif_stack:
  finite_experience_occurrence:
  local_representativeness:

n_experiments: 3
n_participants: 40  # match the live human experiment (full_run.yaml: 40/experiment)
seed: 7

inner_loop:
  max_iterations: 2
  candidate_count: 3

agent:
  timeout_sec: 900
  backend: opencode # null -> CODING_AGENT env var, then "claude"
  model: google/gemini-3.1-pro-preview

# Held-out evaluation stimuli (see holdout_recovery.yaml for the rationale).
eval_pool:
  exhaustive: true
  lengths: [1, 2, 3, 4, 5, 6, 7, 8]
  predict_max_draws: 500
  min_remaining: 100

fit:
  draws: 4000
  tune: 3000
  chains: 4
  # Lifted off PyMC's implicit 0.8 to shrink divergences. 0.99 was tried first
  # but caused NUTS to hang for many hours on weakly-identified models (tiny
  # step size + max tree depth every iteration), so it is backed off to 0.95.
  # The actual reliability fix is Phase-2 graceful exclusion of unreliable-LOO
  # models, not cranking this. Flows through config["fit"] -> fit_kwargs ->
  # fit_model -> pm.sample, and is folded into the fit-cache signature.
  target_accept: 0.95
