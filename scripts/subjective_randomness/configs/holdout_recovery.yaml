# Holdout recovery: hold each seed model out as the ground truth, run the full
# agentic outer+inner loop seeded with the remaining models, and track the
# correlation between the loop's best model and the ground truth on a large
# held-out stimulus set at every inner-loop scoring step.
project_id: subjective_randomness
# The GT/baseline registry: the model set with pure-Python family twins for
# data generation. The GTs below are the models the 2026-08 consolidation
# superseded: still on disk here, but no longer in the registry manifest or the
# live seed pool, so they are out-of-pool by construction.
seed_models_dir: src/subjective_randomness/pymc_model_families

# null | [names] | {name: params|null} — the same shapes as model_recovery's
# generating_models (null/missing params -> the family's DEFAULT_PARAMS).
gt_models:
  falk_konold_dp:
  motif_stack:
  finite_experience_occurrence:
  local_representativeness:

n_experiments: 3
n_participants: 40  # match the live human experiment (full_run.yaml: 40/experiment)
seed: 7

inner_loop:
  # Scaled in September 2026 (loop-improvement plan P45): 2 -> 5 candidate
  # rounds per experiment and 3 -> 6 candidates per round, so an experiment
  # sees 30 proposals instead of 6. Slot roles at 6 (model_zoo.slot_roles):
  # three exploratory slots walking the twelve-lens battery (a round never
  # repeats a lens), two that refine the incumbent, one that refines a model
  # of the agent's choosing. A round's six agents run concurrently (one
  # worker per slot); the critique agent runs before them because its
  # critiques.md is inlined into every candidate brief.
  max_iterations: 5
  candidate_count: 6
  # Test statistics the critique agent proposes per round (the inner-loop
  # default; explicit so a sweep's setting is self-documenting and can be
  # overridden with --n-critique-proposals / N_CRITIQUE_PROPOSALS).
  n_critique_proposals: 8
  # Novelty gate: reject a candidate whose posterior-mean p_left is within
  # this RMSE of an admitted model's on the loop's novelty pool (not the
  # training stimuli). 0 disables the gate. Explicit here (it is the inner-loop
  # default) so a sweep's setting is self-documenting and can be A/B'd.
  novelty_rmse_threshold: 0.002

agent:
  timeout_sec: 900
  backend: opencode # null -> CODING_AGENT env var, then "claude"
  model: google/gemini-3.1-pro-preview

# Held-out evaluation stimuli. Pairs the EIG designs happened to use for
# training are excluded after the run; fail loudly if fewer than min_remaining
# survive.
# Exhaustive: evaluate on every distinct same-length pair for the lengths, so
# seed-holdout results are directly comparable to the impossible-holdout runs
# (which have always used the exhaustive pool). predict_max_draws thins the
# posterior so the (draws x n_stim) prediction array stays bounded.
eval_pool:
  exhaustive: true
  lengths: [1, 2, 3, 4, 5, 6, 7, 8]
  predict_max_draws: 500
  min_remaining: 100

fit:
  draws: 2000
  tune: 1000
  chains: 4
