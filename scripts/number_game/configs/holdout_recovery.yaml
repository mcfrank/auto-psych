# Number-game holdout recovery: one seed is the held-out ground truth, which
# simulates every participant's answers at its parameters fitted to the whole
# Bigelow & Piantadosi dataset (scripts/number_game/fit_ground_truth_params.py),
# and the loop starts from the other two. Every seed is a ground truth (the
# submit script's GT_MODELS).
project_id: number_game
seed_models_dir: src/pipelines/outer_loop/projects/number_game/seed_models
# Posterior means on the whole dataset (fit_ground_truth_params.py; Tenenbaum
# 2026-10-12, the Bigelow & Piantadosi models 2026-10-27).
gt_models:
  tenenbaum_rules_similarity: {lambda_rules: 0.456141, sigma: 111.590091}
  bigelow_piantadosi_mixture: {lambda_0: 0.19238}
  bigelow_piantadosi_independent:
    lambda_0: 0.310239
    set_weights: [0.069975, 0.01473, 1.0e-05, 7.0e-06, 0.001296, 2.5e-05, 0.163617, 0.003756, 0.009198,
      0.083532, 0.002627, 0.000257, 0.001904, 0.000607, 0.130781, 0.015654, 1.5e-05, 0.00029, 0.000155,
      0.001694, 0.003126, 0.004489, 0.000494, 0.00011, 0.005874, 0.040912, 0.016566, 0.027939, 0.015025,
      0.025137, 0.017073, 0.018735, 0.019998, 0.033598, 0.028487, 0.001565, 0.003277, 0.041268, 0.022184,
      0.034088, 0.03622, 0.023488, 0.012783, 0.067436]
    zero_split: 0.500481
n_experiments: 3
n_participants: 5  # simulated participants per experiment, each answering every designed cell
seed: 7
# Population-level models only: the responses agents see carry no participant_id.
hide_participant_id: true
inner_loop:
  max_iterations: 5
  candidate_count: 6
  n_critique_proposals: 8
  # Models are compared on whole held-out example sets.
  selection: {criterion: grouped_cv, cv_group: [number_set], cv_folds: 4}
design:
  n_eig: 450  # one original participant's trial load
  n_random: 0
agent:
  timeout_sec: 1800
  backend: claude
  claude_auth: subscription
  model: claude-opus-5-5
eval_pool:
  predict_max_draws: 500
  min_remaining: 100
fit:
  # NUTS started from each posterior mode (pymc_inference._warm_start_sample).
  method: warm_start_nuts
  tune: 200
  draws: 500
  chains: 4
