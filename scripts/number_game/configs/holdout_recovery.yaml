# Number-game holdout recovery: one seed is the held-out ground truth, which
# simulates every participant's answers at its parameters fitted to the whole
# Bigelow & Piantadosi dataset (scripts/number_game/fit_ground_truth_params.py),
# and the loop starts from the other two. Every seed is a ground truth (the
# submit script's GT_MODELS).
project_id: number_game
seed_models_dir: src/pipelines/outer_loop/projects/number_game/seed_models
# Posterior means on the whole dataset (fit_ground_truth_params.py, 2026-10-12).
gt_models:
  tenenbaum_rules_similarity: {lambda_rules: 0.456141, sigma: 111.590091}
  bigelow_piantadosi_independent:
    p_mix: 0.470877
    rule_weights: [4.0e-05, 0.000293, 0.000376, 0.001708, 0.003068, 0.004624, 0.000657, 0.000111, 0.005783,
      0.003769, 0.009422, 0.083731, 0.00258, 0.000257, 0.002438, 0.000607, 0.04034, 0.131232, 0.015431,
      0.016343, 0.027994, 0.015077, 0.024426, 0.017187, 0.018954, 0.020118, 0.033547, 0.028958, 0.001474,
      0.00326, 0.040948, 0.021869, 0.034267, 0.036839, 0.023644, 0.012959, 0.067587, 0.015446, 0.162009,
      0.070608, 1.0e-05, 7.0e-06]
  bigelow_piantadosi_interval:
    p_mix: 0.45547
    rule_weights: [3.9e-05, 0.000288, 0.000446, 0.001626, 0.00373, 0.00504, 0.000645, 0.000112, 0.005118,
      0.003784, 0.009203, 0.085605, 0.002367, 0.000266, 0.002538, 0.000636, 0.039828, 0.130342, 0.016543,
      0.017453, 0.02843, 0.01529, 0.025452, 0.017776, 0.018981, 0.020065, 0.033304, 0.030982, 0.001427,
      0.003506, 0.041939, 0.022273, 0.033433, 0.036355, 0.022441, 0.01337, 0.067611, 0.015851, 0.156528,
      0.069364, 1.0e-05, 6.0e-06]
    midpoint_shape: [1.211284, 0.84356]
n_experiments: 3
n_participants: 5  # simulated participants per experiment, each answering every designed cell
seed: 7
# Population-level models only: the responses agents see carry no participant_id.
hide_participant_id: true
inner_loop:
  max_iterations: 5
  candidate_count: 6
  n_critique_proposals: 8
  # Models are compared on whole held-out example sets.
  selection: {criterion: grouped_cv, cv_group: [number_set], cv_folds: 4}
design:
  n_eig: 450  # one original participant's trial load
  n_random: 0
agent:
  timeout_sec: 1800
  backend: claude
  claude_auth: subscription
  model: claude-opus-5-5
eval_pool:
  predict_max_draws: 500
  min_remaining: 100
fit:
  # NUTS started from each posterior mode (pymc_inference._warm_start_sample).
  method: warm_start_nuts
  tune: 200
  draws: 500
  chains: 4
