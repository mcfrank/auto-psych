# The RSA live campaign (PLAN.md, "Decisions (2026-10-08, the live campaign: claim 2)"
# and 2026-10-10). Read by `python -m src.rsa.live.config` (check / render) and by
# scripts/rsa/slurm/outer_live.sbatch. Live recruitment spends real money: it needs
# confirm_live_recruitment: true here AND CONFIRM_LIVE_RECRUITMENT=1 at submit, and
# the launcher asks for a typed "yes".

confirm_live_recruitment: false   # set to true, deliberately, for a live (paid) launch
firebase_project: auto-psych-2c5da
series_label: rsa                  # Hosting sites <firebase_project>-<series_label>-c<k> (<= 30 characters)
chains: [0, 1, 2]                  # data/rsa/live_seeds/chains/chain_<k>
experiments: 3                     # per chain (launch experiment 1 first: N_EXPERIMENTS=1; PI 2026-10-11)
participants: 200                  # per experiment
trials: 13                         # designed displays a person answers (+ 2 catch = 15; PI 2026-10-11)
displays: 52                       # 200 x 13 / 52 = 50 responses a display

prolific:
  reward: 50                       # cents (PI 2026-10-11): $10/h at the 3-min listing; the pilot's median was 2.0 min for 12 choices
  estimated_completion_time: 3     # whole minutes (Prolific's unit): consent, instructions, a practice screen, 15 choices
  name: "Who is Bob talking about?"
  description: >-
    You will see a few pictures and hear one word from a speaker, and choose the picture you
    think the speaker means. About 3 minutes.
  device_compatibility: [desktop]
  completion_code: AUTO_PSYCH_COMPLETE_RSA
  completion_code_action: AUTOMATICALLY_APPROVE
  min_approval_rate: 98            # percent
  exclude_earlier_participants: true
  exclude_earlier_participants_from: project   # only earlier RSA studies (PI 2026-10-10: subjective randomness is a different task)
